<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock paper</title>
<!--
  print-mock.html — printable question paper rendered from Supabase mock_data.
  Usage: print-mock.html?type=<mock_type>&id=<row id>            (preferred)
         print-mock.html?type=<mock_type>&sbmock=<row id>        (alias)
         print-mock.html?type=<mock_type>&number=<mock_number>   (by mock_number)
  Optional: &key=1  -> also append an Answer Key section.
            &auto=print -> call window.print() once rendered (client "Save as PDF").
  When rendering completes it sets window.__printReady = true and document.title,
  so a headless renderer (Puppeteer page.pdf) can wait on that flag.
  Phase 1: Reading (cefr-reading / ielts-reading). Other skills plug into renderBody().
-->
<style>
  :root{ --ink:#1e293b; --muted:#64748b; --accent:#0d9488; --line:#e2e8f0; --soft:#f8fafc; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#fff; color:var(--ink);
    font-family:Georgia,"Times New Roman",serif; line-height:1.6; font-size:14px; }
  .sheet{ max-width:794px; margin:0 auto; padding:24px 28px 40px; }
  .doc-header{ text-align:center; border-bottom:3px solid var(--accent); padding-bottom:14px; margin-bottom:22px; }
  .doc-header img{ height:46px; margin-bottom:6px; }
  .brand{ font-weight:bold; color:var(--accent); font-size:18px; letter-spacing:.3px; }
  .subbrand{ color:var(--muted); font-size:12px; }
  .doc-title{ font-size:22px; font-weight:bold; margin:10px 0 4px; }
  .doc-meta{ color:var(--muted); font-size:13px; }
  .part{ margin:0 0 22px; }
  .part-title{ font-size:17px; font-weight:bold; color:var(--accent);
    border-bottom:2px solid var(--line); padding-bottom:6px; margin:0 0 10px; }
  .instruction{ font-style:italic; color:var(--muted); font-size:13px; margin:0 0 12px; }
  .passage{ border-left:4px solid var(--accent); background:var(--soft); padding:14px 16px; margin:0 0 14px; }
  .passage-title{ font-weight:bold; text-align:center; text-transform:uppercase;
    letter-spacing:1px; margin:0 0 12px; font-size:15px; }
  .passage-content{ text-align:justify; }
  .passage-content p{ margin:0 0 10px; text-indent:18px; }
  .para{ margin:0 0 12px; padding:12px 14px; border:1px solid var(--line); border-radius:6px; }
  .para-num{ font-weight:bold; color:var(--accent); margin-bottom:6px; }
  .box{ border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin:0 0 14px; background:#f0fdfa; }
  .box-title{ font-weight:bold; margin-bottom:8px; }
  .box-item{ margin:4px 0; }
  .q{ margin:0 0 10px; padding:10px 12px; background:#fafafa; border-radius:6px; }
  .q-text{ font-weight:bold; margin-bottom:6px; }
  .opt{ margin:3px 0 3px 6px; }
  .opt-letter{ font-weight:bold; margin-right:6px; }
  .write{ display:inline-block; min-width:120px; border-bottom:1px solid #94a3b8; }
  .sec{ margin:12px 0; padding:10px 12px; background:var(--soft); border-radius:6px; }
  .sec-title{ font-weight:bold; color:var(--accent); margin-bottom:4px; }
  .sec-instr{ font-style:italic; color:var(--muted); font-size:13px; margin-bottom:8px; }
  .answer-key{ margin-top:26px; border-top:3px solid var(--accent); padding-top:14px; }
  .ak-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px 14px; font-size:13px; }
  .ak-grid div{ padding:3px 0; border-bottom:1px dotted var(--line); }
  .foot{ margin-top:24px; text-align:center; color:var(--muted); font-size:11px; border-top:1px solid var(--line); padding-top:8px; }
  .loading{ text-align:center; color:var(--muted); padding:60px 20px; font-size:15px; }
  .err{ text-align:center; color:#b91c1c; padding:60px 20px; }

  /* Listening-specific */
  .gap-input{ border:none !important; border-bottom:1px solid #94a3b8 !important; min-width:150px !important; background:transparent !important; box-shadow:none !important; }
  /* Writable inline answer blank for gap-fill / sentence-completion (handwriting space) */
  .pdf-gap{ display:inline-block; min-width:150px; border-bottom:1px solid #475569; margin:0 4px; vertical-align:baseline; }
  .pdf-gap-n{ font-weight:bold; color:var(--accent); margin-right:3px; }
  .map-img{ max-width:100%; height:auto; display:block; margin:10px auto; border:1px solid var(--line); }
  .labels{ font-size:13px; }
  .labels span{ display:inline-block; margin:2px 10px 2px 0; }
  .extract{ margin:0 0 12px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; }
  .extract-title{ font-weight:bold; color:var(--accent); margin-bottom:6px; }
  /* Writing / Speaking */
  .prompt-box{ border-left:4px solid var(--accent); background:var(--soft); padding:12px 14px; margin:8px 0 10px; }
  .task-meta{ font-size:12px; color:var(--muted); margin:0 0 8px; }
  .write-area{ min-height:130px; border:1px dashed #cbd5e1; border-radius:6px; margin-top:8px; background:repeating-linear-gradient(transparent,transparent 26px,#eef2f7 27px); }

  /* Break rules so individual blocks aren't split mid-item. NOTE: do NOT put
     break-inside:avoid on .part — a whole part (e.g. 8 questions) is taller than
     the space left under the header, so avoiding its split forces it onto a fresh
     page and leaves the first page half-empty. Parts must flow; only keep their
     inner items (questions/boxes/passages) intact. */
  .passage, .para, .box, .q, .sec, .extract, .answer-key{ break-inside:avoid; page-break-inside:avoid; }
  .part-title{ break-after:avoid; page-break-after:avoid; }

  /* Per-part audio QR (listening papers) */
  .part-head{ display:flex; justify-content:space-between; align-items:center; gap:14px;
    border-bottom:2px solid var(--line); padding-bottom:6px; margin:0 0 10px; }
  .part-head .part-title{ border:none; padding:0; margin:0; }
  .part-qr{ flex:0 0 auto; text-align:center; width:88px; }
  .part-qr svg{ width:80px; height:80px; display:block; margin:0 auto; }
  .part-qr-cap{ font-size:8.5px; color:var(--muted); line-height:1.2; margin-top:2px; }

  /* Centre-logo watermark — position:fixed repeats on every printed page in
     Chrome's PDF engine. A very faint overlay so the perfect layout underneath
     stays crisp; pointer-events off so it never blocks anything. */
  .watermark{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:50; pointer-events:none; }
  .watermark img{ width:62%; max-width:460px; opacity:0.05; filter:grayscale(35%); }

  @page{ size:A4; margin:14mm 12mm; }
  @media print{
    .sheet{ max-width:none; margin:0; padding:0; }
    body{ font-size:12.5px; }
  }
</style>
<script src="qrcode.min.js"></script>
</head>
<body>
<div class="sheet" id="sheet"><div class="loading">Loading mock paper…</div></div>

<script>
(function(){
  var SB_URL = 'https://zknyukkbtbcqgvkgjktb.supabase.co';
  var SB_KEY = 'sb_publishable_SRLvRtRHU52FliLxA6gYaQ_I-v5LCk2';
  var MOCK_ID = null;  // row id, set after fetch — used for per-part audio QR links

  function qp(name){ return new URLSearchParams(location.search).get(name); }
  function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  // Passage/question text is authored HTML in mock_data — render as-is (trusted content).
  function html(s){ return (s==null?'':String(s)); }

  // gap-fill hint → swap the gap marker (run of underscores / dots) for a wide
  // writable blank; if no marker present, append one. No separate "Answer:" line.
  function inlineGap(text){
    var t = String(text==null?'':text);
    if (/_{2,}|\.{3,}|…/.test(t)) return t.replace(/_{2,}|\.{3,}|…/g, '<span class="pdf-gap"></span>');
    return t + ' <span class="pdf-gap"></span>';
  }
  // sentence-completion passage → turn each <span class="gap-input" data-gap="N">…</span>
  // into "(N) ____" : number AHEAD of a wide writable blank (not mid-line).
  function fmtSentenceGaps(s){
    return String(s==null?'':s).replace(
      /<span[^>]*class="gap-input"[^>]*data-gap="([^"]+)"[^>]*>[\s\S]*?<\/span>/g,
      '<span class="pdf-gap-n">($1)</span><span class="pdf-gap"></span>'
    );
  }

  function fail(msg){
    document.getElementById('sheet').innerHTML = '<div class="err">'+esc(msg)+'</div>';
    window.__printReady = true; // let a headless renderer proceed and fail gracefully
  }

  function brand(){
    var c = window.SITE_CONFIG || {};
    return {
      name: c.brandName || 'Mock Stream',
      sub: c.heading2 || '',
      logo: c.logoUrl || 'https://i.ibb.co/WN0XY5Lv/logo.png'
    };
  }

  // ---- answer helpers ----
  function ansFor(part, qId){
    var a = part.answers && part.answers[qId];
    if (Array.isArray(a)) return a[0];
    return a;
  }

  // ---- Reading renderer (cefr-reading / ielts-reading share this shape) ----
  function renderReading(md){
    var parts = md.parts || [];
    var out = '';
    parts.forEach(function(part){
      out += '<div class="part">';
      out += '<div class="part-title">'+esc(part.title||('Part '+(part.partNumber||'')))+ (part.questionRange?(' ('+esc(part.questionRange)+')'):'') +'</div>';
      if (part.instruction) out += '<div class="instruction">'+html(part.instruction)+'</div>';

      // Passage (gap-fill / single text)
      if (part.passage){
        out += '<div class="passage">';
        if (part.passage.title) out += '<div class="passage-title">'+html(part.passage.title)+'</div>';
        if (part.passage.content) out += '<div class="passage-content">'+html(part.passage.content)+'</div>';
        if (Array.isArray(part.passage.paragraphs)){
          part.passage.paragraphs.forEach(function(p){
            out += '<div class="para"><div class="para-num">Paragraph '+esc(p.number)+(p.questionId?(' — Q'+esc(p.questionId)):'')+'</div>'+html(p.content)+'</div>';
          });
        }
        out += '</div>';
      }

      // Headings bank (matching headings)
      var headings = part.headings || part.extraHeadings;
      if (Array.isArray(headings) && headings.length){
        out += '<div class="box"><div class="box-title">List of Headings</div>';
        headings.forEach(function(h){ out += '<div class="box-item"><strong>'+esc(h.letter)+'.</strong> '+html(h.text)+'</div>'; });
        out += '</div>';
      }

      // Statements bank (when shown first)
      if (Array.isArray(part.statements) && part.statementsFirst){
        out += '<div class="box"><div class="box-title">Statements</div>';
        part.statements.forEach(function(s){ out += '<div class="box-item"><strong>'+esc(s.letter)+'.</strong> '+html(s.text)+'</div>'; });
        out += '</div>';
      }

      // Texts (matching texts to statements)
      if (Array.isArray(part.texts)){
        part.texts.forEach(function(t){
          out += '<div class="para"><div class="para-num">Text '+esc(t.number)+'</div>'+html(t.content)+'</div>';
        });
      }
      if (Array.isArray(part.statements) && !part.statementsFirst){
        out += '<div class="box"><div class="box-title">Statements</div>';
        part.statements.forEach(function(s){ out += '<div class="box-item"><strong>'+esc(s.letter)+'.</strong> '+html(s.text)+'</div>'; });
        out += '</div>';
      }

      // Direct questions
      if (Array.isArray(part.questions)){
        part.questions.forEach(function(q){ out += renderQuestion(q); });
      }

      // Question sections
      if (Array.isArray(part.questionSections)){
        part.questionSections.forEach(function(sec){
          out += '<div class="sec"><div class="sec-title">'+html(sec.title||'')+'</div>';
          if (sec.instruction) out += '<div class="sec-instr">'+html(sec.instruction)+'</div>';
          (sec.questions||[]).forEach(function(q){ out += renderQuestion(q); });
          out += '</div>';
        });
      }

      out += '</div>';
    });
    return out;
  }

  function renderQuestion(q){
    var s = '<div class="q"><div class="q-text">'+esc(q.id)+'. '+html(q.text||q.hint||'')+'</div>';
    if (Array.isArray(q.options) && q.options.length){
      q.options.forEach(function(o){
        s += '<div class="opt"><span class="opt-letter">'+esc(o.letter)+'</span>'+html(o.text)+'</div>';
      });
    } else {
      s += '<div class="opt">Answer: <span class="write">&nbsp;</span></div>';
    }
    return s + '</div>';
  }

  function renderAnswerKey(md){
    var rows = [];
    (md.parts||[]).forEach(function(part){
      var a = part.answers||{};
      Object.keys(a).sort(function(x,y){return (parseInt(x,10)||0)-(parseInt(y,10)||0);}).forEach(function(qId){
        var v = a[qId]; if (Array.isArray(v)) v = v.join(' / ');
        rows.push('<div><strong>'+esc(qId)+'.</strong> '+esc(v)+'</div>');
      });
    });
    if (!rows.length) return '';
    return '<div class="answer-key"><div class="part-title">Answer Key</div><div class="ak-grid">'+rows.join('')+'</div></div>';
  }

  // ---- shared question renderer (listening) ----
  function renderQ(q){
    var label = (q.id!=null ? esc(q.id)+'. ' : (q.number!=null ? esc(q.number)+'. ' : ''));
    var body = html(q.text || q.hint || q.place || q.label || '');
    var s = '<div class="q"><div class="q-text">'+label+body+'</div>';
    if (Array.isArray(q.options) && q.options.length){
      q.options.forEach(function(o){ s += '<div class="opt"><span class="opt-letter">'+esc(o.letter)+'</span>'+html(o.text)+'</div>'; });
    } else {
      s += '<div class="opt">Answer: <span class="write">&nbsp;</span></div>';
    }
    return s + '</div>';
  }

  // Renders one listening "node" (an IELTS subPart, or a flat CEFR part) by its type.
  function renderListNode(node){
    var t = node.type || '';
    var s = '';
    if (node.instruction) s += '<div class="instruction">'+html(node.instruction)+'</div>';
    if (node.passageTitle) s += '<div class="passage-title">'+html(node.passageTitle)+'</div>';
    if (node.passageContent) s += '<div class="passage"><div class="passage-content">'+fmtSentenceGaps(html(node.passageContent))+'</div></div>';

    if (t === 'gap-fill-form'){
      if (typeof node.formContent === 'string' && node.formContent.trim()){
        s += '<div class="passage">'+fmtSentenceGaps(html(node.formContent))+'</div>'; // IELTS: authored HTML w/ gap-inputs
      } else if (Array.isArray(node.questions)){
        // CEFR: questions[].hint — render the hint with a writable inline blank,
        // number ahead, and NO separate "Answer:" line.
        node.questions.forEach(function(q){
          var lbl = (q.id!=null ? esc(q.id)+'. ' : (q.number!=null ? esc(q.number)+'. ' : ''));
          s += '<div class="q"><div class="q-text">'+lbl+inlineGap(html(q.hint||q.text||''))+'</div></div>';
        });
      }
      return s;
    }
    if (t === 'map-labeling'){
      if (node.mapTitle) s += '<div class="passage-title">'+html(node.mapTitle)+'</div>';
      if (node.mapImage) s += '<img class="map-img" src="'+esc(node.mapImage)+'" alt="">';
      if (Array.isArray(node.mapLabels) && node.mapLabels.length){
        s += '<div class="box"><div class="box-title">Labels</div><div class="labels">'+
             node.mapLabels.map(function(l){ return '<span><strong>'+esc(l)+'</strong></span>'; }).join('')+'</div></div>';
      }
      (node.questions||[]).forEach(function(q){ s += renderQ(q); });
      return s;
    }
    if (t === 'matching' || t === 'matching-speakers'){
      if (Array.isArray(node.options) && node.options.length){
        s += '<div class="box"><div class="box-title">'+esc(node.boxTitle||'Options')+'</div>';
        node.options.forEach(function(o){ s += '<div class="box-item"><strong>'+esc(o.letter)+'.</strong> '+html(o.text)+'</div>'; });
        s += '</div>';
      }
      (node.questions || node.speakers || []).forEach(function(q){ s += renderQ(q); });
      return s;
    }
    if (t === 'mcq-multi'){
      (node.options||[]).forEach(function(o){ s += '<div class="opt"><span class="opt-letter">'+esc(o.letter)+'</span>'+html(o.text)+'</div>'; });
      (node.questionIds||[]).forEach(function(id){ s += '<div class="q"><div class="q-text">'+esc(id)+'.</div><div class="opt">Answer: <span class="write">&nbsp;</span></div></div>'; });
      return s;
    }
    if (t === 'mcq-extracts'){
      (node.extracts||[]).forEach(function(ex){
        s += '<div class="extract"><div class="extract-title">'+html(ex.title||('Extract '+(ex.extractNumber||'')))+'</div>';
        (ex.questions||[]).forEach(function(q){ s += renderQ(q); });
        s += '</div>';
      });
      return s;
    }
    if (t === 'sentence-completion'){
      // The passage (rendered above) already has inline gap-input blanks the
      // student writes into — so do NOT also emit a separate "Answer:" list.
      // Fall back to a questions list only if there's no inline passage.
      if (node.passageContent && String(node.passageContent).trim()) return s;
      (node.questions||[]).forEach(function(q){ s += renderQ(q); });
      return s;
    }
    // mcq, mcq-reply, and any default → questions list
    (node.questions||[]).forEach(function(q){ s += renderQ(q); });
    return s;
  }

  // Per-part audio QR → branded player page (listen.html) on whatever host this
  // PDF was generated from (so a clone's PDF opens that clone's player). Inline
  // SVG so it renders in the headless-Chrome PDF with no image-load wait.
  function qrBlock(part){
    if (!MOCK_ID || typeof qrcode === 'undefined') return '';
    var pn = part.partNumber || '';
    var url = location.origin + '/listen.html?sbmock=' + encodeURIComponent(MOCK_ID) + (pn ? ('&part=' + encodeURIComponent(pn)) : '');
    try{
      var qr = qrcode(0, 'M'); qr.addData(url); qr.make();
      var svg = qr.createSvgTag({ cellSize:2, margin:0, scalable:true });
      return '<div class="part-qr">'+svg+'<div class="part-qr-cap">Scan for<br>Part '+esc(pn)+' audio</div></div>';
    }catch(e){ return ''; }
  }

  function renderListening(md){
    var parts = md.parts || [];
    var out = '';
    parts.forEach(function(part){
      out += '<div class="part">';
      out += '<div class="part-head"><div class="part-title">'+esc(part.title||('Part '+(part.partNumber||'')))+ (part.questionRange?(' ('+esc(part.questionRange)+')'):'') +'</div>'+ qrBlock(part) +'</div>';
      if (Array.isArray(part.subParts) && part.subParts.length){
        if (part.instruction) out += '<div class="instruction">'+html(part.instruction)+'</div>';
        part.subParts.forEach(function(sp){ out += renderListNode(sp); });
      } else {
        out += renderListNode(part);
      }
      out += '</div>';
    });
    return out;
  }

  // plain-text fields (CEFR writing) → escape + preserve line breaks
  function textBlock(s){ return esc(s).replace(/\n/g,'<br>'); }

  // ---- Writing renderer (ielts-writing tasks.task1/task2 ; cefr-writing part1+t11/t12/t2) ----
  function renderWriting(md){
    var tasks = md.tasks || {};
    var out = '';

    // IELTS: tasks.task1 / tasks.task2 (prompt is authored HTML; task1 has a chart image)
    if (tasks.task1 || tasks.task2){
      ['task1','task2'].forEach(function(key, i){
        var t = tasks[key]; if(!t) return;
        out += '<div class="part">';
        out += '<div class="part-title">Writing Task '+(i+1)+(t.title?(' — '+esc(t.title)):'')+'</div>';
        var meta=[];
        if (t.timeMinutes) meta.push('Time: '+esc(t.timeMinutes)+' min');
        if (t.wordGoal) meta.push('Write at least '+esc(t.wordGoal)+' words');
        if (meta.length) out += '<div class="task-meta">'+meta.join(' &nbsp;·&nbsp; ')+'</div>';
        if (t.instruction) out += '<div class="instruction">'+html(t.instruction)+'</div>';
        if (t.prompt) out += '<div class="prompt-box">'+html(t.prompt)+'</div>';
        if (t.chartImageUrl) out += '<img class="map-img" src="'+esc(t.chartImageUrl)+'" alt="">';
        out += '<div class="write-area"></div>';
        out += '</div>';
      });
      return out;
    }

    // CEFR: Part 1 scenario + two task options (t11/t12), Part 2 (t2)
    out += '<div class="part"><div class="part-title">Part 1'+((md.part1&&md.part1.topic)?(' — '+esc(md.part1.topic)):'')+'</div>';
    if (tasks.p1_context) out += '<div class="instruction">'+textBlock(tasks.p1_context)+'</div>';
    if (tasks.p1_scenario) out += '<div class="prompt-box">'+textBlock(tasks.p1_scenario)+'</div>';
    [['t11','Option 1'],['t12','Option 2']].forEach(function(pair){
      var t = tasks[pair[0]]; if(!t) return;
      out += '<div class="q"><div class="q-text">'+pair[1]+(t.title?(' — '+esc(t.title)):'')+'</div>';
      if (t.prompt) out += '<div>'+textBlock(t.prompt)+'</div>';
      if (t.target) out += '<div class="task-meta">('+esc(t.target)+')</div>';
      out += '</div>';
    });
    out += '<div class="write-area"></div></div>';

    if (tasks.t2){
      var t2 = tasks.t2;
      out += '<div class="part"><div class="part-title">Part 2'+(t2.title?(' — '+esc(t2.title)):'')+'</div>';
      if (t2.genre) out += '<div class="task-meta">Genre: '+esc(t2.genre)+(t2.target?(' &nbsp;·&nbsp; '+esc(t2.target)):'')+'</div>';
      if (t2.prompt) out += '<div class="prompt-box">'+textBlock(t2.prompt)+'</div>';
      out += '<div class="write-area"></div></div>';
    }
    return out;
  }

  // ---- Speaking renderer (questions[] grouped by part; IELTS P2 cue-card bullets; CEFR P2 images) ----
  function renderSpeaking(md){
    var qs = md.questions || [];
    var images = md.images || {};
    var out = '';
    var curPart = null;
    qs.forEach(function(q){
      if (q.part !== curPart){
        if (curPart !== null) out += '</div>';
        curPart = q.part;
        out += '<div class="part"><div class="part-title">'+esc(curPart||'')+'</div>';
      }
      out += '<div class="q"><div class="q-text">'+(q.number!=null?esc(q.number)+'. ':'')+html(q.prompt||'')+'</div>';
      var meta=[];
      if (q.prepTime) meta.push('Prep: '+esc(q.prepTime)+'s');
      if (q.speakTime) meta.push('Speak: '+esc(q.speakTime)+'s');
      else if (q.badge) meta.push(esc(q.badge));
      if (meta.length) out += '<div class="task-meta">'+meta.join(' &nbsp;·&nbsp; ')+'</div>';
      if (Array.isArray(q.bulletPoints) && q.bulletPoints.length){
        out += '<div class="box"><div class="box-title">You should say:</div>';
        q.bulletPoints.forEach(function(b){ out += '<div class="box-item">&bull; '+html(b)+'</div>'; });
        out += '</div>';
      }
      if (q.hasImages && (images.img1 || images.img2)){
        if (images.img1) out += '<img class="map-img" src="'+esc(images.img1)+'" alt="'+esc(images.img1Alt||'')+'">';
        if (images.img2) out += '<img class="map-img" src="'+esc(images.img2)+'" alt="'+esc(images.img2Alt||'')+'">';
      }
      out += '</div>';
    });
    if (curPart !== null) out += '</div>';
    return out;
  }

  var RENDERERS = {
    'cefr-reading': renderReading,
    'ielts-reading': renderReading,
    'cefr-listening': renderListening,
    'ielts-listening': renderListening,
    'cefr-writing': renderWriting,
    'ielts-writing': renderWriting,
    'cefr-speaking': renderSpeaking,
    'ielts-speaking': renderSpeaking
  };

  function render(type, md){
    var b = brand();
    var ti = md.testInfo || {};
    var head = '<div class="doc-header">'+
      '<img src="'+esc(b.logo)+'" alt="" onerror="this.style.display=\'none\'">'+
      '<div class="brand">'+esc(b.name)+'</div>'+
      (b.sub?'<div class="subbrand">'+esc(b.sub)+'</div>':'')+
      '<div class="doc-title">'+esc(ti.title || md.title || 'Mock Test')+'</div>'+
      '<div class="doc-meta">'+
        (ti.level?('Level: '+esc(ti.level)+' &nbsp;|&nbsp; '):'')+
        (ti.totalTime?('Time: '+esc(ti.totalTime)+' min &nbsp;|&nbsp; '):'')+
        (ti.totalQuestions?('Questions: '+esc(ti.totalQuestions)):'')+
      '</div></div>';

    var renderer = RENDERERS[type];
    var body = renderer ? renderer(md) : '<div class="err">No print layout for type: '+esc(type)+' yet.</div>';
    var key = (qp('key')==='1') ? renderAnswerKey(md) : '';
    var foot = '<div class="foot">© '+new Date().getFullYear()+' '+esc(b.name)+'. Practice paper — unauthorized reproduction prohibited.</div>';

    document.getElementById('sheet').innerHTML = head + body + key + foot;
    document.title = (ti.title || md.title || 'Mock paper');

    // Centre-logo watermark on every page (fixed → repeats per printed page)
    if (b.logo){
      var wm = document.createElement('div');
      wm.className = 'watermark';
      wm.innerHTML = '<img src="'+esc(b.logo)+'" alt="" onerror="this.parentNode.style.display=\'none\'">';
      document.body.appendChild(wm);
    }

    // Signal readiness to a headless renderer after images settle.
    var imgs = Array.prototype.slice.call(document.images);
    var pending = imgs.filter(function(i){ return !i.complete; }).length;
    if (!pending){ window.__printReady = true; }
    else {
      imgs.forEach(function(i){ i.addEventListener('load', done); i.addEventListener('error', done); });
      function done(){ if (--pending<=0) window.__printReady = true; }
      setTimeout(function(){ window.__printReady = true; }, 4000); // safety
    }
    if (qp('auto')==='print'){ setTimeout(function(){ try{ window.print(); }catch(e){} }, 600); }
  }

  async function main(){
    var type = qp('type');
    var id = qp('id') || qp('sbmock');
    var number = qp('number');
    if (!type){ return fail('Missing ?type'); }
    var url;
    if (id){
      url = SB_URL+'/rest/v1/mock_tests?id=eq.'+encodeURIComponent(id)+'&select=id,mock_data,mock_type';
    } else if (number){
      url = SB_URL+'/rest/v1/mock_tests?mock_type=eq.'+encodeURIComponent(type)+'&mock_number=eq.'+encodeURIComponent(number)+'&status=eq.published&select=id,mock_data,mock_type';
    } else {
      return fail('Missing ?id or ?number');
    }
    try{
      var r = await fetch(url, { headers:{ apikey:SB_KEY, Authorization:'Bearer '+SB_KEY } });
      if (!r.ok){ return fail('Fetch failed ('+r.status+')'); }
      var rows = await r.json();
      if (!rows || !rows.length){ return fail('Mock not found'); }
      MOCK_ID = (rows[0].id != null) ? rows[0].id : id;
      var md = rows[0].mock_data;
      if (typeof md === 'string'){ try{ md = JSON.parse(md); }catch(e){ return fail('Bad mock_data'); } }
      render(type, md);
    }catch(e){ fail('Error: '+(e.message||e)); }
  }

  // SITE_CONFIG may load async on real centres; give it a brief head start but don't block.
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', main);
  else main();
})();
</script>
</body>
