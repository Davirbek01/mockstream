<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test — IELTS Practice</title>
  <link rel="stylesheet" href="site-config/responsive-scaling.css">
  <!-- Site Config (swap this script to change brand/skin) -->
  <script src="center-id.js"></script>
  <script src="site-config/site-config.js"></script>
  <!-- jsPDF for PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root{ 
      --bg1:#667eea; --bg2:#764ba2; 
      --card:#ffffff;
      --text:#0f172a; --text-light:#475569; --text-accent:#667eea;
      --correct:#10b981; --wrong:#ef4444;
      --shadow:0 25px 50px -12px rgba(0,0,0,.35);
      --shadow-hover:0 35px 60px -15px rgba(0,0,0,.45);
      --border:rgba(255,255,255,.18);
    }
    
    *{box-sizing:border-box; margin:0; padding:0;}
    
    html,body{height:100%; overflow:hidden;}
    
    .back-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      margin:1.5rem auto 2rem;
      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(10px);
      color:#fff;
      text-decoration:none;
      padding:12px 28px;
      border-radius:50px;
      font-weight:600;
      font-size:15px;
      transition:all 0.3s ease;
      border:1px solid rgba(255,255,255,0.2);
    }
    .back-btn-wrap{
      text-align:center;
    }
    .back-btn:hover{
      background:rgba(255,255,255,0.25);
      transform:translateY(-2px);
    }

    /* Mobile - minimize back button, hide download PDF */
    @media (max-width: 768px) {
      .back-btn {
        padding: 10px 24px;
        font-size: 14px;
      }
      .download-pdf-btn {
        display: none !important;
      }
    }

    .download-pdf-btn{
      display:none !important;
    }
    .download-pdf-btn:hover{
      background:linear-gradient(135deg, #059669, #047857);
      transform:translateY(-2px);
      box-shadow:0 6px 16px rgba(16,185,129,.4);
    }
    .download-pdf-btn:active{
      transform:translateY(0);
    }
    .download-pdf-btn svg{
      width:16px;
      height:16px;
      fill:currentColor;
    }
    
    body{
      font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background:linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
      background-attachment:fixed;
      color:var(--text); 
      -webkit-tap-highlight-color:transparent;
      display:flex; 
      flex-direction:column;
      align-items:center; 
      justify-content:center;
      padding:20px;
      position:relative;
    }
    
    body::before{
      content:'';
      position:absolute;
      inset:0;
      background:radial-gradient(circle at 20% 50%, rgba(255,255,255,.1) 0%, transparent 50%),
                 radial-gradient(circle at 80% 80%, rgba(255,255,255,.08) 0%, transparent 50%);
      pointer-events:none;
    }

    /* Topic cover photo shown as a soft watermark behind the quiz */
    #testWatermark{
      position:fixed;
      inset:0;
      background-size:cover;
      background-position:center;
      opacity:0;
      filter:saturate(1.1);
      pointer-events:none;
      z-index:0;
      transition:opacity .7s ease;
    }
    #testWatermark::after{
      content:'';
      position:absolute;
      inset:0;
      /* light tint for cohesion; the frosted quiz card keeps text legible */
      background:linear-gradient(135deg, rgba(102,126,234,.30) 0%, rgba(139,92,246,.30) 100%);
    }
    .header, .wrap{ position:relative; z-index:1; }
    
    .header{
      text-align:center;
      margin-bottom:2rem;
      animation:fadeInDown 0.6s ease;
    }
    
    .header h1{
      font-size:clamp(18px, 3vw, 24px);
      font-weight:700;
      color:#ffffff;
      text-shadow:0 2px 8px rgba(0,0,0,.2);
      letter-spacing:-0.02em;
      margin-bottom:0.3rem;
    }
    
    .progress-bar{
      width:min(400px, 90vw);
      height:6px;
      background:rgba(255,255,255,.2);
      border-radius:10px;
      overflow:hidden;
      backdrop-filter:blur(10px);
      margin:0 auto;
    }
    
    .progress-fill{
      height:100%;
      background:linear-gradient(90deg, var(--text-accent), #8b5cf6);
      border-radius:10px;
      transition:width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow:0 0 20px rgba(102,126,234,.5);
    }
    
    .progress-text{
      color:rgba(255,255,255,.9);
      font-size:14px;
      font-weight:600;
      margin-top:0.5rem;
      text-shadow:0 2px 4px rgba(0,0,0,.2);
    }

    .score-display{
      display:flex;
      gap:1.5rem;
      justify-content:center;
      margin-top:0.5rem;
    }

    .score-item{
      color:rgba(255,255,255,.95);
      font-size:15px;
      font-weight:700;
      display:flex;
      align-items:center;
      gap:0.5rem;
    }

    .score-item .icon{
      font-size:18px;
    }
    
    .wrap{ 
      width:min(840px, 94vw); 
      height:auto;
      position:relative;
      perspective:1500px;
      animation:fadeInUp 0.8s ease;
      display:flex;
      flex-direction:column;
      margin:20px 0;
    }
    
    .question-card{
      position:relative;
      width:100%;
      height:auto;
      border-radius:32px;
      background:rgba(255,255,255,.74);
      backdrop-filter:blur(10px) saturate(1.1);
      -webkit-backdrop-filter:blur(10px) saturate(1.1);
      border:2px solid rgba(255,255,255,.55);
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.9);
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      padding:clamp(20px, 3.5vh, 36px) clamp(24px, 4vw, 44px);
      padding-bottom:clamp(24px, 4vh, 40px);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      opacity:0;
      transform:translateY(30px);
      transition:all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .question-card.active{
      opacity:1;
      transform:translateY(0);
    }

    .question-card.exit{
      opacity:0;
      transform:translateY(-30px);
    }
    
    .question-number{
      font-size:13px;
      font-weight:700;
      color:var(--text-accent);
      text-transform:uppercase;
      letter-spacing:0.1em;
      margin-bottom:0.75rem;
      padding:6px 16px;
      background:linear-gradient(135deg, rgba(102,126,234,.1), rgba(139,92,246,.1));
      border-radius:50px;
    }
    
    .question-type{
      font-size:clamp(15px, 2.5vw, 18px);
      font-weight:600;
      color:var(--text-light);
      margin-bottom:0.75rem;
      text-align:center;
    }
    
    .question-text{
      font-size:clamp(20px, 3.5vw, 30px);
      font-weight:800;
      color:var(--text);
      text-align:center;
      margin-bottom:1.25rem;
      line-height:1.2;
      letter-spacing:-0.02em;
    }
    .question-text b{color:var(--text-accent);font-weight:800;}
    .option-btn b{color:var(--text-accent);font-weight:700;}
    
    .options{
      display:grid;
      grid-template-columns:repeat(2, 1fr);
      gap:1rem;
      width:100%;
      max-width:600px;
    }

    @media(max-width:768px){
      .options{
        grid-template-columns:1fr;
        max-width:400px;
      }
    }
    
    .option-btn{
      padding:0.9rem 1.2rem;
      font-size:16px;
      font-weight:600;
      border:3px solid #e2e8f0;
      border-radius:16px;
      background:linear-gradient(135deg, #ffffff, #f8fafc);
      cursor:pointer;
      transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    
    .option-btn::before{
      content:'';
      position:absolute;
      inset:0;
      background:linear-gradient(135deg, rgba(102,126,234,.1), rgba(139,92,246,.1));
      opacity:0;
      transition:opacity 0.3s ease;
    }
    
    .option-btn:hover:not(.disabled){
      border-color:var(--text-accent);
      transform:translateY(-3px);
      box-shadow:0 12px 24px -6px rgba(102,126,234,.25);
    }
    
    .option-btn:hover:not(.disabled)::before{
      opacity:1;
    }
    
    .option-btn.correct{
      border-color:var(--correct) !important;
      background:linear-gradient(135deg, #d1fae5, #a7f3d0) !important;
      animation:correctPulse 0.5s ease;
    }
    
    .option-btn.wrong{
      border-color:var(--wrong) !important;
      background:linear-gradient(135deg, #fee2e2, #fecaca) !important;
      animation:wrongShake 0.5s ease;
    }
    
    .option-btn.disabled{
      cursor:not-allowed;
      opacity:0.7;
    }

    .option-btn.disabled:not(.correct):not(.wrong){
      opacity:0.5;
    }

    .wrong-meaning{
      position:absolute;
      top:-32px;
      left:50%;
      transform:translateX(-50%);
      background:var(--wrong);
      color:white;
      padding:4px 12px;
      border-radius:8px;
      font-size:12px;
      font-weight:600;
      white-space:nowrap;
      z-index:10;
      animation:fadeInDown 0.3s ease;
    }

    .wrong-meaning::after{
      content:'';
      position:absolute;
      bottom:-6px;
      left:50%;
      transform:translateX(-50%);
      border-left:6px solid transparent;
      border-right:6px solid transparent;
      border-top:6px solid var(--wrong);
    }

    .correct-meaning{
      position:absolute;
      top:-32px;
      left:50%;
      transform:translateX(-50%);
      background:var(--correct);
      color:white;
      padding:4px 12px;
      border-radius:8px;
      font-size:12px;
      font-weight:600;
      white-space:nowrap;
      z-index:10;
      animation:fadeInDown 0.3s ease;
    }

    .correct-meaning::after{
      content:'';
      position:absolute;
      bottom:-6px;
      left:50%;
      transform:translateX(-50%);
      border-left:6px solid transparent;
      border-right:6px solid transparent;
      border-top:6px solid var(--correct);
    }
    
    .feedback{
      margin-top:1.5rem;
      padding:1rem 2rem;
      border-radius:16px;
      font-size:16px;
      font-weight:600;
      text-align:center;
      opacity:0;
      transform:translateY(10px);
      transition:all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      max-width:100%;
    }
    
    .feedback.show{
      opacity:1;
      transform:translateY(0);
    }
    
    .feedback.correct-msg{
      background:linear-gradient(135deg, #d1fae5, #a7f3d0);
      color:#065f46;
      border:2px solid #6ee7b7;
    }
    
    .feedback.wrong-msg{
      background:linear-gradient(135deg, #fee2e2, #fecaca);
      color:#991b1b;
      border:2px solid #fca5a5;
    }

    .countdown-timer{
      position:absolute;
      bottom:20px;
      right:20px;
      width:44px;
      height:44px;
      opacity:0;
      transition:opacity 0.3s ease;
    }

    .countdown-timer.show{
      opacity:1;
    }

    .countdown-timer svg{
      width:100%;
      height:100%;
      transform:rotate(-90deg);
    }

    .countdown-circle-bg{
      fill:none;
      stroke:#e2e8f0;
      stroke-width:4;
    }

    .countdown-circle-progress{
      fill:none;
      stroke:url(#timerGradient);
      stroke-width:4;
      stroke-linecap:round;
      transition:stroke-dashoffset 0.1s linear, opacity 0.3s ease;
    }

    .countdown-text{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      font-size:16px;
      font-weight:700;
      color:var(--text-accent);
      animation:pulse 1s ease-in-out infinite;
    }

    @keyframes pulse{
      0%, 100%{ transform:translate(-50%, -50%) scale(1); opacity:1; }
      50%{ transform:translate(-50%, -50%) scale(1.1); opacity:0.8; }
    }
    
    .speaker-btn{
      position:absolute;
      top:20px;
      left:20px;
      width:44px;
      height:44px;
      border-radius:50%;
      background:linear-gradient(135deg, var(--text-accent), #8b5cf6);
      border:none;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 4px 12px rgba(102,126,234,.3);
      transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index:10;
    }

    .speaker-btn:hover{
      transform:scale(1.1);
      box-shadow:0 6px 16px rgba(102,126,234,.4);
    }

    .speaker-btn:active{
      transform:scale(0.95);
    }

    .speaker-btn svg{
      width:20px;
      height:20px;
      fill:white;
    }

    .speaker-btn.speaking{
      animation:speakingPulse 0.6s ease-in-out infinite;
    }
    .speaker-btn.loading{
      pointer-events:none;
      opacity:0.7;
    }
    .speaker-btn.loading::after{
      content:'';
      position:absolute;
      inset:0;
      border-radius:50%;
      border:3px solid transparent;
      border-top-color:#fff;
      animation:spin 0.8s linear infinite;
    }
    .speaker-btn.playing{
      background:linear-gradient(135deg, #10b981, #059669);
    }
    @keyframes spin{
      to{ transform:rotate(360deg); }
    }

    @keyframes speakingPulse{
      0%, 100%{ transform:scale(1); }
      50%{ transform:scale(1.15); }
    }

    .results-card{
      position:relative;
      width:100%;
      border-radius:32px;
      background:linear-gradient(135deg, var(--card) 0%, #fefefe 100%);
      border:2px solid var(--border);
      box-shadow:var(--shadow);
      padding:48px;
      display:flex;
      flex-direction:column;
      align-items:center;
      opacity:0;
      transform:scale(0.9);
      transition:all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .results-card.show{
      opacity:1;
      transform:scale(1);
    }

    .results-icon{
      font-size:72px;
      margin-bottom:1rem;
      animation:bounce 1s ease infinite;
    }

    .results-title{
      font-size:36px;
      font-weight:800;
      color:var(--text);
      margin-bottom:0.5rem;
    }

    .results-score{
      font-size:24px;
      font-weight:700;
      color:var(--text-accent);
      margin-bottom:1rem;
    }

    .results-message{
      font-size:18px;
      color:var(--text-light);
      text-align:center;
      max-width:400px;
      margin-bottom:2rem;
      line-height:1.6;
    }

    .btn-restart{
      padding:16px 40px;
      font-size:18px;
      font-weight:700;
      border:none;
      border-radius:50px;
      background:linear-gradient(135deg, var(--text-accent), #8b5cf6);
      color:white;
      cursor:pointer;
      transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow:0 8px 24px rgba(102,126,234,.4);
    }

    .btn-restart:hover{
      transform:translateY(-3px);
      box-shadow:0 12px 32px rgba(102,126,234,.5);
    }

    /* Retry round transition */
    /* Navigation buttons (shown after answering) */
    .nav-buttons{
      display:flex;
      gap:12px;
      margin-top:1.25rem;
    }
    .nav-btn{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:10px 24px;
      font-size:15px;
      font-weight:600;
      border:none;
      border-radius:50px;
      cursor:pointer;
      transition:all 0.25s ease;
      color:#fff;
    }
    .nav-btn.prev{
      background:rgba(100,116,139,.75);
    }
    .nav-btn.prev:hover{
      background:rgba(100,116,139,1);
      transform:translateY(-2px);
    }
    .nav-btn.next{
      background:linear-gradient(135deg, var(--text-accent), #8b5cf6);
      box-shadow:0 4px 14px rgba(102,126,234,.35);
    }
    .nav-btn.next:hover{
      transform:translateY(-2px);
      box-shadow:0 6px 20px rgba(102,126,234,.45);
    }
    .nav-btn.home{
      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.2);
      color:var(--text-light);
      font-size:14px;
      padding:10px 20px;
    }
    .nav-btn.home:hover{
      background:rgba(255,255,255,0.3);
      transform:translateY(-2px);
    }
    .nav-btn:disabled{
      opacity:0.4;
      cursor:not-allowed;
      transform:none !important;
    }

    .retry-card{
      position:relative;
      width:100%;
      border-radius:32px;
      background:linear-gradient(135deg, var(--card) 0%, #fefefe 100%);
      border:2px solid var(--border);
      box-shadow:var(--shadow);
      padding:48px;
      display:flex;
      flex-direction:column;
      align-items:center;
      opacity:0;
      transform:scale(0.9);
      transition:all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .retry-card.show{
      opacity:1;
      transform:scale(1);
    }
    .retry-icon{
      font-size:64px;
      margin-bottom:1rem;
    }
    .retry-title{
      font-size:30px;
      font-weight:800;
      color:var(--text);
      margin-bottom:0.5rem;
    }
    .retry-stats{
      font-size:20px;
      font-weight:600;
      color:var(--text-accent);
      margin-bottom:0.5rem;
    }
    .retry-message{
      font-size:16px;
      color:var(--text-light);
      text-align:center;
      max-width:420px;
      margin-bottom:2rem;
      line-height:1.6;
    }
    .retry-buttons{
      display:flex;
      gap:16px;
      flex-wrap:wrap;
      justify-content:center;
    }
    .btn-retry{
      padding:16px 36px;
      font-size:17px;
      font-weight:700;
      border:none;
      border-radius:50px;
      background:linear-gradient(135deg, #f59e0b, #d97706);
      color:white;
      cursor:pointer;
      transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow:0 8px 24px rgba(245,158,11,.4);
    }
    .btn-retry:hover{
      transform:translateY(-3px);
      box-shadow:0 12px 32px rgba(245,158,11,.5);
    }
    .btn-finish{
      padding:16px 36px;
      font-size:17px;
      font-weight:700;
      border:none;
      border-radius:50px;
      background:linear-gradient(135deg, var(--text-accent), #8b5cf6);
      color:white;
      cursor:pointer;
      transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow:0 8px 24px rgba(102,126,234,.4);
    }
    .btn-finish:hover{
      transform:translateY(-3px);
      box-shadow:0 12px 32px rgba(102,126,234,.5);
    }
    .retry-round-badge{
      display:inline-block;
      background:linear-gradient(135deg, #f59e0b, #d97706);
      color:#fff;
      font-size:13px;
      font-weight:700;
      padding:4px 14px;
      border-radius:20px;
      margin-bottom:0.5rem;
    }
    
    @keyframes fadeIn{
      from{ opacity:0; }
      to{ opacity:1; }
    }
    
    @keyframes fadeInUp{
      from{ opacity:0; transform:translateY(30px); }
      to{ opacity:1; transform:translateY(0); }
    }
    
    @keyframes fadeInDown{
      from{ opacity:0; transform:translateY(-30px); }
      to{ opacity:1; transform:translateY(0); }
    }

    @keyframes correctPulse{
      0%, 100%{ transform:scale(1); }
      50%{ transform:scale(1.05); }
    }

    @keyframes wrongShake{
      0%, 100%{ transform:translateX(0); }
      25%{ transform:translateX(-10px); }
      75%{ transform:translateX(10px); }
    }

    @keyframes bounce{
      0%, 100%{ transform:translateY(0); }
      50%{ transform:translateY(-20px); }
    }

    /* Loading state */
    .loading-card{
      position:relative;
      width:100%;
      border-radius:32px;
      background:linear-gradient(135deg, var(--card) 0%, #fefefe 100%);
      border:2px solid var(--border);
      box-shadow:var(--shadow);
      padding:60px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .loading-spinner{
      width:50px;
      height:50px;
      border:4px solid #e2e8f0;
      border-top-color:var(--text-accent);
      border-radius:50%;
      animation:spin 1s linear infinite;
      margin-bottom:20px;
    }

    @keyframes spin{
      to{ transform:rotate(360deg); }
    }

    .loading-text{
      font-size:18px;
      color:var(--text-light);
      font-weight:600;
    }

    /* Brand styling */
    .brand{
      display:none !important;
    }
    .logo{
      width:36px; height:36px;
      border-radius:999px;
      background:#fff;
      box-shadow:0 8px 20px rgba(0,0,0,.25);
      overflow:hidden;
      flex:0 0 auto;
    }
    .logo img{
      width:100%; height:100%;
      object-fit:cover;
      display:block;
    }
    .brandtext{ text-align:left; }
    .brandtext .line1{
      font-weight:800;
      letter-spacing:-.02em;
      font-size:16px;
      color:#fff;
      text-shadow:0 2px 8px rgba(0,0,0,.2);
      line-height:1.2;
    }
    .brandtext .line2{
      font-weight:600;
      opacity:.9;
      font-size:11px;
      color:rgba(255,255,255,.9);
    }

    .error-card{
      position:relative;
      width:100%;
      border-radius:32px;
      background:linear-gradient(135deg, #fee2e2, #fecaca);
      border:2px solid #fca5a5;
      padding:40px;
      display:flex;

<body>
  <div id="testWatermark"></div>
  <button class="download-pdf-btn" id="downloadPdfBtn" title="Download as PDF">
    <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
    Download PDF
  </button>
  <div class="header">
    <div class="brand" id="brandContainer" style="display:none;">
      <div class="logo" id="logoContainer">
        <img id="logoImg" src="" alt="Logo"/>
      </div>
      <div class="brandtext">
        <div class="line1" id="brandTitle"></div>
        <div class="line2" id="brandSubtitle"></div>
      </div>
    </div>
    <h1 id="testTitle">📚 Loading Test...</h1>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText">Loading...</div>
    <div class="score-display">
      <div class="score-item">
        <span class="icon">✓</span>
        <span id="correctCount">0</span>
      </div>
      <div class="score-item">
        <span class="icon">✗</span>
        <span id="wrongCount">0</span>
      </div>
    </div>
  </div>
  
  <div class="wrap" id="wrap">
    <div class="loading-card">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading questions...</div>
    </div>
  </div>



  <!-- Load global settings from speaking mock -->
  <script src="questions S/questions.js"></script>
  <script>
    // Get global logo and branding from speaking settings
    const GLOBAL_LOGO_URL = (window.SITE_CONFIG && window.SITE_CONFIG.logoUrl) || (window.SPEAKING_TEST_DATA && window.SPEAKING_TEST_DATA.settings && window.SPEAKING_TEST_DATA.settings.logoUrl) || 'https://i.ibb.co/WN0XY5Lv/logo.png';
    const GLOBAL_LOGO_WORDING = (window.SITE_CONFIG && window.SITE_CONFIG.brandName) || (window.SPEAKING_TEST_DATA && window.SPEAKING_TEST_DATA.settings && window.SPEAKING_TEST_DATA.settings.logoWording) || 'Mock Stream';
    
    // ===== DYNAMIC LOADING =====
    const urlParams = new URLSearchParams(window.location.search);
    const testFile = urlParams.get('test');
    const testType = urlParams.get('type') || 'vocabulary'; // 'vocabulary' or 'grammar'

    // ── Level-free deep links + open counter ──────────────────────────
  var _LV = ['intermediate', 'upper-intermediate', 'advanced'];
  var _LVMETA = { 'intermediate': ['B1', 'Intermediate'],
                  'upper-intermediate': ['B2', 'Upper-Intermediate'],
                  'advanced': ['C1', 'Advanced'] };
  function _lvSplit(slug) {
    for (var i = 0; i < _LV.length; i++) {
      if (slug && slug.slice(-(_LV[i].length + 1)) === '-' + _LV[i]) {
        return { base: slug.slice(0, -(_LV[i].length + 1)), level: _LV[i] };
      }
    }
    return { base: slug || '', level: null };
  }
  // Count one open of this SET (all levels share a count), once per day per
  // browser. Fire-and-forget: a failure must never affect the runner.
  function _lvBump(kind, base) {
    if (!base) return;
    try {
      var d = new Date();
      var today = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      var k = '_learnViewsSeen';
      var seen = {};
      try { seen = JSON.parse(localStorage.getItem(k) || '{}') || {}; } catch (e) {}
      if (seen.date !== today) seen = { date: today, keys: [] };
      var tag = kind + ':' + base;
      if (seen.keys.indexOf(tag) !== -1) return;
      seen.keys.push(tag);
      try { localStorage.setItem(k, JSON.stringify(seen)); } catch (e) {}
      var K = 'sb_publishable_SRLvRtRHU52FliLxA6gYaQ_I-v5LCk2';
      fetch('https://zknyukkbtbcqgvkgjktb.supabase.co/rest/v1/rpc/learn_view_bump', {
        method: 'POST',
        headers: { apikey: K, Authorization: 'Bearer ' + K, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_kind: kind, p_key: base }),
        keepalive: true
      }).catch(function () {});
    } catch (e) {}
  }
  // Level-free link: ask, then continue to the level-specific URL. Mirrors
  // the article reader, so one shared link serves every level.
  function _lvChoose(title, onPick) {
    var bd = document.createElement('div');
    bd.style.cssText = 'position:fixed;inset:0;z-index:2147483600;background:rgba(15,23,42,.55);' +
      'display:flex;align-items:center;justify-content:center;padding:20px;' +
      '-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)';
    var card = document.createElement('div');
    card.style.cssText = 'background:#fff;border-radius:18px;padding:22px;max-width:340px;width:100%;' +
      'box-shadow:0 20px 60px rgba(0,0,0,.3);font-family:system-ui,-apple-system,sans-serif';
    var html = '<div style="font:800 19px system-ui;color:#0f172a;text-align:center">Choose Your Level</div>' +
      '<div style="font:500 13px system-ui;color:#64748b;text-align:center;margin:6px 0 16px">' +
      (title ? String(title).replace(/[<>&]/g, '') : 'Select the version that matches your English level') + '</div>';
    _LV.forEach(function (l) {
      var m = _LVMETA[l];
      html += '<button data-l="' + l + '" style="display:flex;align-items:center;gap:12px;width:100%;' +
        'background:#f8fafc;border:2px solid #e2e8f0;border-radius:13px;padding:13px 15px;margin-bottom:9px;' +
        'cursor:pointer;text-align:left">' +
        '<span style="font:800 14px system-ui;background:#e2e8f0;color:#334155;border-radius:8px;' +
        'padding:5px 9px">' + m[0] + '</span>' +
        '<span style="font:700 14px system-ui;color:#4c1d95">' + m[1] + '</span></button>';
    });
    card.innerHTML = html;
    bd.appendChild(card);
    document.body.appendChild(bd);
    card.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () { onPick(b.getAttribute('data-l')); });
    });
  }

    var _lvInfo = _lvSplit(testFile || '');
    var _lvKind = (testType === 'grammar') ? 'grammar' : 'vocabulary';
    if (testFile && !_lvInfo.level) {
      // Shared link with no level — ask before loading anything.
      window.__awaitLevel = true;
      document.addEventListener('DOMContentLoaded', function () {
        _lvChoose('', function (l) {
          location.replace(location.pathname + '?test=' + encodeURIComponent(_lvInfo.base + '-' + l) +
                           '&type=' + encodeURIComponent(testType));
        });
      });
    } else if (_lvInfo.base) {
      _lvBump(_lvKind, _lvInfo.base);
    }

    let ALL_QUESTIONS = [];
    let QUESTIONS = [];
    let currentQuestion = 0;
    let correctAnswers = 0;
    let wrongAnswers = 0;
    let answered = false;
    const wrap = document.getElementById('wrap');

    // ===== gTTS SERVER =====
    const GTTS_SERVER_URL = 'https://english-server-p7y6.onrender.com/tts/audio';
    const gttsCache = {};
    let currentGttsAudio = null;

    function cleanTextForTTS(text) {
      return text
        .replace(/_+/g, ', ,')              // gaps → pause
        .replace(/["\u201C\u201D\u201E]/g, '')  // remove double quotes
        .replace(/[\u2018\u2019]/g, "'")    // normalize smart single quotes
        .replace(/[*#~`|]/g, '')            // strip symbols
        .replace(/\s{2,}/g, ' ')            // collapse spaces
        .trim();
    }

    function stopGttsAudio() {
      if (currentGttsAudio) {
        currentGttsAudio.pause();
        currentGttsAudio.currentTime = 0;
        currentGttsAudio = null;
      }
    }

    async function playGtts(text, btn) {
      // If already playing, toggle off
      if (btn.classList.contains('playing')) {
        stopGttsAudio();
        btn.classList.remove('playing', 'speaking');
        return;
      }

      stopGttsAudio();
      const cleaned = cleanTextForTTS(text);
      if (!cleaned) return;

      btn.classList.add('loading');
      btn.classList.remove('playing', 'speaking');

      try {
        let blob;
        if (gttsCache[cleaned]) {
          blob = gttsCache[cleaned];
        } else {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 30000);
          const res = await fetch(GTTS_SERVER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phrase: cleaned }),
            signal: controller.signal
          });
          clearTimeout(timeout);
          if (!res.ok) throw new Error('gTTS server error ' + res.status);

          const ct = res.headers.get('content-type') || '';
          if (ct.includes('zip') || ct.includes('octet-stream')) {
            // ZIP response — extract mp3
            if (!window.JSZip) {
              const s = document.createElement('script');
              s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
              await new Promise((r, e) => { s.onload = r; s.onerror = e; document.head.appendChild(s); });
            }
            const zip = await JSZip.loadAsync(await res.arrayBuffer());
            const mp3 = Object.keys(zip.files).find(f => f.endsWith('.mp3'));
            if (mp3) blob = await zip.files[mp3].async('blob');
            else throw new Error('No mp3 in zip');
          } else {
            blob = await res.blob();
          }
          gttsCache[cleaned] = blob;
        }

        btn.classList.remove('loading');
        btn.classList.add('playing');

        const audio = new Audio(URL.createObjectURL(blob));
        currentGttsAudio = audio;
        audio.onended = () => { btn.classList.remove('playing'); currentGttsAudio = null; };
        audio.onerror = () => { btn.classList.remove('playing'); currentGttsAudio = null; };
        audio.play();

      } catch (err) {
        console.warn('gTTS failed, falling back to browser TTS:', err);
        btn.classList.remove('loading', 'playing');
        // Fallback to browser speechSynthesis
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(cleaned);
          utterance.lang = 'en-US';
          utterance.rate = 0.9;
          btn.classList.add('speaking');
          utterance.onend = () => btn.classList.remove('speaking');
          utterance.onerror = () => btn.classList.remove('speaking');
          window.speechSynthesis.speak(utterance);
        }
      }
    }

    // ===== SMART RETRY TRACKER =====
    let wrongQuestions = [];        // questions answered wrong in current round
    let retryRound = 0;            // 0 = first pass, 1+ = retry rounds
    let totalQuestions = 0;         // total questions in first round
    let totalCorrectFirstRound = 0; // correct in first round (for final stats)
    let totalRetried = 0;           // total questions retried across all rounds
    let totalCorrectedInRetry = 0;  // questions fixed during retry rounds
    let autoAdvanceTimer = null;    // setTimeout id for auto-advance
    let countdownInterval = null;   // setInterval id for countdown circle

    // Track per-question answers so user can navigate back
    let answeredQuestions = {};     // index -> { selected, isCorrect }

    function showError(message) {
      wrap.innerHTML = `
        <div class="error-card">
          <div class="error-icon">❌</div>
          <div class="error-title">Failed to Load Test</div>
          <div class="error-message">${message}</div>
          <button class="btn-restart" onclick="window.history.back()">← Go Back</button>
        </div>
      `;
    }

    async function loadTest() {
      if (window.__awaitLevel) return;   // waiting on the level chooser
      if (!testFile) {
        showError('No test file specified. Use <code>?test=filename</code> in URL.<br><br>Example: <code>test.html?test=vocab01&type=vocabulary</code>');
        return;
      }

      // Prefer the migrated Supabase row (mock_type='grammar'|'vocabulary',
      // keyed by mock_data.slug); fall back to the static JS file.
      try {
        const SB = 'https://zknyukkbtbcqgvkgjktb.supabase.co';
        const K = 'sb_publishable_SRLvRtRHU52FliLxA6gYaQ_I-v5LCk2';
        const q = `${SB}/rest/v1/mock_tests?mock_type=eq.${encodeURIComponent(testType)}&mock_data->>slug=eq.${encodeURIComponent(testFile)}&select=title,mock_data&limit=1`;
        const r = await fetch(q, { headers: { apikey: K, Authorization: 'Bearer ' + K } });
        const rows = r.ok ? await r.json() : [];
        const md = rows[0] && rows[0].mock_data;
        if (md && Array.isArray(md.questions) && md.questions.length) {
          window.ALL_QUESTIONS = md.questions;
          ALL_QUESTIONS = md.questions;
          window.TEST_META = Object.assign({}, window.TEST_META, { title: rows[0].title || md.displayName });
          if (md.imageUrl) {
            var _wm = document.getElementById('testWatermark');
            if (_wm) {
              var _im = new Image();
              _im.onload = function () { _wm.style.backgroundImage = 'url("' + md.imageUrl + '")'; _wm.style.opacity = '1'; };
              _im.src = md.imageUrl;
            }
          }
          initTest();
          return;
        }
      } catch (e) { /* fall through to static file */ }

      // Determine folder based on type
      const folder = testType === 'grammar' ? 'questions G' : 'questions V';
      const scriptPath = `${folder}/${testFile}.js`;

      // Create script element to load external JS
      const script = document.createElement('script');
      script.src = scriptPath;
      script.onload = () => {
        // Check if ALL_QUESTIONS was loaded
        if (typeof window.ALL_QUESTIONS !== 'undefined' && window.ALL_QUESTIONS.length > 0) {
          ALL_QUESTIONS = window.ALL_QUESTIONS;
          initTest();
        } else {
          showError(`File loaded but no questions found in <code>${scriptPath}</code>`);
        }
      };
      script.onerror = () => {
        showError(`Could not load <code>${scriptPath}</code><br><br>Make sure the file exists in the <code>${folder}/</code> folder.`);
      };
      document.head.appendChild(script);
    }

    function initTest() {
      // Shuffle and pick questions
      QUESTIONS = shuffleArray([...ALL_QUESTIONS]);
      totalQuestions = QUESTIONS.length;
      answeredQuestions = {};
      
      // Check for custom metadata
      const meta = window.TEST_META || {};
      
      // Update title
      const titleMap = {
        'vocabulary': '📚 Vocabulary Test',
        'grammar': '📝 Grammar Test'
      };
      const defaultTitle = titleMap[testType] || '📚 Test';
      document.getElementById('testTitle').textContent = meta.title || defaultTitle;
      document.title = `${meta.title || defaultTitle} — IELTS Practice`;

      // Apply custom branding if provided
      if (meta.logo || meta.brand || GLOBAL_LOGO_URL) {
        const brandContainer = document.getElementById('brandContainer');
        brandContainer.style.display = 'flex';
        
        // Always use global logo from speaking settings
        document.getElementById('logoImg').src = GLOBAL_LOGO_URL;
        
        // Use test title as brand, but show global wording as subtitle
        if (meta.brand || meta.title) {
          document.getElementById('brandTitle').textContent = meta.brand || meta.title;
        }
        // Always use global logo wording as subtitle
        document.getElementById('brandSubtitle').textContent = GLOBAL_LOGO_WORDING;
        // Hide default title if brand is shown
        if (meta.brand) {
          document.getElementById('testTitle').style.display = 'none';
        }
      }

      // Apply custom colors if provided
      if (meta.colors) {
        const root = document.documentElement;
        if (meta.colors.bg1) root.style.setProperty('--bg1', meta.colors.bg1);
        if (meta.colors.bg2) root.style.setProperty('--bg2', meta.colors.bg2);
        if (meta.colors.accent) root.style.setProperty('--text-accent', meta.colors.accent);
      }

      // Clear loading and start test
      wrap.innerHTML = '';
      showQuestion(0);
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function updateProgress() {
      const progress = ((currentQuestion + 1) / QUESTIONS.length) * 100;
      document.getElementById('progressFill').style.width = progress + '%';
      const roundPrefix = retryRound > 0 ? `Review Round ${retryRound} · ` : '';
      document.getElementById('progressText').textContent = `${roundPrefix}Question ${currentQuestion + 1} of ${QUESTIONS.length}`;
      document.getElementById('correctCount').textContent = correctAnswers;
      document.getElementById('wrongCount').textContent = wrongAnswers;
    }

    function createQuestionCard(index) {
      const q = QUESTIONS[index];
      const shuffledOptions = shuffleArray([...q.options]);

      const card = document.createElement('div');
      card.className = 'question-card';
      
      card.innerHTML = `
        <button class="speaker-btn" title="Listen">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
        <div class="countdown-timer">
          <svg viewBox="0 0 44 44">
            <defs>
              <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#667eea"/>
                <stop offset="100%" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <circle class="countdown-circle-bg" cx="22" cy="22" r="18"/>
            <circle class="countdown-circle-progress" cx="22" cy="22" r="18"/>
          </svg>
          <span class="countdown-text">3</span>
        </div>
        <div class="question-number">Question ${index + 1}</div>
        <div class="question-type">${q.type}</div>
        <div class="question-text">${q.question}</div>
        <div class="options">
          ${shuffledOptions.map(opt => `
            <button class="option-btn" data-answer="${opt}">${opt}</button>
          `).join('')}
        </div>
        <div class="feedback"></div>
        <div class="nav-buttons">
          <button class="nav-btn prev" ${index === 0 ? 'disabled' : ''}>← Back</button>
          <button class="nav-btn home" onclick="goBack(); return false;">🏠 Home</button>
          <button class="nav-btn next">${index < QUESTIONS.length - 1 ? 'Next →' : 'Finish →'}</button>
        </div>
      `;

      const speakerBtn = card.querySelector('.speaker-btn');
      const optionBtns = card.querySelectorAll('.option-btn');
      const feedback = card.querySelector('.feedback');
      const prevBtn = card.querySelector('.nav-btn.prev');
      const nextBtn = card.querySelector('.nav-btn.next');

      // Text-to-speech for question (gTTS with browser fallback)
      speakerBtn.addEventListener('click', () => {
        playGtts(q.question, speakerBtn);
      });

      // If this question was already answered (navigating back), restore its state
      if (answeredQuestions[index]) {
        answered = true;
        const prev = answeredQuestions[index];
        optionBtns.forEach(b => {
          b.classList.add('disabled');
          if (b.dataset.answer === q.correct) b.classList.add('correct');
          if (b.dataset.answer === prev.selected && !prev.isCorrect) b.classList.add('wrong');
          // Restore wrong meaning tooltip
          if (!prev.isCorrect && b.dataset.answer === prev.selected && q.meanings && q.meanings[prev.selected]) {
            const wrongMeaning = document.createElement('div');
            wrongMeaning.className = 'wrong-meaning';
            wrongMeaning.textContent = q.meanings[prev.selected];
            b.style.position = 'relative';
            b.appendChild(wrongMeaning);
          }
        });
        feedback.textContent = q.def || (prev.isCorrect ? 'Correct!' : 'Incorrect');
        feedback.className = `feedback ${prev.isCorrect ? 'correct-msg' : 'wrong-msg'} show`;
      }

      optionBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          if (answered) return;
          
          answered = true;
          const selectedAnswer = btn.dataset.answer;
          const isCorrect = selectedAnswer === q.correct;

          // Store answer for this question
          answeredQuestions[index] = { selected: selectedAnswer, isCorrect };

          optionBtns.forEach(b => {
            b.classList.add('disabled');
            if (b.dataset.answer === q.correct) {
              b.classList.add('correct');
            }
          });

          if (isCorrect) {
            btn.classList.add('correct');
            correctAnswers++;
            feedback.textContent = q.def || 'Correct!';
            feedback.className = 'feedback correct-msg show';
            if (retryRound > 0) totalCorrectedInRetry++;
          } else {
            btn.classList.add('wrong');
            wrongAnswers++;
            wrongQuestions.push(q); // track for retry
            
            // Add wrong meaning tooltip
            if (q.meanings && q.meanings[selectedAnswer]) {
              const wrongMeaning = document.createElement('div');
              wrongMeaning.className = 'wrong-meaning';
              wrongMeaning.textContent = q.meanings[selectedAnswer];
              btn.style.position = 'relative';
              btn.appendChild(wrongMeaning);
            }
            
            feedback.textContent = q.def || 'Incorrect';
            feedback.className = 'feedback wrong-msg show';
          }

          updateProgress();
          
          // Start countdown timer
          const delayTime = 3000;
          const timerElement = card.querySelector('.countdown-timer');
          const progressCircle = card.querySelector('.countdown-circle-progress');
          const timerText = card.querySelector('.countdown-text');
          const radius = progressCircle.r.baseVal.value;
          const circumference = 2 * Math.PI * radius;
          
          timerElement.classList.add('show');
          progressCircle.style.strokeDasharray = circumference;
          progressCircle.style.strokeDashoffset = 0;
          
          let timeLeft = delayTime / 1000;
          timerText.textContent = Math.ceil(timeLeft);
          
          // Clear any previous timers
          if (countdownInterval) clearInterval(countdownInterval);
          if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);

          countdownInterval = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
              clearInterval(countdownInterval);
              countdownInterval = null;
              timerElement.style.opacity = '0';
            } else {
              const progress = timeLeft / (delayTime / 1000);
              const offset = circumference * (1 - progress);
              progressCircle.style.strokeDashoffset = offset;
              progressCircle.style.opacity = progress;
              timerText.textContent = Math.ceil(timeLeft);
            }
          }, 100);
          
          // Auto advance
          autoAdvanceTimer = setTimeout(() => {
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = null;
            autoAdvanceTimer = null;
            navigateForward();
          }, delayTime);
        });
      });

      // Nav button handlers
      prevBtn.addEventListener('click', () => {
        cancelAutoAdvance();
        if (currentQuestion > 0) {
          currentQuestion--;
          showQuestion(currentQuestion);
        }
      });

      nextBtn.addEventListener('click', () => {
        cancelAutoAdvance();
        navigateForward();
      });

      return card;
    }

    function cancelAutoAdvance() {
      if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
      if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
    }

    function navigateForward() {
      if (currentQuestion < QUESTIONS.length - 1) {
        currentQuestion++;
        showQuestion(currentQuestion);
      } else {
        showResults();
      }
    }

    function showQuestion(index) {
      cancelAutoAdvance();
      answered = false;

      const existingCards = wrap.querySelectorAll('.question-card');
      existingCards.forEach(card => {
        card.classList.add('exit');
        setTimeout(() => card.remove(), 500);
      });

      setTimeout(() => {
        if (index < QUESTIONS.length) {
          const card = createQuestionCard(index);
          wrap.appendChild(card);
          setTimeout(() => card.classList.add('active'), 50);
          updateProgress();
        } else {
          showResults();
        }
      }, 500);
    }

    function showResults() {
      // If there are wrong questions, offer a retry round
      if (wrongQuestions.length > 0) {
        if (retryRound === 0) totalCorrectFirstRound = correctAnswers;
        showRetryTransition();
        return;
      }

      // Final results — all correct (or user chose to finish)
      showFinalResults();
    }

    function showRetryTransition() {
      const wrongCount = wrongQuestions.length;
      const roundLabel = retryRound === 0 ? 'Round Complete' : `Review Round ${retryRound} Complete`;

      const retryCard = document.createElement('div');
      retryCard.className = 'retry-card';
      retryCard.innerHTML = `
        <div class="retry-icon">🔄</div>
        <div class="retry-title">${roundLabel}</div>
        <div class="retry-stats">${correctAnswers}/${QUESTIONS.length} correct · ${wrongCount} to review</div>
        <div class="retry-message">
          You got <strong>${wrongCount} question${wrongCount > 1 ? 's' : ''}</strong> wrong.
          Let's go over ${wrongCount > 1 ? 'them' : 'it'} again to strengthen your knowledge!
        </div>
        <div class="retry-buttons">
          <button class="btn-retry" onclick="startRetryRound()">🔁 Review Mistakes</button>
          <button class="btn-finish" onclick="showFinalResults()">📊 See Final Results</button>
        </div>
      `;

      wrap.innerHTML = '';
      wrap.appendChild(retryCard);
      setTimeout(() => retryCard.classList.add('show'), 100);
    }

    function startRetryRound() {
      retryRound++;
      totalRetried += wrongQuestions.length;

      // Load only the wrong questions, reshuffled
      QUESTIONS = shuffleArray([...wrongQuestions]);
      wrongQuestions = [];
      answeredQuestions = {};
      currentQuestion = 0;
      correctAnswers = 0;
      wrongAnswers = 0;

      // Update progress bar for the retry round
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('progressText').textContent = `Review Round ${retryRound} · Question 1 of ${QUESTIONS.length}`;
      document.getElementById('correctCount').textContent = '0';
      document.getElementById('wrongCount').textContent = '0';

      wrap.innerHTML = '';
      showQuestion(0);
    }

    function showFinalResults() {
      // Calculate overall stats
      const firstRoundCorrect = totalCorrectFirstRound || correctAnswers;
      const firstRoundPercentage = Math.round((firstRoundCorrect / totalQuestions) * 100);

      let icon = '🎉';
      let title = 'Excellent!';
      let message = 'Outstanding performance! You have mastered this topic.';

      if (firstRoundPercentage < 50) {
        icon = '📖';
        title = 'Keep Studying!';
        message = 'Practice makes perfect. Review and try again!';
      } else if (firstRoundPercentage < 70) {
        icon = '👍';
        title = 'Good Job!';
        message = 'You\'re making progress! A bit more practice will help.';
      } else if (firstRoundPercentage < 90) {
        icon = '⭐';
        title = 'Great Work!';
        message = 'Very impressive! You have a solid understanding.';
      }

      // Build retry summary line
      let retrySummary = '';
      if (retryRound > 0) {
        retrySummary = `
          <div style="margin-top:12px; padding:12px 20px; background:linear-gradient(135deg,#fef3c7,#fde68a); border-radius:16px; font-size:15px; color:#92400e; max-width:340px; text-align:center;">
            🔁 Reviewed <strong>${totalRetried}</strong> mistake${totalRetried > 1 ? 's' : ''} across <strong>${retryRound}</strong> round${retryRound > 1 ? 's' : ''}
            ${totalCorrectedInRetry > 0 ? `<br>✅ Corrected <strong>${totalCorrectedInRetry}</strong> on review` : ''}
            ${wrongQuestions.length > 0 ? `<br>⚠️ Still tricky: <strong>${wrongQuestions.length}</strong>` : '<br>🎯 All mistakes corrected!'}
          </div>
        `;
      }

      const resultsCard = document.createElement('div');
      resultsCard.className = 'results-card';
      resultsCard.innerHTML = `
        <div class="results-icon">${icon}</div>
        <div class="results-title">${title}</div>
        <div class="results-score">Score: ${firstRoundCorrect}/${totalQuestions} (${firstRoundPercentage}%)</div>
        <div class="results-message">${message}</div>
        ${retrySummary}
        <button class="btn-restart" onclick="location.reload()" style="margin-top:1.5rem;">
          🔄 Take Test Again
        </button>
      `;

      wrap.innerHTML = '';
      wrap.appendChild(resultsCard);
      setTimeout(() => resultsCard.classList.add('show'), 100);
    }

    // Initialize
    loadTest();

    // ===== PDF DOWNLOAD FUNCTIONALITY =====
    document.getElementById('downloadPdfBtn').addEventListener('click', async function() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');
      
      // Page dimensions
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const margin = 20;
      const contentWidth = pageWidth - (margin * 2);
      
      // Colors
      const primaryColor = [102, 126, 234]; // #667eea
      const secondaryColor = [118, 75, 162]; // #764ba2
      const textColor = [15, 23, 42]; // #0f172a
      const lightTextColor = [71, 85, 105]; // #475569
      const accentBg = [248, 250, 252]; // #f8fafc
      
      // Get metadata
      const meta = window.TEST_META || {};
      // Always use global logo from speaking settings
      const logoUrl = GLOBAL_LOGO_URL;
      const brandTitle = meta.brand || 'Vocabulary Test';
      // Always use global wording for subtitle
      const subtitle = GLOBAL_LOGO_WORDING;
      
      // Function to load image as base64
      async function loadImageAsBase64(url) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = 'Anonymous';
          img.onload = function() {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            try {
              resolve(canvas.toDataURL('image/jpeg', 0.9));
            } catch(e) {
              resolve(null);
            }
          };
          img.onerror = () => resolve(null);
          img.src = url;
        });
      }
      
      // Load logo
      let logoBase64 = null;
      try {
        logoBase64 = await loadImageAsBase64(logoUrl);
      } catch(e) {
        console.log('Could not load logo');
      }
      
      let yPos = margin;
      
      // ===== HEADER DESIGN =====
      // Clean title (remove emojis)
      const cleanTitle = brandTitle.replace(/[\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]|[\u{1F600}-\u{1F64F}]|[\u{1F680}-\u{1F6FF}]/gu, '').trim();
      const cleanSubtitle = subtitle.replace(/[\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]|[\u{1F600}-\u{1F64F}]|[\u{1F680}-\u{1F6FF}]/gu, '').trim();
      
      // Gradient header background
      doc.setFillColor(...primaryColor);
      doc.rect(0, 0, pageWidth, 50, 'F');
      
      // Add subtle pattern overlay
      doc.setFillColor(255, 255, 255);
      doc.setGState(new doc.GState({opacity: 0.05}));
      for(let i = 0; i < pageWidth; i += 10) {
        doc.circle(i, 25, 20, 'F');
      }
      doc.setGState(new doc.GState({opacity: 1}));
      
      // Logo
      if (logoBase64) {
        try {
          doc.addImage(logoBase64, 'JPEG', margin, 10, 30, 30);
        } catch(e) {}
      }
      
      // Title text
      const titleX = logoBase64 ? margin + 38 : margin;
      const maxTitleWidth = pageWidth - titleX - 55;
      
      doc.setTextColor(255, 255, 255);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(20);
      const titleLines = doc.splitTextToSize(cleanTitle, maxTitleWidth);
      doc.text(titleLines[0] || cleanTitle, titleX, 25);
      
      doc.setFontSize(10);
      doc.setFont('helvetica', 'normal');
      doc.text(cleanSubtitle || 'Practice Questions', titleX, 35);
      
      // Date on right side (in a box)
      doc.setFillColor(255, 255, 255);
      doc.setGState(new doc.GState({opacity: 0.15}));
      doc.roundedRect(pageWidth - margin - 45, 12, 45, 26, 3, 3, 'F');
      doc.setGState(new doc.GState({opacity: 1}));
      
      doc.setFontSize(8);
      doc.setTextColor(255, 255, 255);
      const dateStr = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      doc.text(dateStr, pageWidth - margin - 22.5, 22, { align: 'center' });
      doc.setFont('helvetica', 'bold');
      doc.text(`${ALL_QUESTIONS.length} Questions`, pageWidth - margin - 22.5, 32, { align: 'center' });
      
      yPos = 60;
      
      // ===== QUESTIONS =====
      const questions = ALL_QUESTIONS;
      
      questions.forEach((q, idx) => {
        // Check if we need a new page
        if (yPos > pageHeight - 60) {
          doc.addPage();
          yPos = margin;
          
          // Mini header on subsequent pages
          doc.setFillColor(...primaryColor);
          doc.rect(0, 0, pageWidth, 15, 'F');
          doc.setTextColor(255, 255, 255);
          doc.setFontSize(10);
          doc.setFont('helvetica', 'bold');
          doc.text(cleanTitle, margin, 10);
          doc.text(`Page ${doc.getNumberOfPages()}`, pageWidth - margin, 10, { align: 'right' });
          yPos = 25;
        }
        
        // Question number badge
        doc.setFillColor(...primaryColor);
        doc.roundedRect(margin, yPos, 12, 6, 1, 1, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(8);
        doc.setFont('helvetica', 'bold');
        doc.text(`${idx + 1}`, margin + 6, yPos + 4.2, { align: 'center' });
        
        // Question type
        doc.setTextColor(...lightTextColor);
        doc.setFont('helvetica', 'italic');
        doc.setFontSize(9);
        doc.text(q.type || 'Fill in the blank:', margin + 16, yPos + 4);
        
        yPos += 10;
        
        // Question text
        doc.setTextColor(...textColor);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        const questionLines = doc.splitTextToSize(q.question, contentWidth);
        doc.text(questionLines, margin, yPos);
        yPos += questionLines.length * 5 + 4;
        
        // Options in 2x2 grid
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        const opts = q.options;
        const optLabels = ['A', 'B', 'C', 'D'];
        const colWidth = (contentWidth - 10) / 2;
        
        for(let i = 0; i < opts.length; i++) {
          const col = i % 2;
          const row = Math.floor(i / 2);
          const x = margin + (col * (colWidth + 10));
          const y = yPos + (row * 8);
          
          // Option box
          doc.setFillColor(...accentBg);
          doc.setDrawColor(226, 232, 240);
          doc.roundedRect(x, y - 4.5, colWidth, 7, 1, 1, 'FD');
          
          // Option label
          doc.setTextColor(...primaryColor);
          doc.setFont('helvetica', 'bold');
          doc.text(`${optLabels[i]}.`, x + 2, y);
          
          // Option text
          doc.setTextColor(...textColor);
          doc.setFont('helvetica', 'normal');
          const optText = doc.splitTextToSize(opts[i], colWidth - 12)[0];
          doc.text(optText, x + 10, y);
        }
        
        yPos += Math.ceil(opts.length / 2) * 8 + 8;
        
        // Divider line
        doc.setDrawColor(226, 232, 240);
        doc.setLineWidth(0.3);
        doc.line(margin, yPos, pageWidth - margin, yPos);
        yPos += 8;
      });
      
      // ===== ANSWER KEY PAGE =====
      doc.addPage();
      yPos = margin;
      
      // Answer key header
      doc.setFillColor(...secondaryColor);
      doc.rect(0, 0, pageWidth, 35, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(20);
      doc.setFont('helvetica', 'bold');
      doc.text('Answer Key', margin, 22);
      doc.setFontSize(10);
      doc.setFont('helvetica', 'normal');
      doc.text(`${cleanTitle} - ${questions.length} Questions`, margin, 30);
      
      yPos = 45;
      
      // Answers in grid
      const answersPerRow = 5;
      const answerBoxWidth = (contentWidth - (answersPerRow - 1) * 5) / answersPerRow;
      
      questions.forEach((q, idx) => {
        const col = idx % answersPerRow;
        const row = Math.floor(idx / answersPerRow);
        
        if (col === 0 && row > 0 && yPos + 20 > pageHeight - margin) {
          doc.addPage();
          yPos = margin;
        }
        
        const x = margin + (col * (answerBoxWidth + 5));
        const y = yPos + (row % 15) * 14;
        
        // Question number box
        doc.setFillColor(...primaryColor);
        doc.roundedRect(x, y, 8, 10, 1, 1, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(9);
        doc.setFont('helvetica', 'bold');
        doc.text(`${idx + 1}`, x + 4, y + 6.5, { align: 'center' });
        
        // Answer
        doc.setFillColor(209, 250, 229); // green bg
        doc.setDrawColor(16, 185, 129);
        doc.roundedRect(x + 10, y, answerBoxWidth - 12, 10, 1, 1, 'FD');
        
        doc.setTextColor(6, 95, 70);
        doc.setFontSize(8);
        doc.setFont('helvetica', 'bold');
        const answerText = doc.splitTextToSize(q.correct, answerBoxWidth - 16)[0];
        doc.text(answerText, x + 12, y + 6.5);
        
        // Move to next row section
        if (col === answersPerRow - 1 && (row + 1) % 15 === 0 && row > 0) {
          yPos += 15 * 14 + 10;
        }
      });
      
      // ===== FOOTER ON ALL PAGES =====
      const totalPages = doc.getNumberOfPages();
      for (let i = 1; i <= totalPages; i++) {
        doc.setPage(i);
        doc.setFillColor(248, 250, 252);
        doc.rect(0, pageHeight - 12, pageWidth, 12, 'F');
        doc.setTextColor(...lightTextColor);
        doc.setFontSize(8);
        doc.setFont('helvetica', 'normal');
        doc.text('Generated from Interactive Test Platform', margin, pageHeight - 5);
        doc.text(`Page ${i} of ${totalPages}`, pageWidth - margin, pageHeight - 5, { align: 'right' });
      }
      
      // Save PDF
      const fileName = `${brandTitle.replace(/[^a-z0-9]/gi, '_')}_Test.pdf`;
      doc.save(fileName);
    });
  </script>

<!-- ===== LEAVE WARNING PROTECTION ===== -->
<script>
(function() {
  let testInProgress = false;
  let testFinished = false;
  window.__okToLeave = false;

  // ===== LEVEL DETECTION =====
  const _urlP = new URLSearchParams(window.location.search);
  const _testSlug = _urlP.get('test') || '';
  const _testType = _urlP.get('type') || 'vocabulary';
  const _levelKeys = ['intermediate', 'upper-intermediate', 'advanced'];
  let _currentLevel = null;
  let _baseSlug = _testSlug;
  // Extract current level from slug (e.g. "conditionals01-upper-intermediate" -> level="upper-intermediate", base="conditionals01")
  for (let i = _levelKeys.length - 1; i >= 0; i--) {
    if (_testSlug.endsWith('-' + _levelKeys[i])) {
      _currentLevel = _levelKeys[i];
      _baseSlug = _testSlug.slice(0, -(_levelKeys[i].length + 1));
      break;
    }
  }
  const _hasLevels = !!_currentLevel;

  // Mark test as in progress when first question is shown
  const originalShowQuestion = window.showQuestion;
  if (typeof originalShowQuestion === 'function') {
    window.showQuestion = function(index) {
      testInProgress = true;
      return originalShowQuestion.apply(this, arguments);
    };
  } else {
    // Fallback: mark as in progress shortly after load
    setTimeout(function() { testInProgress = true; }, 1000);
  }

  // Mark as finished when results are shown
  const originalShowResults = window.showResults;
  if (typeof originalShowResults === 'function') {
    window.showResults = function() {
      testFinished = true;
      return originalShowResults.apply(this, arguments);
    };
  }

  // Create leave warning modal
  function createLeaveWarningModal() {
    if (document.getElementById('leaveWarningModal')) return;
    
    const modalHTML = `
      <div id="leaveWarningModal" style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 999999;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(5px);
      ">
        <div style="
          background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
          border-radius: 20px;
          padding: 40px;
          max-width: 420px;
          width: 90%;
          text-align: center;
          box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
          border: 1px solid rgba(255, 255, 255, 0.1);
          animation: leaveModalPop 0.3s ease-out;
        ">
          <div style="
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
          ">
            <span style="font-size: 40px;">⚠️</span>
          </div>
          <h2 style="
            color: #f8fafc;
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 700;
          ">Wait! Test in Progress</h2>
          <p style="
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
          ">
            Are you sure you want to leave?<br>
            <strong style="color: #f87171;">Your progress will be lost!</strong>
          </p>
          <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
            <button id="leaveStayBtn" style="
              padding: 14px 35px;
              border: none;
              border-radius: 12px;
              font-size: 16px;
              font-weight: 600;
              cursor: pointer;
              transition: all 0.3s ease;
              background: linear-gradient(135deg, #667eea, #764ba2);
              color: white;
              box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            ">✓ Continue Test</button>
            ${_hasLevels ? `<button id="leaveSwitchLevelBtn" style="
              padding: 14px 35px;
              border: 2px solid #0f766e;
              border-radius: 12px;
              font-size: 16px;
              font-weight: 600;
              cursor: pointer;
              transition: all 0.3s ease;
              background: linear-gradient(135deg, #0f766e, #134e4a);
              color: #5eead4;
              box-shadow: 0 4px 15px rgba(15, 118, 110, 0.3);
            ">🔄 Switch Level</button>` : ''}
            <button id="leaveConfirmBtn" style="
              padding: 14px 35px;
              border: 2px solid #475569;
              border-radius: 12px;
              font-size: 16px;
              font-weight: 600;
              cursor: pointer;
              transition: all 0.3s ease;
              background: transparent;
              color: #94a3b8;
            ">Leave Anyway</button>
          </div>
        </div>
      </div>
      <style>
        @keyframes leaveModalPop {
          from { transform: scale(0.8); opacity: 0; }
          to { transform: scale(1); opacity: 1; }
        }
        #leaveStayBtn:hover {
          transform: translateY(-2px);
          box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        #leaveConfirmBtn:hover {
          background: #334155;
          border-color: #64748b;
          color: #e2e8f0;
        }
        #leaveSwitchLevelBtn:hover {
          transform: translateY(-2px);
          box-shadow: 0 6px 20px rgba(15, 118, 110, 0.4);
          background: linear-gradient(135deg, #14b8a6, #0f766e);
        }
      </style>
    `;
    
    document.body.insertAdjacentHTML('beforeend', modalHTML);
    
    document.getElementById('leaveStayBtn').addEventListener('click', function() {
      hideLeaveWarningModal();
    });

    const switchBtn = document.getElementById('leaveSwitchLevelBtn');
    if (switchBtn) {
      switchBtn.addEventListener('click', function() {
        hideLeaveWarningModal();
        showLevelSwitcher();
      });
    }
    
    document.getElementById('leaveConfirmBtn').addEventListener('click', function() {
      window.__okToLeave = true;
      hideLeaveWarningModal();
      const _tp = new URLSearchParams(window.location.search);
      const _type = _tp.get('type');
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'returnToLanding', openModal: _type || '' }, '*');
      } else {
        _returnToV3Picker();
      }
    });
  }

  // Custom goBack function for back button
  function goBack() {
    if (testInProgress && !testFinished && !window.__okToLeave) {
      showLeaveWarningModal();
      return;
    }
    window.__okToLeave = true;
    const _tp = new URLSearchParams(window.location.search);
    const _type = _tp.get('type');
    // Use postMessage if in iframe, else direct navigation
    if (window.parent !== window) {
      window.parent.postMessage({ action: 'returnToLanding', openModal: _type || '' }, '*');
    } else {
      _returnToV3Picker();
    }
  }
  // Push v3 with a hash so the picker auto-re-opens on the new
  // landing entry. _type matches the v3 _LEARN_CATALOGS keys
  // (grammar | vocabulary).
  function _returnToV3Picker() {
    var _tp = new URLSearchParams(window.location.search);
    var _type = _tp.get('type') || 'grammar';
    window.location.href = '/landing-v3.html#learn=' + encodeURIComponent(_type);
  }
  // Make goBack available globally
  window.goBack = goBack;

  function showLeaveWarningModal() {
    createLeaveWarningModal();
    const modal = document.getElementById('leaveWarningModal');
    modal.style.display = 'flex';
  }

  function hideLeaveWarningModal() {
    const modal = document.getElementById('leaveWarningModal');
    if (modal) modal.style.display = 'none';
  }

  // Level switcher overlay
  function showLevelSwitcher() {
    if (!_hasLevels) return;
    let existing = document.getElementById('levelSwitcherOverlay');
    if (existing) existing.remove();

    const levelMeta = {
      'intermediate': { label: 'Intermediate', tag: 'B1–B2', color: '#0f766e', gradient: 'linear-gradient(135deg, #0f766e, #134e4a)' },
      'upper-intermediate': { label: 'Upper-Intermediate', tag: 'B2–C1', color: '#7c3aed', gradient: 'linear-gradient(135deg, #7c3aed, #4c1d95)' },
      'advanced': { label: 'Advanced', tag: 'C1–C2', color: '#dc2626', gradient: 'linear-gradient(135deg, #dc2626, #7f1d1d)' }
    };

    let btnsHTML = '';
    for (const key of _levelKeys) {
      const meta = levelMeta[key];
      const isCurrent = key === _currentLevel;
      const targetSlug = _baseSlug + '-' + key;
      btnsHTML += `<button class="lvl-switch-btn${isCurrent ? ' current' : ''}" data-slug="${targetSlug}" style="
        width: 100%;
        padding: 16px 20px;
        border: 2px solid ${isCurrent ? meta.color : 'rgba(255,255,255,0.1)'};
        border-radius: 14px;
        font-size: 16px;
        font-weight: 600;
        cursor: ${isCurrent ? 'default' : 'pointer'};
        transition: all 0.3s ease;
        background: ${isCurrent ? meta.gradient : 'rgba(255,255,255,0.05)'};
        color: ${isCurrent ? '#fff' : '#cbd5e1'};
        display: flex;
        align-items: center;
        justify-content: space-between;
        opacity: ${isCurrent ? '1' : '0.85'};
      ">
        <span>${meta.label}</span>
        <span style="
          font-size: 12px;
          padding: 3px 10px;
          border-radius: 20px;
          background: ${isCurrent ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.08)'};
          color: ${isCurrent ? '#fff' : '#94a3b8'};
        ">${isCurrent ? '✓ Current' : meta.tag}</span>
      </button>`;
    }

    const html = `
    <div id="levelSwitcherOverlay" style="
      display: flex;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      z-index: 9999999;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
    ">
      <div style="
        background: linear-gradient(145deg, #1e293b, #0f172a);
        border-radius: 24px;
        padding: 35px 30px;
        max-width: 380px;
        width: 90%;
        text-align: center;
        box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        border: 1px solid rgba(255,255,255,0.1);
        animation: leaveModalPop 0.3s ease-out;
      ">
        <div style="font-size: 40px; margin-bottom: 15px;">🔄</div>
        <h2 style="color: #f8fafc; font-size: 22px; margin-bottom: 8px; font-weight: 700;">Switch Level</h2>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 25px;">Your current progress will be reset</p>
        <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;">
          ${btnsHTML}
        </div>
        <button id="lvlSwitchCancelBtn" style="
          padding: 12px 30px;
          border: 2px solid #475569;
          border-radius: 12px;
          font-size: 15px;
          font-weight: 600;
          cursor: pointer;
          background: transparent;
          color: #94a3b8;
          transition: all 0.3s ease;
        ">Cancel</button>
      </div>
    </div>
    <style>
      .lvl-switch-btn:not(.current):hover {
        opacity: 1 !important;
        background: rgba(255,255,255,0.1) !important;
        border-color: rgba(255,255,255,0.3) !important;
        transform: translateY(-1px);
      }
      #lvlSwitchCancelBtn:hover {
        background: #334155;
        border-color: #64748b;
        color: #e2e8f0;
      }
    </style>`;

    document.body.insertAdjacentHTML('beforeend', html);

    document.getElementById('lvlSwitchCancelBtn').addEventListener('click', function() {
      document.getElementById('levelSwitcherOverlay').remove();
    });

    document.querySelectorAll('.lvl-switch-btn:not(.current)').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const slug = this.dataset.slug;
        window.__okToLeave = true;
        if (window.parent !== window) {
          window.parent.postMessage({ action: 'loadTestLevel', test: slug, type: _testType }, '*');
        } else {
          window.location.href = `test.html?test=${slug}&type=${_testType}`;
        }
      });
    });
  }

  // Back button trap using History API
  function setupBackButtonTrap() {
    history.pushState(null, '', location.href);
    history.pushState(null, '', location.href);
    
    window.addEventListener('popstate', function(e) {
      if (testInProgress && !testFinished && !window.__okToLeave) {
        history.pushState(null, '', location.href);
        showLeaveWarningModal();
      }
    });
  }

  // Keyboard shortcuts blocking (F5, Ctrl+R, Ctrl+W)
  window.addEventListener('keydown', function(e) {
    if (!testInProgress || testFinished || window.__okToLeave) return;
    
    const isF5 = e.key === 'F5';
    const isCtrlR = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'r';
    const isCtrlW = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'w';
    
    if (isF5 || isCtrlR || isCtrlW) {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      showLeaveWarningModal();
      return false;
    }
  }, true);

  // Fallback beforeunload for browser button clicks
  window.addEventListener('beforeunload', function(e) {
    if (testInProgress && !testFinished && !window.__okToLeave) {
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
  });

  // Initialize back button trap on load
  setupBackButtonTrap();
})();
</script>
</body>
</html>
