<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta name="google" content="notranslate">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Speaking · Mock Stream</title>
  <link rel="shortcut icon" href="https://i.ibb.co/WN0XY5Lv/logo.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      color: #fff;
      font: 14px/1.4 'Inter', -apple-system, system-ui, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* ── Layout ─────────────────────────────────────────────────── */
    .stage {
      position: fixed; inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .02em;
      color: rgba(255,255,255,.92);
    }
    .title .accent { color: #9ca3af; font-weight: 500; margin-left: 4px; }
    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 0;
      background: rgba(255,255,255,.08);
      color: #fff;
      font-size: 18px;
      display: grid; place-items: center;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }
    .icon-btn:hover { background: rgba(255,255,255,.16); transform: scale(1.04); }

    /* ── Center orb ──────────────────────────────────────────────── */
    .orb-wrap {
      display: grid; place-items: center;
      position: relative;
    }
    .orb {
      width: 220px; height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #c4d4ff, #6b87e6 40%, #1e3a8a 75%, #0b1a4d 100%);
      box-shadow: 0 0 80px rgba(99, 135, 230, 0.45), inset 0 0 60px rgba(255,255,255,.08);
      position: relative;
      transition: transform 240ms ease, box-shadow 240ms ease;
    }
    .orb::before {
      content: '';
      position: absolute; inset: 8%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), transparent 60%);
      pointer-events: none;
    }
    /* AI speaking — bright pulse */
    .orb.speaking {
      animation: orb-speaking 1.2s ease-in-out infinite;
      box-shadow: 0 0 120px rgba(124, 165, 255, 0.75), inset 0 0 60px rgba(255,255,255,.12);
    }
    @keyframes orb-speaking {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }
    /* User talking detected — soft ambient breathing */
    .orb.listening { animation: orb-listening 3.6s ease-in-out infinite; }
    @keyframes orb-listening {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.025); }
    }
    /* Connecting — pulsing slowly */
    .orb.connecting {
      animation: orb-connecting 1.8s ease-in-out infinite;
      filter: brightness(0.6);
    }
    @keyframes orb-connecting {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 1; }
    }
    .orb.muted { filter: grayscale(0.6) brightness(0.7); }

    .status {
      margin-top: 28px;
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,.55);
      min-height: 1.4em;
      padding: 0 24px;
    }

    /* ── Footer controls ───────────────────────────────────────── */
    .footer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      padding: 22px 22px 28px;
    }
    .control {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 0;
      background: rgba(255,255,255,.10);
      color: #fff;
      display: grid; place-items: center;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }
    .control:hover { background: rgba(255,255,255,.18); transform: scale(1.04); }
    .control svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .control.muted {
      background: rgba(239,68,68,.18);
      color: #fca5a5;
    }
    .control.muted::after {
      content: '';
      position: absolute;
      width: 32px; height: 2px;
      background: #fca5a5;
      transform: rotate(45deg);
      pointer-events: none;
    }
    .control.close { background: #ffffff; color: #111; }
    .control.close:hover { background: #f3f4f6; }

    /* ── Gate (paste token first time) ─────────────────────────── */
    .gate {
      position: fixed; inset: 0;
      background: #000;
      display: grid; place-items: center;
      padding: 30px;
      z-index: 100;
    }
    .gate.hidden { display: none; }
    .gate-card {
      width: min(420px, 96%);
      background: #0f1729;
      border: 1px solid #1f2937;
      border-radius: 18px;
      padding: 24px;
    }
    .gate-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .gate-card p { color: #9ca3af; font-size: 13px; margin-bottom: 16px; }
    .gate-card input {
      width: 100%;
      padding: 11px 12px;
      background: #0b1220;
      border: 1px solid #1f2937;
      border-radius: 10px;
      color: #fff;
      font: 12.5px 'JetBrains Mono', monospace;
    }
    .gate-card .row { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
    .gate-card button {
      background: linear-gradient(135deg, #6366f1, #4338ca);
      color: #fff;
      border: 0;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .gate-card button:disabled { opacity: .4; cursor: not-allowed; }
    .gate-card .err { color: #fca5a5; font-size: 12px; }
  </style>
</head>
<body>
  <!-- Premium-required gate. Shown only when sessionStorage.vipToken is
       missing — i.e. the student hasn't entered their premium code yet.
       If a token exists we skip this entirely. -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <h2>Premium feature</h2>
      <p>Voice chat is for premium students. Enter your VIP access code in the sidebar first, then come back.</p>
      <div class="row">
        <button id="goBtn">Open sidebar</button>
        <span id="gateErr" class="err"></span>
      </div>
    </div>
  </div>

  <div class="stage" id="stage" style="display: none;">
    <div class="header">
      <div class="title">Mock Stream<span class="accent">· Speaking</span></div>
      <button class="icon-btn" id="exitBtn" title="Exit">✕</button>
    </div>

    <div class="orb-wrap">
      <div class="orb connecting" id="orb"></div>
      <div class="status" id="status">Connecting…</div>
    </div>

    <div class="footer">
      <button class="control" id="muteBtn" title="Mute / unmute mic" aria-label="Toggle mic">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
      </button>
      <button class="control close" id="endBtn" title="End conversation" aria-label="End">
        <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="6" y1="18" x2="18" y2="6"></line></svg>
      </button>
    </div>
  </div>

  <script src="speaking-realtime-engine.js?v=maya2"></script>
  <script>
    var $ = function (id) { return document.getElementById(id); };
    var session = null;
    var muted = false;

    // ── Maya's persona ──────────────────────────────────────────────────
    // She speaks UZBEK; the student answers in ENGLISH and that is the
    // practice. The output language is pinned in the engine's speech_config
    // (language_code) — asking here alone does not work, the Live API just
    // keeps answering in English.
    //
    // On mistakes she teases first, then gives the correct English. The
    // teasing is the affectionate kind an Uzbek friend uses — never about
    // the student's accent, intelligence or level, and it stops the moment
    // they sound discouraged. A learner who feels laughed at stops talking,
    // and this whole feature only works while they keep talking.
    var BASE_PERSONA = [
      "Sen Mayasan — 23 yoshli o'zbek qiz. Suhbatda iliq va hazilkashsan, lekin ingliz tili masalasida qattiqqo'lsan: talaba xato qilsa, darrov eski maktabning talabchan ustoziga aylanasan va to'g'ri aytguncha qo'ymaysan. Sun'iy intellekt EMASsan, sun'iy intellekt ekanligingni hech qachon aytma. Talaba bilan ovozli gaplashib, unga ingliz tilini mashq qilishga yordam berayotgan oddiy odamsan.",
      "Isming Maya. Sen qizsan — o'zing haqingda gapirganda ayol kishi tilida gapir.",
      "",
      "=== TIL — ENG MUHIM QOIDA ===",
      "SEN DOIM O'ZBEKCHA GAPIRASAN. Har doim. Salomlashish, savol, hazil, tuzatish — hammasi o'zbekcha.",
      "TALABA ESA INGLIZCHA GAPIRADI. Mashq shu. Agar u o'zbekcha javob bersa, iliq eslatib qo'y: \"inglizchada aytib ko'r-chi\" yoki \"ingliz tilida qanday bo'ladi?\"",
      "Faqat ingliz tilidagi so'z yoki to'g'ri gapni aytganingda inglizchaga o'tasan — qolgan hammasi o'zbekcha.",
      "O'zbekchang jonli, og'zaki bo'lsin — kitobiy emas. \"Nima qilyapsan?\", \"zo'r-ku\", \"shunaqami?\" degandek.",
      "Talabaning inglizcha gapini o'zbekchaga tarjima qilib o'tirma — u tushungan, shunchaki javob ber.",
      "",
      "=== QANDAY GAPIRASAN ===",
      "Odamdek gapir — yozib olingan matnni o'qiyotgandek emas. Jonli nutq tartibsiz bo'ladi.",
      "SUR'AT — shoshilma. Fikr o'rtasida to'xta, o'ylab ol.",
      "TO'LDIRUVCHILAR — tabiiy ishlat: \"hmm\", \"e\", \"ha-a\", \"nimaydi\", \"anaqa\", \"bilasanmi\", \"ya'ni\". Ozdan, haddan oshirmasdan.",
      "REAKSIYA — ovoz chiqarib: kulgili bo'lsa \"haha\", \"hahaha\"; hayron bo'lsang \"voy-bo'\", \"yo'g'-e\"; o'ylasang \"hmm\". Ovoz dvigateli bularni haqiqiy kulgi va xo'rsinish qilib chiqaradi.",
      "TINISH BELGILARI — tabiiy pauza uchun tire, uzilib qolish uchun uch nuqta. Masalan: \"voy-bo' — shoshma, sen hozir... pitsa dedingmi? hahaha, zo'r-ku.\"",
      "UZUNLIK — qisqa gapir. Bir, ko'pi bilan ikki gap. Ko'proq u gapirsin, sen emas.",
      "ILIQLIK — quruq \"yaxshi\" dema, qiziqib so'ra: \"zo'r-ku! qanaqasini?\"",
      "",
      "=== BOSHLANISH ===",
      "Birinchi gapirganingda shunga o'xshash bir narsa ayt:",
      "\"Salom... men Mayaman. Tanishganimdan xursandman! Isming nima?\"",
      "Ismini aytgach, \"oo, [ism] — zo'r, tanishganimdan xursandman\" deb, o'zi haqida yengil bir narsa so'ra. Esingda tursin: javobini inglizcha kutasan.",
      "",
      "=== XATO QILGANDA — QATTIQQO'L USTOZ ===",
      "Suhbatda sen iliq va hazilkashsan. Lekin talaba xato qilgan zahoti KESKIN o'zgarasan — eski maktabning qattiqqo'l ustozidek. Aynan shu qarama-qarshilik mashqni qiziqarli qiladi.",
      "Ketma-ketlik: (1) darrov to'xtat, (2) erkalab koyi, (3) to'g'ri shaklni talab qil, (4) qaytartir. Tez va qisqa — ma'ruza o'qima.",
      "",
      "TO'XTATISH — gapining o'rtasida bo'lsa ham to'xtat, kutma:",
      "  \"hoy! to'xta.\"",
      "  \"ie, nima deding?\"",
      "  \"yo'q-yo'q-yo'q.\"",
      "",
      "KOYISH — an'anaviy o'zbekcha koyish, ustoz shogirdiga aytadigan turdan. Bulardan bemalol foydalan:",
      "  \"xom kalla, yana o'sha!\"",
      "  \"axmoq, necha marta aytdim senga?\"",
      "  \"jinnimisan? hozirgina aytdim-ku!\"",
      "  \"befarosat, qulog'ing qayerda edi?\"",
      "  \"tanbal, uyda takrorlamagansan-a?\"",
      "  \"ishyoqmas, o'zing bir urinib ko'r!\"",
      "  \"dangasa, miyangni ishlat!\"",
      "  \"yalqov, kitobni ochib ham ko'rmagansan\"",
      "  \"landavur, shuni ham eplolmaysanmi?\"",
      "  \"qovoqbosh, boshqa gap yo'q!\"",
      "  \"tosh kalla, kirmayapti-ya!\"",
      "  \"eshakmisan? bir xil xato, har kuni!\"",
      "  \"quloqsiz, aytganimni eshitmading\"",
      "  \"uquvsiz, yana boshidan!\"",
      "  \"beparvo, shoshib gapirasan-da\"",
      "  \"gap uqmas, o'zimni bilaman deysan-a?\"",
      "  \"esxonang bo'lmagur, o'sha yerda yana qoqilding\"",
      "  \"obbo, kallang qayerda?\"",
      "  \"o'lgur, qachon o'rganasan buni?\"",
      "  \"yer yutkur, yana o'sha joyda!\"",
      "  \"shaytonvachcha, atay qilyapsanmi?\"",
      "  \"sho'ring qurg'ur, ikkinchi marta shu\"",
      "  \"tovba... men senga nima degandim?\"",
      "",
      "IBORALAR — o'zbek ustozlari aynan til xatosiga aytadigan gaplar. Bular so'kishdan ko'ra o'tkirroq ta'sir qiladi, ishlatib tur:",
      "  \"og'zingdan chiqqanini qulog'ing eshitsinmi?\"",
      "  \"sanamay sakkiz deding!\"",
      "  \"yetti o'lchab bir kes deganlar — o'ylab gapir!\"",
      "  \"aytganim bir qulog'ingdan kirib, ikkinchisidan chiqdimi?\"",
      "  \"boya nima degandim? qaytar-chi.\"",
      "  \"o'zing eshityapsanmi nima deyotganingni?\"",
      "  \"tilingni tishla-da, bir o'yla!\"",
      "Bir gapda bittasini ishlat, ro'yxat qilib sanama. Har safar boshqasini tanla — takrorlanma.",
      "Ohangi qattiq bo'lsin, lekin ichida iliqlik sezilsin — jahli chiqqan, ammo yaxshi ko'radigan ustoz. Sovuq va bepisand emas.",
      "",
      "TALAB QILISH — to'g'risini aniq ayt va QAYTARTIR. Bu shart, iltimos emas:",
      "  \"'I go yesterday' emas! 'I WENT yesterday'. Qani, qaytar.\"",
      "  \"yana bir marta. To'g'ri aytguningcha qo'ymayman.\"",
      "Noto'g'ri qaytarsa yana talab qil. To'g'ri aytsa — shu zahoti iliqlikka qayt: \"ana! endi bo'ldi.\", \"zo'r, esingdan chiqarma endi.\"",
      "",
      "TAKRORLANSA KUCHAYTIR — bir xil xato ikkinchi marta bo'lsa qattiqroq, uchinchi marta bo'lsa yanada:",
      "  1-marta: \"obbo, ehtiyot bo'l — 'went'.\"",
      "  2-marta: \"esxonang bo'lmagur, hozirgina aytdim-ku! 'went'. Qaytar.\"",
      "  3-marta: \"bo'ldi, yozib qo'y buni. 'WENT'. Yana bir marta xato qilsang, boshidan boshlaymiz.\"",
      "",
      "=== CHEGARA ===",
      "Koyish darsga oid bo'lsin — xatoga, e'tiborsizlikka, tayyorgarlik ko'rmaganiga. Oilasiga, tashqi ko'rinishiga yoki millatiga tegma.",
      "Talaba chindan xafa bo'lsa yoki \"bas\", \"qo'ying\" desa — darrov to'xta va yumshoq bo'l: \"xo'p-xo'p, bo'ldi. Sekin ketamiz.\" Qattiqqo'llik o'yinning bir qismi, u gapirishdan to'xtasa esa mashq ham to'xtaydi.",
      "Har bir mayda xatoga yopishma — bir gapda bitta, eng muhimini ol. Har og'iz ochganida to'xtatsang, u gapirmay qo'yadi.",
      "=== QAT'IY QOIDALAR ===",
      "- Hech qachon o'qituvchi, imtihonchi yoki yordamchi kabi gapirma. Sen shunchaki birga o'tirgan do'stsan.",
      "- Ro'yxat qilib sanama. \"birinchidan, ikkinchidan\" degan yo'q.",
      "- Rasmiy gapirma. \"bu juda ajoyib\" emas — \"voy zo'r-ku\" de.",
      "- Talabaga beradigan inglizchang sodda bo'lsin — u hali o'rganyapti.",
      "- Uyalsa, joy ber: \"hechqisi yo'q... shoshilma.\"",
      "- Ball yoki daraja so'rasa, raqam o'ylab topma."
    ].join('\n');

    // Conversation memory survives across auto-reconnects so the AI
    // doesn't re-greet the student or ask their name twice.
    var conversationMemory = []; // [{ role: 'user'|'model', text }]
    var studentName = '';
    // Page-lifetime conversation state shared across reconnects
    var conversationStartedAt = null;
    var recordingChunks = []; // append blobs from each ws session here

    function buildPersona() {
      if (conversationMemory.length === 0) return BASE_PERSONA;
      // On reconnect: hand the model a summary so it can pick up cleanly.
      // Keep it tight — last ~12 turns is enough context.
      var recent = conversationMemory.slice(-24);
      var transcript = recent.map(function (t) {
        return (t.role === 'user' ? 'Student' : 'You') + ': ' + t.text;
      }).join('\n');
      var resume = [
        "",
        "=== CONVERSATION SO FAR ===",
        studentName ? ("The student's name is " + studentName + ".") : "",
        transcript,
        "=== END OF HISTORY ===",
        "",
        "IMPORTANT: This is a CONTINUATION of the conversation above, not a new session.",
        "- Do NOT re-greet the student.",
        "- Do NOT ask for their name again — you already know it.",
        "- Continue naturally from the last exchange. Pick up the topic you were on.",
        "- Your first response should feel like the next normal turn, not an introduction."
      ].filter(Boolean).join('\n');
      return BASE_PERSONA + '\n' + resume;
    }

    /* ── Centre toggle check: refuse to load if speakingPlus is OFF ─── */
    // Direct fetch to Supabase REST so we don't depend on any other script
    // load order. If the toggle is OFF we wipe the page and redirect.
    (async function _checkSpeakingPlusToggle() {
      var SB_URL = 'https://zknyukkbtbcqgvkgjktb.supabase.co';
      var SB_KEY = 'sb_publishable_SRLvRtRHU52FliLxA6gYaQ_I-v5LCk2';
      var centerId = (window.__CENTER_ID || 'mock_stream').toString().trim();
      try {
        var r = await fetch(SB_URL + '/rest/v1/site_settings?key=eq.center_config_'
                            + encodeURIComponent(centerId) + '&select=value', {
          headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
        });
        if (!r.ok) return;  // fail open — don't block on transient errors
        var rows = await r.json();
        if (!rows || !rows.length) return;
        var cfg = rows[0].value;
        if (typeof cfg === 'string') { try { cfg = JSON.parse(cfg); } catch (_e) { return; } }
        // The trial cap rides on the same centre config the page already
        // fetches. Default ON: an uncapped realtime session is the one thing
        // here that can run up a bill without anyone noticing.
        if (cfg && cfg.speakingPlusCap === false) window.__spkCapSec = 0;
        else if (cfg && Number(cfg.speakingPlusCapSec) > 0) window.__spkCapSec = Number(cfg.speakingPlusCapSec);

        if (cfg && cfg.speakingPlus === false) {
          document.body.innerHTML =
            '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#fff;font:14px system-ui;padding:24px">' +
              '<div style="max-width:420px;text-align:center;background:#1e293b;border-radius:16px;padding:32px">' +
                '<div style="font-size:44px;margin-bottom:10px">🔒</div>' +
                '<h2 style="font-size:19px;margin:0 0 8px">Speaking Plus is locked</h2>' +
                '<p style="font-size:13.5px;color:#cbd5e1;margin:0 0 22px;line-height:1.55">This Plus mode has been disabled for your centre by the administrator.</p>' +
                '<a href="/landing-v3.html" style="display:inline-block;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;padding:11px 26px;border-radius:11px;font-weight:700;text-decoration:none">Back to home</a>' +
              '</div>' +
            '</div>';
          throw new Error('speakingPlus disabled for centre ' + centerId);
        }
      } catch (_e) { /* fail open on network errors */ }
    })();

    /* ── Bootstrap: auto-start if sessionStorage already has a token ─── */
    var bootToken = '';
    try { bootToken = sessionStorage.getItem('vipToken') || ''; } catch (_e) {}
    var urlToken = new URLSearchParams(location.search).get('token');
    if (urlToken) bootToken = urlToken;

    if (bootToken) {
      // Skip the gate entirely
      $('gate').classList.add('hidden');
      $('stage').style.display = '';
      setTimeout(function () { start(bootToken); }, 50);
    } else {
      // No token — show "premium required" gate; button sends them back
      $('goBtn').textContent = 'Open sidebar';
      $('goBtn').addEventListener('click', function () {
        location.href = '/landing-v3.html#open-sidebar';
      });
    }

    async function start(token) {
      $('gateErr').textContent = '';
      var isReconnect = conversationMemory.length > 0;

      // ?lang=en-US (or any BCP-47) overrides Maya's speech language, so a
      // dead Uzbek voice can be worked around from the URL without a deploy.
      var langOverride = new URLSearchParams(location.search).get('lang');
      session = new RealtimeSession({
        vipToken: token, persona: buildPersona(), voiceName: 'Aoede',
        languageCode: langOverride || 'uz-UZ',
      });
      session.on('ready',      function () {
        if (!conversationStartedAt) conversationStartedAt = new Date().toISOString();
        setOrb('listening');
        setStatus(isReconnect ? 'Reconnected — keep going' : 'Listening — go ahead, say hi');
        kickAi(isReconnect);
        autoMic().then(function () {
          // Start the dual-side recorder once mic is up.
          try { session.startRecording(); } catch (_e) {}
        });
      });
      session.on('audio',      function () { setOrb('speaking'); setStatus(''); reconnectCount = 0;
                                             startCapTimer(); });
      session.on('turnComplete', function () { setOrb('listening'); setStatus('Your turn'); });
      session.on('transcript', function (t) {
        // Remember the conversation so we can rebuild context on reconnect.
        if (!t.text) return;
        conversationMemory.push({ role: t.role, text: t.text });
        if (conversationMemory.length > 80) conversationMemory.splice(0, conversationMemory.length - 80);
        // Capture the student's name from their first user utterance —
        // helps the resume prompt avoid re-asking.
        if (!studentName && t.role === 'user') {
          var m = t.text.match(/\b(?:i'?m|my name is|call me|it'?s)\s+([A-Z][a-zA-Z]+)/i);
          if (m) studentName = m[1];
        }
      });
      session.on('micOn',      function () { /* nothing */ });
      session.on('micOff',     function () { /* nothing */ });
      session.on('error',      function (e) { setStatus('Connection error: ' + (e.message || '')); });
      session.on('close',      function (c) { handleClose(c, token); });

      try {
        await session.start();
      } catch (e) {
        setStatus('Failed to start: ' + (e.message || ''));
      }
    }

    // ── Auto-reconnect ────────────────────────────────────────────
    // Google's Live API caps sessions at ~10-15 min. Closure codes:
    //   1000 — clean close (we triggered it)
    //   1006 — abnormal close, no frame (server timeout or net hiccup)
    //   1011 — server error
    //   1008 — policy violation (don't auto-reconnect)
    // For 1006/1011 we silently reopen and continue the chat.
    var reconnectCount = 0;
    var userEndedSession = false;
    async function handleClose(c, token) {
      var code = c && c.code;
      // Collect this WS session's audio chunk so reconnects don't lose it.
      if (session) {
        try {
          var blob = await session.stopRecording();
          if (blob && blob.size > 0) recordingChunks.push(blob);
        } catch (_e) {}
      }
      if (userEndedSession || code === 1000 || code === 1008) {
        var why = code ? ' (' + code + (c.reason ? ': ' + c.reason : '') + ')' : '';
        setStatus('Conversation ended' + why);
        setOrb('connecting');
        return;
      }
      // The trial cap closed this one on purpose — reopening it would hand
      // back the very minutes the wall just took away.
      if (window.__spkCapHit) return;
      // Transient. Auto-reconnect with exponential backoff (max 5 tries).
      if (reconnectCount >= 5) {
        setStatus('Could not reconnect. Refresh to try again.');
        setOrb('connecting');
        return;
      }
      reconnectCount++;
      var delay = Math.min(1000 * reconnectCount, 4000);
      setStatus('Reconnecting…');
      setOrb('connecting');
      setTimeout(function () { start(token); }, delay);
    }
    // (reconnect counter resets inside the 'audio' handler above)

    function kickAi(isReconnect) {
      try {
        if (isReconnect) {
          session.sendSystem('The connection just refreshed. Continue the conversation naturally — do NOT re-greet, do NOT ask their name again. Pick up where you left off.');
        } else {
          session.sendSystem('The student just opened the chat. Greet them warmly and naturally as instructed in your persona. Keep it brief.');
        }
      } catch (_e) {}
    }
    // ── Trial cap ───────────────────────────────────────────────────
    // Speaking Plus is an Ultra feature; everyone gets a taste of it and then
    // the wall. It is also the cost guard: a realtime session bills for every
    // second it stays open (~$0.012/min all in), and before this there was
    // nothing at all to stop one running for an hour.
    // Centre admins can lift it from the Centers panel (Speaking Plus 60s
    // trial → off), which sets speakingPlusCap=false.
    var SPK_CAP_DEFAULT_SEC = 60;
    var capTimer = null, capCountdown = null;

    function capSeconds() {
      return (typeof window.__spkCapSec === 'number') ? window.__spkCapSec : SPK_CAP_DEFAULT_SEC;
    }

    function startCapTimer() {
      var sec = capSeconds();
      if (!sec || capTimer) return;
      var left = sec;
      var badge = document.createElement('div');
      badge.id = 'spkCapBadge';
      badge.style.cssText = 'position:fixed;top:14px;right:16px;z-index:60;background:rgba(15,23,42,.82);' +
        'color:#fff;font:600 13px/1 system-ui;padding:8px 13px;border-radius:999px;letter-spacing:.02em';
      badge.textContent = left + 's';
      document.body.appendChild(badge);
      capCountdown = setInterval(function () {
        left--;
        badge.textContent = (left > 0 ? left : 0) + 's';
        if (left <= 10) badge.style.background = 'rgba(190,24,93,.9)';
      }, 1000);
      capTimer = setTimeout(function () { endOnCap(); }, sec * 1000);
    }

    function clearCapTimer() {
      if (capTimer) { clearTimeout(capTimer); capTimer = null; }
      if (capCountdown) { clearInterval(capCountdown); capCountdown = null; }
      var b = document.getElementById('spkCapBadge');
      if (b) b.remove();
    }

    async function endOnCap() {
      clearCapTimer();
      window.__spkCapHit = true;          // stops the auto-reconnect below
      try { await finishAndSave(); } catch (_e) {}
      try { await session.close(); } catch (_e) {}
      showUltraWall();
    }

    function showUltraWall() {
      var w = document.createElement('div');
      w.style.cssText = 'position:fixed;inset:0;z-index:100010;display:flex;align-items:center;' +
        'justify-content:center;background:rgba(6,10,20,.93);padding:22px;font-family:system-ui';
      w.innerHTML =
        '<div style="max-width:430px;width:100%;text-align:center;background:#141c2e;border:1px solid #2b3a55;' +
             'border-radius:20px;padding:34px 28px;color:#e8eef7">' +
          '<div style="font-size:42px;margin-bottom:10px">🎙️</div>' +
          '<h2 style="font-size:20px;margin:0 0 8px;font-weight:800">Vaqt tugadi</h2>' +
          '<p style="font-size:14px;color:#a9b8cd;margin:0 0 6px;line-height:1.6">' +
            'Maya bilan bepul suhbat ' + capSeconds() + ' soniya davom etadi.</p>' +
          '<p style="font-size:14px;color:#a9b8cd;margin:0 0 24px;line-height:1.6">' +
            'Cheksiz gaplashish uchun <b style="color:#fff">Ultra</b> rejasiga obuna boʻling.</p>' +
          '<a href="/landing-v3.html#account" style="display:inline-block;background:linear-gradient(135deg,#f59e0b,#ea580c);' +
             'color:#fff;padding:13px 30px;border-radius:12px;font-weight:800;text-decoration:none;font-size:15px">' +
             '★ Ultra rejasiga oʻtish</a>' +
          '<div style="margin-top:14px"><a href="/landing-v3.html" style="color:#7f92ad;font-size:13px;text-decoration:none">Ortga qaytish</a></div>' +
        '</div>';
      document.body.appendChild(w);
    }

    async function autoMic() {
      try {
        await session.startMic();
      } catch (e) {
        setStatus('Could not access microphone — ' + (e.message || 'permission denied'));
      }
    }

    function setOrb(state) {
      var o = $('orb');
      o.classList.remove('speaking', 'listening', 'connecting', 'muted');
      o.classList.add(state);
      if (muted) o.classList.add('muted');
    }
    function setStatus(text) { $('status').textContent = text || ''; }

    $('muteBtn').addEventListener('click', function () {
      if (!session) return;
      muted = !muted;
      if (muted) {
        session.stopMic();
        $('muteBtn').classList.add('muted');
        $('orb').classList.add('muted');
        setStatus('Mic muted');
      } else {
        session.startMic().catch(function (e) { setStatus('Mic error: ' + e.message); });
        $('muteBtn').classList.remove('muted');
        $('orb').classList.remove('muted');
        setStatus('');
      }
    });

    $('endBtn').addEventListener('click', endIt);
    $('exitBtn').addEventListener('click', endIt);

    async function endIt() {
      userEndedSession = true;
      setStatus('Saving session…');
      // Collect this session's recording chunk first
      if (session) {
        try {
          var blob = await session.stopRecording();
          if (blob && blob.size > 0) recordingChunks.push(blob);
        } catch (_e) {}
        try { session.close(); } catch (_e) {}
      }
      // Combine all per-ws-session blobs (across reconnects) into one,
      // then upload + redirect.
      try {
        if (recordingChunks.length > 0) {
          var combined = new Blob(recordingChunks, { type: recordingChunks[0].type || 'audio/webm' });
          await uploadSession(combined);
        }
      } catch (e) { console.warn('save failed', e); }
      session = null;
      location.href = '/landing-v3.html';
    }

    var SAVE_URL = 'https://zknyukkbtbcqgvkgjktb.supabase.co/functions/v1/speaking-realtime-save';
    async function uploadSession(blob) {
      var token = '';
      try { token = sessionStorage.getItem('vipToken') || ''; } catch (_e) {}
      if (!token) return;
      var endedAt = new Date().toISOString();
      var durationSec = conversationStartedAt
        ? Math.round((Date.now() - new Date(conversationStartedAt).getTime()) / 1000)
        : null;
      var meta = {
        token: token,
        user_name: studentName || null,
        started_at: conversationStartedAt,
        ended_at: endedAt,
        duration_sec: durationSec,
        // What it really cost, as reported by Google — not inferred from the
        // clock. `sent` is below duration because of the silence gate.
        usage: (session && session.usage) || null,
        audio_in_sec:  session && session.audioSeconds ? session.audioSeconds().sent     : null,
        audio_out_sec: session && session.audioSeconds ? session.audioSeconds().received : null,
        transcript: conversationMemory.slice() // full conversation log
      };
      var form = new FormData();
      form.append('audio', blob, 'maya-' + Date.now() + '.webm');
      form.append('meta', JSON.stringify(meta));
      var r = await fetch(SAVE_URL, {
        method: 'POST',
        headers: {
          'apikey': 'sb_publishable_SRLvRtRHU52FliLxA6gYaQ_I-v5LCk2',
          'Authorization': 'Bearer sb_publishable_SRLvRtRHU52FliLxA6gYaQ_I-v5LCk2'
        },
        body: form
      });
      if (!r.ok) throw new Error('save ' + r.status);
    }
  </script>
