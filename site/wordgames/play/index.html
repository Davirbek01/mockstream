<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Games — Mock Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#FBF8F3;--card:#FFFFFF;--soft:#F3F8F5;--text:#10302A;--dim:#6B7C78;
        --gold:#0B6E5F;--orange:#E2603C;--teal:#0E8A76;--line:rgba(11,110,95,.24);
        --hair:rgba(11,110,95,.13);--ok:#1E8E4E;--okbg:#E5F5EC;--bad:#C8432B;--badbg:#FBE9E5;
        --shadow:0 6px 18px rgba(11,60,50,.12);
        /* har qatlamning o'z rangi (o'qituvchi: «qiziqarli rang») */
        --l1:#7C4DFF;--l2:#E2603C;--l3:#0EA5C6;--l4:#E8A317;--l5:#1E9E6A;--l6:#D63A7A;--lc:var(--gold)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--text);font-family:Manrope,"Segoe UI",system-ui,sans-serif;}
  body{min-height:100vh;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .wrap{max-width:820px;margin:0 auto;padding:16px 16px 40px}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .top a.back{color:var(--gold);text-decoration:none;font-weight:700;font-size:15px}
  .top .sp{flex:1}
  .modes{display:flex;background:var(--soft);border:1px solid var(--hair);border-radius:999px;padding:3px}
  .modes button{padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--dim)}
  .modes button[aria-pressed="true"]{background:var(--gold);color:#fff}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(26px,5vw,38px);margin-top:10px;line-height:1.1}
  h1 small{display:block;font-family:Manrope,sans-serif;font-size:15px;color:var(--dim);font-weight:600;margin-top:4px}
  .layers{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:16px 0 14px}
  .layers button{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:8px 4px;
    display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
  .layers b{font-size:13px}
  .layers span{font-size:12px;color:var(--dim);font-weight:600}
  .layers button:not(:disabled){border-top:4px solid var(--lc)}
  .layers button:not(:disabled) b{color:var(--lc)}
  .layers button.on{border-color:var(--lc);box-shadow:0 0 0 2px var(--lc) inset;background:color-mix(in srgb,var(--lc) 10%,#fff)}
  .layers button.done span{color:var(--ok)}
  .layers button:disabled{opacity:1;background:rgba(255,255,255,.9);color:var(--dim);cursor:not-allowed}
  .stage{background:var(--card);border:1px solid var(--hair);border-radius:20px;box-shadow:var(--shadow);padding:18px}
  .meta{display:flex;justify-content:space-between;color:var(--dim);font-weight:700;font-size:14px}
  .bar{height:6px;background:var(--soft);border-radius:6px;margin:8px 0 14px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--lc);width:0;transition:width .3s}
  .stage{border-top:6px solid var(--lc)}
  .stage[data-l="1"],button[data-l="1"]{--lc:var(--l1)}
  .stage[data-l="2"],button[data-l="2"]{--lc:var(--l2)}
  .stage[data-l="3"],button[data-l="3"]{--lc:var(--l3)}
  .stage[data-l="4"],button[data-l="4"]{--lc:var(--l4)}
  .stage[data-l="5"],button[data-l="5"]{--lc:var(--l5)}
  .stage[data-l="6"],button[data-l="6"]{--lc:var(--l6)}

  .prompt{background:radial-gradient(120% 100% at 50% 0%,color-mix(in srgb,var(--lc) 14%,#fff),#fff 70%);border-radius:16px;padding:14px;
    min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
  .prompt img{max-width:100%;max-height:220px;border-radius:14px;object-fit:contain}
  .prompt .big{font-size:clamp(30px,7vw,46px);font-weight:800;letter-spacing:.01em}
  .prompt .uz{font-size:clamp(22px,5vw,30px);font-weight:700;color:var(--gold)}
  .prompt .hint{font-size:14px;color:var(--dim);font-weight:600}
  .prompt .sent{font-size:clamp(19px,4.2vw,24px);font-weight:600;line-height:1.45;max-width:640px}
  .prompt .sent .gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--orange);color:var(--orange)}
  .say{width:76px;height:76px;border-radius:50%;background:var(--gold);color:#fff;font-size:32px;box-shadow:var(--shadow)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .opts button{background:var(--soft);border:2px solid var(--hair);border-radius:14px;padding:14px 10px;
    font-size:clamp(17px,3.8vw,21px);font-weight:700;min-height:58px;text-align:center}
  .opts button .k{display:inline-block;font-size:12px;color:var(--dim);margin-right:6px;font-weight:800}
  /* 4 variant — 4 rang va belgi (▲ ◆ ● ■), Kahoot uslubi */
  .opts button{color:#fff;border:0;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s,opacity .2s}
  .opts button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .opts button:nth-child(1){background:#E2603C}
  .opts button:nth-child(2){background:#2F6FD6}
  .opts button:nth-child(3){background:#F2B705;color:#2A2100}
  .opts button:nth-child(4){background:#1E9E6A}
  .opts button .k{color:inherit;opacity:.9;font-size:20px;line-height:1;vertical-align:-1px;margin-right:8px}
  .opts.done button:not(.ok):not(.bad){opacity:.28}
  .opts button.ok{outline:4px solid #fff;box-shadow:0 0 0 7px var(--ok)}
  .opts button.ok::after{content:"  ✓";font-weight:900}
  .opts button.bad{opacity:.6;animation:shake .35s}
  .opts button.bad::after{content:"  ✗";font-weight:900}
  .say{background:var(--lc)}
  .tiles button:not(.del){border-color:color-mix(in srgb,var(--lc) 45%,#fff);color:var(--lc);background:color-mix(in srgb,var(--lc) 8%,#fff)}
  .slots span{border-bottom-color:var(--lc)}
  .typed input{border-color:color-mix(in srgb,var(--lc) 55%,#fff)}
  .typed button{background:var(--lc)}
  .prompt .uz{color:var(--lc)}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .opts button:disabled{cursor:default}
  .slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px;min-height:52px}
  .slots span{width:40px;height:48px;border-bottom:3px solid var(--line);display:flex;align-items:center;
    justify-content:center;font-size:26px;font-weight:800;text-transform:lowercase}
  .slots span.fix{border-bottom-color:transparent;width:18px}
  /* so'z guruhi bir qatorda; uzun so'zda kataklar torayadi (min 16px) */
  .slots .w{display:inline-flex;flex-wrap:nowrap;gap:3px;max-width:100%;border:0;width:auto;height:auto}
  .slots .w span{flex:0 1 40px;min-width:12px;width:auto}
  .slots .w span.fix{flex:0 0 8px}
  .tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .tiles button{width:48px;height:52px;border-radius:12px;background:var(--soft);border:2px solid var(--hair);
    font-size:24px;font-weight:800}
  .tiles button:disabled{opacity:.25}
  .tiles .del{width:auto;padding:0 14px;font-size:18px}
  .typed{display:flex;gap:8px;margin-top:16px}
  .typed input{flex:1;font:inherit;font-size:22px;font-weight:700;padding:12px 14px;border-radius:14px;
    border:2px solid var(--line);background:var(--soft);color:var(--text);min-width:0}
  .typed button{background:var(--gold);color:#fff;border-radius:14px;padding:0 18px;font-weight:800}
  .fb{min-height:30px;margin-top:14px;text-align:center;font-weight:700;font-size:17px}
  .fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
  .next{display:block;margin:12px auto 0;background:var(--orange);color:#fff;font-weight:800;font-size:18px;
    border-radius:999px;padding:12px 34px;min-height:48px}
  .next[hidden]{display:none}
  .end{text-align:center;padding:10px 0}
  .end .pct{font-size:64px;font-weight:800;color:var(--gold);line-height:1}
  .end p{margin-top:8px;font-weight:600;color:var(--dim)}
  .end .msg{color:var(--ok);font-weight:800;font-size:18px;margin-top:10px}
  .end ul{list-style:none;margin:16px auto 0;max-width:420px;text-align:left}
  .end li{padding:8px 12px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;gap:10px}
  .end li b{color:var(--bad)}
  .end .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
  .end .btns button{background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:10px 20px;font-weight:800;min-height:48px}
  .end .btns button.main{background:var(--orange);border-color:var(--orange);color:#fff}
  .pic{display:flex;flex-direction:column;align-items:center;gap:4px;margin:0}
  .pic figcaption{font-size:11px;color:var(--dim);font-weight:600;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tmr{padding:7px 12px;border-radius:999px;font-weight:700;font-size:14px;border:2px solid var(--line);color:var(--dim)}
  .tmr[aria-pressed="true"]{border-color:var(--orange);color:var(--orange)}
  body.sinf .tmr{display:none}
  .meta{align-items:center}
  .ring{position:relative;width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center}
  .ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:5}
  .ring .bg{stroke:var(--soft)}
  .ring .arc{stroke:var(--lc);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
  .ring b{position:relative;font-size:16px;color:var(--text)}
  .ring.low .arc{stroke:var(--bad)} .ring.low b{color:var(--bad)}
  .ring.low{animation:pulse .6s infinite}
  .ring.out{opacity:.45;animation:none}
  .end .stars{font-size:22px;font-weight:800;color:var(--orange);margin-top:6px}
  /* Fon manzara (o'qituvchi: «juda zerikarli») — har unitga o'z rasmi, ustida oq parda;
     sinf rejimida yo'q (proyektorda matn o'qilishi muhimroq) */
  /* tana foni rasmni yopmasin: rasm 0-qatlam, kontent 1-qatlam */
  .wrap,body>.back,body>.sz-back{position:relative;z-index:1}
  .bgimg{position:fixed;inset:0;z-index:0;pointer-events:none;background:center/cover no-repeat;opacity:0;transition:opacity .6s}
  .bgimg.on{opacity:1}
  .bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(251,248,243,.55) 0,rgba(251,248,243,.12) 38%,rgba(251,248,243,.10) 70%,rgba(251,248,243,.35))}
  body.sinf .bgimg,body.sinf .bgcred{display:none}
  h1{text-shadow:0 1px 14px rgba(255,255,255,.95),0 0 2px rgba(255,255,255,.9)}
  h1 small{color:#3F5652}
  /* sarlavha qismi manzara ustida o'qilsin — muzli oyna */
  .glass{background:rgba(255,255,255,.80);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-radius:20px;padding:12px 16px 14px;box-shadow:0 6px 22px rgba(11,60,50,.14)}
  body.sinf .glass{background:none;box-shadow:none;padding:0;backdrop-filter:none;-webkit-backdrop-filter:none}
  .layers button{background:rgba(255,255,255,.94)}
  .tmr{background:#fff}
  .bgcred{position:fixed;right:8px;bottom:6px;z-index:5;font-size:10.5px;color:#3F5652;background:rgba(255,255,255,.72);
    padding:3px 8px;border-radius:8px;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bgcred a{color:inherit}
  /* telefonda pastdagi tugmalarni yopmasin — sahifa oxirida oddiy qator */
  @media (max-width:700px){.bgcred{position:relative;right:auto;bottom:auto;display:table;margin:0 auto 16px;max-width:92vw;z-index:1}}
  .err{padding:30px;text-align:center;color:var(--bad);font-weight:700}
  @media (max-width:520px){
    .layers{grid-template-columns:repeat(3,1fr)}
    .opts{grid-template-columns:1fr}
    .tiles button{width:42px;height:48px}
    .slots span{width:32px}
  }

  /* ---------------- SINF REJIMI (2 jamoa, 75" panel) ---------------- */
  body.sinf .wrap{max-width:1500px}
  body.sinf #layers, body.sinf #stage{display:none}
  #cls{display:none}
  body.sinf #cls{display:block;margin-top:14px}
  .setup{background:var(--card);border:1px solid var(--hair);border-radius:20px;padding:22px;box-shadow:var(--shadow);max-width:760px}
  .setup h2{font-size:18px;margin:14px 0 8px}
  .setup h2:first-child{margin-top:0}
  .pills{display:flex;flex-wrap:wrap;gap:8px}
  .pills button{padding:10px 16px;border-radius:999px;border:2px solid var(--line);font-weight:700;min-height:44px}
  .pills button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
  .names{display:flex;gap:10px;flex-wrap:wrap}
  .names input{font:inherit;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--line);flex:1;min-width:140px}
  .names input.a{border-color:#2F6FD6}.names input.b{border-color:#E2603C}
  .go{margin-top:18px;background:var(--orange);color:#fff;font-weight:800;font-size:20px;border-radius:999px;padding:14px 40px;min-height:52px}
  .board{display:none}
  .board.on{display:block}
  .bhead{display:flex;align-items:center;gap:14px;justify-content:space-between}
  .score{font-size:clamp(28px,4vw,54px);font-weight:800;min-width:90px}
  .score.a{color:#2F6FD6}.score.b{color:#E2603C;text-align:right}
  .score small{display:block;font-size:clamp(13px,1.2vw,18px);font-weight:700;color:var(--dim)}
  .clock{font-size:clamp(36px,5vw,72px);font-weight:800;color:var(--gold);min-width:110px;text-align:center}
  .clock.low{color:var(--bad);animation:pulse .6s infinite}
  @keyframes pulse{50%{transform:scale(1.12)}}
  .ctl{display:flex;gap:8px;justify-content:center}
  .ctl button{width:48px;height:48px;border-radius:12px;background:var(--soft);border:1px solid var(--hair);font-size:20px}
  .cq{background:var(--card);border:1px solid var(--hair);border-radius:22px;margin:14px 0;padding:18px;min-height:clamp(150px,22vh,300px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
  /* 1-qatlam javobi ochilganda so'z rasmning YONIGA chiqadi (ostiga emas) —
     balandlik o'smaydi, 1920x1080 panelda sahifa surilmaydi (QC3) */
  body.sinf .wrap{padding-bottom:12px}
  .cq.rev{flex-direction:row;gap:clamp(16px,2.5vw,48px)}
  .cq img{max-height:clamp(120px,20vh,300px);max-width:100%;border-radius:14px}
  .cq .big{font-size:clamp(34px,5vw,80px);font-weight:800}
  .cq .uz{font-size:clamp(28px,4vw,64px);font-weight:800;color:var(--gold)}
  .cq .sent{font-size:clamp(22px,2.8vw,44px);font-weight:600;line-height:1.4}
  .cq .sent .gap{display:inline-block;min-width:120px;border-bottom:4px solid var(--orange)}
  .cq .say{width:96px;height:96px;font-size:42px}
  .sides{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .side{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;border-radius:20px;position:relative}
  .side.a{background:rgba(47,111,214,.08);border:3px solid rgba(47,111,214,.35)}
  .side.b{background:rgba(226,96,60,.08);border:3px solid rgba(226,96,60,.35)}
  .opt{background:var(--card);border:3px solid var(--hair);border-radius:16px;padding:14px 10px;min-height:clamp(64px,9vh,120px);
    font-size:clamp(18px,2.2vw,36px);font-weight:800;display:flex;align-items:center;gap:10px;justify-content:center;text-align:center}
  /* uzun o'zbekcha javob (Advanced) uch qatorga cho'zilib ekrandan toshmasin */
  .opt.long{font-size:clamp(16px,1.55vw,26px);line-height:1.15}
  .side.a .opt .key{background:#2F6FD6}.side.b .opt .key{background:#E2603C}
  .opt .key{color:#fff;border-radius:8px;font-size:clamp(12px,1vw,16px);padding:3px 8px;flex:none}
  .side.locked .opt{opacity:.45}
  .side.locked .opt.chosen{opacity:1;outline:4px solid currentColor}
  .side.a .opt.chosen{color:#2F6FD6}.side.b .opt.chosen{color:#E2603C}
  .opt.right{opacity:1!important;background:var(--okbg);border-color:var(--ok);color:var(--ok)!important}
  .opt.wrong{opacity:1!important;background:var(--badbg);border-color:var(--bad);color:var(--bad)!important}
  .frozen{position:absolute;top:-14px;right:14px;background:var(--text);color:#fff;font-weight:800;font-size:13px;
    padding:4px 10px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase}
  .pop{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:64px;font-weight:800;animation:up 1.1s forwards;pointer-events:none}
  .pop.a{color:#2F6FD6}.pop.b{color:#E2603C}
  @keyframes up{to{transform:translate(-50%,-160%);opacity:0}}
  .curtain{position:fixed;inset:0;background:rgba(16,48,42,.92);color:#fff;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;font-size:clamp(24px,3vw,48px);font-weight:800;z-index:60}
  .curtain.on{display:flex}
  .cend{background:var(--card);border-radius:20px;padding:24px;text-align:center;box-shadow:var(--shadow)}
  .cend .win{font-size:clamp(28px,4vw,56px);font-weight:800;color:var(--gold)}
  .cend .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px;text-align:left}
  .cend h3{font-size:18px;margin-bottom:6px}
  .cend li{list-style:none;padding:5px 0;border-bottom:1px solid var(--hair);break-inside:avoid}
  .cend ul{columns:2;column-gap:18px}
  @media (max-width:700px){.sides,.cend .cols{grid-template-columns:1fr}.cend ul{columns:1}}
</style>

</head>
<body>
<div class="bgimg" id="bgimg" aria-hidden="true"></div>
<div class="wrap" id="app">
  <div class="glass">
  <div class="top">
    <a class="back" href="/wordgames/">← Word Games</a>
    <span class="sp"></span>
    <div class="modes" role="group" aria-label="Rejim">
    </div>
    <button class="tmr" id="tmr" aria-pressed="true" title="Yulduzli taymer">⏱ Taymer</button>
  </div>
  <h1 id="ttl">…<small></small></h1>
  </div>
  <div class="layers" id="layers"></div>
  <div class="stage" id="stage"><div class="err">Yuklanmoqda…</div></div>
  <div id="cls"></div>
</div>

<div class="bgcred" id="bgcred"></div>
<script src="../evu-core.js?v=2"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
/* URL parametrlari innerHTML va fetch yo'liga tushadi — faqat oq ro'yxat
   (sharh: ?b= orqali XSS — sozlar.com kelib chiqishi, kirish kodlari bilan bir xil) */
const BOOK = /^[a-z0-9-]{1,20}$/.test(Q.get("b") || "") ? Q.get("b") : "elementary";
const UNIT = Math.min(999, Math.max(1, parseInt(Q.get("u"), 10) || 1));
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dataUrl = u => `../data/${BOOK}/unit-${pad(u)}.json`;
const imgUrl = w => `https://audio.mock-stream.com/evu/img/${BOOK}/${w.id}.jpg`;
const audUrl = (w, ex) => `https://audio.mock-stream.com/evu/audio/${BOOK}-u${pad(UNIT)}/${w.id}${ex ? "_ex" : ""}.mp3`;

/* Rasm ostida muallif va litsenziya (CC BY-SA talabi; loyiha qoidasi) */
let credits = {};
const pic = w => {
  const c = credits[BOOK + "/" + w.id] || credits[w.id] || {};  /* kitob/id — kitoblar bir-birini bosmasin */
  const who = [c.author, c.license].filter(Boolean).join(" · ");
  return `<figure class="pic"><img src="${esc(imgUrl(w))}" alt="">${who ? `<figcaption>${esc(who)}</figcaption>` : ""}</figure>`;
};
let unit = null, pool = [], layer = 1, qs = [], qi = 0, right = 0, wrong = [], answered = false, retry = false;

/* Yulduzli taymer (o'qituvchi taklifi, 2026-10-05): tez javob = ko'proq yulduz.
   Vaqt tugasa savol XATO EMAS — faqat yulduz yo'q, o'quvchi javob berishda davom etadi.
   80% qoidasi to'g'ri javoblar bo'yicha qoladi. «⏱ Taymer» o'chirilsa — oddiy rejim. */
let timerOn = true;
try { timerOn = localStorage.getItem("evu-timer") !== "0"; } catch (e) {}
let tLeft = 0, tTotal = 0, tInt = null, starSum = 0;
const R = 20, CIRC = 2 * Math.PI * R;
function stopTimer() { clearInterval(tInt); tInt = null; }
function paintRing() {
  const ring = $("ring"); if (!ring) return;
  const frac = tTotal ? Math.max(0, tLeft) / tTotal : 0;
  ring.querySelector(".arc").style.strokeDashoffset = String(CIRC * (1 - frac));
  ring.querySelector("b").textContent = tLeft > 0 ? Math.ceil(tLeft) : "–";
  ring.classList.toggle("low", tLeft > 0 && tLeft <= 5);
  ring.classList.toggle("out", tLeft <= 0);
}
function startTimer() {
  stopTimer();
  if (!timerOn) return;
  tTotal = EVU.timerSec(layer); tLeft = tTotal; paintRing();
  const t0 = performance.now();
  tInt = setInterval(() => {
    tLeft = tTotal - (performance.now() - t0) / 1000;
    if (tLeft <= 0) { tLeft = 0; stopTimer(); }
    paintRing();
  }, 200);
}

/* Yakka rejim va menyular CLICK bilan: telefonda pointerdown sahifani surish
   uchun qo'yilgan barmoqni ham javob deb olardi (sharh). Tezlik kerak bo'lgan
   sinf rejimidagi .opt tugmalari o'z pointerdown'ida qoladi — panel surilmaydi. */
function tap(el, fn) { el.addEventListener("click", fn); }

/* Audio: haqiqiy xato yoki 1,5 s ichida boshlanmasa -> onFail; brauzer avto-
   ijroni to'sgan bo'lsa (NotAllowedError) -> onBlocked (so'zni OCHMAYDI).
   Har chaqiruvga token: eski savolning kech xatosi yangi savolga tegmasin. */
let player = null, playToken = 0;
function play(w, ex, cb = {}) {
  try { if (player) player.pause(); } catch (e) {}
  const tok = ++playToken, a = new Audio(audUrl(w, ex));
  player = a;
  let done = false;
  const end = fn => { if (done || tok !== playToken) return; done = true; clearTimeout(t); if (fn) fn(); };
  const t = setTimeout(() => end(cb.onFail), 1500);
  a.addEventListener("playing", () => end(null));
  a.addEventListener("error", () => end(cb.onFail));
  const p = a.play();
  if (p && p.catch) p.catch(e => end(e && e.name === "NotAllowedError" ? cb.onBlocked : cb.onFail));
}

async function load() {
  try {
    const r = await fetch(dataUrl(UNIT));
    if (!r.ok) throw new Error(r.status);
    unit = await r.json();
  } catch (e) {
    $("stage").innerHTML = '<div class="err">Bu unit hali tayyor emas.</div>';
    return;
  }
  /* qo'shni unitlar — chalg'ituvchi zaxirasi; bo'lmasa ham ishlaydi */
  try { const r = await fetch(`../img/credits.json`); if (r.ok) credits = await r.json(); } catch (e) {}
  for (const n of [UNIT - 1, UNIT + 1]) {
    if (n < 1) continue;
    /* qo'shnining clash juftlari ham — bir unitda sink, keyingisida basin bo'lsa ikkalasi bir savolga tushmasin */
    try { const r = await fetch(dataUrl(n)); if (r.ok) { const j = await r.json(); pool = pool.concat(j.words); unit.clash = (unit.clash || []).concat(j.clash || []); } } catch (e) {}
  }
  document.title = `Unit ${UNIT}: ${unit.title} — Word Games`;
  $("ttl").innerHTML = `Unit ${UNIT}: ${esc(unit.title)}<small>${esc(unit.title_uz)} · ${unit.words.length} ta so‘z</small>`;
  if (Q.get("mode") === "sinf") { classInit(); return; }
  const prog = EVU.progress.get(BOOK, UNIT);
  layer = 1;
  for (let L = 1; L <= 6; L++) if (EVU.unlocked(prog, L) && !(prog[L] >= EVU.PASS)) { layer = L; break; }
  start(layer);
}

function paintLayers() {
  const prog = EVU.progress.get(BOOK, UNIT);
  $("layers").innerHTML = EVU.LAYERS.map(L => {
    const open = EVU.unlocked(prog, L.n) && EVU.available(unit, L.n, pool);
    const pct = prog[L.n];
    const cls = [L.n === layer ? "on" : "", pct >= EVU.PASS ? "done" : ""].join(" ");
    return `<button data-l="${L.n}" class="${cls}" ${open ? "" : "disabled"}>
      <b>${L.n}. ${L.name}</b><span>${!open ? "🔒" : pct != null ? pct + "%" : "—"}</span></button>`;
  }).join("");
  $("layers").querySelectorAll("button:not([disabled])").forEach(b =>
    tap(b, () => { retry = false; start(+b.dataset.l); }));
}

function start(L, only) {
  layer = L;
  paintLayers();
  let list = EVU.questions(unit, L, Math.random, pool);
  if (only) list = list.filter(q => only.includes(q.word.id));
  qs = list; qi = 0; right = 0; wrong = []; starSum = 0;
  show();
}

function show() {
  answered = false;
  const q = qs[qi], w = q.word;
  const pct = Math.round(qi / qs.length * 100);
  let prompt = "", body = "";
  if (layer === 1) {
    prompt = w.img ? `${pic(w)}` : `<div class="big">${esc(w.en)}</div>`;
    prompt += `<div class="hint">Bu nima? O‘zbekchasini tanlang.</div>`;
  } else if (layer === 2) {
    prompt = `<div class="uz">${esc(w.uz)}</div><div class="hint">Inglizchasini tanlang.</div>`;
  } else if (layer === 3) {
    prompt = `<button class="say" id="say" aria-label="Tinglash">🔊</button><div class="hint" id="h3">Tinglang va so‘zni tanlang.</div>`;
  } else if (layer === 4 || layer === 6) {
    prompt = (w.img ? `${pic(w)}` : "") +
      `<div class="uz">${esc(w.uz)}</div><div class="hint">${layer === 4 ? "Harflardan so‘zni yig‘ing." : "Inglizchasini yozing."}</div>`;
  } else if (layer === 5) {
    prompt = `<div class="sent">${gapSentence(w)}</div><div class="hint">Bo‘sh joyga mos so‘zni tanlang.</div>`;
  }
  if (q.options) {
    const label = o => layer === 1 ? o.uz : layer === 5 ? (o.gap || o.en) : o.en;
    body = `<div class="opts">${q.options.map((o, i) =>
      `<button data-id="${esc(o.id)}"><span class="k">${"▲◆●■"[i]}</span>${esc(label(o))}</button>`).join("")}</div>`;
  } else if (layer === 4) {
    body = `<div class="slots" id="slots"></div><div class="tiles" id="tiles"></div>`;
  } else {
    body = `<form class="typed" id="typed" autocomplete="off"><input id="inp" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Javob"><button>OK</button></form>`;
  }
  $("stage").dataset.l = layer;
  $("stage").innerHTML = `<div class="meta"><span>${EVU.LAYERS[layer - 1].name}${retry ? " · xatolar" : ""}</span>${timerOn ? `<span class="ring" id="ring"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="${R}" class="bg"/><circle cx="24" cy="24" r="${R}" class="arc" stroke-dasharray="${CIRC}"/></svg><b></b></span>` : ""}<span>${starSum ? "⭐ " + starSum + " · " : ""}${qi + 1} / ${qs.length}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="prompt">${prompt}</div>${body}
    <div class="fb" id="fb"></div><button class="next" id="next" hidden>Keyingi →</button>`;
  tap($("next"), advance);
  if (q.options) $("stage").querySelectorAll(".opts button").forEach(b => tap(b, () => choose(b.dataset.id)));
  if (layer === 3) {
    const myQi = qi;
    const hint = txt => { if (qi === myQi && layer === 3 && $("h3")) $("h3").textContent = txt; };
    const go = () => play(w, false, {
      onFail: () => hint("Audio ochilmadi — so‘z: " + w.en),
      onBlocked: () => hint("🔊 tugmasini bosing — tinglang va tanlang."),
    });
    tap($("say"), go); go();
  }
  if (layer === 4) spell(w);
  if (layer === 6) {
    $("typed").addEventListener("submit", e => { e.preventDefault(); if (!answered) judge(EVU.checkTyped($("inp").value, w)); });
    setTimeout(() => $("inp") && $("inp").focus(), 50);
  }
  startTimer();
}

function gapSentence(w) {
  // butun so'z sifatida qidiriladi: "hat" "that" ichida bo'shliqqa aylanmasin
  const ex = w.ex, lo = ex.toLowerCase(), g = w.gap.toLowerCase(), al = /[a-z0-9]/;
  let i = lo.indexOf(g);
  while (i >= 0 && (al.test(lo[i - 1] || "") || al.test(lo[i + g.length] || ""))) i = lo.indexOf(g, i + 1);
  if (i < 0) i = lo.indexOf(g);
  return esc(ex.slice(0, i)) + '<span class="gap">&nbsp;</span>' + esc(ex.slice(i + w.gap.length));
}

/* Imlo: harflar aralash, +2 chalg'ituvchi harf; probel/defis/apostrof o'z joyida */
function spell(w) {
  const target = w.en.toLowerCase();
  const letters = [...target].filter(c => /[a-z]/.test(c));
  const abc = "abcdefghijklmnopqrstuvwxyz";
  const extra = [];
  while (extra.length < 2) { const c = abc[Math.floor(Math.random() * 26)]; if (!letters.includes(c)) extra.push(c); }
  const tiles = EVU.shuffle(letters.concat(extra));
  const picked = [];
  function paint() {
    let k = 0;
    /* har so'z o'z guruhida — telefonda so'z o'rtasidan bo'linmasin (sharh: «indefini / te») */
    $("slots").innerHTML = target.split(" ").flatMap(word => word.split(/(?<=-)/)).map(word => '<span class="w">' + [...word].map(c => /[a-z]/.test(c)
      ? `<span>${picked[k] != null ? tiles[picked[k++]] : (k++, "")}</span>` : `<span class="fix">${esc(c)}</span>`).join("") + "</span>").join("");
    $("tiles").innerHTML = tiles.map((c, i) => `<button data-i="${i}" ${picked.includes(i) || answered ? "disabled" : ""}>${c}</button>`).join("") +
      `<button class="del" id="del" ${answered ? "disabled" : ""}>⌫</button>`;
    $("tiles").querySelectorAll("button[data-i]").forEach(b => tap(b, () => {
      if (answered) return;
      picked.push(+b.dataset.i); paint();
      if (picked.length === letters.length) {
        let s = "", j = 0;
        for (const c of target) s += /[a-z]/.test(c) ? tiles[picked[j++]] : c;
        judge(s === target);
      }
    }));
    tap($("del"), () => { if (!answered) { picked.pop(); paint(); } });
  }
  paint();
}

function choose(id) {
  if (answered) return;
  const q = qs[qi];
  $("stage").querySelector(".opts").classList.add("done");
  $("stage").querySelectorAll(".opts button").forEach(b => {
    b.disabled = true;
    if (b.dataset.id === q.answer.id) b.classList.add("ok");
    else if (b.dataset.id === id) b.classList.add("bad");
  });
  judge(id === q.answer.id);
}

function judge(ok) {
  answered = true;
  const gotStars = ok && timerOn && tLeft > 0 ? EVU.stars(tLeft / tTotal) : 0;
  stopTimer();
  starSum += gotStars;
  const w = qs[qi].word;
  if (ok) right++; else wrong.push(w);
  const fb = $("fb");
  fb.className = "fb " + (ok ? "ok" : "bad");
  fb.innerHTML = ok ? "✓ To‘g‘ri!" + (gotStars ? " " + "⭐".repeat(gotStars) : "") : `✗ To‘g‘ri javob: <b>${esc(w.en)}</b> — ${esc(w.uz)}`;
  if (layer === 4) $("tiles").querySelectorAll("button").forEach(b => b.disabled = true);
  if (layer === 6) $("inp").disabled = true;
  play(w, layer === 5 && !!w.ex);
  $("next").hidden = false;
  $("next").focus();
}

function advance() {
  if (!answered) return;
  if (++qi < qs.length) show(); else finish();
}

function finish() {
  stopTimer();
  const pct = Math.round(right / qs.length * 100);
  const bestBefore = EVU.progress.getStars(BOOK, UNIT, layer);
  if (timerOn && !retry) EVU.progress.setStars(BOOK, UNIT, layer, starSum);
  const starLine = timerOn && !retry
    ? `<p class="stars">⭐ ${starSum} / ${qs.length * 3}${starSum > bestBefore && bestBefore ? " — yangi rekord! 🏅" : bestBefore ? " · rekord: " + bestBefore : ""}</p>` : "";
  const before = EVU.progress.get(BOOK, UNIT);
  if (!retry) EVU.progress.set(BOOK, UNIT, layer, pct);
  const after = EVU.progress.get(BOOK, UNIT);
  const opened = layer < 6 && !EVU.unlocked(before, layer + 1) && EVU.unlocked(after, layer + 1);
  const nextOpen = layer < 6 && EVU.unlocked(after, layer + 1) && EVU.available(unit, layer + 1, pool);
  $("stage").innerHTML = `<div class="end">
    <div class="pct">${pct}%</div><p>${right} / ${qs.length} to‘g‘ri${retry ? " (xatolarni takrorlash)" : ""}</p>${starLine}
    ${opened ? `<div class="msg">🎉 ${layer + 1}-qatlam ochildi!</div>` :
      (!retry && pct < EVU.PASS ? `<p>Keyingi qatlam uchun ${EVU.PASS}% kerak.</p>` : "")}
    ${wrong.length ? `<ul>${wrong.map(w => `<li><b>${esc(w.en)}</b><span>${esc(w.uz)}</span></li>`).join("")}</ul>` : ""}
    <div class="btns">
      ${wrong.length ? '<button id="bErr" class="main">Xatolarni qayta o‘ynash</button>' : ""}
      <button id="bAgain">Qatlamni qaytadan</button>
      ${nextOpen ? '<button id="bNext" class="main">Keyingi qatlam →</button>' : ""}
    </div></div>`;
  paintLayers();
  const ids = wrong.map(w => w.id);
  if ($("bErr")) tap($("bErr"), () => { retry = true; start(layer, ids); });
  tap($("bAgain"), () => { retry = false; start(layer); });
  if ($("bNext")) tap($("bNext"), () => { retry = false; start(layer + 1); });
}

document.addEventListener("keydown", e => {
  if (document.body.classList.contains("sinf")) return;
  if (!unit || !qs.length || e.target.tagName === "INPUT") {
    if (e.key === "Enter" && answered && e.target.tagName === "INPUT") { e.preventDefault(); advance(); }
    return;
  }
  /* fokusdagi tugmada Enter o'zi click beradi — ikki marta o'tib ketmasin */
  if (e.key === "Enter") { if (e.target.tagName !== "BUTTON") advance(); return; }
  const n = parseInt(e.key, 10);
  const q = qs[qi];
  if (q && q.options && n >= 1 && n <= 4) choose(q.options[n - 1].id);
});

/* ====================== SINF REJIMI (2 jamoa) ======================
   So'z poygasidan sinalgan qoidalar: javob ikkala jamoa tanlagach yoki vaqt
   tugagach OCHILADI; variantlar ikki tomonda derange bilan boshqa o'rinda;
   tezlikka qarab 3/2/1 ball, kechroq to'g'ri topgan kamida 1 ball kam;
   har jamoaga bitta urinish; A S D F / J K L ; ; Space — tanaffus. */
const CODES = { a: ["KeyA", "KeyS", "KeyD", "KeyF"], b: ["KeyJ", "KeyK", "KeyL", "Semicolon"] };
const LABEL = { a: ["A", "S", "D", "F"], b: ["J", "K", "L", ";"] };
const CLASS_LAYERS = EVU.LAYERS.filter(L => L.choice);
let cfg = { layer: 1, sec: 30, a: "1-jamoa", b: "2-jamoa" };
try { Object.assign(cfg, JSON.parse(localStorage.getItem("evu-cls")) || {}); } catch (e) {}
let cq = [], ci = 0, ans = {}, score = {}, miss = {}, left = 0, tick = null, closed = false, paused = false, advT = null;

function classInit() {
  document.body.classList.add("sinf");
  if (!CLASS_LAYERS.some(L => L.n === cfg.layer)) cfg.layer = 1;
  const pill = (k, v, t) => `<button data-k="${k}" data-v="${v}" aria-pressed="${cfg[k] === v}">${t}</button>`;
  $("cls").innerHTML = `<div class="setup" id="setup">
    <h2>Qatlam</h2><div class="pills">${CLASS_LAYERS.map(L => pill("layer", L.n, L.n + ". " + L.name)).join("")}</div>
    <h2>Vaqt</h2><div class="pills">${[20, 30, 45].map(n => pill("sec", n, n + " soniya")).join("")}</div>
    <h2>Jamoalar</h2><div class="names"><input class="a" id="nA" value="${esc(cfg.a)}" maxlength="20" aria-label="1-jamoa nomi"><input class="b" id="nB" value="${esc(cfg.b)}" maxlength="20" aria-label="2-jamoa nomi"></div>
    <button class="go" id="go">Boshlash ▶</button></div>
    <div class="board" id="board"></div>
    <div class="curtain" id="curtain"><div>⏸ Tanaffus</div><div id="cScore"></div><div style="font-size:.5em">Davom etish: Space yoki ⏸</div></div>`;
  $("cls").querySelectorAll(".pills button").forEach(b => tap(b, () => {
    cfg[b.dataset.k] = +b.dataset.v;
    b.parentNode.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  }));
  tap($("go"), classStart);
  tap($("curtain"), () => pause(false));
}

function classStart() {
  cfg.a = $("nA").value.trim() || "1-jamoa";
  cfg.b = $("nB").value.trim() || "2-jamoa";
  try { localStorage.setItem("evu-cls", JSON.stringify(cfg)); } catch (e) {}
  cq = EVU.questions(unit, cfg.layer, Math.random, pool);
  ci = -1; score = { a: 0, b: 0 }; miss = { a: [], b: [] }; paused = false;
  $("setup").style.display = "none";
  $("board").classList.add("on");
  $("board").innerHTML = `<div class="bhead">
      <div class="score a"><small>${esc(cfg.a)}</small><span id="scA">0</span></div>
      <div><div class="clock" id="clock"></div><div class="ctl"><button id="bPause" aria-label="Tanaffus">⏸</button><button id="bFs" aria-label="To‘liq ekran">⛶</button></div></div>
      <div class="score b"><small>${esc(cfg.b)}</small><span id="scB">0</span></div></div>
    <div class="cq" id="cq"></div>
    <div class="sides"><div class="side a" id="sideA"></div><div class="side b" id="sideB"></div></div>
    <p id="cqn" style="text-align:center;margin-top:10px;font-weight:700;color:var(--dim)"></p>`;
  tap($("bPause"), () => pause());
  /* click: sensorli panelda pointerdown faollashtiruvchi hodisa emas — fullscreen rad etilardi */
  $("bFs").addEventListener("click", () => {
    const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    if (p && p.catch) p.catch(() => {});
  });
  classNext();
}

function classNext() {
  ci++;
  if (ci >= cq.length) return classEnd();
  const q = cq[ci], w = q.word, L = cfg.layer;
  closed = false; ans = { a: null, b: null };
  $("cqn").textContent = (ci + 1) + " / " + cq.length;
  $("cq").classList.remove("rev");
  $("cq").innerHTML =
    L === 1 ? (w.img ? `${pic(w)}` : `<div class="big">${esc(w.en)}</div>`)
    : L === 2 ? `<div class="uz">${esc(w.uz)}</div>`
    : L === 3 ? `<button class="say" id="cSay" aria-label="Tinglash">🔊</button>`
    : `<div class="sent">${gapSentence(w)}</div>`;
  if (L === 3) {
    /* audio yo'q bo'lsa sinf butun taymer davomida qotib qolmasin */
    const myCi = ci;
    const cb = { onFail: () => { if (ci === myCi && !closed) $("cq").insertAdjacentHTML("beforeend", `<div class="big">${esc(w.en)}</div>`); } };
    tap($("cSay"), () => play(w, false, cb)); play(w, false, cb);
  }
  const label = o => L === 1 ? o.uz : L === 5 ? (o.gap || o.en) : o.en;
  const orderA = q.options.slice(), order = { a: orderA, b: EVU.derange(orderA) };
  ["a", "b"].forEach(side => {
    const host = $("side" + side.toUpperCase());
    host.className = "side " + side;
    host.innerHTML = order[side].map((o, i) =>
      `<button class="opt${label(o).length > 22 ? " long" : ""}" data-right="${o.id === q.answer.id ? 1 : ""}"><span class="key">${LABEL[side][i]}</span><span>${esc(label(o))}</span></button>`).join("");
    host.querySelectorAll(".opt").forEach(b => b.addEventListener("pointerdown", ev => { ev.preventDefault(); hit(side, b); }));
  });
  left = cfg.sec; paintClock(); startTick();
}

function startTick() {
  clearInterval(tick);
  tick = setInterval(() => { left--; paintClock(); if (left <= 0) { clearInterval(tick); closeRound(); } }, 1000);
}
function paintClock() { const c = $("clock"); c.textContent = left; c.classList.toggle("low", left <= 5 && !closed); }
const pointsNow = () => { const f = left / cfg.sec; return f > 2 / 3 ? 3 : f > 1 / 3 ? 2 : 1; };

function hit(side, btn) {
  if (paused || closed || ans[side] || !btn) return;
  ans[side] = { btn, right: !!btn.dataset.right, left, pts: pointsNow() };
  btn.classList.add("chosen");
  const host = $("side" + side.toUpperCase());
  host.classList.add("locked");
  const tag = document.createElement("div"); tag.className = "frozen"; tag.textContent = "tanlandi"; host.appendChild(tag);
  if (ans.a && ans.b) closeRound();
}

function closeRound() {
  if (closed) return;
  closed = true; clearInterval(tick); paintClock();
  const w = cq[ci].word;
  const right = ["a", "b"].filter(x => ans[x] && ans[x].right).sort((x, y) => ans[y].left - ans[x].left);
  let first = 0;
  right.forEach((x, i) => {
    let p = ans[x].pts;
    if (i > 0) p = Math.max(1, Math.min(p, first - 1)); else first = p;
    score[x] += p;
    $("sc" + x.toUpperCase()).textContent = score[x];
    const pop = document.createElement("div"); pop.className = "pop " + x; pop.textContent = "+" + p;
    $("side" + x.toUpperCase()).appendChild(pop); setTimeout(() => pop.remove(), 1200);
  });
  ["a", "b"].forEach(x => {
    if (!ans[x] || !ans[x].right) miss[x].push(w);
    if (ans[x]) ans[x].btn.classList.add(ans[x].right ? "right" : "wrong");
  });
  document.querySelectorAll("#cls .opt").forEach(b => { if (b.dataset.right) b.classList.add("right"); });
  if (cfg.layer === 5) $("cq").innerHTML = `<div class="sent">${esc(w.ex)}</div>`;
  if (cfg.layer === 1 && w.img) $("cq").classList.add("rev");
  if (cfg.layer === 2 || (cfg.layer === 1 && w.img)) $("cq").insertAdjacentHTML("beforeend", `<div class="big">${esc(w.en)}</div>`);
  play(w, cfg.layer === 5);
  advT = setTimeout(classNext, 2600);
}

function pause(on) {
  if (!$("board") || !$("board").classList.contains("on") || !cq.length || ci >= cq.length) return;
  const want = on === undefined ? !paused : on;
  if (want === paused) return;
  paused = want;
  if (paused) {
    clearInterval(tick); clearTimeout(advT);
    try { player.pause(); } catch (e) {}
    $("cScore").textContent = `${cfg.a} ${score.a} : ${score.b} ${cfg.b}`;
    $("curtain").classList.add("on");
  } else {
    $("curtain").classList.remove("on");
    if (closed) advT = setTimeout(classNext, 900); else startTick();
  }
}

function classEnd() {
  clearInterval(tick);
  const win = score.a === score.b ? "Durang!" : "🏆 " + (score.a > score.b ? cfg.a : cfg.b);
  const list = m => m.length ? `<ul>${m.map(w => `<li><b>${esc(w.en)}</b> — ${esc(w.uz)}</li>`).join("")}</ul>` : "<p>Xato yo‘q 🎉</p>";
  $("board").innerHTML = `<div class="cend"><div class="win">${esc(win)}</div>
    <p style="font-size:28px;font-weight:800;margin-top:6px">${esc(cfg.a)} ${score.a} : ${score.b} ${esc(cfg.b)}</p>
    <div class="cols"><div><h3>${esc(cfg.a)} — xatolar</h3>${list(miss.a)}</div><div><h3>${esc(cfg.b)} — xatolar</h3>${list(miss.b)}</div></div>
    <button class="go" id="again">Yana o‘ynash</button></div>`;
  tap($("again"), () => { $("board").classList.remove("on"); $("setup").style.display = ""; });
}

document.addEventListener("keydown", e => {
  if (!document.body.classList.contains("sinf") || e.target.tagName === "INPUT") return;
  if (e.code === "Space" || e.key === " ") { e.preventDefault(); pause(); return; }
  if (!cq.length || closed || paused || !$("board").classList.contains("on")) return;
  /* e.code — maktab kompyuterida kirill tartibi yoqiq bo'lsa ham A S D F ishlaydi */
  ["a", "b"].forEach(side => {
    const i = CODES[side].indexOf(e.code);
    if (i >= 0) hit(side, $("side" + side.toUpperCase()).querySelectorAll(".opt")[i]);
  });
});


function paintTmr() { $("tmr").setAttribute("aria-pressed", String(timerOn)); $("tmr").textContent = timerOn ? "⏱ Taymer" : "⏱ Taymersiz"; }
paintTmr();
tap($("tmr"), () => {
  timerOn = !timerOn; paintTmr();
  try { localStorage.setItem("evu-timer", timerOn ? "1" : "0"); } catch (e) {}
  if (unit && qs.length && !document.body.classList.contains("sinf")) start(layer, retry ? qs.map(q => q.word.id) : undefined);
});

/* Fon manzara: unit raqamiga qarab aylanadi; muallif va litsenziya pastda */
fetch("../bg/credits.json").then(r => r.ok ? r.json() : []).then(list => {
  if (!list.length || document.body.classList.contains("sinf")) return;
  const b = list[(UNIT - 1) % list.length];
  const img = new Image();
  img.onload = () => { $("bgimg").style.backgroundImage = `url("../bg/${encodeURIComponent(b.file)}")`; $("bgimg").classList.add("on"); };
  img.src = "../bg/" + encodeURIComponent(b.file);
  $("bgcred").innerHTML = `Fon: <a href="${esc(b.page)}" target="_blank" rel="noopener">${esc(b.title)}</a> — ${esc(b.author)}, ${esc(b.license)}`;
}).catch(() => {});
load();
</script>
