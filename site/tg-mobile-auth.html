<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Signing in…</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           display: flex; align-items: center; justify-content: center; min-height: 100vh;
           margin: 0; background: #f8fafc; color: #334155; text-align: center; padding: 20px; }
    .card { max-width: 360px; }
    .spin { width: 36px; height: 36px; border: 4px solid #e2e8f0; border-top-color: #0d9488;
            border-radius: 50%; margin: 0 auto 16px; animation: s 1s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    a { color: #0d9488; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spin"></div>
    <p id="msg">Returning to the app…</p>
  </div>
  <script>
    // Telegram OAuth → mobile-app forwarder.
    // Telegram redirects here with #tgAuthResult=<base64 payload>. We bounce it
    // into the app's deep link (?to=...). The payload is signed by Telegram and
    // verified server-side by verify-telegram-login, so forwarding is safe —
    // but we still only allow known app schemes.
    (function () {
      var params = new URLSearchParams(location.search);
      var to = params.get('to') || '';
      var frag = location.hash || '';
      var okScheme = /^(mockstream:\/\/|exp:\/\/|exps:\/\/)/.test(to);
      if (!to || !okScheme) {
        document.getElementById('msg').textContent = 'Invalid return link. Please reopen the app and try again.';
        return;
      }
      var sep = to.indexOf('#') === -1 ? '#' : '&';
      var target = to + (frag ? sep + frag.replace(/^#/, '') : '');
      location.replace(target);
      // Fallback hint if the deep link doesn't fire (e.g. desktop browser)
      setTimeout(function () {
        document.getElementById('msg').innerHTML =
          'If the app did not open automatically, <a href="' + target.replace(/"/g, '&quot;') + '">tap here</a>.';
      }, 1500);
    })();
  </script>
</body>
</html>
