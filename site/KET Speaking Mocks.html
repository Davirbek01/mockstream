<!DOCTYPE html>
<html lang="en">
<head>
  <script src="auto-theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KET Speaking — Coming Soon</title>
  <link rel="shortcut icon" id="site-favicon" href="https://i.ibb.co/WN0XY5Lv/logo.png">
  <link rel="stylesheet" href="site-config/responsive-scaling.css">
  <script src="center-id.js"></script>
  <script src="site-config/site-config.js"></script>
  <script>if (window.SITE_CONFIG) { var f = document.getElementById('site-favicon'); if (f) f.href = window.SITE_CONFIG.logoUrl; }</script>
  <style>
    :root { --primary:#a855f7; --primary-dark:#7c3aed; --bg:#faf5ff; --card:#fff; --border:#e2e8f0; --text:#1e293b; --muted:#64748b; }
    [data-theme="dark"], body.dark-mode { --bg:#0f172a; --card:#1e293b; --border:#334155; --text:#f1f5f9; --muted:#94a3b8; }
    [data-theme="dark"] body, body.dark-mode { background:linear-gradient(135deg,#0f172a,#1e293b) !important; color:var(--text); }
    [data-theme="dark"] .card, body.dark-mode .card { background:var(--card); color:var(--text); }
    [data-theme="dark"] h1, body.dark-mode h1 { color:#c084fc; }
    [data-theme="dark"] p, body.dark-mode p { color:var(--muted); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',system-ui,sans-serif; background:linear-gradient(135deg,var(--bg),#f3e8ff); min-height:100vh; padding:20px; color:var(--text); display:flex; align-items:center; justify-content:center; }
    .card { max-width:480px; background:var(--card); border-radius:24px; padding:48px 32px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.08); }
    .icon { font-size:64px; margin-bottom:16px; }
    h1 { font-size:24px; color:var(--primary-dark); margin-bottom:8px; }
    .badge { display:inline-block; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; padding:6px 14px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:1.5px; margin-bottom:18px; }
    p { color:var(--muted); font-size:14px; line-height:1.6; margin-bottom:18px; }
    .back-btn { display:inline-block; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; padding:10px 24px; border-radius:12px; text-decoration:none; font-weight:600; margin-top:8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎤</div>
    <div class="badge">COMING SOON</div>
    <h1>KET Speaking Practice</h1>
    <p>The KET Speaking module is in development. Real KET Speaking is paired (2 candidates) — we're working on a faithful single-player simulation.</p>
    <p>In the meantime, practice your speaking skills with our other modules.</p>
    <a class="back-btn" href="landing-v3.html">← Back to home</a>
  </div>
</body>
</html>
