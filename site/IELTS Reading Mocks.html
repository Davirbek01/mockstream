    <style>
        :root {
            --primary: #0369a1;
            --primary-light: #e0f2fe;
            --secondary: #7c3aed;
            --secondary-light: #ede9fe;
            --success: #10b981;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px;
            color: white;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 20px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-5px);
        }

        .passages-grid {
            display: grid;
            gap: 20px;
        }

        .passage-card {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            border: 2px solid var(--border);
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .passage-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(3, 105, 161, 0.15);
        }

        .passage-number {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-light), #bae6fd);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            flex-shrink: 0;
        }

        .passage-info {
            flex: 1;
        }

        .passage-label {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .passage-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text);
        }

        .passage-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--muted);
        }

        .passage-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .arrow-icon {
            font-size: 24px;
            color: var(--primary);
            opacity: 0.5;
            transition: all 0.3s;
        }

        .passage-card:hover .arrow-icon {
            opacity: 1;
            transform: translateX(5px);
        }

        /* ===== Practice Mode Card Styles ===== */
        .test-card-wrap {
            background: var(--card);
            border-radius: 16px;
            padding: 20px 24px;
            border: 2px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .test-card-wrap:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 30px rgba(3,105,161,0.12);
        }
        .test-card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
        }
        .test-mode-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .mode-btn {
            padding: 10px 6px;
            border: 2px solid;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: white;
            line-height: 1.3;
        }
        .mode-btn .mode-meta {
            font-size: 10px;
            font-weight: 400;
            opacity: 0.75;
        }
        .mode-full {
            border-color: var(--primary);
            color: var(--primary);
        }
        .mode-full:hover {
            background: var(--primary);
            color: white;
        }
        .mode-practice {
            border-color: var(--success);
            color: var(--success);
        }
        .mode-practice:hover {
            background: var(--success);
            color: white;
        }
        @media (max-width: 640px) {
            .test-mode-row { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 380px) {
            .test-mode-row { grid-template-columns: 1fr; }
        }

        .no-tests {
            text-align: center;
            padding: 60px 20px;
            background: var(--card);
            border-radius: 16px;
            border: 2px dashed var(--border);
        }

        .no-tests-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .no-tests h3 {
            color: var(--muted);
            margin-bottom: 8px;
        }

        .no-tests p {
            color: var(--muted);
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 24px;
            }

            .passage-card {
                flex-direction: column;
                text-align: center;
            }

            .passage-meta {
                justify-content: center;
                flex-wrap: wrap;
            }

            .arrow-icon {
                display: none;
            }
        }
    </style>
</head>

    <script>
        // Back navigation logic
        function goBack() {
            try {
                if (window.parent && window.parent !== window) {
                    if (typeof window.parent.returnToLanding === 'function') {
                        window.parent.returnToLanding();
                        return;
                    }
                    window.parent.postMessage('returnToLanding', '*');
                    return;
                }
            } catch (e) {
                console.log('Error calling parent:', e);
            }
            window.location.href = 'landing.html';
        }

        // Add compatibility aliases
        window.goBack = goBack;
        window.goToLanding = goBack;

        // Attach to back button
        document.addEventListener('DOMContentLoaded', function () {
            const backBtn = document.querySelector('.back-btn');
            if (backBtn) {
                backBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    goBack();
                });
            }
        });

        // Automatically discover and load reading tests
        const readingTests = [];

        // List of possible file patterns to check
        const filePatterns = [
            'ielts-reading-01.js',
            'ielts-reading-02.js',
            'ielts-reading-03.js',
            'ielts-reading-04.js',
            'ielts-reading-05.js',
            'ielts-reading-06.js',
            'ielts-reading-07.js',
            'ielts-reading-08.js',
            'ielts-reading-09.js',
            'ielts-reading-10.js',
            // 'ielts-reading-test-01.js',  ← migrated to mock_tests (id=4) — see Mock Settings panel
            'ielts-reading-test-02.js',
            'ielts-reading-test-03.js',
            'ielts-reading-test-04.js',
            'ielts-reading-test-05.js',
            'ielts-reading-test-06.js',
            'ielts-reading-test-07.js',
            'ielts-reading-test-08.js',
            'ielts-reading-test-09.js',
            'ielts-reading-test-10.js',
            'ielts-reading-test-11.js',
            'ielts-reading-test-12.js',
            'ielts-reading-test-13.js',
            'ielts-reading-test-14.js',
            'ielts-reading-test-15.js',
            'ielts-reading-test-16.js',
            'ielts-reading-test-17.js',
            'ielts-reading-test-18.js',
            'ielts-reading-test-19.js',
            'ielts-reading-test-20.js',
            'ielts-reading-test-21.js',
            'ielts-reading-test-22.js',
            'ielts-reading-test-23.js',
            'ielts-reading-test-24.js',
            'ielts-reading-test-25.js',
            'ielts-reading-test-26.js',
            'ielts-reading-test-27.js',
            'ielts-reading-test-28.js',
            'ielts-reading-test-29.js',
            'ielts-reading-test-30.js',
            'ielts-reading-test-31.js',
            'ielts-reading-test-32.js',
            'ielts-reading-test-33.js',
            'ielts-reading-test-34.js',

            'ielts-reading-test-37.js',

            'ielts-reading-test-43.js',

            'ielts-reading-test-45.js',
            'ielts-reading-test-46.js',
            'ielts-reading-test-47.js',
            'ielts-reading-test-48.js',
            'ielts-reading-test-49.js',
            'ielts-reading-test-50.js'
        ];

        async function loadTest(filename) {
            return new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = 'questions IELTS R/' + filename;
                script.onload = function () {
                    if (window.IELTS_READING_TEST) {
                        const test = window.IELTS_READING_TEST;

                        // Handle both single-passage format and multi-passage format (from test builder)
                        let shortName, title, questions, time;

                        if (test.passages && Array.isArray(test.passages) && test.passages.length > 0) {
                            // Multi-passage format from test builder
                            // Build combined title showing all passage short names
                            const passageNames = test.passages.map(function (p, index) {
                                const name = p.shortName || p.title || 'Passage ' + (index + 1);
                                return 'P' + (index + 1) + ': ' + name;
                            });
                            shortName = passageNames.join(' - ');
                            title = test.passages[0].title || 'Reading Test';

                            // Count questions from ALL passages (not just first)
                            questions = 0;
                            test.passages.forEach(function (passage) {
                                if (passage.questionSections) {
                                    passage.questionSections.forEach(function (section) {
                                        questions += section.questions ? section.questions.length : 0;
                                    });
                                }
                            });
                            if (questions === 0) questions = test.testInfo?.totalQuestions || 40;

                            // Total time for all passages
                            time = test.testInfo?.totalTime || 60;
                        } else {
                            // Single-passage format (original format)
                            shortName = test.shortName || test.title || 'Reading Test';
                            title = test.title || 'Reading Test';
                            questions = test.totalQuestions || 13;
                            time = test.timeRecommended || 20;
                        }

                        // Collect per-passage info for practice mode buttons
                        var passageInfo = [];
                        if (test.passages && Array.isArray(test.passages)) {
                            passageInfo = test.passages.map(function (p, pi) {
                                var qc = 0;
                                (p.questionSections || []).forEach(function (s) { qc += s.questions ? s.questions.length : 0; });
                                if (qc === 0 && p.questionRange) {
                                    var pts = p.questionRange.split('-');
                                    qc = parseInt(pts[1]) - parseInt(pts[0]) + 1;
                                }
                                return { name: p.shortName || ('Passage ' + (pi + 1)), questions: qc || 13, time: p.timeRecommended || 20 };
                            });
                        }

                        readingTests.push({
                            file: filename,
                            shortName: shortName,
                            title: title,
                            questions: questions,
                            time: time,
                            passageInfo: passageInfo
                        });
                        // Clear for next test
                        window.IELTS_READING_TEST = null;
                    }
                    resolve(true);
                };
                script.onerror = function () {
                    resolve(false);
                };
                document.head.appendChild(script);
            });
        }

        async function discoverTests() {
            for (const pattern of filePatterns) {
                await loadTest(pattern);
            }
            renderTests();
        }

        function renderTests() {
            const grid = document.getElementById('passagesGrid');

            if (readingTests.length === 0) {
                grid.innerHTML = `
                    <div class="no-tests">
                        <div class="no-tests-icon">📚</div>
                        <h3>No Tests Available</h3>
                        <p>Reading tests will appear here once they are added.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = readingTests.map(function(test, index) {
                var mockNum = String(index + 1).padStart(2, '0');
                var fullUrl = 'IELTS reading.html?test=' + test.file;
                // Build passage practice buttons if per-passage info available
                var practiceButtons = '';
                if (test.passageInfo && test.passageInfo.length === 3) {
                    practiceButtons = test.passageInfo.map(function(p, pi) {
                        var pUrl = fullUrl + '&passage=' + (pi + 1);
                        return '<button class="mode-btn mode-practice" data-url="' + pUrl + '" data-mock-num="' + mockNum + '">'
                            + '📖 Passage ' + (pi + 1)
                            + '<span class="mode-meta">' + p.name + ' · ' + p.questions + ' qs · ' + p.time + ' min</span>'
                            + '</button>';
                    }).join('');
                }
                return '<div class="test-card-wrap">'
                    + '<div class="test-card-header">'
                    + '<div class="passage-number">' + (index + 1) + '</div>'
                    + '<div class="passage-info">'
                    + '<div class="passage-label">Test ' + (index + 1) + '</div>'
                    + '<div class="passage-title">' + (test.shortName || test.title) + '</div>'
                    + '</div></div>'
                    + '<div class="test-mode-row">'
                    + '<button class="mode-btn mode-full" data-url="' + fullUrl + '" data-mock-num="' + mockNum + '">'
                    + '🎯 Full Test'
                    + '<span class="mode-meta">' + test.questions + ' qs · ' + test.time + ' min</span>'
                    + '</button>'
                    + practiceButtons
                    + '</div></div>';
            }).join('');

            // Intercept clicks on mode buttons
            grid.addEventListener('click', function(e) {
                var btn = e.target.closest('.mode-btn');
                if (!btn) return;
                e.preventDefault();
                var testUrl = btn.getAttribute('data-url');
                var mockNum = btn.getAttribute('data-mock-num');
                if (!testUrl || !mockNum) return;
                window._pendingReadingTest = { url: testUrl, mockNumber: mockNum };
                showReadingAccessModal(mockNum);
            });
        }

        // Initialize - auto-discover tests
        document.addEventListener('DOMContentLoaded', function () {
            discoverTests();

            // Name Input Modal Logic
            (function () {
                var fullName = sessionStorage.getItem('CANDIDATE_FULL_NAME');
                if (fullName && !sessionStorage.getItem('CANDIDATE_NAME')) {
                    sessionStorage.setItem('CANDIDATE_NAME', fullName);
                }
            })();

            if (!sessionStorage.getItem('CANDIDATE_NAME')) {
                const nameModalHTML = `
                    <div id="nameInputModal" style="
                        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                        background: rgba(0, 0, 0, 0.85); z-index: 10000;
                        display: flex; justify-content: center; align-items: center;
                        backdrop-filter: blur(5px);
                    ">
                        <div style="
                            background: white; padding: 40px; border-radius: 16px;
                            max-width: 450px; width: 90%; text-align: center;
                            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                            animation: slideUp 0.4s ease-out;
                        ">
                            <h2 style="color: #0369a1; margin-bottom: 20px; font-weight: 700;">Welcome to IELTS Reading</h2>
                            <p style="color: #64748b; margin-bottom: 25px; font-size: 16px;">Please enter your full name to view available tests.</p>
                            <input type="text" id="candidateNameInput" placeholder="Full Name (e.g. John Doe)" style="
                                width: 100%; padding: 15px; margin-bottom: 25px;
                                border: 2px solid #e2e8f0; border-radius: 10px;
                                font-size: 16px; outline: none; transition: border-color 0.3s;
                            ">
                            <button id="saveNameBtn" style="
                                background: linear-gradient(135deg, #0369a1, #0284c7);
                                color: white; border: none; padding: 15px 40px;
                                border-radius: 10px; font-size: 16px; font-weight: 600;
                                cursor: pointer; width: 100%; box-shadow: 0 4px 15px rgba(3, 105, 161, 0.3);
                                transition: transform 0.2s;
                            ">Continue</button>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', nameModalHTML);

                const btn = document.getElementById('saveNameBtn');
                const input = document.getElementById('candidateNameInput');

                function saveAndClose() {
                    const name = input.value.trim();
                    if (name) {
                        sessionStorage.setItem('CANDIDATE_NAME', name);
                        document.getElementById('nameInputModal').remove();
                    } else {
                        input.style.borderColor = '#ef4444';
                        input.focus();
                    }
                }

                btn.addEventListener('click', saveAndClose);
                input.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveAndClose(); });
                input.focus();
            }
        });
    </script>

    <!-- ===== READING ACCESS CODE MODAL ===== -->
    <div id="readingAccessModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:100002;justify-content:center;align-items:center;">

        <input type="text" id="readingAccessCodeInput" placeholder="Enter access code" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="numeric" pattern="[0-9]*" oninput="this.value=this.value.replace(/\D/g,'')" style="width:100%;padding:14px 16px;border:2px solid #e2e8f0;border-radius:12px;font-size:18px;text-align:center;letter-spacing:3px;font-weight:700;margin-bottom:12px;transition:border-color 0.3s;box-sizing:border-box;" onfocus="this.style.borderColor='#0369a1'" onblur="this.style.borderColor='#e2e8f0'">

          <button id="readingAccessVerifyBtn" onclick="verifyReadingAccessCode()" style="flex:1;padding:12px;border:none;background:linear-gradient(135deg,#0369a1,#0284c7);color:white;font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;">Verify</button>

    <style>

    <script>
      window.isSuperAccessUnlocked = window.isSuperAccessUnlocked || function () {
        return sessionStorage.getItem('vipSessionAccess') === 'true';
      };
      window.readingMockRequiresCode = function (mockNumber) {
        if (window.isSuperAccessUnlocked()) return false;
        var padded = String(mockNumber).padStart(2, '0');
        if (window.READING_MOCK_PROMOCODES && window.READING_MOCK_PROMOCODES[padded]) return true;
        return false;
      };
      window.validateFullReadingAccess = async function (inputValue, mockNumber) {
        try {
          if (window.isSuperAccessUnlocked()) {
            var isVipAi = sessionStorage.getItem('vipPremiumAi') === 'true';
            return { valid: true, premiumEntry: isVipAi };
          }
          var cleanInput = inputValue.trim().replace(/[-\s]/g, '');
          if (cleanInput.length === 10 && /^\d{10}$/.test(cleanInput) && window.extractReadingPremiumOTP) {
            var aiPasscode = window.extractReadingPremiumOTP(cleanInput, mockNumber);
            if (aiPasscode) {
              try {

<script>
(function () {
  var EXAM  = 'ielts';
  var SKILL = 'reading';
  var CARD_ATTR = 'data-mock-num';
  var PART_SEL  = '.mode-btn.mode-practice';

  function _decorate() {
    if (!window.PremiumGate) return;

    document.querySelectorAll('.test-card-wrap').forEach(function (card) {
      if (card.querySelector(':scope > .pg-taken-badge')) return;
      var btn = card.querySelector('[' + CARD_ATTR + ']');
      if (!btn) return;
      var n = Number(btn.getAttribute(CARD_ATTR));
      if (!n) return;
      var count = window.PremiumGate.attemptCount({ skill: SKILL, exam_type: EXAM, mock_number: n });
      if (!count) return;
      var b = document.createElement('span');
      b.className = 'pg-taken-badge';
      b.textContent = count === 1 ? '✓ Taken' : '✓ Taken · ' + count + '×';
      card.appendChild(b);
    });

    if (!window.PremiumGate.isPremiumTier(SKILL) && !window.PremiumGate.isAdmin()) {
      document.querySelectorAll(PART_SEL).forEach(function (btn) {
        window.PremiumGate.applyLockBadge(btn, 'part_practice_' + SKILL + '_' + EXAM);
      });
    }
  }

  function _refreshCrossDevice() {
    if (!window.PremiumGate || !window.PremiumGate.fetchTakenForUser) return;
    window.PremiumGate.fetchTakenForUser().then(function (rows) {
      document.querySelectorAll('.pg-taken-badge').forEach(function (b) { b.remove(); });
      var counts = {};
      rows.forEach(function (r) {
        if (r.skill !== SKILL || r.exam_type !== EXAM) return;
        counts[r.mock_number] = (counts[r.mock_number] || 0) + 1;
      });
      document.querySelectorAll('.test-card-wrap').forEach(function (card) {
        var btn = card.querySelector('[' + CARD_ATTR + ']');
        if (!btn) return;
        var n = Number(btn.getAttribute(CARD_ATTR));
        if (!counts[n]) return;
        var b = document.createElement('span');
        b.className = 'pg-taken-badge';
        b.textContent = counts[n] === 1 ? '✓ Taken' : '✓ Taken · ' + counts[n] + '×';
        card.appendChild(b);
      });
    });
  }

  function _kick() {
    _decorate();
    _refreshCrossDevice();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', _kick);
  else _kick();

  // Re-decorate when cards get re-rendered (filter changes, Supabase mocks load, etc)
  var mo = new MutationObserver(function () { _decorate(); });
  if (document.body) mo.observe(document.body, { childList: true, subtree: true });
})();
</script>
