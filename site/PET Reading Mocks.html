<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PET Reading — Mock</title>
  <script src="center-id.js"></script>
  <script src="site-config/site-config.js"></script>
  <script>document.addEventListener('DOMContentLoaded',function(){document.title=((window.SITE_CONFIG&&window.SITE_CONFIG.brandName)||'Mock Stream')+' · PET Reading';});</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@500;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Cambridge-inspired palette */
      --navy-900: #0b1d3a;
      --navy-800: #11295a;
      --navy-700: #1a3a7e;
      --blue-600: #1c5bd8;
      --blue-500: #2563eb;
      --blue-400: #3b82f6;
      --gold-500: #d4a72c;
      --gold-400: #eab308;
      --amber-200: #fef3c7;
      --rose-500: #e11d48;
      --rose-100: #ffe4e6;
      --emerald-600: #059669;
      --emerald-500: #10b981;
      --emerald-50: #ecfdf5;

      --bg: #f6f8fc;
      --bg-soft: #eef2f9;
      --paper: #ffffff;
      --paper-warm: #fbf9f3;
      --ink: #0b1d3a;
      --ink-2: #334155;
      --muted: #64748b;
      --ring: #e2e8f0;
      --ring-strong: #cbd5e1;
      --shadow-sm: 0 1px 2px rgba(11,29,58,.06), 0 1px 3px rgba(11,29,58,.04);
      --shadow-md: 0 4px 14px rgba(11,29,58,.08), 0 1px 4px rgba(11,29,58,.04);
      --shadow-lg: 0 12px 36px rgba(11,29,58,.14), 0 2px 8px rgba(11,29,58,.06);
      --shadow-pop: 0 18px 48px rgba(11,29,58,.22);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background:
        radial-gradient(1100px 540px at 100% -10%, rgba(28,91,216,0.10), transparent 60%),
        radial-gradient(900px 460px at -10% 0%, rgba(212,167,44,0.10), transparent 60%),
        linear-gradient(180deg, #f7f9fd 0%, var(--bg) 100%);
      background-attachment: fixed;
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ─── Top bar ─────────────────────────────────────────────── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 100%);
      color: #fff; padding: 12px 22px;
      display: flex; align-items: center; gap: 16px;
      border-bottom: 3px solid var(--gold-400);
    }
    .topbar .back {
      background: rgba(255,255,255,0.10); color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      padding: 8px 14px; border-radius: 10px; font-weight: 700;
      cursor: pointer; transition: all .15s ease;
      font-family: inherit; font-size: 13.5px;
      backdrop-filter: blur(8px);
    }
    .topbar .back:hover { background: rgba(255,255,255,0.18); transform: translateX(-2px); }
    .topbar .brand { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
    .topbar .crest { display: none; }
    .topbar .titlewrap { line-height: 1.15; flex: 1; min-width: 0; }
    .topbar .titlewrap .t1 { display: none; }
    .topbar .titlewrap .t2 {
      font-family: 'Playfair Display', serif;
      font-weight: 800; font-size: 22px; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .topbar .spacer { flex: 1; }
    .topbar .timer {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, var(--emerald-600), var(--emerald-500));
      color: #fff; padding: 9px 16px; border-radius: 12px;
      font-weight: 800; font-variant-numeric: tabular-nums;
      box-shadow: 0 6px 18px rgba(5,150,105,0.45);
      font-size: 14.5px; letter-spacing: 0.3px;
    }
    .topbar .timer::before { content: '⏱'; font-size: 14px; }
    .topbar .timer.warn { background: linear-gradient(135deg, #d97706, #f59e0b); box-shadow: 0 6px 18px rgba(217,119,6,0.45); }
    .topbar .timer.crit { background: linear-gradient(135deg, #dc2626, #ef4444); box-shadow: 0 6px 22px rgba(220,38,38,0.55); animation: critPulse 1.1s ease-in-out infinite; }
    @keyframes critPulse { 50% { transform: scale(0.97); } }
    .topbar .submit {
      background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
      color: var(--navy-900); border: 0;
      padding: 9px 20px; border-radius: 12px;
      font-weight: 800; cursor: pointer; font-family: inherit; font-size: 14px;
      box-shadow: 0 6px 18px rgba(212,167,44,0.45);
      transition: all .15s ease;
      letter-spacing: 0.3px;
    }
    .topbar .submit:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(212,167,44,0.55); }
    /* Mock switcher (1..28) — sticky white strip under topbar, centered on desktop, sideways scroll on mobile. */
    .mock-switcher {
      position: sticky; top: 64px; z-index: 95;
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center;
      background: #fff;
      border-bottom: 1px solid var(--ring);
      padding: 10px 18px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    @media (max-width: 720px) {
      .mock-switcher { flex-wrap: nowrap; justify-content: flex-start; padding: 10px 12px; }
    }
    .mock-switcher::-webkit-scrollbar { display: none; }
    .mock-switcher .ms-pill {
      flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 36px; height: 32px; padding: 0 12px; border-radius: 999px;
      background: #eef2ff; color: var(--navy-700);
      border: 1px solid var(--ring);
      font-weight: 700; font-size: 13.5px;
      text-decoration: none;
      transition: all .12s ease;
    }
    .mock-switcher .ms-pill:hover { background: #dbe6ff; }
    .mock-switcher .ms-pill.active {
      background: var(--navy-700); color: #fff;
      border-color: var(--navy-700);
    }
    /* Old part-progress strip removed in favour of mock-switcher */
    .nav-strip { display: none !important; }

    /* ─── Part progress strip ─────────────────────────────────── */
    .nav-strip {
      position: sticky; top: 64px; z-index: 90;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--ring);
      padding: 10px 22px;
      display: flex; align-items: center; gap: 6px;
      overflow-x: auto; scrollbar-width: thin;
    }
    .nav-strip::-webkit-scrollbar { height: 4px; }
    .nav-strip::-webkit-scrollbar-thumb { background: var(--ring-strong); border-radius: 4px; }
    .nav-chip {
      flex: 0 0 auto;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      background: var(--bg-soft); color: var(--ink-2);
      border: 1px solid transparent;
      font-size: 12px; font-weight: 700; letter-spacing: 0.2px;
      cursor: pointer; transition: all .15s ease;
      text-decoration: none;
    }
    .nav-chip:hover { background: #e0e7ff; color: var(--navy-800); }
    .nav-chip.has-answers { background: var(--emerald-50); color: var(--emerald-600); border-color: rgba(5,150,105,0.3); }
    .nav-chip.complete { background: var(--emerald-500); color: #fff; border-color: var(--emerald-500); }
    .nav-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.55; }

    /* ─── Page wrapper ─────────────────────────────────────── */
    .page { max-width: 920px; margin: 28px auto 100px; padding: 0 22px; }

    /* Paper hero */
    .paper-hero {
      position: relative;
      background: linear-gradient(135deg, var(--navy-900), var(--navy-800) 60%, var(--navy-700));
      color: #fff;
      border-radius: 24px;
      padding: 36px 38px;
      margin-bottom: 26px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .paper-hero::after {
      content: ''; position: absolute; inset: -50% -10% auto auto;
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(212,167,44,0.20), transparent 65%);
      pointer-events: none;
    }
    .paper-hero .lvl-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(212,167,44,0.18); color: var(--gold-400);
      padding: 4px 12px; border-radius: 999px; font-size: 11.5px;
      font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
      border: 1px solid rgba(212,167,44,0.35);
    }
    .paper-hero .test-no {
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 5vw, 52px); font-weight: 900; line-height: 1; letter-spacing: -1px;
      margin: 14px 0 6px;
    }
    .paper-hero .paper-line {
      font-size: 14px; color: rgba(255,255,255,0.75); letter-spacing: 0.4px;
    }
    .paper-hero .paper-line strong { color: #fff; font-weight: 800; letter-spacing: 1.4px; }
    .paper-hero .meta-row {
      display: flex; gap: 22px; margin-top: 22px; padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.10);
      font-size: 13px;
    }
    .paper-hero .meta-row .m { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.85); }
    .paper-hero .meta-row .m b { color: #fff; font-weight: 800; }

    /* ─── Part card ───────────────────────────────────────── */
    .part-card {
      background: var(--paper);
      border-radius: 22px;
      padding: 30px 32px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(11,29,58,0.06);
      position: relative;
      animation: cardFadeIn .55s cubic-bezier(.21,1.1,.4,1) both;
    }
    @keyframes cardFadeIn {
      /* opacity-only — using transform here lingers as a stacking context
         after the animation and clips dropdown popovers that overflow
         into the next part-card. */
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .part-card::before {
      content: ''; position: absolute; left: 0; top: 28px; bottom: 28px;
      width: 4px; border-radius: 4px;
      background: linear-gradient(180deg, var(--blue-500), var(--blue-600));
    }
    .part-card[data-pn="1"]::before { background: linear-gradient(180deg, #2563eb, #1d4ed8); }
    .part-card[data-pn="2"]::before { background: linear-gradient(180deg, #0891b2, #0e7490); }
    .part-card[data-pn="3a"]::before, .part-card[data-pn="3b"]::before { background: linear-gradient(180deg, #7c3aed, #6d28d9); }
    .part-card[data-pn="4"]::before { background: linear-gradient(180deg, #db2777, #be185d); }
    .part-card[data-pn="5"]::before { background: linear-gradient(180deg, #ea580c, #c2410c); }
    .part-card[data-pn="6"]::before { background: linear-gradient(180deg, #16a34a, #15803d); }
    .part-card[data-pn="7"]::before { background: linear-gradient(180deg, #d97706, #b45309); }
    .part-card[data-pn="8"]::before { background: linear-gradient(180deg, #0d9488, #0f766e); }
    .part-card[data-pn="9"]::before { background: linear-gradient(180deg, #be123c, #9f1239); }

    .part-head {
      display: flex; align-items: flex-start; gap: 16px; margin-bottom: 18px;
    }
    .part-num {
      width: 52px; height: 52px; flex-shrink: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 22px; font-family: 'Playfair Display', serif;
      box-shadow: 0 6px 18px rgba(28,91,216,0.35);
    }
    .part-card[data-pn="1"] .part-num { background: linear-gradient(135deg, #2563eb, #1d4ed8); box-shadow: 0 6px 18px rgba(37,99,235,0.35); }
    .part-card[data-pn="2"] .part-num { background: linear-gradient(135deg, #0891b2, #0e7490); box-shadow: 0 6px 18px rgba(8,145,178,0.35); }
    .part-card[data-pn="3a"] .part-num, .part-card[data-pn="3b"] .part-num { background: linear-gradient(135deg, #7c3aed, #6d28d9); box-shadow: 0 6px 18px rgba(124,58,237,0.35); }
    .part-card[data-pn="4"] .part-num { background: linear-gradient(135deg, #db2777, #be185d); box-shadow: 0 6px 18px rgba(219,39,119,0.35); }
    .part-card[data-pn="5"] .part-num { background: linear-gradient(135deg, #ea580c, #c2410c); box-shadow: 0 6px 18px rgba(234,88,12,0.35); }
    .part-card[data-pn="6"] .part-num { background: linear-gradient(135deg, #16a34a, #15803d); box-shadow: 0 6px 18px rgba(22,163,74,0.35); }
    .part-card[data-pn="7"] .part-num { background: linear-gradient(135deg, #d97706, #b45309); box-shadow: 0 6px 18px rgba(217,119,6,0.35); }
    .part-card[data-pn="8"] .part-num { background: linear-gradient(135deg, #0d9488, #0f766e); box-shadow: 0 6px 18px rgba(13,148,136,0.35); }
    .part-card[data-pn="9"] .part-num { background: linear-gradient(135deg, #be123c, #9f1239); box-shadow: 0 6px 18px rgba(190,18,60,0.35); }
    .part-name { font-size: 19px; font-weight: 800; color: var(--ink); margin: 0; line-height: 1.2; }
    .part-meta-row {
      font-size: 12px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px; margin-top: 2px;
    }
    .part-meta-row .dot { margin: 0 6px; color: var(--ring-strong); }

    .part-instr {
      background: var(--bg-soft);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 0 0 22px;
      font-size: 14px; line-height: 1.6; color: var(--ink-2);
      border-left: 3px solid var(--blue-400);
    }
    .part-instr p { margin: 0 0 4px; }
    .part-instr p:last-child { margin: 0; }

    /* Example */
    .ex-img { margin-top: 8px; background: #fff; border-radius: 10px; padding: 6px; border: 1px solid #bae6fd; max-width: 100%; }
    .ex-img img { max-width: 100%; height: auto; display: block; }
    .example-card--wide { align-items: flex-start; }
    .example-card--wide .ex-left { flex: 1 1 0; min-width: 0; max-width: 50%; }
    .example-card--wide .ex-right { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
    .ex-opts { display: flex; flex-direction: column; gap: 6px; }
    .ex-opt { display: flex; gap: 10px; padding: 6px 10px; background: #fff; border: 1px solid #bae6fd; border-radius: 8px; font-size: 13.5px; line-height: 1.4; color: #1e3a5f; }
    .ex-opt.is-correct { background: #dcfce7; border-color: #86efac; color: #14532d; font-weight: 600; }
    .ex-opt-letter { font-weight: 800; min-width: 16px; }
    .ex-opt-text { flex: 1; min-width: 0; }
    .ex-ans-row { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
    @media (max-width: 720px) {
      .example-card--wide { flex-direction: column; align-items: stretch; gap: 12px; }
      .example-card--wide .ex-left, .example-card--wide .ex-right { max-width: 100%; flex: none; width: 100%; }
    }
    .example-card {
      background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
      border: 1px solid #bae6fd;
      border-radius: 14px;
      padding: 14px 18px;
      margin: 16px 0;
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      font-size: 14px;
    }
    .example-card.vert { flex-direction: column; align-items: stretch; }
    .ex-label { font-size: 10.5px; font-weight: 900; color: var(--navy-700); letter-spacing: 1.5px; text-transform: uppercase; }
    .ex-answer-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--navy-800); color: #fff;
      padding: 6px 14px; border-radius: 999px;
      font-weight: 900; letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(11,29,58,0.25);
    }

    /* Part 1 — 2-column layout (questions / notices) on desktop */
    .p1-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: start;
    }
    .p1-questions, .p1-notices { min-width: 0; }
    .p1-section-head {
      font-size: 11px; font-weight: 900; letter-spacing: 1.6px; text-transform: uppercase;
      color: var(--navy-700); margin: 0 0 12px;
      padding-bottom: 8px; border-bottom: 2px solid var(--ring);
    }
    @media (max-width: 860px) {
      .p1-grid { grid-template-columns: 1fr; gap: 18px; }
      .p1-notices { order: 1; }
      .p1-questions { order: 2; }
    }

    /* Collapsible notices on mobile. <details> is desktop-always-open;
       mobile becomes tap-to-toggle so the notices don't push the
       questions far below the fold. */
    .notices-collapse { background: transparent; }
    .notices-collapse > summary { cursor: default; list-style: none; outline: none; }
    .notices-collapse > summary::-webkit-details-marker { display: none; }
    .notices-collapse > summary::marker { content: ''; }
    .notices-collapse > summary .collapse-caret { display: none; }
    @media (max-width: 860px) {
      .notices-collapse > summary {
        cursor: pointer;
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 16px;
        background: linear-gradient(135deg, #eff6ff, #dbeafe);
        border-radius: 12px; border: 1px solid #bfdbfe;
        border-bottom: 1px solid #bfdbfe;
        margin-bottom: 0; transition: background .15s ease;
      }
      .notices-collapse > summary:hover { background: linear-gradient(135deg, #dbeafe, #bfdbfe); }
      .notices-collapse > summary .collapse-caret {
        display: inline-block; font-size: 12px; color: var(--navy-700);
        transition: transform .2s ease;
      }
      .notices-collapse[open] > summary { border-radius: 12px 12px 0 0; }
      .notices-collapse[open] > summary .collapse-caret { transform: rotate(180deg); }
      .notices-collapse[open] > .notices-grid {
        padding: 16px 14px;
        border: 1px solid #bfdbfe; border-top: 0;
        border-radius: 0 0 12px 12px;
        background: #f8fbff;
        animation: detailsFade .2s ease;
      }
      @keyframes detailsFade {
        from { opacity: 0; transform: translateY(-2px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    }

    /* Notices grid (Part 1) */
    .notices-grid {
      display: grid; grid-template-columns: 50px 1fr; gap: 10px 12px;
    }
    .notice-letter {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--navy-800), var(--navy-700));
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 16px; font-family: 'Playfair Display', serif;
      align-self: center; justify-self: center;
      box-shadow: 0 4px 12px rgba(11,29,58,0.30);
    }
    .notice-card {
      background: var(--paper);
      border: 2px solid var(--ink);
      padding: 14px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14.5px;
      line-height: 1.4;
      white-space: pre-line;
      min-height: 52px;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      box-shadow: var(--shadow-sm), 0 2px 0 rgba(11,29,58,0.06);
      transition: transform .2s ease;
    }
    .notice-card:hover { transform: translateY(-1px); }
    /* Per-notice flavour — picked by letter */
    .notice-card.flavor-ticket { background: linear-gradient(180deg, #fffbeb, #fef3c7); border-color: #b45309; color: #78350f; }
    .notice-card.flavor-warn   { background: #facc15; border-color: #854d0e; color: #1c0d00; font-weight: 800; text-transform: uppercase; letter-spacing: 0.7px; }
    .notice-card.flavor-info   { background: linear-gradient(180deg, #dbeafe, #bfdbfe); border-color: #1e40af; color: #1e3a8a; font-weight: 800; }
    .notice-card.flavor-police { background: linear-gradient(180deg, #ffe4e6, #fecaca); border-color: #991b1b; color: #7f1d1d; font-weight: 700; }
    .notice-card.flavor-open   { background: #fff; border-color: var(--ink); color: var(--ink); }

    /* Part 1 question row — pills wrap below in the narrower column.
       Mobile (<560px): hide pill row, show styled dropdown. */
    .p1-q {
      display: grid; grid-template-columns: 40px 1fr; gap: 10px 14px;
      padding: 16px 0; border-top: 1px dashed var(--ring);
      align-items: center;
    }
    .p1-q:first-of-type { border-top: 0; padding-top: 4px; }
    .p1-q .q-num { width: 38px; height: 38px; font-size: 16px; }
    .p1-q .q-text {
      font-size: 16px; font-weight: 600; color: var(--ink);
      line-height: 1.5; letter-spacing: -0.1px;
    }
    .p1-q .p1-answer { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .p1-q .p1-answer .opt-pill { min-width: 42px; padding: 10px 14px; font-size: 14px; }
    .p1-q .p1-dd { display: none; grid-column: 1 / -1; margin-top: 4px; }
    @media (max-width: 560px) {
      .p1-q .q-text { font-size: 16.5px; font-weight: 600; }
      .p1-q .p1-answer { display: none; }
      .p1-q .p1-dd { display: block; }
    }

    /* Custom dropdown — styled to match the pill look */
    .dd-wrap { position: relative; }
    .dd-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 10px;
      background: var(--paper); border: 1.5px solid var(--ring-strong);
      color: var(--ink); font-weight: 700; font-family: inherit; font-size: 14px;
      cursor: pointer; width: 100%; min-height: 44px;
      transition: all .15s ease;
      box-shadow: var(--shadow-sm);
    }
    .dd-btn:hover { border-color: var(--blue-500); }
    .dd-btn.open { border-color: var(--blue-500); box-shadow: 0 0 0 3px rgba(28,91,216,0.15); }
    .dd-btn .dd-circle {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, var(--navy-800), var(--navy-700));
      color: #fff; display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 12px; font-family: 'Playfair Display', serif;
      flex-shrink: 0;
    }
    .dd-btn .dd-circle.empty { background: var(--ring); color: var(--muted); font-family: inherit; font-size: 16px; }
    .dd-btn .dd-current { flex: 1; text-align: left; color: var(--ink-2); }
    .dd-btn .dd-current.picked { color: var(--navy-800); font-weight: 800; }
    .dd-btn .dd-arrow { color: var(--muted); transition: transform .2s ease; }
    .dd-btn.open .dd-arrow { transform: rotate(180deg); }
    .dd-popover {
      display: none;
      position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: var(--paper); border-radius: 12px;
      box-shadow: var(--shadow-pop);
      border: 1px solid var(--ring);
      padding: 8px; z-index: 1000;
      max-height: 320px; overflow-y: auto;
    }
    /* When any dropdown inside a part-card is open, lift the whole card so
       its overflowing popover sits above subsequent cards. */
    .part-card:has(.dd-btn.open) { z-index: 500; }
    .dd-popover.open { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    @media (max-width: 480px) {
      .dd-popover.open { grid-template-columns: 1fr; }
    }
    .dd-opt {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 8px;
      background: transparent; border: 0;
      cursor: pointer; font-family: inherit; font-size: 13px;
      text-align: left; transition: all .12s ease;
      color: var(--ink);
    }
    .dd-opt:hover { background: var(--bg-soft); }
    .dd-opt.selected { background: linear-gradient(135deg, #eff6ff, #dbeafe); }
    .dd-opt .dd-circle { width: 28px; height: 28px; }
    .dd-opt .dd-hint {
      font-size: 12.5px; color: var(--ink-2); font-weight: 600;
      flex: 1; min-width: 0; line-height: 1.45;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    /* Compact "mini" dropdown — used inline in Part 3b's dialogue lines.
       No persistent label, just a small letter-circle + chevron.
       Width and position are entirely JS-driven (positionFixedPopover)
       so the popover never overflows the viewport regardless of where
       the trigger sits in the dialogue. */
    .dd-wrap-mini { display: inline-block; }
    .dd-btn-mini {
      display: inline-flex; width: auto; min-height: 36px;
      padding: 5px 10px; gap: 6px;
    }
    .dd-btn-mini .dd-current { display: none; }
    .dd-btn-mini .dd-circle { width: 26px; height: 26px; font-size: 11px; }
    /* Inside the mini popover: full-width rows + top-aligned circle so
       multi-line option text wraps naturally beside the letter. */
    .dd-wrap-mini .dd-opt { width: 100%; align-items: flex-start; }
    .dd-wrap-mini .dd-opt .dd-circle { margin-top: 1px; }

    /* Question rows (parts 4 etc.) */
    .q-row {
      display: grid; grid-template-columns: 44px 1fr 270px; gap: 14px;
      align-items: center; padding: 14px 0;
      border-top: 1px dashed var(--ring);
    }

    /* Part 4 — Q + book-title options. Row on desktop, stacked on mobile. */
    .p4-q {
      display: grid; grid-template-columns: 40px 1fr; gap: 10px 14px;
      padding: 16px 0; border-top: 1px dashed var(--ring);
      align-items: start;
    }
    .p4-q:first-of-type { border-top: 0; padding-top: 4px; }
    .p4-q .q-num { width: 38px; height: 38px; font-size: 16px; }
    .p4-q .q-text {
      font-size: 16px; font-weight: 600; color: var(--ink);
      line-height: 1.5; letter-spacing: -0.1px;
    }
    .p4-answer {
      grid-column: 1 / -1; display: flex; gap: 8px;
      flex-wrap: wrap; margin-top: 6px;
    }
    .p4-opt {
      flex: 1 1 30%; min-width: 160px;
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; border-radius: 10px;
      background: var(--paper); color: var(--ink-2);
      border: 1.5px solid var(--ring-strong);
      font-size: 13.5px; font-family: inherit; text-align: left;
      cursor: pointer; transition: all .15s cubic-bezier(.4,0,.2,1);
      box-shadow: var(--shadow-sm);
    }
    .p4-opt:hover { border-color: var(--blue-500); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .p4-opt.selected {
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border-color: var(--blue-500); color: var(--navy-800);
      box-shadow: 0 4px 14px rgba(28,91,216,0.20);
    }
    .p4-opt .p4-letter {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--bg-soft); color: var(--navy-700);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 11px; flex-shrink: 0;
      font-family: 'Playfair Display', serif;
    }
    .p4-opt.selected .p4-letter { background: var(--blue-600); color: #fff; }
    .p4-opt .p4-title { font-weight: 700; line-height: 1.3; }
    @media (max-width: 640px) {
      .p4-answer { flex-direction: column; }
      .p4-opt { flex: 1 1 100%; width: 100%; min-width: 0; }
    }
    .q-row:first-of-type { border-top: 0; }
    .q-num {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--bg-soft); color: var(--navy-800);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 15px;
    }
    .q-row.answered .q-num { background: var(--emerald-500); color: #fff; box-shadow: 0 4px 12px rgba(16,185,129,0.35); }

    /* ── Post-submit review marking ───────────────────────── */
    .opt-pill.is-correct, .mcq-opt.is-correct, .p4-opt.is-correct, .dd-opt.is-correct { border-color: var(--emerald-500) !important; background: #d1fae5 !important; color: var(--navy-900) !important; box-shadow: 0 4px 12px rgba(16,185,129,0.32) !important; }
    .opt-pill.is-wrong,   .mcq-opt.is-wrong,   .p4-opt.is-wrong,   .dd-opt.is-wrong   { border-color: var(--rose-500)   !important; background: #fee2e2 !important; color: #7f1d1d        !important; }
    .vocab-input.is-correct, .inline-input.is-correct, .an-input.is-correct { border-color: var(--emerald-500) !important; background: #ecfdf5 !important; color: var(--navy-900) !important; }
    .vocab-input.is-wrong,   .inline-input.is-wrong,   .an-input.is-wrong   { border-color: var(--rose-500)   !important; background: #fef2f2 !important; color: #7f1d1d        !important; text-decoration: line-through; }
    .vocab-input.is-revealed, .inline-input.is-revealed, .an-input.is-revealed { border-color: var(--gold-500) !important; background: #fffbeb !important; color: var(--navy-900) !important; font-weight: 700; }
    .ans-key { display:inline-flex; align-items:center; background: var(--emerald-500); color:#fff; font-weight:700; font-size:11.5px; padding:2px 9px; border-radius:999px; margin-left:8px; vertical-align:middle; white-space:nowrap; }
    body.submitted .opt-pill, body.submitted .mcq-opt, body.submitted .p4-opt, body.submitted .dd-btn, body.submitted .dd-opt, body.submitted .pet-cloze-btn, body.submitted .pet-cloze-opt { pointer-events: none; }
    body.submitted .vocab-input, body.submitted .inline-input, body.submitted .an-input, body.submitted textarea { pointer-events: none; }
    .q-text { font-size: 14.5px; line-height: 1.55; color: var(--ink); }
    .q-answer-select { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
    .opt-pill {
      min-width: 36px; padding: 8px 12px; border-radius: 10px;
      background: var(--paper); color: var(--ink-2);
      border: 1.5px solid var(--ring-strong);
      font-weight: 800; font-size: 13px; font-family: inherit;
      cursor: pointer; transition: all .12s cubic-bezier(.4,0,.2,1);
      box-shadow: var(--shadow-sm);
    }
    .opt-pill:hover { border-color: var(--blue-500); color: var(--blue-600); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .opt-pill.selected {
      background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
      color: #fff; border-color: transparent;
      box-shadow: 0 4px 12px rgba(28,91,216,0.40);
      transform: translateY(-1px);
    }
    .opt-pill:active { transform: translateY(0) scale(.96); }

    /* Sentence MCQ */
    .sentence-q { padding: 18px 0; border-top: 1px dashed var(--ring); }
    .sentence-q:first-of-type { border-top: 0; }
    .sentence-stem {
      font-size: 15px; line-height: 1.7; margin-bottom: 10px; color: var(--ink);
      display: flex; gap: 10px;
    }
    .sentence-stem .num {
      flex-shrink: 0;
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--bg-soft); color: var(--navy-800);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 13px;
    }
    .sentence-q.answered .sentence-stem .num { background: var(--emerald-500); color: #fff; }
    .mcq-row { display: flex; gap: 10px; flex-wrap: wrap; margin-left: 38px; }
    .mcq-opt {
      flex: 1 1 28%; min-width: 140px;
      padding: 11px 14px; border-radius: 10px;
      background: var(--paper); color: var(--ink-2);
      border: 1.5px solid var(--ring-strong);
      font-size: 13.5px; font-family: inherit;
      cursor: pointer; transition: all .15s cubic-bezier(.4,0,.2,1);
      display: flex; align-items: center; gap: 8px;
      box-shadow: var(--shadow-sm);
    }
    .mcq-opt:hover { border-color: var(--blue-500); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .mcq-opt .ltr {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--bg-soft); color: var(--navy-700);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 11px; flex-shrink: 0;
      transition: all .15s ease;
    }
    .mcq-opt.selected {
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border-color: var(--blue-500); color: var(--navy-800);
      box-shadow: 0 4px 14px rgba(28,91,216,0.20);
    }
    .mcq-opt.selected .ltr { background: var(--blue-600); color: #fff; }

    /* Dialogue table (Part 3b) */
    .dialogue-wrap {
      background: var(--paper-warm);
      border: 1px solid #e8e0c8;
      border-radius: 14px;
      padding: 22px;
      margin: 18px 0;
      box-shadow: var(--shadow-sm);
    }
    /* Positioning ancestor for the per-gap dropdown popover. The
       popover spans the full line width so option text always has
       room to breathe — no JS-driven fixed positioning needed. */
    .dlg-line { position: relative; }
    .dd-wrap-mini { position: static; }
    .dd-wrap-mini .dd-popover {
      left: 0; right: 0;
      top: calc(100% + 6px);
      min-width: 0;
    }
    .dialogue-and-options {
      display: grid; grid-template-columns: 1.2fr 1fr; gap: 26px;
    }
    @media (max-width: 720px) { .dialogue-and-options { grid-template-columns: 1fr; } }
    .dlg-line {
      display: grid; grid-template-columns: 96px 1fr; gap: 10px;
      padding: 8px 0; border-bottom: 1px dotted #e8e0c8;
      font-size: 14px; line-height: 1.55;
    }
    .dlg-line:last-child { border-bottom: 0; }
    .dlg-speaker { font-weight: 800; color: var(--navy-800); }
    .dlg-gap { display: inline-flex; align-items: center; gap: 10px; }
    .dlg-gap .num {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--blue-500); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 12px;
    }
    .dlg-select {
      padding: 6px 12px;
      border: 1.5px solid var(--ring-strong); border-radius: 10px;
      font-family: inherit; font-weight: 700; font-size: 13px;
      background: #fff; cursor: pointer;
      transition: all .15s ease;
    }
    .dlg-select:focus { outline: 0; border-color: var(--blue-500); }
    .options-list {
      background: #fff; border-radius: 12px;
      padding: 14px 16px; font-size: 13.5px; line-height: 1.6;
      border: 1px solid var(--ring);
    }
    /* On mobile the per-gap dropdown already exposes the full text of
       every option, so the side options-list panel becomes redundant —
       hide it to reclaim scroll real estate. Desktop keeps it visible. */
    @media (max-width: 720px) {
      .options-list { display: none; }
      .dialogue-and-options { grid-template-columns: 1fr; }
    }
    .options-list .opt { padding: 7px 0; border-bottom: 1px dashed var(--ring); display: flex; gap: 10px; }
    .options-list .opt:last-child { border-bottom: 0; }
    .options-list .opt .ltr {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--navy-800); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 11px; flex-shrink: 0;
      font-family: 'Playfair Display', serif;
    }

    /* Three book texts (Part 4) */
    .three-texts-heading {
      background: linear-gradient(135deg, var(--navy-800), var(--navy-700));
      color: #fff; padding: 14px 22px; border-radius: 14px 14px 0 0;
      font-weight: 800; font-size: 17px; letter-spacing: 0.5px;
      font-family: 'Playfair Display', serif;
      box-shadow: var(--shadow-sm);
    }
    .three-texts {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0;
      background: var(--paper); border-radius: 0 0 14px 14px;
      box-shadow: var(--shadow-md);
      margin-bottom: 18px;
      overflow: hidden;
      border: 1px solid var(--ring);
    }
    @media (max-width: 900px) { .three-texts { grid-template-columns: 1fr; } }
    .book-card {
      padding: 20px 18px;
      background: var(--paper);
      border-right: 1px dashed var(--ring);
      position: relative;
    }
    .book-card:last-child { border-right: 0; }
    @media (max-width: 900px) {
      .book-card { border-right: 0; border-bottom: 1px dashed var(--ring); }
      .book-card:last-child { border-bottom: 0; }
    }
    .book-card .book-letter {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--rose-500), #c11444);
      color: #fff; font-weight: 900; font-family: 'Playfair Display', serif;
      font-size: 15px; margin-bottom: 10px;
      box-shadow: 0 4px 12px rgba(225,29,72,0.32);
    }
    .book-card .book-title {
      font-family: 'Playfair Display', serif;
      font-weight: 800; font-size: 18px; line-height: 1.2;
      color: var(--ink); margin-bottom: 10px; letter-spacing: -0.2px;
    }
    .book-card .book-body {
      font-size: 13px; line-height: 1.65; color: var(--ink-2);
      white-space: pre-line;
    }

    /* Cloze passage (Part 5) */
    .cloze-box {
      background: var(--paper-warm);
      border: 1px solid #e8e0c8;
      border-radius: 14px;
      padding: 22px 28px;
      font-size: 15.5px; line-height: 2; white-space: pre-line;
      box-shadow: var(--shadow-sm);
      font-family: 'Playfair Display', Georgia, serif;
    }
    .cloze-box h3 {
      font-family: 'Playfair Display', serif;
      margin: 0 0 14px 0;
      font-size: 26px; font-weight: 800; font-style: italic;
      color: var(--navy-800);
    }
    .gap-pill {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 32px; padding: 2px 10px;
      background: var(--amber-200);
      border: 1px solid var(--gold-500);
      color: #78350f;
      border-radius: 8px; font-weight: 800; font-size: 13.5px;
      font-family: 'Inter', sans-serif;
      vertical-align: baseline; line-height: 1.5;
    }
    .gap-pill.ex { background: #d1fae5; border-color: var(--emerald-500); color: #065f46; }

    /* Cloze inline dropdown (Part 5) — each gap is its own popover.
       The trigger looks like the amber gap pill; after picking it
       turns green and shows the chosen word inline in the passage. */
    .cloze-gap-wrap {
      position: relative; display: inline-block;
      vertical-align: baseline; line-height: 1;
    }
    .cloze-gap-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px;
      border: 1px solid var(--gold-500);
      background: var(--amber-200);
      color: #78350f;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 800; font-size: 13.5px;
      cursor: pointer; line-height: 1.4;
      vertical-align: baseline;
      transition: all .15s ease;
      box-shadow: var(--shadow-sm);
    }
    .cloze-gap-btn:hover { background: #fde68a; }
    .cloze-gap-btn.open { background: #fcd34d; box-shadow: 0 0 0 3px rgba(212,167,44,0.2); }
    /* Plain inline number inside the amber pill — no circle wrapper.
       After answering, the same span gets swapped to the picked word
       in pickDD() and the pill class flips to `.answered` (green). */
    .cloze-gap-btn .cloze-num {
      display: inline; padding: 0; margin: 0; background: transparent;
      color: inherit;
      font-family: 'Inter', sans-serif;
      font-weight: 800; font-size: 14px;
      letter-spacing: 0.2px;
      box-shadow: none; border-radius: 0;
      width: auto; height: auto;
    }
    .cloze-gap-btn .dd-arrow { color: var(--gold-500); font-size: 10px; margin-left: 2px; }
    .cloze-gap-btn.answered .cloze-num { color: #047857; }
    /* Answered: green pill showing the picked word inline. */
    .cloze-gap-btn.answered {
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      border-color: var(--emerald-500);
      color: #065f46;
    }
    .cloze-gap-btn.answered .dd-arrow { color: var(--emerald-500); }
    .cloze-gap-wrap .dd-popover {
      position: absolute;
      top: calc(100% + 6px);
      left: 0; right: auto;
      width: 220px;
      min-width: 0;
      display: none;
    }
    .cloze-gap-wrap .dd-popover.open {
      display: grid; grid-template-columns: 1fr; gap: 4px;
    }
    .cloze-gap-wrap .dd-opt { width: 100%; padding: 8px 10px; }
    .cloze-gap-wrap .dd-opt .dd-hint {
      font-size: 13px; font-weight: 700;
      font-family: 'Inter', sans-serif;
    }

    /* Vocab fill (Part 6) */
    .vocab-row {
      display: grid; grid-template-columns: 44px 1fr 240px; gap: 14px;
      padding: 14px 0; align-items: center;
      border-top: 1px dashed var(--ring);
    }
    .vocab-row:first-of-type { border-top: 0; }
    .vocab-prompt { font-size: 14.5px; line-height: 1.55; color: var(--ink); }
    .vocab-input-wrap {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-soft); padding: 10px 14px; border-radius: 10px;
      border: 1.5px solid var(--ring-strong);
      transition: all .15s ease;
    }
    .vocab-input-wrap:focus-within { border-color: var(--blue-500); background: #f0f9ff; }
    .vocab-input-wrap .first-ltr {
      font-family: 'Playfair Display', serif;
      font-weight: 800; font-size: 20px; color: var(--navy-800);
      min-width: 18px;
    }
    .vocab-input {
      font-family: inherit; font-size: 15px;
      padding: 6px 4px; border: 0; background: transparent;
      flex: 1; min-width: 0; color: var(--ink);
      border-bottom: 2px dotted var(--ring-strong);
    }
    .vocab-input:focus { outline: 0; border-bottom-color: var(--blue-500); }

    /* Letter (Part 7) */
    .letter-box {
      background:
        repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(15,23,42,0.06) 27px, rgba(15,23,42,0.06) 28px),
        var(--paper-warm);
      border: 1px solid #e8d8a3;
      border-left: 6px solid #b45309;
      border-radius: 10px;
      padding: 28px 36px;
      font-size: 15px; line-height: 1.9;
      color: var(--ink);
      box-shadow: var(--shadow-md);
      position: relative;
    }
    .letter-box::before {
      content: ''; position: absolute; left: -6px; top: 14px; bottom: 14px;
      width: 6px; background: repeating-linear-gradient(180deg, #b45309, #b45309 6px, #fbbf24 6px, #fbbf24 12px);
      border-radius: 6px 0 0 6px;
    }
    .letter-header { text-align: right; white-space: pre-line; color: var(--ink-2); margin-bottom: 18px; font-family: 'Caveat', cursive; font-size: 19px; line-height: 1.4; }
    .letter-greeting { font-weight: 700; margin-bottom: 8px; }
    .letter-body { white-space: pre-line; }
    .letter-closing { white-space: pre-line; margin-top: 14px; font-weight: 600; font-family: 'Caveat', cursive; font-size: 21px; }
    .inline-input {
      display: inline-block; vertical-align: baseline;
      font-family: inherit; font-size: 14.5px;
      width: 88px; padding: 2px 8px;
      border: 0; border-bottom: 2px dotted var(--blue-500);
      background: rgba(28,91,216,0.06);
      border-radius: 4px 4px 0 0;
      color: var(--navy-800); font-weight: 700;
      transition: all .15s ease;
    }
    .inline-input:focus { outline: 0; background: #fef3c7; border-bottom-color: var(--gold-500); }
    .inline-input::placeholder { color: var(--blue-400); font-weight: 800; }

    /* Part 8 — notice + note + Andy's notes */
    .filmclub-notice {
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 10px;
      padding: 0; overflow: hidden;
      margin: 16px 0;
      box-shadow: var(--shadow-md);
      max-width: 440px; margin-left: auto; margin-right: auto;
    }
    .filmclub-notice .ntitle {
      background: linear-gradient(180deg, #fde68a, #fbbf24);
      color: #78350f;
      padding: 12px 16px;
      font-weight: 900; font-size: 18px;
      text-align: center; letter-spacing: 1.5px;
      border-bottom: 3px solid var(--ink);
      font-family: 'Playfair Display', serif;
    }
    .filmclub-notice .nbody {
      padding: 16px 22px;
      font-size: 15px; line-height: 1.8;
      white-space: pre-line;
      font-family: 'Playfair Display', serif;
    }
    .note-card {
      background: var(--paper-warm);
      border: 1px solid #e8d8a3;
      border-radius: 10px;
      padding: 18px 22px;
      margin: 18px 0;
      font-family: 'Caveat', cursive;
      font-size: 19px; line-height: 1.5;
      color: var(--ink);
      box-shadow: var(--shadow-sm);
      max-width: 460px;
    }
    .note-card .date-line { text-align: right; color: var(--muted); font-size: 16px; margin-bottom: 6px; }
    .note-card .note-body { white-space: pre-line; }
    .note-card .sig { font-weight: 700; margin-top: 8px; font-size: 22px; }
    .andy-notes {
      background: var(--paper);
      border: 1px solid var(--ring);
      border-radius: 14px;
      padding: 22px 26px;
      margin: 18px 0;
      box-shadow: var(--shadow-md);
    }
    .andy-notes .an-title {
      font-family: 'Playfair Display', serif;
      font-weight: 800; text-align: center; font-size: 20px;
      color: var(--navy-800);
    }
    .andy-notes .an-sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .andy-notes .an-row {
      display: grid; grid-template-columns: 150px 1fr;
      gap: 14px; padding: 12px 0; align-items: center;
      border-top: 1px dashed var(--ring);
    }
    .andy-notes .an-row:first-of-type { border-top: 0; }
    .andy-notes .an-label { font-weight: 700; color: var(--ink-2); }
    .andy-notes .an-value {
      display: flex; align-items: center; gap: 10px;
      min-width: 0;
    }
    .andy-notes .an-num {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--blue-500); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 13px; flex-shrink: 0;
    }
    .andy-notes .an-prefix {
      font-weight: 700; color: var(--ink); flex-shrink: 0;
    }
    .andy-notes .an-input {
      padding: 8px 12px; border: 1.5px solid var(--ring-strong); border-radius: 8px;
      font-size: 14.5px; font-family: inherit;
      flex: 1; min-width: 0;
      transition: all .15s ease;
    }
    .andy-notes .an-input:focus { outline: 0; border-color: var(--blue-500); background: #f0f9ff; }
    .andy-notes .prefilled { font-style: italic; color: var(--muted); font-family: 'Caveat', cursive; font-size: 19px; }

    /* Mobile: label stacks above the value so the input gets full width. */
    @media (max-width: 640px) {
      .andy-notes .an-row {
        grid-template-columns: 1fr;
        gap: 6px; padding: 14px 0;
      }
      .andy-notes .an-label { font-size: 14.5px; }
    }

    /* Postcard (Part 9) */
    .postcard-prompt-card {
      background: linear-gradient(135deg, #fffbeb, #fef3c7);
      border: 1px solid #fcd34d;
      border-radius: 14px;
      padding: 18px 22px;
      margin: 18px 0;
      font-size: 14.5px; line-height: 1.65;
      white-space: pre-line;
      box-shadow: var(--shadow-sm);
      max-width: 460px;
    }
    .postcard-prompt-card .sig {
      margin-top: 12px; font-family: 'Caveat', cursive;
      font-size: 22px; font-weight: 700; text-align: right;
      color: var(--navy-800);
    }
    .postcard-frame {
      background:
        linear-gradient(135deg, #fafafa 0%, #fff 100%);
      border: 2px solid var(--ring-strong);
      border-radius: 14px;
      padding: 18px;
      box-shadow: var(--shadow-md);
      position: relative;
    }
    .postcard-frame::before {
      content: 'POSTCARD'; position: absolute; top: 8px; right: 12px;
      font-size: 10px; font-weight: 800; letter-spacing: 2px;
      color: var(--ring-strong);
    }
    .postcard-textarea {
      width: 100%; min-height: 160px;
      padding: 14px 16px; border: 1.5px dashed var(--ring-strong);
      border-radius: 10px;
      font-family: 'Caveat', cursive; font-size: 21px; line-height: 1.4;
      resize: vertical; background: transparent;
      color: var(--ink);
    }
    .postcard-textarea:focus { outline: 0; border-color: var(--blue-500); background: #fffef9; }
    .wc-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; padding: 0 4px; }
    .wc-bar { flex: 1; height: 6px; background: var(--ring); border-radius: 3px; overflow: hidden; }
    .wc-fill { height: 100%; background: linear-gradient(90deg, var(--rose-500), var(--gold-500), var(--emerald-500)); width: 0; transition: width .25s ease; }
    .wc-label { font-size: 12.5px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
    .wc-label.in-range { color: var(--emerald-600); }
    .wc-label.out-range { color: var(--rose-500); }

    /* Floating bottom submit on mobile */
    .float-submit {
      display: none;
      position: fixed; bottom: 16px; right: 16px; z-index: 95;
      background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
      color: var(--navy-900);
      border: 0; padding: 14px 22px; border-radius: 999px;
      font-weight: 800; font-family: inherit; font-size: 15px;
      box-shadow: 0 12px 30px rgba(212,167,44,0.55);
      cursor: pointer;
    }
    /* Floating submit removed on mobile — top-bar Submit is enough. */

    /* Leave-test dialog — replaces window.confirm. Soft amber-themed
       card with two clear actions (keep going / leave anyway). */
    .leave-modal {
      position: fixed; inset: 0;
      background: rgba(11,29,58,0.78); backdrop-filter: blur(10px);
      display: none; align-items: center; justify-content: center;
      z-index: 250; padding: 20px;
      animation: leaveFade .2s ease;
    }
    .leave-modal.show { display: flex; }
    .leave-card {
      background: var(--paper); border-radius: 22px;
      max-width: 460px; width: 100%;
      padding: 32px 30px 26px;
      box-shadow: var(--shadow-pop);
      text-align: center;
      animation: leavePop .28s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes leaveFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes leavePop  { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .leave-card .leave-icon {
      width: 60px; height: 60px; border-radius: 50%;
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border: 2px solid #f59e0b;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 6px 18px rgba(245,158,11,0.35);
      margin: 0 auto 16px;
    }
    .leave-card h2 {
      margin: 0 0 10px;
      font-family: 'Playfair Display', serif;
      font-weight: 800; font-size: 24px; color: var(--navy-800);
    }
    .leave-card p {
      margin: 0 0 22px; font-size: 14.5px; line-height: 1.6;
      color: var(--ink-2);
    }
    .leave-actions { display: flex; gap: 10px; }
    .leave-actions button {
      flex: 1; padding: 12px 18px; border-radius: 12px;
      border: 0; cursor: pointer; font-family: inherit;
      font-weight: 800; font-size: 14px;
      transition: all .15s ease;
    }
    .leave-stay {
      background: linear-gradient(135deg, var(--emerald-600), var(--emerald-500));
      color: #fff; box-shadow: 0 6px 18px rgba(5,150,105,0.35);
    }
    .leave-stay:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(5,150,105,0.45); }
    .leave-go {
      background: var(--bg-soft); color: var(--rose-500);
      border: 1.5px solid #fecaca !important;
    }
    .leave-go:hover { background: #fee2e2; border-color: var(--rose-500) !important; }

    /* Results panel — drops in at the END of the page (matches Listening UX) */
    .results-modal {
      display: none;
      max-width: 780px;
      margin: 24px auto 60px;
      padding: 0 22px;
    }
    .results-modal.show { display: block; }
    .results-card {
      background: var(--paper); border-radius: 22px;
      width: 100%;
      padding: 32px 36px;
      box-shadow: var(--shadow-pop);
      border: 1px solid var(--ring);
      animation: cardFadeIn .4s ease both;
    }
    .results-card h2 {
      margin: 0 0 16px 0; font-family: 'Playfair Display', serif;
      font-weight: 800; font-size: 28px; color: var(--navy-800);
    }
    .score-hero {
      background: linear-gradient(135deg, var(--navy-900), var(--navy-700));
      color: #fff; padding: 24px 28px; border-radius: 18px;
      display: flex; align-items: center; gap: 24px;
      margin: 14px 0 20px;
    }
    .score-big {
      font-family: 'Playfair Display', serif;
      font-size: 56px; font-weight: 900; line-height: 1;
      background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .score-meta { font-size: 13.5px; color: rgba(255,255,255,0.85); line-height: 1.5; }
    .score-meta strong { color: #fff; }
    .score-breakdown {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; margin: 18px 0;
    }
    .score-row {
      background: var(--bg-soft); padding: 10px 14px; border-radius: 10px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px;
    }
    .score-row .pn { font-weight: 800; color: var(--navy-800); }
    .score-row .ps { font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    @media (max-width: 540px) { .score-breakdown { grid-template-columns: 1fr 1fr; } }
    .free-text-review {
      background: var(--bg-soft); border-radius: 12px;
      padding: 14px 16px; margin: 12px 0;
      border-left: 3px solid var(--blue-500);
    }
    .free-text-review .qhead { font-weight: 800; margin-bottom: 8px; color: var(--navy-800); }
    .free-text-review .their-ans {
      background: #fff; border: 1px solid var(--ring-strong);
      padding: 10px 14px; border-radius: 8px;
      font-size: 14.5px; margin-bottom: 8px; white-space: pre-line;
    }
    .free-text-review .expected {
      color: var(--ink-2); font-size: 13px;
    }
    .free-text-review .expected strong { color: var(--emerald-600); }
    .results-actions { display: flex; gap: 12px; margin-top: 24px; }
    .results-actions button {
      flex: 1; padding: 12px 18px; border-radius: 12px; border: 0;
      cursor: pointer; font-weight: 800; font-family: inherit; font-size: 14px;
      transition: all .15s ease;
    }
    .btn-back { background: var(--bg-soft); color: var(--ink); }
    .btn-back:hover { background: var(--ring); }
    .btn-retry {
      background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
      color: #fff; box-shadow: 0 6px 18px rgba(28,91,216,0.35);
    }
    .btn-retry:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(28,91,216,0.45); }

    .topbar-mobile-title { display: none; }
    @media (max-width: 720px) {
      .page { margin: 18px auto 100px; padding: 0 12px; }
      .part-card { padding: 22px 18px; border-radius: 18px; }
      .part-card::before { left: 0; top: 22px; bottom: 22px; }
      .paper-hero { padding: 28px 22px; border-radius: 18px; }
      .topbar { padding: 8px 12px; gap: 8px; }
      .topbar .crest { display: none; }
      .topbar .brand { gap: 0; }
      .topbar .titlewrap { display: none; }
      .topbar-mobile-title { display: inline-block; font-weight: 700; font-size: 15px; color: #fff; white-space: nowrap; }
      .topbar .back { padding: 6px 10px; font-size: 13px; }
      .topbar .timer { padding: 6px 10px; font-size: 13.5px; }
      .topbar .submit { padding: 7px 14px; font-size: 13.5px; }
      .nav-strip { padding: 8px 12px; top: 60px; }
      .mock-switcher { top: 52px; }
      .q-row { grid-template-columns: 36px 1fr; }
      .q-row .q-answer-select { grid-column: 1 / -1; justify-content: flex-start; }
      .vocab-row { grid-template-columns: 36px 1fr; }
      .vocab-row .vocab-input-wrap { grid-column: 1 / -1; }

      /* Compact leave-modal to match the Listening runner's look */
      .leave-card { padding: 22px 20px 18px; border-radius: 16px; max-width: 360px; }
      .leave-card .leave-icon { display: none; }
      .leave-card h2 { font-family: Inter, sans-serif; font-size: 18px; margin-bottom: 6px; }
      .leave-card p { font-size: 13px; margin-bottom: 16px; }
      .leave-actions button { padding: 10px 14px; font-size: 13.5px; border-radius: 10px; }
    }

    /* ─── PET-specific styles ─────────────────────────────────────── */
    .q-num { width: 32px; height: 32px; flex-shrink: 0; border-radius: 999px; background: var(--blue-500); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; }
    .q-num.inline { display: inline-flex; margin-right: 10px; vertical-align: middle; }

    /* Part 1 — short signs/notices */
    .pet-p1-list { display: flex; flex-direction: column; gap: 24px; }
    .pet-p1-row { display: grid; grid-template-columns: 36px 1fr 1fr; gap: 18px; align-items: start; }
    .pet-notice { background: var(--paper-warm); border: 1.5px solid var(--ring-strong); border-radius: 12px; padding: 14px 16px; min-height: 90px; box-shadow: 0 2px 6px rgba(11,29,58,0.05); position: relative; }
    .pet-notice-formal { background: #fff; border-color: var(--navy-800); }
    .pet-notice-formal .pet-notice-title { background: var(--navy-800); color: #fff; margin: -14px -16px 12px; padding: 8px 12px; border-radius: 11px 11px 0 0; font-weight: 800; font-size: 13.5px; letter-spacing: 1px; text-align: center; text-transform: uppercase; }
    .pet-notice-note { background: #fef9c3; border-color: #fde047; transform: rotate(-0.5deg); }
    .pet-notice-note .pet-notice-title { font-family: 'Caveat', cursive; font-size: 22px; color: #713f12; margin-bottom: 6px; }
    .pet-notice-note .pet-notice-body, .pet-notice-note .pet-notice-sig { font-family: 'Caveat', cursive; font-size: 19px; color: #713f12; line-height: 1.35; }
    .pet-notice-message { background: #e0f2fe; border-color: #7dd3fc; border-radius: 14px 14px 14px 4px; }
    .pet-notice-message .pet-notice-title { font-weight: 800; color: var(--navy-800); margin-bottom: 4px; font-size: 13px; }
    .pet-notice-sign { background: #fff; border: 2px solid var(--navy-700); }
    .pet-notice-img { display: flex; align-items: center; justify-content: center; padding: 8px; background: #fff; border-radius: 12px; border: 1px solid var(--ring); }
    .pet-notice-img img { max-width: 100%; width: 100%; height: auto; display: block; }
    .pet-passage-img { margin: 14px 0 20px; background: #fff; border-radius: 12px; padding: 10px; border: 1px solid var(--ring); box-shadow: 0 2px 6px rgba(11,29,58,0.05); }
    .pet-passage-img img { max-width: 100%; width: 100%; height: auto; display: block; border-radius: 6px; }
    .pet-notice-sign .pet-notice-title { text-align: center; font-weight: 900; font-size: 15px; color: var(--navy-900); letter-spacing: 0.5px; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--ring); }
    .pet-notice-sign .pet-notice-body { text-align: center; }
    .pet-notice-body { font-size: 13.5px; line-height: 1.55; color: var(--ink); }
    .pet-notice-sig { margin-top: 8px; font-weight: 700; color: var(--ink-2); text-align: right; font-size: 13px; }
    .pet-p1-q { display: flex; flex-direction: column; gap: 10px; }
    .pet-p1-stem { font-weight: 700; color: var(--ink); font-size: 14.5px; }
    .pet-mcq-list { display: flex; flex-direction: column; gap: 8px; }
    .mcq-opt { background: #fff; border: 1.5px solid var(--ring); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; text-align: left; font-family: inherit; font-size: 14px; color: var(--ink); transition: all .12s ease; }
    .mcq-opt:hover { border-color: var(--blue-400); background: #f0f9ff; }
    .mcq-opt.selected, .mcq-opt.picked { border-color: var(--blue-500); background: #dbeafe; box-shadow: 0 2px 8px rgba(28,91,216,0.15); }
    .mcq-opt.is-correct { border-color: var(--emerald-500) !important; background: #ecfdf5 !important; }
    .mcq-opt.is-wrong { border-color: var(--rose-500) !important; background: #fef2f2 !important; }
    .mcq-letter { flex-shrink: 0; font-weight: 900; color: var(--navy-700); width: 22px; }
    .mcq-text { flex: 1; line-height: 1.45; }
    @media (max-width: 760px) {
      .pet-p1-row { grid-template-columns: 28px 1fr; }
      .pet-p1-row .pet-notice { grid-column: 1 / -1; margin-left: 28px; }
      .pet-p1-row .pet-p1-q { grid-column: 1 / -1; margin-left: 28px; }
      .pet-p1-row .q-num { grid-row: 1; }
    }

    /* Part 2 — people / texts matching */
    .pet-p2-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
    .pet-section-head { font-size: 11px; font-weight: 900; letter-spacing: 1.6px; text-transform: uppercase; color: var(--navy-700); margin: 0 0 14px; padding-bottom: 8px; border-bottom: 2px solid var(--ring); }
    .pet-p2-people { display: flex; flex-direction: column; gap: 16px; }
    .pet-p2-person { display: flex; gap: 12px; align-items: flex-start; background: var(--bg-soft); border-radius: 12px; padding: 14px; border-left: 3px solid var(--blue-500); }
    .pet-person-img { flex: 0 0 90px; background: #fff; border: 1px solid var(--ring); border-radius: 8px; padding: 4px; display: flex; align-items: center; justify-content: center; }
    .pet-person-img img { max-width: 100%; max-height: 120px; height: auto; display: block; }
    .pet-person-body { flex: 1; min-width: 0; }
    .pet-person-name { font-weight: 800; color: var(--ink); font-size: 14.5px; margin-bottom: 4px; }
    .pet-person-desc { font-size: 13.5px; line-height: 1.55; color: var(--ink-2); margin-bottom: 10px; }
    .pet-p2-letters { display: flex; flex-wrap: wrap; gap: 6px; }
    .opt-pill { background: #fff; border: 1.5px solid var(--ring); border-radius: 999px; min-width: 38px; height: 34px; padding: 0 12px; font-weight: 800; cursor: pointer; font-family: inherit; font-size: 13px; color: var(--navy-700); transition: all .12s ease; display: inline-flex; align-items: center; justify-content: center; }
    .opt-pill:hover { border-color: var(--blue-400); background: #f0f9ff; }
    .opt-pill.selected, .opt-pill.picked { background: var(--blue-500); color: #fff; border-color: var(--blue-500); }
    .opt-pill.is-correct { background: var(--emerald-500) !important; color: #fff !important; border-color: var(--emerald-500) !important; }
    .opt-pill.is-wrong { background: var(--rose-500) !important; color: #fff !important; border-color: var(--rose-500) !important; }
    .pet-p2-texts { display: flex; flex-direction: column; gap: 12px; }
    .pet-text-card { background: #fff; border: 1px solid var(--ring); border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; }
    .pet-text-letter { flex-shrink: 0; width: 30px; height: 30px; border-radius: 999px; background: var(--navy-800); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; }
    .pet-text-body { font-size: 13px; line-height: 1.55; color: var(--ink); flex: 1; }
    @media (max-width: 820px) {
      .pet-p2-grid { grid-template-columns: 1fr; gap: 18px; }
      .pet-p2-texts { order: -1; }
    }

    /* Part 3 — passage + T/F */
    .pet-passage { background: var(--paper-warm); border: 1px solid var(--ring); border-radius: 14px; padding: 22px 26px; margin-bottom: 22px; font-size: 14.5px; line-height: 1.7; color: var(--ink); }
    .pet-passage-title { font-family: 'Playfair Display', serif; font-size: 24px; margin: 0 0 4px; color: var(--navy-900); text-align: center; }
    .pet-passage-sub { font-size: 13px; color: var(--muted); margin-bottom: 14px; text-align: center; font-style: italic; }
    .pet-passage p { margin: 0 0 12px; }
    .pet-passage p:last-child { margin-bottom: 0; }
    .pet-tf-list { display: flex; flex-direction: column; gap: 12px; }
    .pet-tf-row { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; padding: 12px; background: #fff; border: 1px solid var(--ring); border-radius: 10px; }
    .pet-tf-stem { font-size: 14px; line-height: 1.55; color: var(--ink); grid-column: 2; }
    .pet-tf-buttons { grid-column: 2; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .pet-tf-btn { padding: 0 16px; }

    /* Part 4 — passage + MCQ A/B/C/D */
    .pet-mcq-block { display: flex; flex-direction: column; gap: 18px; }
    .pet-mcq-row { background: #fff; border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; }
    .pet-mcq-stem { font-weight: 700; color: var(--ink); font-size: 14.5px; margin-bottom: 10px; line-height: 1.5; }

    /* Part 5 — cloze with inline gap pills */
    .pet-cloze-passage .pet-gap-inline { display: inline-block; min-width: 50px; padding: 1px 10px; margin: 0 3px; border-radius: 999px; background: var(--amber-200); border: 1px solid var(--gold-400); font-weight: 800; color: var(--navy-800); text-align: center; font-size: 13.5px; }
    .pet-cloze-block .pet-mcq-row { padding: 12px 14px; }
    .pet-cloze-options { flex-direction: row !important; flex-wrap: wrap; gap: 8px; }
    .pet-cloze-options .mcq-opt { flex: 1 1 calc(50% - 4px); min-width: 0; padding: 8px 10px; font-size: 13.5px; }
    @media (min-width: 720px) {
      .pet-cloze-options .mcq-opt { flex: 1 1 calc(25% - 6px); }
    }

    /* Part 5 cloze — inline dropdown picker per gap */
    .pet-cloze-wrap { position: relative; display: inline-block; margin: 0 3px; vertical-align: baseline; }
    .pet-cloze-btn { background: var(--amber-200); border: 1.5px solid var(--gold-400); border-radius: 999px; padding: 2px 10px 2px 12px; font-weight: 800; color: var(--navy-800); font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; transition: all .12s ease; }
    .pet-cloze-btn:hover { background: #fef3c7; border-color: var(--gold-500); }
    .pet-cloze-btn.picked { background: #dbeafe; border-color: var(--blue-500); color: var(--navy-900); }
    .pet-cloze-btn.is-correct { background: #ecfdf5 !important; border-color: var(--emerald-500) !important; color: var(--navy-900); }
    .pet-cloze-btn.is-wrong { background: #fef2f2 !important; border-color: var(--rose-500) !important; color: #7f1d1d; }
    .pet-cloze-btn.is-revealed { background: #fffbeb !important; border-color: var(--gold-500) !important; color: var(--navy-900); font-weight: 800; }
    .pet-cloze-num { line-height: 1.1; }
    .pet-cloze-arrow { font-size: 10px; opacity: .7; }
    .pet-cloze-pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 50; background: #fff; border: 1.5px solid var(--ring-strong); border-radius: 12px; box-shadow: 0 12px 30px rgba(11,29,58,.18); padding: 6px; min-width: 220px; display: flex; flex-direction: column; gap: 4px; }
    .pet-cloze-pop[hidden] { display: none; }
    .pet-cloze-opt { background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 13.5px; color: var(--ink); text-align: left; transition: all .12s ease; }
    .pet-cloze-opt:hover { background: #f0f9ff; border-color: var(--blue-400); }
    .pet-cloze-opt.picked { background: #dbeafe; border-color: var(--blue-500); }
    .pet-cloze-opt.is-correct { background: #ecfdf5 !important; border-color: var(--emerald-500) !important; }
    .pet-cloze-opt.is-wrong { background: #fef2f2 !important; border-color: var(--rose-500) !important; }
    .pet-cloze-opt-letter { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--bg-soft); color: var(--navy-700); display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 11.5px; }
    .pet-cloze-opt.picked .pet-cloze-opt-letter, .pet-cloze-opt.is-correct .pet-cloze-opt-letter { background: var(--navy-700); color: #fff; }
    .pet-cloze-opt-text { flex: 1; line-height: 1.4; }
  </style>
</head>
<body>

<div class="topbar">
  <button class="back" onclick="goBack()">← Back</button>
  <div class="brand">
    <div class="crest">KE</div>
    <div class="titlewrap">
      <div class="t1">KET · Key English Test</div>
      <div class="t2" id="topbarSub">Paper 1 · Reading and Writing</div>
    </div>
    <div class="topbar-mobile-title" id="topbarMobileTitle">Test 1</div>
  </div>
  <span class="spacer"></span>
  <span class="timer" id="timer">1:10:00</span>
  <button class="submit" onclick="submitTest()">Submit</button>
</div>

<nav class="mock-switcher" id="mockSwitcher">
  <a class="ms-pill" href="?mock=1">1</a>
  <a class="ms-pill" href="?mock=2">2</a>
  <a class="ms-pill" href="?mock=3">3</a>
  <a class="ms-pill" href="?mock=4">4</a>
</nav>

<div class="nav-strip" id="navStrip"></div>

<div class="page" id="page">
  <div class="paper-hero">
    <span class="lvl-chip">⭐ B1 · Preliminary English Test</span>
    <div class="test-no" id="heroTestNo">Test 1</div>
    <div class="paper-line"><strong>PAPER 1</strong> &nbsp; READING &nbsp;·&nbsp; 50 minutes</div>
    <div class="meta-row">
      <div class="m">📑 <b>5 parts</b></div>
      <div class="m">❓ <b>35 questions</b></div>
      <div class="m">⏱ <b>50 min</b></div>
    </div>
  </div>
  <div id="partsRoot"></div>
</div>

<button class="float-submit" onclick="submitTest()">Submit ✓</button>

<div class="results-modal" id="resultsModal">
  <div class="results-card" id="resultsCard"></div>
</div>

<!-- Custom leave-test dialog (replaces window.confirm) -->
<div class="leave-modal" id="leaveModal" onclick="closeLeaveModal(event)">
  <div class="leave-card" onclick="event.stopPropagation()">
    <div class="leave-icon">⚠️</div>
    <h2>Leave this mock?</h2>
    <p>Your progress will be lost. Are you sure?</p>
    <div class="leave-actions">
      <button type="button" class="leave-stay" onclick="closeLeaveModal()">Keep Going</button>
      <button type="button" class="leave-go" onclick="confirmLeave()">Leave Anyway</button>
    </div>
  </div>
</div>

<script>
  // Dynamic mock loader. ?mock=02 (or 2) → questions PET R/pet-reading-test-02.js.
  // Defaults to mock 01 when the param is absent or invalid.
  (function () {
    var p = new URLSearchParams(location.search);
    var n = parseInt(p.get('mock') || '1', 10);
    if (!n || n < 1 || n > 99) n = 1;
    var pad = (n < 10 ? '0' : '') + n;
    window._PET_MOCK_NUM = pad;
    document.write('<script src="questions PET R/pet-reading-test-' + pad + '.js"><\/script>');
  })();
</script>
<script>
  function goBack() {
    var m = document.getElementById('leaveModal');
    if (m) { m.classList.add('show'); }
    else { window.location.href = '/pet.html?paper=reading'; }
  }
  function closeLeaveModal(ev) {
    if (ev && ev.type === 'click' && ev.target.id !== 'leaveModal') return;
    var m = document.getElementById('leaveModal');
    if (m) m.classList.remove('show');
  }
  function confirmLeave() {
    window.location.href = '/pet.html?paper=reading';
  }
  // Esc dismisses the dialog
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      var m = document.getElementById('leaveModal');
      if (m && m.classList.contains('show')) closeLeaveModal();
    }
  });

  // ── State ──────────────────────────────────────────────────────
  window.__ANS = {};
  function setAns(id, val) {
    window.__ANS[id] = val;
    refreshAnsweredMarkers(id);
    refreshNavStrip();
  }
  function getAns(id) { return window.__ANS[id] || ''; }

  // Pill / MCQ pickers — set both `selected` (visual) and `picked` (for markAnswers query)
  function pickPill(id, letter, btn) {
    setAns(id, letter);
    var parent = btn.parentElement;
    parent.querySelectorAll('.opt-pill').forEach(function (p) { p.classList.remove('selected'); p.classList.remove('picked'); });
    btn.classList.add('selected');
    btn.classList.add('picked');
  }
  function pickMcq(id, letter, btn) {
    setAns(id, letter);
    var parent = btn.parentElement;
    parent.querySelectorAll('.mcq-opt').forEach(function (p) { p.classList.remove('selected'); p.classList.remove('picked'); });
    btn.classList.add('selected');
    btn.classList.add('picked');
  }

  function refreshAnsweredMarkers(id) {
    // Mark parent .q-row / .sentence-q answered when any input/pill is filled
    document.querySelectorAll('[data-qslot="' + id + '"]').forEach(function (el) {
      if (window.__ANS[id]) el.classList.add('answered');
      else el.classList.remove('answered');
    });
  }

  function refreshNavStrip() {
    if (!window.PET_R_TEST) return;
    var strip = document.getElementById('navStrip');
    if (!strip) return;
    strip.innerHTML = '';
    var parts = window.PET_R_TEST.parts;
    var partGroups = {};
    parts.forEach(function (p) {
      var key = p.partNumber + (p.partLetter || '');
      if (!partGroups[key]) partGroups[key] = { part: p, items: [] };
      (p.items || []).forEach(function (it) { partGroups[key].items.push(it); });
    });
    Object.keys(partGroups).forEach(function (key) {
      var grp = partGroups[key];
      var total = grp.items.length;
      var answered = grp.items.filter(function (it) { return window.__ANS[it.id]; }).length;
      var chip = document.createElement('a');
      chip.href = '#part-' + key;
      chip.className = 'nav-chip';
      if (answered === total && total > 0) chip.classList.add('complete');
      else if (answered > 0) chip.classList.add('has-answers');
      chip.innerHTML = '<span class="dot"></span> Part ' + key + ' · ' + answered + '/' + total;
      strip.appendChild(chip);
    });
  }

  // ── Renderers ──────────────────────────────────────────────────
  // Generic part-type labels. The per-mock topic (Schnauzer dogs /
  // Dinosaurs / Rhinos / Burglars / etc.) is appended dynamically by
  // getPartName() from whichever title field the data carries.
  var PART_NAMES = {
    '1':  'Match the notices',
    '2':  'Sentence gap-fill',
    '3a': 'Conversation replies',
    '3b': 'Conversation matching',
    '4':  'Reading passage',
    '5':  'Cloze passage',
    '6':  'Vocabulary',
    '7':  'Open cloze',
    '8':  'Information transfer',
    '9':  'Writing'
  };

  function getPartName(part) {
    var key = part.partNumber + (part.partLetter || '');
    var base = PART_NAMES[key] || ('Part ' + key);
    // Only Part 5 gets the per-mock topic suffix appended — it's the
    // cloze passage and the topic varies per test (Schnauzer dogs /
    // Dinosaurs / Rhinos / Madame Tussaud's). Other parts keep the
    // generic label so they don't echo the heading repeated below.
    if (key === '5' && part.passageTitle) {
      var clean = String(part.passageTitle).replace(/\s+/g, ' ').trim();
      if (clean) return base + ' · ' + clean;
    }
    return base;
  }

  function renderPartHeader(part) {
    var name = getPartName(part);
    var instrHtml = (part.instruction || []).map(function (l) { return '<p>' + escapeHtml(l) + '</p>'; }).join('');
    var n = (part.items || []).length;
    return ''
      + '<div class="part-head">'
      + '  <div class="part-num">' + part.partNumber + '</div>'
      + '  <div style="flex:1;min-width:0">'
      + '    <h2 class="part-name">' + escapeHtml(name) + '</h2>'
      + '    <div class="part-meta-row">' + escapeHtml(part.questionsLabel || '') + ' <span class="dot">•</span> ' + n + ' questions</div>'
      + '  </div>'
      + '</div>'
      + '<div class="part-instr">' + instrHtml + '</div>';
  }

  function renderExampleSimple(prompt, answer, image, options) {
    var body = image
      ? '<div class="ex-img"><img src="' + image + '" alt="Example notice"></div>'
      : '<div style="margin-top:4px"><b>0</b> ' + escapeHtml(prompt) + '</div>';
    var optsHtml = '';
    if (options && options.length) {
      optsHtml = '<div class="ex-opts">';
      options.forEach(function (o) {
        var on = (o.letter === answer) ? ' is-correct' : '';
        optsHtml += '<div class="ex-opt' + on + '"><span class="ex-opt-letter">' + escapeHtml(o.letter) + '</span><span class="ex-opt-text">' + escapeHtml(o.text) + '</span></div>';
      });
      optsHtml += '</div>';
    }
    return '<div class="example-card example-card--wide">'
      + '<div class="ex-left"><div class="ex-label">Example</div>' + body + '</div>'
      + '<div class="ex-right">' + optsHtml
      + '<div class="ex-ans-row"><div class="ex-label">Answer</div><span class="ex-answer-pill">' + escapeHtml(answer) + '</span></div>'
      + '</div>'
      + '</div>';
  }

  // ─── PART 1: short signs/notices, 5 questions, MCQ A/B/C ─────────
  function renderPart1(part) {
    var html = renderPartHeader(part);
    html += renderExampleSimple(part.example.prompt, part.example.answer, part.example.image, part.example.options);
    html += '<div class="pet-p1-list">';
    part.items.forEach(function (item) {
      html += '<div class="pet-p1-row" data-qslot="' + item.id + '">';
      html += '<div class="q-num">' + item.id + '</div>';
      if (item.image) {
        html += '<div class="pet-notice-img"><img src="' + item.image + '" alt="Question ' + item.id + ' notice" loading="lazy"></div>';
      } else {
        var styleClass = item.style ? 'pet-notice pet-notice-' + item.style : 'pet-notice';
        html += '<div class="' + styleClass + '">';
        if (item.noticeTitle) html += '<div class="pet-notice-title">' + escapeHtml(item.noticeTitle) + '</div>';
        html += '<div class="pet-notice-body">' + escapeHtml(item.noticeText).replace(/\n/g, '<br>') + '</div>';
        if (item.noticeSig) html += '<div class="pet-notice-sig">' + escapeHtml(item.noticeSig) + '</div>';
        html += '</div>';
      }
      html += '<div class="pet-p1-q">';
      html += '<div class="pet-p1-stem">' + escapeHtml(item.prompt) + '</div>';
      html += '<div class="pet-mcq-list">';
      item.options.forEach(function (o) {
        html += '<button class="mcq-opt" data-letter="' + o.letter + '" onclick="pickMcq(' + item.id + ',\'' + o.letter + '\',this)">';
        html += '<span class="mcq-letter">' + o.letter + '</span><span class="mcq-text">' + escapeHtml(o.text) + '</span>';
        html += '</button>';
      });
      html += '</div></div>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  // ─── PART 2: 5 people → 8 texts (A-H) matching ────────────────────
  function renderPart2(part) {
    var html = renderPartHeader(part);
    var letters = part.texts.map(function (t) { return t.letter; });
    html += '<div class="pet-p2-grid">';
    // Left: people
    html += '<div class="pet-p2-people"><div class="pet-section-head">People</div>';
    part.items.forEach(function (item) {
      html += '<div class="pet-p2-person" data-qslot="' + item.id + '">';
      html += '<div class="q-num">' + item.id + '</div>';
      if (item.image) {
        html += '<div class="pet-person-img"><img src="' + item.image + '" alt="' + escapeHtml(item.name || ('Person ' + item.id)) + '" loading="lazy"></div>';
      }
      html += '<div class="pet-person-body">';
      html += '<div class="pet-person-name">' + escapeHtml(item.name) + '</div>';
      html += '<div class="pet-person-desc">' + escapeHtml(item.description) + '</div>';
      html += '<div class="pet-p2-letters">';
      letters.forEach(function (l) {
        html += '<button class="opt-pill" data-letter="' + l + '" onclick="pickPill(' + item.id + ',\'' + l + '\',this)">' + l + '</button>';
      });
      html += '</div></div></div>';
    });
    html += '</div>';
    // Right: texts
    html += '<div class="pet-p2-texts"><div class="pet-section-head">' + escapeHtml(part.textsTitle || 'Texts') + '</div>';
    part.texts.forEach(function (t) {
      html += '<div class="pet-text-card">';
      html += '<div class="pet-text-letter">' + t.letter + '</div>';
      html += '<div class="pet-text-body">';
      if (t.title) html += '<strong>' + escapeHtml(t.title) + '</strong> ';
      html += escapeHtml(t.body);
      html += '</div></div>';
    });
    html += '</div></div>';
    return html;
  }

  // ─── PART 3: 10 True/False statements about a long passage ────────
  function renderPart3(part) {
    var html = renderPartHeader(part);
    if (part.passageImage) {
      html += '<div class="pet-passage-img"><img src="' + part.passageImage + '" alt="' + escapeHtml(part.passageTitle || 'Reading passage') + '" loading="lazy"></div>';
    } else {
      html += '<div class="pet-passage">';
      if (part.passageTitle) html += '<h3 class="pet-passage-title">' + escapeHtml(part.passageTitle) + '</h3>';
      if (part.passageSubtitle) html += '<div class="pet-passage-sub">' + escapeHtml(part.passageSubtitle) + '</div>';
      part.passage.split(/\n\n+/).forEach(function (para) {
        html += '<p>' + escapeHtml(para).replace(/\n/g, '<br>') + '</p>';
      });
      html += '</div>';
    }
    html += '<div class="pet-tf-list">';
    part.items.forEach(function (item) {
      html += '<div class="pet-tf-row" data-qslot="' + item.id + '">';
