      html += '<div class="q-num">' + item.id + '</div>';
      html += '<div class="pet-tf-stem">' + escapeHtml(item.statement) + '</div>';
      html += '<div class="pet-tf-buttons">';
      ['A','B'].forEach(function (l) {
        var label = l === 'A' ? 'A · Correct' : 'B · Incorrect';
        html += '<button class="opt-pill pet-tf-btn" data-letter="' + l + '" onclick="pickPill(' + item.id + ',\'' + l + '\',this)">' + label + '</button>';
      });
      html += '</div></div>';
    });
    html += '</div>';
    return html;
  }

  // ─── PART 4: long passage + 5 MCQ A/B/C/D ─────────────────────────
  function renderPart4(part) {
    var html = renderPartHeader(part);
    html += '<div class="pet-passage">';
    if (part.passageTitle) html += '<h3 class="pet-passage-title">' + escapeHtml(part.passageTitle) + '</h3>';
    if (part.passageSubtitle) html += '<div class="pet-passage-sub">' + escapeHtml(part.passageSubtitle) + '</div>';
    part.passage.split(/\n\n+/).forEach(function (para) {
      html += '<p>' + escapeHtml(para).replace(/\n/g, '<br>') + '</p>';
    });
    html += '</div>';
    html += '<div class="pet-mcq-block">';
    part.items.forEach(function (item) {
      html += '<div class="pet-mcq-row" data-qslot="' + item.id + '">';
      html += '<div class="pet-mcq-stem"><span class="q-num inline">' + item.id + '</span>' + escapeHtml(item.prompt) + '</div>';
      html += '<div class="pet-mcq-list">';
      item.options.forEach(function (o) {
        html += '<button class="mcq-opt" data-letter="' + o.letter + '" onclick="pickMcq(' + item.id + ',\'' + o.letter + '\',this)">';
        html += '<span class="mcq-letter">' + o.letter + '</span><span class="mcq-text">' + escapeHtml(o.text) + '</span>';
        html += '</button>';
      });
      html += '</div></div>';
    });
    html += '</div>';
    return html;
  }

  // ─── PART 5: short text with inline-dropdown gaps (A/B/C/D per gap) ───
  function renderPart5(part) {
    var html = renderPartHeader(part);
    html += renderExampleSimple(part.example.prompt, part.example.answer);
    // Build id → options map for inline dropdown rendering.
    var optsMap = {};
    part.items.forEach(function (it) { optsMap[it.id] = it.options; });

    html += '<div class="pet-passage pet-cloze-passage">';
    if (part.passageTitle) html += '<h3 class="pet-passage-title">' + escapeHtml(part.passageTitle) + '</h3>';
    if (part.passageSubtitle) html += '<div class="pet-passage-sub">' + escapeHtml(part.passageSubtitle) + '</div>';

    function gapHtml(n) {
      var id = parseInt(n, 10);
      var opts = optsMap[id] || [];
      // Worked example (Q0): show the answer letter inline, non-interactive.
      if (!opts.length && id === 0 && part.example && part.example.answer) {
        return '<span class="pet-cloze-wrap"><span class="pet-cloze-btn is-correct" style="cursor:default"><span class="pet-cloze-num">(0) ' + escapeHtml(part.example.answer) + '</span></span></span>';
      }
      var s = '<span class="pet-cloze-wrap" data-qslot="' + id + '">';
      s += '<button type="button" class="pet-cloze-btn" id="cloze-btn-' + id + '" onclick="toggleCloze(' + id + ', event)">';
      s += '<span class="pet-cloze-num">(' + id + ')</span>';
      s += '<span class="pet-cloze-arrow">▾</span></button>';
      // Popover container must be a <span> too — HTML5 forbids block-level <div> inside <span>,
      // and the browser auto-ejects the popover out of the wrap when that happens.
      s += '<span class="pet-cloze-pop" id="cloze-pop-' + id + '" hidden>';
      opts.forEach(function (o) {
        var safeText = String(o.text || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        s += '<button type="button" class="pet-cloze-opt" data-letter="' + o.letter + '" onclick="pickCloze(' + id + ',\'' + o.letter + '\',\'' + safeText + '\',this)">';
        s += '<span class="pet-cloze-opt-letter">' + o.letter + '</span><span class="pet-cloze-opt-text">' + escapeHtml(o.text) + '</span>';
        s += '</button>';
      });
      s += '</span></span>';
      return s;
    }

    var passage = part.passage.split(/\n\n+/).map(function (para) {
      var html2 = escapeHtml(para).replace(/\n/g, '<br>');
      html2 = html2.replace(/\((\d+)\)\s*_+/g, function (_, n) { return gapHtml(n); });
      html2 = html2.replace(/\{\{(\d+)\}\}/g, function (_, n) { return gapHtml(n); });
      return '<p>' + html2 + '</p>';
    }).join('');
    html += passage + '</div>';
    return html;
  }

  function toggleCloze(id, ev) {
    if (ev) ev.stopPropagation();
    if (document.body.classList.contains('submitted')) return;
    document.querySelectorAll('.pet-cloze-pop').forEach(function (p) {
      if (p.id !== 'cloze-pop-' + id) p.hidden = true;
    });
    var pop = document.getElementById('cloze-pop-' + id);
    if (pop) pop.hidden = !pop.hidden;
  }
  function pickCloze(id, letter, text, el) {
    setAns(id, letter);
    var pop = document.getElementById('cloze-pop-' + id);
    if (pop) {
      pop.querySelectorAll('.pet-cloze-opt').forEach(function (o) { o.classList.remove('picked'); });
      pop.hidden = true;
    }
    el.classList.add('picked');
    var btn = document.getElementById('cloze-btn-' + id);
    if (btn) {
      btn.classList.add('picked');
      var num = btn.querySelector('.pet-cloze-num');
      if (num) num.textContent = letter + ' · ' + text;
    }
  }
  document.addEventListener('click', function (e) {
    if (e.target.closest('.pet-cloze-wrap')) return;
    document.querySelectorAll('.pet-cloze-pop').forEach(function (p) { p.hidden = true; });
  });

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function escapeJs(s) {
    return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  function build() {
    var data = window.PET_R_TEST;
    if (!data) {
      document.getElementById('partsRoot').innerHTML = '<div style="padding:40px;text-align:center;color:var(--rose-500);background:#fff;border-radius:12px">Failed to load the test data.</div>';
      return;
    }
    var renderers = {
      'sign-mcq':            renderPart1,
      'match-people-texts':  renderPart2,
      'true-false':          renderPart3,
      'passage-mcq':         renderPart4,
      'passage-cloze':       renderPart5
    };
    var rootHtml = '';
    data.parts.forEach(function (p, idx) {
      var key = p.partNumber + (p.partLetter || '');
      var fn = renderers[p.type];
      rootHtml += '<div class="part-card" id="part-' + key + '" data-pn="' + key + '" style="animation-delay:' + (idx * 50) + 'ms">' + (fn ? fn(p) : ('<em>Unknown type: ' + p.type + '</em>')) + '</div>';
    });
    document.getElementById('partsRoot').innerHTML = rootHtml;
    refreshNavStrip();
  }

  // ── Timer ───────────────────────────────────────────────────────
  var totalSeconds = (window.PET_R_TEST && window.PET_R_TEST.testInfo.totalTime || 50) * 60;
  var endAt = Date.now() + totalSeconds * 1000;
  function fmt(s) {
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }
  function tickTimer() {
    var left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    var el = document.getElementById('timer');
    el.textContent = fmt(left);
    el.classList.toggle('warn', left <= 600 && left > 60);
    el.classList.toggle('crit', left <= 60);
    if (left === 0) submitTest();
  }
  setInterval(tickTimer, 1000);

  // ── Submit + grade ──────────────────────────────────────────────
  function submitTest() {
    var data = window.PET_R_TEST;
    if (!data) return;
    var report = { perPart: [], totalScore: 0, totalAuto: 0, freeText: [] };
    data.parts.forEach(function (p) {
      var key = p.partNumber + (p.partLetter || '');
      var partRow = { partNumber: key, type: p.type, score: 0, max: 0 };
      var auto = isAutoGradable(p.type);
      (p.items || []).forEach(function (item) {
        if (auto) {
          partRow.max += 1;
          var given = normalize(getAns(item.id));
          var expected = normalize(item.answer);
          if (given && given === expected) partRow.score += 1;
        } else {
          report.freeText.push({ id: item.id, partNumber: partRow.partNumber, expected: item.answer || '', given: getAns(item.id), type: p.type });
        }
      });
      report.perPart.push(partRow);
      report.totalScore += partRow.score;
      report.totalAuto += partRow.max;
    });
    markAnswers();
    showResults(report);
  }

  // Mark every question right/wrong inline + fill the correct answer for
  // empties/wrongs. Same UX as the Listening runner: nothing lives below the
  // score card — all review happens inline up in the test window.
  function markAnswers() {
    var data = window.PET_R_TEST;
    if (!data) return;
    data.parts.forEach(function (p) {
      if (!isAutoGradable(p.type)) return;
      // Part 8 uses `rows` instead of `items` — normalise so both shapes mark.
      (p.items || p.rows || []).forEach(function (item) {
        var given    = normalize(getAns(item.id));
        var expected = normalize(item.answer);
        var ok = given && given === expected;
        var row = document.querySelector('[data-qslot="' + item.id + '"]');
        var pickedBtn  = row && row.querySelector('.opt-pill.picked, .mcq-opt.picked, .p4-opt.picked, .dd-opt.picked, .pet-cloze-opt.picked');
        // Mark the correct option in the popover (filter to a direct option of THIS row, not nested cloze-pop)
        if (row) {
          var directOptions = row.querySelectorAll('.opt-pill[data-letter], .mcq-opt[data-letter], .pet-cloze-opt[data-letter]');
          directOptions.forEach(function (b) {
            if (b.getAttribute('data-letter') === item.answer) b.classList.add('is-correct');
            else if (b === pickedBtn && !ok) b.classList.add('is-wrong');
          });
        }
        // Part 5 inline cloze button: paint green/red/amber + show the answer text inline.
        var clozeBtn = row && row.querySelector('.pet-cloze-btn');
        if (clozeBtn) {
          var numEl = clozeBtn.querySelector('.pet-cloze-num');
          var answerOpt = row.querySelector('.pet-cloze-opt[data-letter="' + item.answer + '"]');
          var answerText = answerOpt ? (answerOpt.querySelector('.pet-cloze-opt-text')?.textContent || '') : '';
          if (!given && item.answer) {
            clozeBtn.classList.add('is-revealed');
            if (numEl) numEl.textContent = item.answer + ' · ' + answerText;
          } else {
            clozeBtn.classList.add(ok ? 'is-correct' : 'is-wrong');
            if (numEl && ok) numEl.textContent = item.answer + ' · ' + answerText;
          }
        }
        var input = (row && (row.querySelector('.vocab-input') || row.querySelector('.inline-input') || row.querySelector('.an-input')))
                    || document.querySelector('.inline-input[data-id="' + item.id + '"], .an-input[data-id="' + item.id + '"]');
        if (input) {
          if (!given && item.answer) {
            // Blank candidate input — auto-fill the verbatim key in an amber
            // "revealed" treatment so it reads as the correct answer, not as
            // a strikethrough mistake.
            input.value = item.answer;
            input.classList.add('is-revealed');
          } else {
            input.classList.add(ok ? 'is-correct' : 'is-wrong');
            if (!ok) {
              var hint = document.createElement('span');
              hint.className = 'ans-key';
              hint.textContent = '✓ ' + (item.answer || '');
              (input.parentElement || row).appendChild(hint);
            }
          }
        }
        var ddBtn = row && row.querySelector('.dd-btn');
        if (ddBtn) {
          ddBtn.classList.add(ok ? 'is-correct' : 'is-wrong');
          // If candidate left it blank, paint the correct letter into the trigger so the
          // dialogue reads naturally — same in-place fill as Listening note rows.
          if (!given && item.answer) {
            var circle = ddBtn.querySelector('.dd-circle');
            if (circle) {
              circle.classList.remove('empty');
              circle.textContent = item.answer;
            }
            var current = ddBtn.querySelector('.dd-current');
            if (current) {
              current.textContent = item.answer;
              current.classList.add('picked');
            }
            var clozeNum = ddBtn.querySelector('.cloze-num');
            if (clozeNum) clozeNum.textContent = item.answer;
          }
        }
      });
    });
    document.body.classList.add('submitted');
  }

  function isAutoGradable(t) {
    return t === 'sign-mcq' || t === 'match-people-texts' || t === 'true-false'
        || t === 'passage-mcq' || t === 'passage-cloze';
  }
  function normalize(s) {
    return String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function showResults(report) {
    var pct = report.totalAuto > 0 ? Math.round((report.totalScore / report.totalAuto) * 100) : 0;
    var verdict = pct >= 70 ? '🎉 Strong pass!' : pct >= 50 ? '👍 Solid attempt' : '📘 Keep practising';
    var html = '<h2>Results</h2>';
    html += '<div class="score-hero">';
    html += '<div class="score-big">' + report.totalScore + '<span style="font-size:24px;color:rgba(255,255,255,0.5)">/' + report.totalAuto + '</span></div>';
    html += '<div class="score-meta"><div style="font-size:18px;font-weight:800;color:#fff;margin-bottom:4px">' + verdict + '</div>';
    html += '<div><strong>' + pct + '%</strong> on auto-graded items</div>';
    html += '</div></div>';
    html += '<div class="score-breakdown">';
    report.perPart.forEach(function (r) {
      if (r.max > 0) {
        html += '<div class="score-row"><span class="pn">Part ' + r.partNumber + '</span><span class="ps">' + r.score + ' / ' + r.max + '</span></div>';
      }
    });
    html += '</div>';
    html += '<div class="results-actions">';
    html += '<button class="btn-back" onclick="window.location.href=\'/pet.html?paper=reading\'">← Back to picker</button>';
    html += '<button class="btn-retry" onclick="window.location.reload()">Try again ↻</button>';
    html += '</div>';
    document.getElementById('resultsCard').innerHTML = html;
    var panel = document.getElementById('resultsModal');
    panel.classList.add('show');
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Reflect active mock number in topbar pills, subtitle, hero card +
  // browser tab. Without this the hero stays "Test 1" even when
  // ?mock=2 is loaded because the markup pre-fills "Test 1".
  (function () {
    var n = parseInt((window._PET_MOCK_NUM || '01'), 10);
    var pills = document.querySelectorAll('.mock-switcher .ms-pill');
    var activePill = null;
    pills.forEach(function (p) {
      var pn = parseInt(p.textContent.trim(), 10);
      if (pn === n) { p.classList.add('active'); activePill = p; }
    });
    // Scroll active pill into view so users on higher-numbered mocks land near their pill.
    if (activePill) {
      try { activePill.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'instant' }); } catch (_e) {}
    }
    var sub = document.getElementById('topbarSub');
    var hero = document.getElementById('heroTestNo');
    var mobTitle = document.getElementById('topbarMobileTitle');
    var info = window.PET_R_TEST && window.PET_R_TEST.testInfo;
    if (sub && info && info.title) sub.textContent = info.title;
    if (hero) hero.textContent = 'Test ' + n;
    if (mobTitle) mobTitle.textContent = 'Test ' + n;
    try {
      var brand = (window.SITE_CONFIG && window.SITE_CONFIG.brandName) || 'Mock Stream';
      document.title = brand + ' · PET Reading · Test ' + n;
    } catch (_e) {}
  })();

  // Boot
  build();
  tickTimer();
</script>

</body>
</html>
