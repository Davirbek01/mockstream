<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get the App</title>
<!-- Per-centre identity (Netlify overwrites this per build: window.__CENTER_ID). -->
<script src="/center-id.js"></script>
<style>
  html,body{height:100%;margin:0;background:#0a0d14;color:#cdd6e4;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .box{max-width:440px}
  h1{font-size:1.3rem;margin:0 0 8px}
  p{color:#93a0b5;margin:0}
  a{color:#3b82f6}
</style>
</head>
<body>
  <div class="wrap"><div class="box">
    <h1 id="t">Opening the app page…</h1>
    <p id="m">If you are not redirected, <a id="lnk" href="/">go back to the site</a>.</p>
  </div></div>
<script>
  // Each centre's "Get the App" page lives in that centre's own release bucket.
  // This standalone page just forwards to the right one based on the build's
  // centre id — it touches nothing else on the site, so clones are unaffected.
  var TARGETS = {
    bek: 'https://storage.googleapis.com/bekzods-desktop-releases/apps.html',
    mock_stream: 'https://storage.googleapis.com/mockstream-desktop-releases/download.html'
  };
  var center = (window.__CENTER_ID || 'mock_stream');
  var target = TARGETS[center];
  if (target) {
    location.replace(target);
  } else {
    document.getElementById('t').textContent = 'Apps are coming soon';
    document.getElementById('m').innerHTML =
      'Our desktop &amp; mobile apps for this centre aren’t available yet. ' +
      '<a href="/">Back to the site</a>.';
  }
</script>
</body>
</html>
