<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Sign in with Telegram</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           display: flex; align-items: center; justify-content: center; min-height: 100vh;
           margin: 0; background: #f8fafc; color: #334155; text-align: center; padding: 24px; }
    .card { max-width: 360px; width: 100%; }
    h1 { font-size: 20px; margin: 0 0 6px; color: #0f172a; }
    p { margin: 0 0 18px; color: #64748b; font-size: 14px; line-height: 1.4; }
    #btn { display: flex; justify-content: center; min-height: 48px; }
    .spin { width: 30px; height: 30px; border: 4px solid #e2e8f0; border-top-color: #229ED9;
            border-radius: 50%; margin: 8px auto; animation: s 1s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    .err { color: #dc2626; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in with Telegram</h1>
    <p id="msg">Loading…</p>
    <div class="spin" id="spin"></div>
    <div id="btn"></div>
  </div>
  <script>
    // Telegram OAuth bridge for the mobile app.
    // Runs the official Login widget HERE (origin = this registered domain, so
    // Telegram's /setdomain check passes), then forwards the signed `user`
    // payload to the app's deep link as #tgAuthResult=<base64url(JSON)>, which
    // the app verifies server-side via verify-telegram-login (same as the web).
    (function () {
      // Bot handle per centre — must match index.html's TELEGRAM_BOT_BY_CENTER.
      var BOT_BY_CENTER = {
        mock_stream: 'mockstream_login_bot',
        bek:         'bekzods_login_bot',
        niners:      'niners_login_bot',
        global:      'global_login_bot',
        muzaffars:   'muzaffars_login_bot',
        achievers:   'acheivers_login_bot',
        record:      'multilevelrecord_sign_bot'
      };
      var params = new URLSearchParams(location.search);
      var to = params.get('to') || '';
      var center = params.get('center') || 'mock_stream';
      var bot = BOT_BY_CENTER[center];
      var msg = document.getElementById('msg');
      var spin = document.getElementById('spin');
      var okScheme = /^(mockstream:\/\/|exp:\/\/|exps:\/\/)/.test(to);

      function fail(text) {
        spin.style.display = 'none';
        msg.className = 'err';
        msg.textContent = text;
      }
      if (!to || !okScheme) { fail('Invalid return link. Please reopen the app and try again.'); return; }
      if (!bot) { fail('Telegram sign-in is not configured for this centre.'); return; }

      // Called by the widget with the signed Telegram user object.
      window.onTelegramAuth = function (user) {
        try {
          var json = JSON.stringify(user);
          var b64 = btoa(unescape(encodeURIComponent(json)))
            .replace(/\+/g, '-').replace(/\//g, '_');
          var sep = to.indexOf('#') === -1 ? '#' : '&';
          var target = to + sep + 'tgAuthResult=' + b64;
          msg.className = '';
          msg.textContent = 'Returning to the app…';
          location.replace(target);
          // Desktop / manual fallback if the deep link doesn't auto-open.
          setTimeout(function () {
            msg.innerHTML = 'If the app did not open, <a href="' +
              target.replace(/"/g, '&quot;') + '">tap here</a>.';
          }, 1500);
        } catch (e) {
          fail('Could not return to the app. Please try again.');
        }
      };

      // Inject the official Telegram Login widget for this bot.
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://telegram.org/js/telegram-widget.js?22';
      s.setAttribute('data-telegram-login', bot);
      s.setAttribute('data-size', 'large');
      s.setAttribute('data-radius', '12');
      s.setAttribute('data-request-access', 'write');
      s.setAttribute('data-onauth', 'onTelegramAuth(user)');
      s.onload = function () { spin.style.display = 'none'; msg.textContent = 'Tap the button to continue:'; };
      s.onerror = function () { fail('Could not load Telegram. Check your connection and try again.'); };
      document.getElementById('btn').appendChild(s);
    })();
  </script>
</body>
</html>
