<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Sign in with Telegram</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           display: flex; align-items: center; justify-content: center; min-height: 100vh;
           margin: 0; background: #f8fafc; color: #334155; text-align: center; padding: 24px; }
    .card { max-width: 360px; width: 100%; }
    h1 { font-size: 20px; margin: 0 0 6px; color: #0f172a; }
    p  { margin: 0 0 18px; color: #64748b; font-size: 14px; line-height: 1.4; }
    .spin { width: 30px; height: 30px; border: 4px solid #e2e8f0; border-top-color: #229ED9;
            border-radius: 50%; margin: 8px auto; animation: s 1s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    .tgbtn { display: inline-flex; align-items: center; gap: 8px; background: #229ED9; color: #fff;
             border: none; border-radius: 12px; padding: 14px 28px; font-size: 16px; font-weight: 700;
             cursor: pointer; }
    .tgbtn:active { background: #1c8dc4; }
    .err { color: #dc2626; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in with Telegram</h1>
    <p id="msg">Loading…</p>
    <div class="spin" id="spin"></div>
    <div id="btn"></div>
  </div>
  <script>
    // Telegram OAuth bridge for the mobile app.
    // Mirrors the web's proven path (index.html): load telegram-widget.js and
    // call Telegram.Login.auth({ bot_id }) with the NUMERIC bot id from
    // get-login-bot-ids — NOT the iframe widget (which needs a username and
    // reports "Bot domain invalid" if the handle is stale). Running here on the
    // bot's registered domain (mock-stream.com) makes the origin check pass.
    // On success, forward the signed `user` payload to the app's deep link as
    // #tgAuthResult=<base64url(JSON)>, verified server-side by verify-telegram-login.
    (function () {
      var SB_URL = 'https://zknyukkbtbcqgvkgjktb.supabase.co';
      var SB_KEY = 'sb_publishable_SRLvRtRHU52FliLxA6gYaQ_I-v5LCk2';
      var params = new URLSearchParams(location.search);
      var to = params.get('to') || '';
      var center = params.get('center') || 'mock_stream';
      // A centre reachable on TWO domains needs two login bots, because Telegram
      // allows exactly one /setdomain per bot. The bot must match the domain this
      // page is being served from, or Telegram rejects the origin and the user
      // sees "Bot domain invalid". The app only knows its centre id, so resolve
      // the bot by HOSTNAME here — exactly as index.html / landing-v3.html do.
      //
      // `center` itself is deliberately left alone: it is not forwarded from this
      // page (only the signed payload is), and the app posts the centre id to
      // verify-telegram-login, which tries EVERY token the centre owns and takes
      // the first that matches. So the account a student signs into is identical
      // whichever domain and bot they came through.
      var TELEGRAM_LOGIN_KEY_BY_HOST = {
        'bekzodturgunovkx.com':     'bek_kx',
        'www.bekzodturgunovkx.com': 'bek_kx',
        'asrolingo.com':            'global_asr',
        'www.asrolingo.com':        'global_asr'
      };
      var loginKey = TELEGRAM_LOGIN_KEY_BY_HOST[location.hostname] || center;
      var msg = document.getElementById('msg');
      var spin = document.getElementById('spin');
      var btnWrap = document.getElementById('btn');
      // Allow Mock Stream + every clone deep-link scheme (mockstream://,
      // mockstreambek://, …) plus Expo dev schemes. Clones return to their OWN app.
      var okScheme = /^(mockstream[a-z]*:\/\/|exp:\/\/|exps:\/\/)/.test(to);

      function fail(text) { spin.style.display = 'none'; btnWrap.innerHTML = ''; msg.className = 'err'; msg.textContent = text; }
      if (!to || !okScheme) { fail('Invalid return link. Please reopen the app and try again.'); return; }

      // Receives the signed Telegram user object and bounces to the app.
      window.onTelegramAuth = function (user) {
        if (!user) { fail('Telegram sign-in was cancelled. You can close this and try again.'); return; }
        try {
          var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(user))))
            .replace(/\+/g, '-').replace(/\//g, '_');
          var sep = to.indexOf('#') === -1 ? '#' : '&';
          var target = to + sep + 'tgAuthResult=' + b64;
          msg.className = ''; msg.textContent = 'Returning to the app…';
          btnWrap.innerHTML = ''; spin.style.display = 'block';
          location.replace(target);
          setTimeout(function () {
            msg.innerHTML = 'If the app did not open, <a href="' + target.replace(/"/g, '&quot;') + '">tap here</a>.';
          }, 1500);
        } catch (e) { fail('Could not return to the app. Please try again.'); }
      };

      // Load the widget script just for the Telegram.Login JS API (no iframe).
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://telegram.org/js/telegram-widget.js?22';
      s.onload = function () {
        fetch(SB_URL + '/functions/v1/get-login-bot-ids', { headers: { apikey: SB_KEY } })
          .then(function (r) { return r.ok ? r.json() : {}; })
          .then(function (ids) {
            // Fall back to the centre's own key so a host that is not in the map
            // (and every single-domain centre) behaves exactly as before.
            var botId = ids[loginKey] || ids[center];
            if (!botId) { fail('Telegram sign-in is not configured for this centre.'); return; }
            spin.style.display = 'none';
            msg.textContent = 'Tap the button to continue:';
            var b = document.createElement('button');
            b.className = 'tgbtn';
            b.type = 'button';
            b.textContent = 'Continue with Telegram';
            b.onclick = function () {
              if (!window.Telegram || !window.Telegram.Login) { fail('Telegram is still loading — tap again in a moment.'); return; }
              window.Telegram.Login.auth({ bot_id: botId, request_access: 'write' }, window.onTelegramAuth);
            };
            btnWrap.appendChild(b);
          })
          .catch(function () { fail('Could not reach the server. Check your connection and try again.'); });
      };
      s.onerror = function () { fail('Could not load Telegram. Check your connection and try again.'); };
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
