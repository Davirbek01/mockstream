<!DOCTYPE html>
<html lang="en">
<head>
  <script src="auto-theme.js"></script>
  <script src="finish-gate.js" defer></script>
  <script src="./ai-proxy-interceptor.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FCE Reading, Use of English &amp; Writing</title>
  <link rel="shortcut icon" id="site-favicon" href="https://i.ibb.co/WN0XY5Lv/logo.png">
  <link rel="stylesheet" href="site-config/responsive-scaling.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Serif+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <script src="center-id.js"></script>
  <script src="site-config/site-config.js"></script>
  <link rel="stylesheet" href="premium-gate.css">
  <script src="premium-gate.js" defer></script>
  <script src="fce-mock-config.js"></script>
  <script>if (window.SITE_CONFIG) { var f = document.getElementById('site-favicon'); if (f) f.href = window.SITE_CONFIG.logoUrl; }</script>
  <style>
    :root { --primary:#3b82f6; --primary-dark:#2563eb; --primary-light:#dbeafe; --bg:#f8fafc; --card:#fff; --border:#e2e8f0; --text:#1e293b; --muted:#64748b; --danger:#dc2626; --warn:#f59e0b; --good:#10b981; --info:#0ea5e9; --signal-blue:#1e40af; --soft-blue:#eff6ff; --soft-yellow:#fffbf2; --yellow-border:#fde68a; --green-soft:#f0fdf4; --green-soft-border:#bbf7d0; }
    [data-theme="dark"], body.dark-mode {
      --primary-light: rgba(59,130,246,.18);
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --signal-blue: #93c5fd;
      --soft-blue: rgba(59,130,246,.12);
      --soft-yellow: rgba(251,191,36,.10);
      --yellow-border: rgba(251,191,36,.30);
      --green-soft: rgba(34,197,94,.10);
      --green-soft-border: rgba(34,197,94,.30);
    }
    [data-theme="dark"] .part-instruction, body.dark-mode .part-instruction { background: var(--soft-blue); border-color: rgba(59,130,246,.35); color: var(--signal-blue); }
    [data-theme="dark"] .text-card, body.dark-mode .text-card { background: var(--soft-yellow); border-color: var(--yellow-border); color: #fde68a; }
    [data-theme="dark"] .text-card .body, body.dark-mode .text-card .body { color: #fde68a; }
    [data-theme="dark"] .passage, body.dark-mode .passage { background: var(--soft-yellow); border-color: var(--yellow-border); color: #fde68a; }
    [data-theme="dark"] .gapped-options-list, body.dark-mode .gapped-options-list { background: var(--soft-yellow); border-color: var(--yellow-border); color: #fde68a; }
    [data-theme="dark"] .source-email-box, body.dark-mode .source-email-box { background: var(--soft-yellow); border-color: var(--yellow-border); color: #fde68a; }
    [data-theme="dark"] .kwt-card, body.dark-mode .kwt-card { background: var(--card); border-color: var(--border); }
    [data-theme="dark"] .kwt-card .original, body.dark-mode .kwt-card .original { color: var(--text); }
    [data-theme="dark"] .kwt-card .keyword, body.dark-mode .kwt-card .keyword { background: var(--soft-blue); color: var(--signal-blue); }
    [data-theme="dark"] .writing-prompt-box, body.dark-mode .writing-prompt-box { background: var(--green-soft); border-color: var(--green-soft-border); color: #bbf7d0; }
    [data-theme="dark"] .writing-area, body.dark-mode .writing-area { background: var(--soft-blue); border-color: rgba(59,130,246,.55); color: var(--text); }
    [data-theme="dark"] .writing-area:focus, body.dark-mode .writing-area:focus { background: var(--green-soft); border-color: var(--primary); }
    [data-theme="dark"] .gap-input, body.dark-mode .gap-input { background: var(--soft-blue); color: var(--signal-blue); border-color: rgba(59,130,246,.55); }
    [data-theme="dark"] .gap-input:focus, body.dark-mode .gap-input:focus { background: var(--green-soft); color: #bbf7d0; border-color: var(--primary); }
    [data-theme="dark"] .opt-check, body.dark-mode .opt-check { background: var(--card); }
    [data-theme="dark"] .part-nav, body.dark-mode .part-nav { background: var(--card); border-color: var(--border); }
    [data-theme="dark"] .part-jump, body.dark-mode .part-jump { background: var(--card); color: #93c5fd; border-color: var(--border); }
    [data-theme="dark"] .part-arrow, body.dark-mode .part-arrow { background: var(--card); border-color: var(--border); color: var(--muted); }
    [data-theme="dark"] .submit-bar, body.dark-mode .submit-bar { background: var(--card); border-color: var(--border); }
    [data-theme="dark"] .results, body.dark-mode .results { background: var(--card); }
    [data-theme="dark"] .score-row, body.dark-mode .score-row { border-color: var(--border); }
    [data-theme="dark"] .topbar, body.dark-mode .topbar { background: var(--card); border-color: var(--border); }
    [data-theme="dark"] body, body.dark-mode { background: var(--bg) !important; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); min-height:100vh; padding:0; color:var(--text); }

    /* Top exam bar — Cambridge navy banner (PET/KET style) */
    .topbar { position:sticky; top:0; z-index:60; background:linear-gradient(135deg,#0b1d3a 0%,#1c5bd8 100%); color:#fff; padding:12px 18px; display:flex; align-items:center; gap:12px; box-shadow:0 4px 14px rgba(11,29,58,0.25); border-bottom:3px solid #d4a72c; }
    .topbar .back { display:inline-flex; align-items:center; gap:6px; color:#fff; text-decoration:none; background:rgba(255,255,255,0.12); padding:8px 14px; border-radius:10px; font-weight:600; font-size:14px; transition:all .15s; }
    .topbar .back:hover { background:rgba(255,255,255,0.22); transform:translateX(-2px); }
    .topbar .brand { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
    .topbar .crest { width:36px; height:36px; border-radius:8px; background:#fff; color:#0b1d3a; font-weight:900; display:inline-flex; align-items:center; justify-content:center; font-size:13px; letter-spacing:0.5px; box-shadow:0 2px 6px rgba(0,0,0,0.15); flex-shrink:0; }
    .topbar .titlewrap { line-height:1.2; min-width:0; }
    .topbar .t1 { font-size:13px; font-weight:700; color:rgba(255,255,255,0.85); letter-spacing:0.4px; }
    .topbar .t2 { font-size:14.5px; font-weight:800; color:#fff; }
    .topbar .spacer { flex:1; }
    .topbar .level { font-size:10px; font-weight:800; letter-spacing:1.4px; background:rgba(255,255,255,0.15); color:#fff; padding:5px 10px; border-radius:8px; }
    .timer { font-size:17px; font-weight:800; color:#0b1d3a; font-variant-numeric:tabular-nums; padding:7px 14px; background:linear-gradient(135deg,#10b981,#059669); color:#fff; border-radius:10px; box-shadow:0 4px 12px rgba(16,185,129,0.32); }
    .timer::before { content:'⏱'; margin-right:6px; }
    .timer.warn { background:linear-gradient(135deg,#d97706,#f59e0b); box-shadow:0 4px 12px rgba(217,119,6,0.45); }
    .timer.danger { background:linear-gradient(135deg,#dc2626,#ef4444); box-shadow:0 4px 12px rgba(220,38,38,0.55); animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.65; } }

    /* Hero card */
    .paper-hero { max-width:980px; margin:18px auto 16px; padding:0 18px; }
    .paper-hero .hero-inner { background:linear-gradient(135deg,#1a3a72 0%,#0b1d3a 100%); color:#fff; border-radius:16px; padding:24px 28px; box-shadow:0 8px 28px rgba(11,29,58,0.18); position:relative; overflow:hidden; }
    .paper-hero .hero-inner::after { content:''; position:absolute; right:-50px; top:-30px; width:160px; height:160px; background:radial-gradient(circle at center, rgba(212,167,44,0.18), transparent 60%); }
    .paper-hero .lvl-chip { display:inline-block; background:rgba(255,255,255,0.16); color:#ffd166; padding:5px 12px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:1.4px; }
    .paper-hero .test-no { font-family:'Playfair Display',serif; font-size:38px; font-weight:900; margin-top:10px; line-height:1.1; }
    .paper-hero .paper-line { font-size:13.5px; opacity:0.85; letter-spacing:0.5px; margin-top:8px; }
    .paper-hero .paper-line strong { color:#ffd166; }
    .paper-hero .hero-source { font-size:12.5px; opacity:0.7; margin-top:8px; font-style:italic; }
    /* Tablet + mobile — drop level badge, compact title */
    @media (max-width:820px) {
      .topbar { padding:10px 12px; gap:10px; }
      .topbar .level { display:none; }
      .topbar .titlewrap .t1 { font-size:11px; letter-spacing:0.3px; }
      .topbar .titlewrap .t2 { font-size:13.5px; }
      .topbar .titlewrap { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .topbar .titlewrap .t1, .topbar .titlewrap .t2 { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .topbar .back { padding:7px 12px; font-size:13px; }
      .timer { font-size:15px; padding:6px 12px; }
    }
    /* Phone — minimal topbar (arrow back, crest, timer) */
    @media (max-width:560px) {
      .topbar { padding:9px 10px; gap:8px; }
      .topbar .back { padding:6px 9px; font-size:0; line-height:1; gap:0; }
      .topbar .back::before { content:'←'; font-size:18px; color:#fff; }
      .topbar .crest { width:32px; height:32px; font-size:11.5px; }
      .topbar .titlewrap .t1 { display:none; }
      .topbar .titlewrap .t2 { font-size:13px; font-weight:700; }
      .timer { font-size:14px; padding:6px 10px; }
      .timer::before { margin-right:4px; }
      .paper-hero { margin:14px auto 12px; padding:0 12px; }
      .paper-hero .hero-inner { padding:18px 20px; }
      .paper-hero .test-no { font-size:28px; }
      .paper-hero .paper-line { font-size:12px; line-height:1.5; }
      .paper-hero .hero-source { font-size:11.5px; }
      .part-header-title { font-size:28px; }
      .part-header-meta { font-size:9.5px; letter-spacing:1.2px; }
      .container { padding:16px 14px 90px; }
      .passage { padding:20px 18px 22px; font-size:15.5px; }
      .passage h4 { font-size:22px; }
      .passage-body { column-count:1; column-rule:none; }
      .options { margin-left:0; }
      .qrow .qstem { font-size:14px; gap:8px; }
      .part-instruction { font-size:14.5px; padding:0 0 14px; }
    }

    /* Part navigator — centered horizontal tile row */
    .part-nav { position:sticky; top:60px; z-index:55; background:rgba(255,255,255,0.96); backdrop-filter:saturate(180%) blur(6px); border-bottom:1px solid #e2e8f0; padding:12px 0; display:block; box-shadow:0 2px 8px rgba(11,29,58,0.04); overflow-x:auto; scrollbar-width:thin; }
    .part-nav::-webkit-scrollbar { height:4px; }
    .part-nav::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:2px; }
    .part-tiles { display:flex; gap:8px; padding:0 18px; width:max-content; min-width:100%; box-sizing:border-box; justify-content:center; }
    .part-tiles::-webkit-scrollbar { height:4px; }
    .part-tiles::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:2px; }
    .part-tile {
      flex-shrink:0; display:flex; flex-direction:column; align-items:flex-start; gap:1px;
      background:#fff; border:1.5px solid #e2e8f0; border-radius:10px;
      padding:9px 16px; cursor:pointer; transition:all .15s ease;
      font-family:'Inter',sans-serif; min-width:130px; text-align:left;
    }
    .part-tile:hover { border-color:#1c5bd8; background:#f0f6ff; transform:translateY(-1px); box-shadow:0 4px 12px rgba(28,91,216,0.12); }
    .part-tile.active { border-color:#1c5bd8; background:linear-gradient(135deg,#1c5bd8 0%,#0b1d3a 100%); color:#fff; box-shadow:0 4px 14px rgba(28,91,216,0.30); }
    .part-tile-label { font-size:10.5px; font-weight:800; letter-spacing:1px; color:#94a3b8; text-transform:uppercase; }
    .part-tile.active .part-tile-label { color:#ffd166; }
    .part-tile-name { font-size:14px; font-weight:700; color:#0b1d3a; }
    .part-tile.active .part-tile-name { color:#fff; }
    .part-tile-qs { font-size:11px; font-weight:600; color:#64748b; }
    .part-tile.active .part-tile-qs { color:rgba(255,255,255,0.75); }
    .part-arrows { display:flex; gap:8px; flex-shrink:0; }
    .part-arrow { width:40px; height:40px; border-radius:50%; border:1.5px solid #e2e8f0; background:#fff; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; transition:.15s; color:#64748b; }
    .part-arrow:not(:disabled):hover { background:#f0f6ff; color:#1c5bd8; border-color:#1c5bd8; transform:translateY(-1px); box-shadow:0 4px 12px rgba(28,91,216,0.12); }
    .part-arrow.next { background:linear-gradient(135deg,#1c5bd8,#0b1d3a); color:#fff; border-color:#1c5bd8; box-shadow:0 4px 12px rgba(28,91,216,0.28); }
    .part-arrow.next:not(:disabled):hover { filter:brightness(1.08); transform:translateY(-1px); }
    .part-arrow:disabled { opacity:.30; cursor:not-allowed; transform:none; box-shadow:none; }

    /* Progress */
    .progress-row { max-width:980px; margin:8px auto 0; padding:0 18px; display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:12.5px; color:var(--muted); font-weight:600; }
    .progress-bar { flex:1; height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--primary),var(--primary-dark)); transition:width .3s; width:0%; }

    /* Container & part — newspaper paper feel */
    .container { max-width:1040px; margin:0 auto; padding:20px 24px 110px; }
    .part-page { background:transparent; margin-bottom:36px; }

    /* Part header — Cambridge chapter divider style */
    .part-header { display:flex; align-items:center; gap:18px; margin:8px 0 22px; }
    .part-header-rule { flex:1; height:1px; background:linear-gradient(90deg, transparent, #cbd5e1, transparent); }
    .part-header-inner { text-align:center; flex-shrink:0; padding:0 8px; }
    .part-header-meta {
      font-family:'Inter',sans-serif; font-size:10.5px; font-weight:800;
      letter-spacing:1.6px; text-transform:uppercase; color:#1c5bd8;
      margin-bottom:6px;
    }
    .part-header-title {
      font-family:'Playfair Display',serif; font-size:36px; font-weight:900;
      color:#0b1d3a; line-height:1; letter-spacing:-0.5px;
    }
    .part-header-qs {
      font-family:'Source Serif Pro','Crimson Pro',Georgia,serif;
      font-size:14px; font-style:italic; color:#64748b; margin-top:8px;
    }

    /* Instruction — paper-like, no card */
    .part-instruction {
      background:transparent; border:none; border-radius:0;
      padding:0 8px 18px; margin:0 0 22px;
      border-bottom:1px solid #e8e2d3;
      font-family:'Source Serif Pro','Crimson Pro',Georgia,serif;
      font-size:16px; color:#334155; line-height:1.7;
      white-space:pre-wrap;
      max-width:780px; margin-left:auto; margin-right:auto;
      text-align:center;
    }
    .part-instruction::before { content:none; }
    .part-instruction strong { color:#0b1d3a; font-weight:700; font-style:normal; }

    /* Passages — paper-grain, two-column body, serif font, drop cap */
    .passage {
      background:#fffefb; border:1px solid #e8e2d3; border-radius:6px;
      padding:32px 40px 36px; margin:0 0 22px;
      box-shadow:0 2px 10px rgba(11,29,58,0.06), inset 0 0 60px rgba(212,167,44,0.02);
      position:relative;
      font-family:'Crimson Pro','Source Serif Pro',Georgia,serif;
      font-size:17px; line-height:1.65; color:#1a2336;
    }
    .passage h4 {
      font-family:'Playfair Display',serif; font-weight:900;
      font-size:30px; line-height:1.15; color:#0b1d3a;
      text-align:center; margin:0 0 6px; letter-spacing:-0.2px;
    }
    .passage .subtitle {
      font-family:'Source Serif Pro','Crimson Pro',Georgia,serif;
      font-size:14.5px; line-height:1.45; color:#475569;
      text-align:center; margin:0 0 4px; font-style:italic;
    }
    .passage .byline {
      font-family:'Source Serif Pro','Crimson Pro',Georgia,serif;
      font-size:13.5px; color:#64748b; text-align:center; margin:0 0 16px;
      font-style:italic;
    }
    .passage hr.title-rule {
      border:none; border-top:1px solid #cbd5e1; margin:0 0 18px;
    }
    .passage-body {
      column-count:2; column-gap:28px; column-rule:1px solid #f1ece0;
      text-align:justify; hyphens:auto;
    }
    .passage-body p { margin:0 0 12px; break-inside:avoid-column; }
    /* Drop cap on first paragraph */
    .passage-body p:first-of-type::first-letter {
      font-family:'Playfair Display',serif; font-weight:900;
      float:left; font-size:54px; line-height:0.95; padding:6px 8px 0 0;
      color:#0b1d3a;
    }
    /* Marginal [line N] annotation */
    .passage .line-marker {
      display:inline-block; font-family:'Source Serif Pro',Georgia,serif;
      font-size:11.5px; color:#94a3b8; font-style:italic;
      padding:0 6px; vertical-align:middle;
    }
    @media (max-width:720px) {
      .passage { padding:22px 22px 26px; }
      .passage h4 { font-size:24px; }
      .passage-body { column-count:1; }
    }

    /* Text-cards (multiple-matching sections) — magazine-clip feel */
    .mm-section-list { display:grid; gap:18px; margin-bottom:24px; }
    .mm-section {
      background:#fffefb; border:1px solid #e8e2d3; border-radius:6px;
      padding:22px 26px; box-shadow:0 1px 4px rgba(11,29,58,0.05);
      font-family:'Crimson Pro',Georgia,serif; font-size:16px; line-height:1.6; color:#1a2336;
    }
    .mm-section .mm-head { display:flex; align-items:center; gap:12px; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #e8e2d3; }
    .mm-section .letter-pill {
      display:inline-flex; align-items:center; justify-content:center;
      width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#1c5bd8,#0b1d3a);
      color:#fff; font-family:'Inter',sans-serif; font-weight:900; font-size:15px;
      box-shadow:0 3px 8px rgba(28,91,216,0.30); flex-shrink:0;
    }
    .mm-section .name {
      font-family:'Playfair Display',serif; font-weight:800;
      font-size:17px; color:#0b1d3a; flex:1;
    }
    .mm-section .body { white-space:pre-wrap; text-align:justify; hyphens:auto; }
    /* Multiple-matching question rows — inline dropdown picker */
    .mm-q-list { display:grid; gap:10px; margin-top:22px; padding-top:18px; border-top:2px solid #e8e2d3; }
    .mm-qrow {
      display:flex; align-items:center; gap:14px; padding:13px 18px;
      background:#fffefb; border:1px solid #e8e2d3; border-radius:8px;
      box-shadow:0 1px 3px rgba(11,29,58,0.04);
      transition:all .12s ease;
    }
    .mm-qrow:hover { border-color:#cdd5e2; box-shadow:0 2px 8px rgba(11,29,58,0.08); }
    .mm-qstem {
      flex:1; font-family:'Crimson Pro',Georgia,serif;
      font-size:16px; line-height:1.5; color:#1a2336;
    }
    .mm-pick { flex-shrink:0; }
    .mm-pick .gt-pop { left:auto; right:0; min-width:360px; }
    @media (max-width:560px) {
      .mm-qrow { flex-wrap:wrap; gap:10px; padding:11px 14px; }
      .mm-qstem { flex:1 1 100%; font-size:15px; order:2; }
      .mm-pick { order:3; align-self:flex-end; }
      .mm-pick .gt-pop { left:0; right:auto; min-width:280px; }
    }
    /* Legacy text-card support (used by other FCE part types — keep simple) */
    .text-list { display:grid; gap:14px; margin-bottom:16px; }
    .text-card { background:#fffefb; border:1px solid #e8e2d3; border-radius:8px; padding:14px 16px; font-family:'Crimson Pro',Georgia,serif; }
    .text-card .label { display:inline-block; background:linear-gradient(135deg,#1c5bd8,#0b1d3a); color:#fff; padding:3px 11px; border-radius:6px; font-family:'Inter',sans-serif; font-weight:800; font-size:11.5px; margin-bottom:8px; letter-spacing:0.5px; }
    .text-card .name { font-family:'Playfair Display',serif; font-weight:800; font-size:16px; margin-bottom:6px; color:#0b1d3a; }
    .text-card .body { font-size:15px; line-height:1.6; color:#1a2336; }

    /* Gapped options panel */
    .gapped-options-list {
      background:#fffefb; border:1px solid #e8e2d3; border-radius:6px;
      padding:20px 24px; margin:0 0 22px; font-family:'Crimson Pro',Georgia,serif;
      font-size:15.5px; line-height:1.6; color:#1a2336;
      box-shadow:0 1px 4px rgba(11,29,58,0.05);
    }
    .gapped-options-list h4 {
      font-family:'Playfair Display',serif; font-weight:800; color:#0b1d3a;
      margin:0 0 14px; font-size:18px; padding-bottom:8px; border-bottom:1px solid #e8e2d3;
    }
    .gapped-options-list .gap-opt {
      display:flex; gap:14px; padding:9px 0; align-items:flex-start;
    }
    .gapped-options-list .gap-opt:not(:last-child) { border-bottom:1px dashed #e8e2d3; }
    .gapped-options-list .gap-opt strong {
      font-family:'Inter',sans-serif; font-weight:800; color:#fff;
      background:linear-gradient(135deg,#1c5bd8,#0b1d3a);
      border-radius:6px; padding:3px 10px; min-width:30px; text-align:center;
      flex-shrink:0; font-size:13px;
    }

    /* Questions — Cambridge numbered MCQ */
    .qrow { padding:18px 0; border-bottom:1px solid #e2e8f0; }
    .qrow:last-child { border-bottom:none; }
    .qrow .qstem {
      font-family:'Inter',sans-serif; font-size:15px; font-weight:600;
      margin-bottom:12px; color:#0f172a; line-height:1.55;
      display:flex; align-items:flex-start; gap:12px;
    }
    .qnum-pill {
      display:inline-flex; align-items:center; justify-content:center;
      min-width:30px; height:30px; background:linear-gradient(135deg,#1c5bd8,#0b1d3a);
      color:#fff; font-family:'Inter',sans-serif; font-weight:900; padding:0 10px;
      border-radius:8px; font-size:13.5px; flex-shrink:0;
      box-shadow:0 2px 6px rgba(28,91,216,0.28);
    }

    /* Options — Cambridge A/B/C/D card style */
    .options { display:flex; flex-direction:column; gap:8px; margin-left:42px; }
    .opt {
      display:flex; align-items:flex-start; gap:14px; padding:12px 16px;
      border:1.5px solid #e2e8f0; border-radius:8px; cursor:pointer; transition:all .15s;
      font-family:'Inter',sans-serif; font-size:14.5px; line-height:1.5;
      background:#fff;
    }
    .opt:hover { border-color:#1c5bd8; background:#f0f6ff; transform:translateY(-1px); box-shadow:0 4px 12px rgba(28,91,216,0.10); }
    .opt.selected { border-color:#1c5bd8; background:#e0ecff; box-shadow:0 4px 12px rgba(28,91,216,0.18); }
    .opt-check {
      width:22px; height:22px; border:2px solid #cbd5e1; border-radius:50%;
      flex-shrink:0; margin-top:1px; transition:.15s; position:relative; background:#fff;
    }
    .opt:hover .opt-check { border-color:#1c5bd8; }
    .opt.selected .opt-check { background:#1c5bd8; border-color:#1c5bd8; }
    .opt.selected .opt-check::after {
      content:""; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      width:8px; height:8px; background:#fff; border-radius:50%;
    }
    .opt input[type=radio] { display:none; }
    .opt-letter {
      font-family:'Playfair Display',serif; font-weight:900;
      color:#0b1d3a; min-width:20px; font-size:17px;
    }
    .opt.selected .opt-letter { color:#1c5bd8; }
    .opt-text { flex:1; color:#1a2336; }
    .gap-pill {
      display:inline-block; min-width:36px; text-align:center;
      background:linear-gradient(135deg,#1c5bd8,#0b1d3a); color:#fff;
      font-family:'Inter',sans-serif; font-weight:900;
      padding:2px 12px; border-radius:6px; font-size:13px;
      box-shadow:0 2px 6px rgba(28,91,216,0.25);
      vertical-align:baseline;
    }
    /* Gapped-text inline dropdown picker */
    .gt-wrap { position:relative; display:inline-block; vertical-align:baseline; margin:0 2px; font-family:'Inter',sans-serif; }
    .gt-btn {
      display:inline-flex; align-items:center; gap:4px; cursor:pointer;
      background:linear-gradient(135deg,#1c5bd8,#0b1d3a); color:#fff;
      border:none; border-radius:6px; padding:3px 10px; font-size:12.5px; font-weight:800;
      box-shadow:0 2px 6px rgba(28,91,216,0.30); font-family:inherit;
      transition:all .12s ease;
    }
    .gt-btn:hover { transform:translateY(-1px); box-shadow:0 4px 10px rgba(28,91,216,0.40); }
    .gt-btn.picked { background:linear-gradient(135deg,#10b981,#059669); box-shadow:0 4px 10px rgba(16,185,129,0.35); }
    .gt-btn .gt-arrow { font-size:10px; opacity:0.9; }
    .gt-pop {
      position:absolute; top:calc(100% + 8px); left:0; z-index:50;
      background:#fff; border:1.5px solid #cbd5e1; border-radius:12px;
      box-shadow:0 16px 40px rgba(11,29,58,0.22);
      padding:8px; min-width:340px; max-width:min(560px,calc(100vw - 40px));
      max-height:50vh; overflow-y:auto;
      display:flex; flex-direction:column; gap:4px;
    }
    .gt-pop[hidden] { display:none; }
    .gt-opt {
      display:flex; gap:10px; align-items:flex-start; text-align:left;
      background:#fff; border:1.5px solid #e2e8f0; border-radius:8px;
      padding:9px 12px; cursor:pointer; transition:all .12s ease;
      font-family:'Crimson Pro',Georgia,serif; font-size:14.5px; line-height:1.45; color:#1a2336;
    }
    .gt-opt:hover { border-color:#1c5bd8; background:#f0f6ff; }
    .gt-opt.picked { border-color:#10b981; background:#ecfdf5; }
    .gt-opt-letter {
      display:inline-flex; align-items:center; justify-content:center;
      flex-shrink:0; min-width:24px; height:24px;
      background:linear-gradient(135deg,#1c5bd8,#0b1d3a); color:#fff;
      font-family:'Inter',sans-serif; font-weight:900; font-size:12.5px;
      border-radius:50%; box-shadow:0 2px 6px rgba(28,91,216,0.25);
    }
    .gt-opt.picked .gt-opt-letter { background:linear-gradient(135deg,#10b981,#059669); box-shadow:0 2px 6px rgba(16,185,129,0.35); }
    .gt-opt-text { flex:1; }
    .gap-input { border:1.5px solid var(--info); border-radius:6px; padding:3px 10px; font-size:14px; min-width:90px; max-width:160px; font-family:inherit; background:#eff6ff; color:#1e40af; font-weight:700; }
    .gap-input:focus { outline:none; border-color:var(--primary); background:#dbeafe; color:var(--primary-dark); }

    /* Word formation — root word hint inline */
    .word-form-root { display:inline-block; background:#1e293b; color:#fde047; padding:2px 8px; border-radius:5px; font-weight:800; font-size:12.5px; letter-spacing:1px; margin-left:4px; vertical-align:middle; }

    /* Key word transformation cards */
    .kwt-card { background:#fff; border:1.5px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
    .kwt-card .qhead { font-size:14px; font-weight:800; color:var(--primary-dark); margin-bottom:10px; }
    .kwt-card .original { font-size:14.5px; line-height:1.6; margin-bottom:8px; padding:10px 12px; background:#f8fafc; border-radius:8px; color:var(--text); }
    .kwt-card .keyword-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:13.5px; color:var(--muted); }
    .kwt-card .keyword { background:#1e293b; color:#fde047; padding:3px 10px; border-radius:5px; font-weight:800; font-size:12.5px; letter-spacing:1px; }
    .kwt-card .gapped { font-size:14.5px; line-height:1.7; color:var(--text); }
    .kwt-card .gap-input { min-width:200px; max-width:340px; }

    /* Multiple matching — sections list */
    .mm-section-list { display:grid; gap:14px; margin-bottom:18px; }
    .mm-section { background:#fffbf2; border:1.5px solid #fde68a; border-radius:12px; padding:14px 16px; }
    .mm-section .mm-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .mm-section .letter-pill { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; border-radius:8px; font-weight:800; font-size:15px; flex-shrink:0; }
    .mm-section .name { font-weight:700; font-size:14px; color:var(--primary-dark); }
    .mm-section .body { font-size:13.5px; line-height:1.6; }

    /* Writing parts */
    .task-type-heading { font-size:16px; font-weight:700; color:var(--text); margin:14px 0 10px; }
    .task-type-heading strong { color:var(--text); }
    .source-email-box { background:#fffbf2; border:1.5px solid #fde68a; border-radius:10px; padding:14px 18px; margin-bottom:14px; font-size:14px; line-height:1.7; white-space:pre-wrap; color:#7c2d12; }
    .writing-prompt-box { position:relative; background:#f0fdf4; border:1.5px solid #bbf7d0; border-radius:10px; padding:16px 36px 22px 20px; margin-bottom:14px; font-size:14.5px; line-height:1.6; color:#14532d; white-space:pre-wrap; }
    .writing-prompt-box .prompt-bullets { margin:8px 0 0 20px; padding-left:0; list-style:disc; }
    .writing-prompt-box .prompt-bullets li { padding:3px 0; }
    .essay-topic-box { background:#fff; border:2px solid var(--primary); border-radius:10px; padding:14px 18px; margin-bottom:12px; font-size:14.5px; line-height:1.6; color:var(--text); font-style:italic; }
    .essay-notes-box { background:#fefce8; border:1.5px solid #fde047; border-radius:10px; padding:14px 18px; margin-bottom:14px; }
    .essay-notes-box .notes-title { font-weight:800; font-size:14px; color:#713f12; margin-bottom:6px; }
    .essay-notes-box .notes-list { list-style:none; padding:0; margin:0; }
    .essay-notes-box .notes-list li { padding:5px 0; font-size:14px; color:#713f12; }
    .essay-notes-box .notes-list li::before { content:"• "; font-weight:800; }
    .prompt-pencil { position:absolute; bottom:6px; right:10px; font-size:14px; color:#15803d; opacity:.55; }
    .writing-subtitle { font-size:14px; color:var(--text); margin-bottom:10px; }
    .writing-subtitle strong { font-weight:700; }
    .writing-area { width:100%; min-height:260px; border:1.5px solid var(--info); border-radius:8px; padding:14px; font-family:inherit; font-size:14.5px; line-height:1.6; resize:vertical; background:#eff6ff; color:var(--text); }
    .writing-area:focus { outline:none; border-color:var(--primary); background:#dbeafe; }
    .word-count { font-size:13px; color:var(--danger); margin-top:6px; text-align:right; font-weight:700; }
    .word-count.ok { color:var(--good); }
    .word-count.short { color:var(--danger); }
    .word-count.over { color:var(--warn); }

    /* Choice tabs (Writing Part 2) */
    .choice-tabs { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
    .choice-tab { padding:8px 14px; border-radius:8px; border:1.5px solid var(--border); background:#fff; cursor:pointer; font-weight:700; font-size:13.5px; color:var(--muted); transition:.15s; }
    .choice-tab:hover { border-color:var(--primary); color:var(--primary-dark); }
    .choice-tab.active { background:var(--primary); border-color:var(--primary); color:#fff; }

    /* Sample answers (Writing) */
    .writing-sample { background:#fffefb; border:1px solid #e8e2d3; border-radius:10px; padding:0; margin-bottom:14px; box-shadow:0 1px 4px rgba(11,29,58,0.04); overflow:hidden; }
    .writing-sample summary { cursor:pointer; padding:11px 16px; font-family:'Inter',sans-serif; font-weight:700; font-size:13.5px; color:#0b1d3a; background:linear-gradient(135deg,#fef9c3,#fde68a); border-bottom:1px solid #e8e2d3; list-style:none; }
    .writing-sample summary::-webkit-details-marker { display:none; }
    .writing-sample summary::before { content:'▸ '; display:inline-block; transition:transform .15s; }
    .writing-sample[open] summary::before { content:'▾ '; }
    .writing-sample-body { padding:16px 20px; font-family:'Crimson Pro',Georgia,serif; font-size:15px; line-height:1.7; color:#1a2336; white-space:pre-wrap; }

    /* Submit bar */
    .submit-bar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border); padding:12px 16px; display:flex; gap:10px; justify-content:center; align-items:center; box-shadow:0 -2px 10px rgba(0,0,0,.06); z-index:50; }
    .btn { padding:10px 22px; border-radius:10px; font-size:14px; font-weight:700; border:none; cursor:pointer; transition:.15s; }
    .btn-primary { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; }
    .btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(59,130,246,.3); }
    .btn-ghost { background:transparent; color:var(--muted); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }

    .results { background:#fff; border:2px solid var(--primary); border-radius:18px; padding:24px; margin:16px 0; }
    .results h3 { color:var(--primary-dark); margin-bottom:10px; }
    .score-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); }
    .score-row:last-child { border-bottom:none; font-weight:800; }
    .loading { text-align:center; padding:60px 20px; color:var(--muted); }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="/fce.html?paper=reading">← Back</a>
    <div class="brand">
      <div class="crest">FC</div>
      <div class="titlewrap">
        <div class="t1">Cambridge English</div>
        <div class="t2">FCE Reading</div>
      </div>
    </div>
    <div class="spacer"></div>
    <span class="level">B2 FIRST</span>
    <div class="timer" id="timer">60:00</div>
  </div>

  <!-- Hero card -->
  <div class="paper-hero">
    <div class="hero-inner">
      <span class="lvl-chip">⭐ B2 · CEFR LEVEL</span>
      <div class="test-no" id="testNo">Test 1</div>
      <div class="paper-line"><strong>PAPER 1</strong> · READING · ~60 minutes · 3 parts · 30 questions</div>
      <div class="hero-source">Verbatim from <em>Cambridge First Certificate in English 1</em></div>
    </div>
  </div>

  <div class="part-nav" id="partNav" style="display:none;">
    <div class="part-tiles" id="partTiles"></div>
  </div>

  <div class="progress-row" id="progressRow" style="display:none;">
    <span id="progressLabel">Question 1 of 52</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span id="progressPart">Reading Part 1 of 7</span>
  </div>

  <div class="container" id="container">
    <div class="loading" id="loading">Loading mock…</div>
  </div>

  <div class="submit-bar" id="submitBar" style="display:none;">
    <button class="btn btn-ghost" onclick="if(confirm('Leave this mock? Your answers will be lost.')) window.location.href='/fce.html?paper=reading';">Cancel</button>
    <button class="btn btn-primary" id="submitBtn" onclick="submitMock()">Submit</button>
  </div>

  <script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var mock = (params.get('mock') || '01').replace(/[^0-9]/g, '').padStart(2, '0');

    var script = document.createElement('script');
    script.src = 'questions FCE RW/fce-rw-test-' + mock + '.js';
    script.onload = function () {
      if (!window.FCE_RW_TEST) {
        document.getElementById('loading').textContent = 'Mock data not found.';
        return;
      }
      renderTest(window.FCE_RW_TEST);
      startTimer((window.FCE_RW_TEST.testInfo && window.FCE_RW_TEST.testInfo.totalTime) || 155);
    };
    script.onerror = function () {
      document.getElementById('loading').innerHTML =
        '<div style="background:#fff;padding:32px;border-radius:18px;border:2px dashed #e2e8f0;">' +
        '<div style="font-size:42px">📚</div>' +
        '<h3 style="color:#2563eb;margin:8px 0">Mock not available yet</h3>' +
        '<p style="color:#64748b;margin-bottom:14px">Mock ' + mock + ' has not been authored yet.</p>' +
        '<a href="/fce.html?paper=reading" style="display:inline-block;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;padding:10px 20px;border-radius:10px;text-decoration:none;font-weight:700;">← Back to mocks</a>' +
        '</div>';
    };
    document.head.appendChild(script);
  })();

  // ───── State ─────
  var ANSWERS = {};
  var WRITING = { 8: '', 9: '' };
  var WRITING_CHOICE = { 9: 'article' };
  var SCORE_BY_PART = {};
  var ALL_PART_PAGES = [];
  var PART_META = [];
  var CURRENT_IDX = 0;
  var TOTAL_QUESTIONS = 30;
  var READING_PART_COUNT = 3;
  var WRITING_PART_COUNT = 2;

  // ───── Renderer ─────
  function renderTest(test) {
    var c = document.getElementById('container');
    document.getElementById('loading').style.display = 'none';
    document.getElementById('submitBar').style.display = '';
    document.getElementById('partNav').style.display = '';
    document.getElementById('progressRow').style.display = '';

    TOTAL_QUESTIONS = test.testInfo.totalQuestions || 30;
    READING_PART_COUNT = (test.reading && test.reading.parts) ? test.reading.parts.length : 3;
    WRITING_PART_COUNT = (test.writing && test.writing.parts) ? test.writing.parts.length : 2;

    test.reading.parts.forEach(function (p) {
      var m = meta(p, false);
      var page = document.createElement('div');
      page.className = 'part-page';
      page.innerHTML = partHeader(m.displayNumber, m.qStart, m.qEnd, false) + renderReadingPart(p);
      c.appendChild(page);
      ALL_PART_PAGES.push(page);
      PART_META.push(m);
    });
    test.writing.parts.forEach(function (p) {
      var m = meta(p, true);
      var page = document.createElement('div');
      page.className = 'part-page';
      page.innerHTML = partHeader(m.displayNumber, m.qStart, m.qEnd, true) + renderWritingPart(p);
      c.appendChild(page);
      ALL_PART_PAGES.push(page);
      PART_META.push(m);
    });

    populatePartJump();
    wireOptionClicks();
    wireGapInputs();
    wireWritingAreas();
    wireChoiceTabs();
    wireNav();
    showPart(0);
  }

  function meta(p, isWriting) {
    if (p.type === 'cloze-mcq')                 return { partNumber: p.partNumber, displayNumber: p.partNumber, isWriting: false, qStart: p.gaps[0].id,      qEnd: p.gaps[p.gaps.length-1].id };
    if (p.type === 'cloze-open')                return { partNumber: p.partNumber, displayNumber: p.partNumber, isWriting: false, qStart: p.gaps[0].id,      qEnd: p.gaps[p.gaps.length-1].id };
    if (p.type === 'word-formation')            return { partNumber: p.partNumber, displayNumber: p.partNumber, isWriting: false, qStart: p.gaps[0].id,      qEnd: p.gaps[p.gaps.length-1].id };
    if (p.type === 'key-word-transformation')   return { partNumber: p.partNumber, displayNumber: p.partNumber, isWriting: false, qStart: p.items[0].id,     qEnd: p.items[p.items.length-1].id };
    if (p.type === 'long-text-mcq')             return { partNumber: p.partNumber, displayNumber: p.partNumber, isWriting: false, qStart: p.questions[0].id, qEnd: p.questions[p.questions.length-1].id };
    if (p.type === 'gapped-text')               return { partNumber: p.partNumber, displayNumber: p.partNumber, isWriting: false, qStart: p.gaps[0].id,      qEnd: p.gaps[p.gaps.length-1].id };
    if (p.type === 'multiple-matching')         return { partNumber: p.partNumber, displayNumber: p.partNumber, isWriting: false, qStart: p.questions[0].id, qEnd: p.questions[p.questions.length-1].id };
    if (p.type === 'essay')                     return { partNumber: p.partNumber, displayNumber: p.writingPartNumber || 1, isWriting: true,  qStart: 1, qEnd: 1 };
    if (p.type === 'choice-of-three')           return { partNumber: p.partNumber, displayNumber: p.writingPartNumber || 2, isWriting: true,  qStart: 2, qEnd: 5 };
    return { partNumber: p.partNumber, displayNumber: p.partNumber, isWriting: isWriting, qStart: 0, qEnd: 0 };
  }

  function populatePartJump() {
    var box = document.getElementById('partTiles');
    PART_META.forEach(function (m, idx) {
      var tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'part-tile';
      tile.dataset.idx = idx;
      var qPrefix = m.isWriting ? (m.qStart === m.qEnd ? 'Task ' : 'Q') : 'Q';
      var qLabel = qPrefix + m.qStart + (m.qStart !== m.qEnd ? '–' + m.qEnd : '');
      tile.innerHTML =
        '<span class="part-tile-label">' + (m.isWriting ? 'Writing' : 'Reading') + '</span>' +
        '<span class="part-tile-name">Part ' + m.displayNumber + '</span>' +
        '<span class="part-tile-qs">' + qLabel + '</span>';
      tile.addEventListener('click', function () { showPart(idx); });
      box.appendChild(tile);
    });
  }

  function wireNav() {
    // Part navigation is via tile clicks (populatePartJump); prev/next buttons removed.
  }

  function showPart(idx) {
    CURRENT_IDX = idx;
    ALL_PART_PAGES.forEach(function (p, i) { p.style.display = i === idx ? '' : 'none'; });
    var m = PART_META[idx];
    document.querySelectorAll('#partTiles .part-tile').forEach(function (t, i) {
      t.classList.toggle('active', i === idx);
      if (i === idx) t.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    });
    document.getElementById('progressLabel').textContent = m.qStart === m.qEnd ? 'Question ' + m.qStart : 'Questions ' + m.qStart + '–' + m.qEnd;
    var ofN = m.isWriting ? WRITING_PART_COUNT : READING_PART_COUNT;
    document.getElementById('progressPart').textContent = (m.isWriting ? 'Writing Part ' : 'Reading Part ') + m.displayNumber + ' of ' + ofN;
    document.getElementById('progressFill').style.width = ((m.qEnd / TOTAL_QUESTIONS) * 100).toFixed(1) + '%';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function partInstruction(text) {
    return '<div class="part-instruction" data-instruction-text>' + text + '</div>';
  }
  function partHeader(displayNumber, qStart, qEnd, isWriting) {
    var unit = isWriting ? 'Task' : 'Question';
    var qLabel = qStart === qEnd ? unit + ' ' + qStart : (unit === 'Task' ? 'Questions ' : unit + 's ') + qStart + '–' + qEnd;
    var paperLabel = isWriting ? 'Paper 2 · Writing' : 'Paper 1 · Reading';
    return '<div class="part-header">' +
      '<span class="part-header-rule"></span>' +
      '<div class="part-header-inner">' +
        '<div class="part-header-meta">' + paperLabel + '</div>' +
        '<div class="part-header-title">Part ' + displayNumber + '</div>' +
        '<div class="part-header-qs">' + qLabel + '</div>' +
      '</div>' +
      '<span class="part-header-rule"></span>' +
    '</div>';
  }

  // Part 1 — multiple-choice cloze (4 options)
  function renderClozeMcq(p) {
    var h = partInstruction(escapeHtml(p.instruction));
    var rendered = escapeHtml(p.text).replace(/___(\d+)___/g, function (_, n) {
      return '<strong style="color:#2563eb;background:#dbeafe;padding:1px 8px;border-radius:6px">[ ' + p.gaps[parseInt(n)-1].id + ' ]</strong>';
    });
    h += '<div class="passage">' + (p.title ? '<h4>' + escapeHtml(p.title) + '</h4>' : '') + rendered + '</div>';
    p.gaps.forEach(function (g) {
      h += '<div class="qrow">';
      h += '<div class="qstem"><span class="qnum-pill">' + g.id + '</span>Choose the best word:</div>';
      h += renderOptions(g.id, g.options);
      h += '</div>';
    });
    return h;
  }

  // Part 2 — open cloze (1 word per gap)
  function renderClozeOpen(p) {
    var h = partInstruction(escapeHtml(p.instruction));
    var rendered = escapeHtml(p.text).replace(/___(\d+)___/g, function (_, n) {
      var qid = p.gaps[parseInt(n)-1].id;
      return '<input type="text" class="gap-input" data-qid="' + qid + '" data-kind="open" placeholder="' + qid + '" autocomplete="off" />';
    });
    h += '<div class="passage" style="white-space:pre-wrap">' + (p.title ? '<h4>' + escapeHtml(p.title) + '</h4>' : '') + rendered + '</div>';
    return h;
  }

  // Part 3 — word formation
  function renderWordFormation(p) {
    var h = partInstruction(escapeHtml(p.instruction));
    var rendered = escapeHtml(p.text).replace(/___(\d+)___/g, function (_, n) {
      var gap = p.gaps[parseInt(n)-1];
      if (!gap) return '___' + n + '___';
      var input = '<input type="text" class="gap-input" data-qid="' + gap.id + '" data-kind="wordform" placeholder="' + gap.id + '" autocomplete="off" />';
      var hint = '<span class="word-form-root">' + escapeHtml(gap.root || '') + '</span>';
      return input + hint;
    });
    h += '<div class="passage" style="white-space:pre-wrap">' + (p.title ? '<h4>' + escapeHtml(p.title) + '</h4>' : '') + rendered + '</div>';
    return h;
  }

  // Part 4 — key word transformation (6 separate items)
  function renderKeyWordTransformation(p) {
    var h = partInstruction(escapeHtml(p.instruction));
    p.items.forEach(function (it) {
      h += '<div class="kwt-card">';
      h += '<div class="qhead">Question ' + it.id + '</div>';
      h += '<div class="original">' + escapeHtml(it.original) + '</div>';
      h += '<div class="keyword-row">Use this word: <span class="keyword">' + escapeHtml(it.keyWord) + '</span> <span style="color:var(--muted)">(2–5 words including the word given)</span></div>';
      var gappedHtml = escapeHtml(it.gapped).replace(/___/g,
        '<input type="text" class="gap-input" data-qid="' + it.id + '" data-kind="kwt" placeholder="2–5 words" autocomplete="off" />');
      h += '<div class="gapped">' + gappedHtml + '</div>';
      h += '</div>';
    });
    return h;
  }

  // Part 5 — long-text MCQ
  function renderLongTextMcq(p) {
    var h = partInstruction(escapeHtml(p.instruction));
    h += '<div class="passage">';
    if (p.title) h += '<h4>' + escapeHtml(p.title) + '</h4>';
    if (p.subtitle) h += '<div class="subtitle">' + escapeHtml(p.subtitle) + '</div>';
    if (p.byline)  h += '<div class="byline">' + escapeHtml(p.byline) + '</div>';
    h += '<hr class="title-rule">';
    h += '<div class="passage-body">';
    // Split into paragraphs on double-newline; substitute [line N] marker
    var paragraphs = String(p.passage || '').split(/\n\n+/);
    paragraphs.forEach(function (para) {
      var html = escapeHtml(para).replace(/\[line\s+(\d+)\]/g, '<span class="line-marker">line $1</span>');
      h += '<p>' + html + '</p>';
    });
    h += '</div></div>';
    p.questions.forEach(function (q) {
      h += '<div class="qrow">';
      h += '<div class="qstem"><span class="qnum-pill">' + q.id + '</span><span>' + escapeHtml(q.prompt) + '</span></div>';
      h += renderOptions(q.id, q.options);
      h += '</div>';
    });
    return h;
  }

  // Part 6 — gapped text (sentences removed; inline dropdown picker at each gap)
  function renderGappedText(p) {
    var h = partInstruction(escapeHtml(p.instruction));
    h += '<div class="passage">';
    if (p.title) h += '<h4>' + escapeHtml(p.title) + '</h4>';
    if (p.subtitle) h += '<div class="subtitle">' + escapeHtml(p.subtitle) + '</div>';
    if (p.byline)  h += '<div class="byline">' + escapeHtml(p.byline) + '</div>';
    h += '<hr class="title-rule">';
    h += '<div class="passage-body">';
    var paragraphs = String(p.text || '').split(/\n\n+/);
    var gapById = {};
    p.gaps.forEach(function (g) { gapById[g.id] = g; });
    paragraphs.forEach(function (para) {
      var html = escapeHtml(para).replace(/___(\d+)___/g, function (_, n) {
        var gap = gapById[parseInt(n,10)];
        if (!gap) return '___' + n + '___';
        // Inline dropdown button (clickable). Popover content built below.
        var btnHtml = '<span class="gt-wrap">'
          + '<button type="button" class="gt-btn" id="gt-btn-' + gap.id + '" onclick="toggleGappedPop(' + gap.id + ',event)">'
          +   '<span class="gt-num">[ ' + gap.id + ' ]</span>'
          +   '<span class="gt-arrow">▾</span>'
          + '</button>'
          + '<span class="gt-pop" id="gt-pop-' + gap.id + '" hidden>';
        p.options.forEach(function (o) {
          var safe = String(o.text || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
          btnHtml += '<button type="button" class="gt-opt" data-letter="' + o.letter + '" onclick="pickGapped(' + gap.id + ',\'' + o.letter + '\',this)">'
            + '<span class="gt-opt-letter">' + o.letter + '</span>'
            + '<span class="gt-opt-text">' + escapeHtml(o.text) + '</span>'
            + '</button>';
        });
        btnHtml += '</span></span>';
        return btnHtml;
      });
      h += '<p>' + html + '</p>';
    });
    h += '</div></div>';
    // No separate Q rows — answers are recorded by clicking gap pills (pickGapped sets ANSWERS)
    return h;
  }

  // Part 7 — multiple matching (10 questions, 4-6 sections)
  function renderMultipleMatching(p) {
    var h = partInstruction(escapeHtml(p.instruction) + (p.topic ? '\n\n' + escapeHtml(p.topic) : ''));

    h += '<div class="mm-section-list">';
    p.sections.forEach(function (s) {
      h += '<div class="mm-section">';
      h += '<div class="mm-head"><span class="letter-pill">' + s.letter + '</span><span class="name">' + escapeHtml(s.title || '') + '</span></div>';
      h += '<div class="body">' + escapeHtml(s.body) + '</div>';
      h += '</div>';
    });
    h += '</div>';

    // Inline dropdown picker — one button per question, popover lists A–D with full person titles
    h += '<div class="mm-q-list">';
    p.questions.forEach(function (q) {
      h += '<div class="mm-qrow">';
      h += '<span class="qnum-pill">' + q.id + '</span>';
      h += '<span class="mm-qstem">' + escapeHtml(q.prompt) + '</span>';
      h += '<span class="gt-wrap mm-pick">';
      h +=   '<button type="button" class="gt-btn" id="gt-btn-' + q.id + '" onclick="toggleGappedPop(' + q.id + ',event)">';
      h +=     '<span class="gt-num">Pick</span><span class="gt-arrow">▾</span>';
      h +=   '</button>';
      h +=   '<span class="gt-pop" id="gt-pop-' + q.id + '" hidden>';
      p.sections.forEach(function (s) {
        h += '<button type="button" class="gt-opt" data-letter="' + s.letter + '" onclick="pickGapped(' + q.id + ',\'' + s.letter + '\',this)">';
        h +=   '<span class="gt-opt-letter">' + s.letter + '</span>';
        h +=   '<span class="gt-opt-text">' + escapeHtml(s.title || ('Section ' + s.letter)) + '</span>';
        h += '</button>';
      });
      h +=   '</span>';
      h += '</span>';
      h += '</div>';
    });
    h += '</div>';
    return h;
  }

  // Writing Part 1 — compulsory task (letter / essay / email / review etc.)
  function renderEssay(p) {
    var wMin = p.wordMin || 140;
    var wMax = p.wordMax || 190;
    var typeLabel = (p.taskType || 'Essay');
    var typeLower = typeLabel.toLowerCase();

    var h = partInstruction('Write your <strong>' + escapeHtml(typeLower) + '</strong> in <strong>' + wMin + '–' + wMax + ' words</strong>.');
    h += '<div class="task-type-heading">Writing Part 1 — <strong>' + escapeHtml(typeLabel) + '</strong> (compulsory)</div>';
    h += '<div class="writing-subtitle">' + escapeHtml(p.instruction) + '</div>';
    if (p.topic) h += '<div class="essay-topic-box">' + escapeHtml(p.topic) + '</div>';
    if (p.notes && p.notes.length) {
      h += '<div class="essay-notes-box">';
      h += '<div class="notes-title">Write about:</div>';
      h += '<ul class="notes-list">';
      p.notes.forEach(function (n) { h += '<li>' + escapeHtml(n) + '</li>'; });
      h += '</ul>';
      h += '</div>';
    }
    h += '<textarea class="writing-area" data-task="8" placeholder="Write your ' + escapeHtml(typeLower) + ' here..."></textarea>';
    h += '<div class="word-count short" data-for="8" data-min="' + wMin + '" data-max="' + wMax + '">0 / ' + wMin + '–' + wMax + ' words</div>';
    return h;
  }

  // Writing Part 2 — choose 1 of N (120-180 words)
  function renderChoiceOfThree(p) {
    var wMin = p.wordMin || 140;
    var wMax = p.wordMax || 190;
    var choices = p.choices || [];
    var samples = p.samples || [];
    var defaultId = (choices[0] && choices[0].id) || 'article';
    WRITING_CHOICE[9] = defaultId;

    function sampleFor(choiceId) {
      return samples.filter(function (s) { return s.forChoice === choiceId; });
    }

    var h = partInstruction('Choose <strong>ONE</strong> of the tasks below and write <strong>' + wMin + '–' + wMax + ' words</strong>.');
    h += '<div class="task-type-heading">Writing Part 2 — Choose ONE</div>';
    h += '<div class="writing-subtitle">' + escapeHtml(p.instruction) + '</div>';
    h += '<div class="choice-tabs" data-task="9">';
    choices.forEach(function (c, idx) {
      h += '<button type="button" class="choice-tab' + (idx === 0 ? ' active' : '') + '" data-choice="' + escapeHtml(c.id) + '">' +
            escapeHtml(c.heading || (c.taskType + ' option')) + '</button>';
    });
    h += '</div>';
    choices.forEach(function (c, idx) {
      h += '<div class="choice-panel" data-choice="' + escapeHtml(c.id) + '" style="display:' + (idx === 0 ? 'block' : 'none') + '">';
      h += '<div class="writing-prompt-box">' + escapeHtml(c.prompt) + '<span class="prompt-pencil" aria-hidden="true">✏️</span></div>';
      var mySamples = sampleFor(c.id);
      mySamples.forEach(function (s) {
        h += '<details class="writing-sample">';
        h += '<summary>📝 View ' + escapeHtml(s.title || ('Band ' + s.band + ' sample')) + '</summary>';
        h += '<div class="writing-sample-body">' + escapeHtml(s.text) + '</div>';
        h += '</details>';
      });
      h += '</div>';
    });
    h += '<textarea class="writing-area" data-task="9" placeholder="Write your answer here..."></textarea>';
    h += '<div class="word-count short" data-for="9" data-min="' + wMin + '" data-max="' + wMax + '">0 / ' + wMin + '–' + wMax + ' words</div>';
    return h;
  }

  function renderReadingPart(p) {
    switch (p.type) {
      case 'cloze-mcq':                 return renderClozeMcq(p);
      case 'cloze-open':                return renderClozeOpen(p);
      case 'word-formation':            return renderWordFormation(p);
      case 'key-word-transformation':   return renderKeyWordTransformation(p);
      case 'long-text-mcq':             return renderLongTextMcq(p);
      case 'gapped-text':               return renderGappedText(p);
      case 'multiple-matching':         return renderMultipleMatching(p);
      default: return '<em>Unknown part type: ' + escapeHtml(p.type) + '</em>';
    }
  }
  function renderWritingPart(p) {
    switch (p.type) {
      case 'essay':            return renderEssay(p);
      case 'choice-of-three':  return renderChoiceOfThree(p);
      default: return '';
    }
  }

  function renderOptions(qid, options) {
    var h = '<div class="options">';
    options.forEach(function (o) {
      h += '<label class="opt" data-qid="' + qid + '" data-letter="' + o.letter + '">' +
            '<input type="radio" name="q' + qid + '" value="' + o.letter + '"/>' +
            '<span class="opt-check"></span>' +
            '<span class="opt-letter">' + o.letter + '</span>' +
            '<span class="opt-text">' + escapeHtml(o.text) + '</span>' +
           '</label>';
    });
    return h + '</div>';
  }

  // ───── Wiring ─────
  function wireOptionClicks() {
    document.querySelectorAll('.opt').forEach(function (el) {
      el.addEventListener('click', function () {
        var qid = el.dataset.qid;
        ANSWERS[qid] = el.dataset.letter;
        document.querySelectorAll('.opt[data-qid="' + qid + '"]').forEach(function (sib) { sib.classList.remove('selected'); });
        el.classList.add('selected');
        var radio = el.querySelector('input[type=radio]');
        if (radio) radio.checked = true;
      });
    });
  }
  function wireGapInputs() {
    document.querySelectorAll('.gap-input').forEach(function (i) {
      i.addEventListener('input', function () { ANSWERS[i.dataset.qid] = i.value.trim(); });
    });
  }
  // Inline gapped-text dropdown picker
  window.toggleGappedPop = function (id, ev) {
    if (ev) ev.stopPropagation();
    if (document.body.classList.contains('submitted')) return;
    document.querySelectorAll('.gt-pop').forEach(function (p) {
      if (p.id !== 'gt-pop-' + id) p.hidden = true;
    });
    var pop = document.getElementById('gt-pop-' + id);
    if (pop) pop.hidden = !pop.hidden;
  };
  window.pickGapped = function (id, letter, el) {
    ANSWERS[id] = letter;
    var pop = document.getElementById('gt-pop-' + id);
    if (pop) {
      pop.querySelectorAll('.gt-opt').forEach(function (o) { o.classList.remove('picked'); });
      el.classList.add('picked');
      pop.hidden = true;
    }
    var btn = document.getElementById('gt-btn-' + id);
    if (btn) {
      btn.classList.add('picked');
      var num = btn.querySelector('.gt-num');
      if (num) num.textContent = letter + ' · ' + id;
    }
  };
  document.addEventListener('click', function (ev) {
    if (!ev.target.closest('.gt-wrap')) {
      document.querySelectorAll('.gt-pop').forEach(function (p) { p.hidden = true; });
    }
  });
  function wireWritingAreas() {
    document.querySelectorAll('.writing-area').forEach(function (t) {
      var task = t.dataset.task;
      t.addEventListener('input', function () {
        WRITING[task] = t.value;
        var n = (t.value.trim().match(/\S+/g) || []).length;
        var label = document.querySelector('.word-count[data-for="' + task + '"]');
        if (!label) return;
        var min = parseInt(label.dataset.min, 10) || 140;
        var max = parseInt(label.dataset.max, 10) || (min + 50);
        label.textContent = n + ' / ' + min + '–' + max + ' words';
        label.classList.toggle('ok',    n >= min && n <= max);
        label.classList.toggle('short', n < min);
        label.classList.toggle('over',  n > max);
      });
    });
  }
  function wireChoiceTabs() {
    document.querySelectorAll('.choice-tabs').forEach(function (group) {
      var task = group.dataset.task;
      group.querySelectorAll('.choice-tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
          var choice = tab.dataset.choice;
          WRITING_CHOICE[task] = choice;
          group.querySelectorAll('.choice-tab').forEach(function (t) { t.classList.remove('active'); });
          tab.classList.add('active');
          var page = group.closest('.part-page');
          if (!page) return;
          page.querySelectorAll('.choice-panel').forEach(function (panel) {
            panel.style.display = panel.dataset.choice === choice ? 'block' : 'none';
          });
        });
      });
    });
  }

  // ───── Timer ─────
  var TIMER_END = 0, TIMER_INT = null;
  function startTimer(minutes) {
    TIMER_END = Date.now() + minutes * 60 * 1000;
    var el = document.getElementById('timer');
    function tick() {
      var ms = TIMER_END - Date.now();
      if (ms <= 0) { clearInterval(TIMER_INT); el.textContent = '00:00'; el.classList.add('danger'); submitMock(true); return; }
      var s = Math.floor(ms/1000); var m = Math.floor(s/60); s = s % 60;
      el.textContent = (m<10?'0':'')+m + ':' + (s<10?'0':'')+s;
      el.classList.toggle('warn',   ms < 20*60*1000 && ms >= 5*60*1000);
      el.classList.toggle('danger', ms < 5*60*1000);
    }
    tick(); TIMER_INT = setInterval(tick, 1000);
  }

  // ───── Submit ─────
  window.submitMock = function (isAuto) {
    if (!isAuto && !confirm('Submit your answers now? You cannot change them after this.')) return;
    if (TIMER_INT) clearInterval(TIMER_INT);
    var t = window.FCE_RW_TEST;
    var rTotal = 0, rCorrect = 0;
    SCORE_BY_PART = {};

    t.reading.parts.forEach(function (p) {
      var partTotal = 0, partCorrect = 0;
      function check(qid, expected, gotRaw) {
        partTotal++; rTotal++;
        var got = (gotRaw || '').toString().trim().toLowerCase();
        var ok;
        if (Array.isArray(expected)) ok = expected.some(function (a) { return a.toString().toLowerCase() === got; });
        else ok = expected.toString().toLowerCase() === got;
        if (ok) { partCorrect++; rCorrect++; }
      }
      switch (p.type) {
        case 'cloze-mcq':                p.gaps.forEach(function (g) { check(g.id, g.correct, ANSWERS[g.id]); }); break;
        case 'cloze-open':               p.gaps.forEach(function (g) { check(g.id, g.accept, ANSWERS[g.id]); }); break;
        case 'word-formation':           p.gaps.forEach(function (g) { check(g.id, g.accept, ANSWERS[g.id]); }); break;
        case 'key-word-transformation':  p.items.forEach(function (it) { check(it.id, it.accept, ANSWERS[it.id]); }); break;
        case 'long-text-mcq':            p.questions.forEach(function (q) { check(q.id, q.correct, ANSWERS[q.id]); }); break;
        case 'gapped-text':              p.gaps.forEach(function (g) { check(g.id, g.correct, ANSWERS[g.id]); }); break;
        case 'multiple-matching':        p.questions.forEach(function (q) { check(q.id, q.correct, ANSWERS[q.id]); }); break;
      }
      SCORE_BY_PART['Reading Part ' + p.partNumber] = partCorrect + ' / ' + partTotal;
    });

    t.writing.parts.forEach(function (p) {
      if (p.type === 'essay') {
        var n = ((WRITING['8'] || '').trim().match(/\S+/g) || []).length;
        SCORE_BY_PART['Writing Part 1 (Essay)'] = n + ' words (target ' + (p.wordMin || 140) + '–' + (p.wordMax || 190) + ')';
      } else if (p.type === 'choice-of-three') {
        var n2 = ((WRITING['9'] || '').trim().match(/\S+/g) || []).length;
        var choice = WRITING_CHOICE['9'] || 'article';
        SCORE_BY_PART['Writing Part 2 (' + choice.charAt(0).toUpperCase() + choice.slice(1) + ')'] = n2 + ' words (target ' + (p.wordMin || 140) + '–' + (p.wordMax || 190) + ')';
      }
    });

    showResults(rCorrect, rTotal);
    recordAttempt();
  };

  function showResults(rCorrect, rTotal) {
    var html = '<div class="results"><h3>📊 Your Result</h3>';
    Object.keys(SCORE_BY_PART).forEach(function (k) {
      html += '<div class="score-row"><span>' + k + '</span><span>' + SCORE_BY_PART[k] + '</span></div>';
    });
    html += '<div class="score-row"><span>Reading total</span><span>' + rCorrect + ' / ' + rTotal + '</span></div>';
    html += '<div style="margin-top:14px;padding:12px;background:#f8fafc;border-radius:10px;font-size:13px;color:#64748b;line-height:1.55">' +
            'Writing tasks (Parts 1 &amp; 2) will be reviewed by AI scoring for premium users. Your reading score above is auto-graded.' +
            '</div>';
    html += '<div style="display:flex;gap:8px;margin-top:14px"><a href="/fce.html?paper=reading" class="btn btn-primary" style="text-decoration:none;display:inline-block">Back to mocks</a></div>';
    html += '</div>';
    ALL_PART_PAGES.forEach(function (p) { p.style.display = 'none'; });
    document.getElementById('container').insertAdjacentHTML('beforeend', html);
    document.getElementById('submitBar').style.display = 'none';
    document.getElementById('partNav').style.display = 'none';
    document.getElementById('progressRow').style.display = 'none';
    var r = document.querySelector('.results');
    if (r) r.scrollIntoView({ behavior: 'smooth' });
  }

  function recordAttempt() {
    try {
      if (!window.PremiumGate || !window.PremiumGate.recordOpen) return;
      var t = window.FCE_RW_TEST;
      window.PremiumGate.recordOpen({ skill: 'fce_reading_writing', exam_type: 'fce', mock_number: parseInt((t.testInfo.id || '').split('-').pop(), 10) || 1 });
    } catch (e) {}
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  </script>
</body>
</html>
