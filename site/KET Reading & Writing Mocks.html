<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KET Reading & Writing — Mock</title>
  <script src="center-id.js"></script>
  <script src="site-config/site-config.js"></script>
  <script>document.addEventListener('DOMContentLoaded',function(){document.title=((window.SITE_CONFIG&&window.SITE_CONFIG.brandName)||'Mock Stream')+' · KET Reading & Writing';});</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@500;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Cambridge-inspired palette */
      --navy-900: #0b1d3a;
      --navy-800: #11295a;
      --navy-700: #1a3a7e;
      --blue-600: #1c5bd8;
      --blue-500: #2563eb;
      --blue-400: #3b82f6;
      --gold-500: #d4a72c;
      --gold-400: #eab308;
      --amber-200: #fef3c7;
      --rose-500: #e11d48;
      --rose-100: #ffe4e6;
      --emerald-600: #059669;
      --emerald-500: #10b981;
      --emerald-50: #ecfdf5;

      --bg: #f6f8fc;
      --bg-soft: #eef2f9;
      --paper: #ffffff;
      --paper-warm: #fbf9f3;
      --ink: #0b1d3a;
      --ink-2: #334155;
      --muted: #64748b;
      --ring: #e2e8f0;
      --ring-strong: #cbd5e1;
      --shadow-sm: 0 1px 2px rgba(11,29,58,.06), 0 1px 3px rgba(11,29,58,.04);
      --shadow-md: 0 4px 14px rgba(11,29,58,.08), 0 1px 4px rgba(11,29,58,.04);
      --shadow-lg: 0 12px 36px rgba(11,29,58,.14), 0 2px 8px rgba(11,29,58,.06);
      --shadow-pop: 0 18px 48px rgba(11,29,58,.22);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background:
        radial-gradient(1100px 540px at 100% -10%, rgba(28,91,216,0.10), transparent 60%),
        radial-gradient(900px 460px at -10% 0%, rgba(212,167,44,0.10), transparent 60%),
        linear-gradient(180deg, #f7f9fd 0%, var(--bg) 100%);
      background-attachment: fixed;
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ─── Top bar ─────────────────────────────────────────────── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(180deg, var(--navy-900) 0%, var(--navy-800) 100%);
      color: #fff; padding: 12px 22px;
      display: flex; align-items: center; gap: 16px;
      box-shadow: 0 6px 22px rgba(11,29,58,0.25);
    }
    .topbar .back {
      background: rgba(255,255,255,0.10); color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      padding: 8px 14px; border-radius: 10px; font-weight: 700;
      cursor: pointer; transition: all .15s ease;
      font-family: inherit; font-size: 13.5px;
      backdrop-filter: blur(8px);
    }
    .topbar .back:hover { background: rgba(255,255,255,0.18); transform: translateX(-2px); }
    .topbar .brand { display: flex; align-items: center; gap: 12px; }
    .topbar .crest {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
      color: var(--navy-900); display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-family: 'Playfair Display', serif; font-size: 18px;
      box-shadow: 0 4px 14px rgba(212,167,44,0.45);
      letter-spacing: -0.5px;
    }
    .topbar .titlewrap { line-height: 1.15; }
    .topbar .titlewrap .t1 { font-weight: 800; font-size: 14.5px; letter-spacing: 0.2px; }
    .topbar .titlewrap .t2 { font-size: 11.5px; color: rgba(255,255,255,0.7); font-weight: 500; }
    .topbar .spacer { flex: 1; }
    .topbar .timer {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, var(--emerald-600), var(--emerald-500));
      color: #fff; padding: 9px 16px; border-radius: 12px;
      font-weight: 800; font-variant-numeric: tabular-nums;
      box-shadow: 0 6px 18px rgba(5,150,105,0.45);
      font-size: 14.5px; letter-spacing: 0.3px;
    }
    .topbar .timer::before { content: '⏱'; font-size: 14px; }
    .topbar .timer.warn { background: linear-gradient(135deg, #d97706, #f59e0b); box-shadow: 0 6px 18px rgba(217,119,6,0.45); }
    .topbar .timer.crit { background: linear-gradient(135deg, #dc2626, #ef4444); box-shadow: 0 6px 22px rgba(220,38,38,0.55); animation: critPulse 1.1s ease-in-out infinite; }
    @keyframes critPulse { 50% { transform: scale(0.97); } }
    .topbar .submit {
      background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
      color: var(--navy-900); border: 0;
      padding: 9px 20px; border-radius: 12px;
      font-weight: 800; cursor: pointer; font-family: inherit; font-size: 14px;
      box-shadow: 0 6px 18px rgba(212,167,44,0.45);
      transition: all .15s ease;
      letter-spacing: 0.3px;
    }
    .topbar .submit:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(212,167,44,0.55); }

    /* ─── Part progress strip ─────────────────────────────────── */
    .nav-strip {
      position: sticky; top: 64px; z-index: 90;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--ring);
      padding: 10px 22px;
      display: flex; align-items: center; gap: 6px;
      overflow-x: auto; scrollbar-width: thin;
    }
    .nav-strip::-webkit-scrollbar { height: 4px; }
    .nav-strip::-webkit-scrollbar-thumb { background: var(--ring-strong); border-radius: 4px; }
    .nav-chip {
      flex: 0 0 auto;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      background: var(--bg-soft); color: var(--ink-2);
      border: 1px solid transparent;
      font-size: 12px; font-weight: 700; letter-spacing: 0.2px;
      cursor: pointer; transition: all .15s ease;
      text-decoration: none;
    }
    .nav-chip:hover { background: #e0e7ff; color: var(--navy-800); }
    .nav-chip.has-answers { background: var(--emerald-50); color: var(--emerald-600); border-color: rgba(5,150,105,0.3); }
    .nav-chip.complete { background: var(--emerald-500); color: #fff; border-color: var(--emerald-500); }
    .nav-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.55; }

    /* ─── Page wrapper ─────────────────────────────────────── */
    .page { max-width: 920px; margin: 28px auto 100px; padding: 0 22px; }

    /* Paper hero */
    .paper-hero {
      position: relative;
      background: linear-gradient(135deg, var(--navy-900), var(--navy-800) 60%, var(--navy-700));
      color: #fff;
      border-radius: 24px;
      padding: 36px 38px;
      margin-bottom: 26px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .paper-hero::after {
      content: ''; position: absolute; inset: -50% -10% auto auto;
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(212,167,44,0.20), transparent 65%);
      pointer-events: none;
    }
    .paper-hero .lvl-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(212,167,44,0.18); color: var(--gold-400);
      padding: 4px 12px; border-radius: 999px; font-size: 11.5px;
      font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
      border: 1px solid rgba(212,167,44,0.35);
    }
    .paper-hero .test-no {
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 5vw, 52px); font-weight: 900; line-height: 1; letter-spacing: -1px;
      margin: 14px 0 6px;
    }
    .paper-hero .paper-line {
      font-size: 14px; color: rgba(255,255,255,0.75); letter-spacing: 0.4px;
    }
    .paper-hero .paper-line strong { color: #fff; font-weight: 800; letter-spacing: 1.4px; }
    .paper-hero .meta-row {
      display: flex; gap: 22px; margin-top: 22px; padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.10);
      font-size: 13px;
    }
    .paper-hero .meta-row .m { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.85); }
    .paper-hero .meta-row .m b { color: #fff; font-weight: 800; }

    /* ─── Part card ───────────────────────────────────────── */
    .part-card {
      background: var(--paper);
      border-radius: 22px;
      padding: 30px 32px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(11,29,58,0.06);
      position: relative;
      animation: cardFadeIn .55s cubic-bezier(.21,1.1,.4,1) both;
    }
    @keyframes cardFadeIn {
      /* opacity-only — using transform here lingers as a stacking context
         after the animation and clips dropdown popovers that overflow
         into the next part-card. */
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .part-card::before {
      content: ''; position: absolute; left: 0; top: 28px; bottom: 28px;
      width: 4px; border-radius: 4px;
      background: linear-gradient(180deg, var(--blue-500), var(--blue-600));
    }
    .part-card[data-pn="1"]::before { background: linear-gradient(180deg, #2563eb, #1d4ed8); }
    .part-card[data-pn="2"]::before { background: linear-gradient(180deg, #0891b2, #0e7490); }
    .part-card[data-pn="3a"]::before, .part-card[data-pn="3b"]::before { background: linear-gradient(180deg, #7c3aed, #6d28d9); }
    .part-card[data-pn="4"]::before { background: linear-gradient(180deg, #db2777, #be185d); }
    .part-card[data-pn="5"]::before { background: linear-gradient(180deg, #ea580c, #c2410c); }
    .part-card[data-pn="6"]::before { background: linear-gradient(180deg, #16a34a, #15803d); }
    .part-card[data-pn="7"]::before { background: linear-gradient(180deg, #d97706, #b45309); }
    .part-card[data-pn="8"]::before { background: linear-gradient(180deg, #0d9488, #0f766e); }
    .part-card[data-pn="9"]::before { background: linear-gradient(180deg, #be123c, #9f1239); }

    .part-head {
      display: flex; align-items: flex-start; gap: 16px; margin-bottom: 18px;
    }
    .part-num {
      width: 52px; height: 52px; flex-shrink: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 22px; font-family: 'Playfair Display', serif;
      box-shadow: 0 6px 18px rgba(28,91,216,0.35);
    }
    .part-card[data-pn="1"] .part-num { background: linear-gradient(135deg, #2563eb, #1d4ed8); box-shadow: 0 6px 18px rgba(37,99,235,0.35); }
    .part-card[data-pn="2"] .part-num { background: linear-gradient(135deg, #0891b2, #0e7490); box-shadow: 0 6px 18px rgba(8,145,178,0.35); }
    .part-card[data-pn="3a"] .part-num, .part-card[data-pn="3b"] .part-num { background: linear-gradient(135deg, #7c3aed, #6d28d9); box-shadow: 0 6px 18px rgba(124,58,237,0.35); }
    .part-card[data-pn="4"] .part-num { background: linear-gradient(135deg, #db2777, #be185d); box-shadow: 0 6px 18px rgba(219,39,119,0.35); }
    .part-card[data-pn="5"] .part-num { background: linear-gradient(135deg, #ea580c, #c2410c); box-shadow: 0 6px 18px rgba(234,88,12,0.35); }
    .part-card[data-pn="6"] .part-num { background: linear-gradient(135deg, #16a34a, #15803d); box-shadow: 0 6px 18px rgba(22,163,74,0.35); }
    .part-card[data-pn="7"] .part-num { background: linear-gradient(135deg, #d97706, #b45309); box-shadow: 0 6px 18px rgba(217,119,6,0.35); }
    .part-card[data-pn="8"] .part-num { background: linear-gradient(135deg, #0d9488, #0f766e); box-shadow: 0 6px 18px rgba(13,148,136,0.35); }
    .part-card[data-pn="9"] .part-num { background: linear-gradient(135deg, #be123c, #9f1239); box-shadow: 0 6px 18px rgba(190,18,60,0.35); }
    .part-name { font-size: 19px; font-weight: 800; color: var(--ink); margin: 0; line-height: 1.2; }
    .part-meta-row {
      font-size: 12px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px; margin-top: 2px;
    }
    .part-meta-row .dot { margin: 0 6px; color: var(--ring-strong); }

    .part-instr {
      background: var(--bg-soft);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 0 0 22px;
      font-size: 14px; line-height: 1.6; color: var(--ink-2);
      border-left: 3px solid var(--blue-400);
    }
    .part-instr p { margin: 0 0 4px; }
    .part-instr p:last-child { margin: 0; }

    /* Example */
    .example-card {
      background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
      border: 1px solid #bae6fd;
      border-radius: 14px;
      padding: 14px 18px;
      margin: 16px 0;
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      font-size: 14px;
    }
    .example-card.vert { flex-direction: column; align-items: stretch; }
    .ex-label { font-size: 10.5px; font-weight: 900; color: var(--navy-700); letter-spacing: 1.5px; text-transform: uppercase; }
    .ex-answer-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--navy-800); color: #fff;
      padding: 6px 14px; border-radius: 999px;
      font-weight: 900; letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(11,29,58,0.25);
    }

    /* Part 1 — 2-column layout (questions / notices) on desktop */
    .p1-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: start;
    }
    .p1-questions, .p1-notices { min-width: 0; }
    .p1-section-head {
      font-size: 11px; font-weight: 900; letter-spacing: 1.6px; text-transform: uppercase;
      color: var(--navy-700); margin: 0 0 12px;
      padding-bottom: 8px; border-bottom: 2px solid var(--ring);
    }
    @media (max-width: 860px) {
      .p1-grid { grid-template-columns: 1fr; gap: 18px; }
      .p1-notices { order: 1; }
      .p1-questions { order: 2; }
    }

    /* Collapsible notices on mobile. <details> is desktop-always-open;
       mobile becomes tap-to-toggle so the notices don't push the
       questions far below the fold. */
    .notices-collapse { background: transparent; }
    .notices-collapse > summary { cursor: default; list-style: none; outline: none; }
    .notices-collapse > summary::-webkit-details-marker { display: none; }
    .notices-collapse > summary::marker { content: ''; }
    .notices-collapse > summary .collapse-caret { display: none; }
    @media (max-width: 860px) {
      .notices-collapse > summary {
        cursor: pointer;
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 16px;
        background: linear-gradient(135deg, #eff6ff, #dbeafe);
        border-radius: 12px; border: 1px solid #bfdbfe;
        border-bottom: 1px solid #bfdbfe;
        margin-bottom: 0; transition: background .15s ease;
      }
      .notices-collapse > summary:hover { background: linear-gradient(135deg, #dbeafe, #bfdbfe); }
      .notices-collapse > summary .collapse-caret {
        display: inline-block; font-size: 12px; color: var(--navy-700);
        transition: transform .2s ease;
      }
      .notices-collapse[open] > summary { border-radius: 12px 12px 0 0; }
      .notices-collapse[open] > summary .collapse-caret { transform: rotate(180deg); }
      .notices-collapse[open] > .notices-grid {
        padding: 16px 14px;
        border: 1px solid #bfdbfe; border-top: 0;
        border-radius: 0 0 12px 12px;
        background: #f8fbff;
        animation: detailsFade .2s ease;
      }
      @keyframes detailsFade {
        from { opacity: 0; transform: translateY(-2px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    }

    /* Notices grid (Part 1) */
    .notices-grid {
      display: grid; grid-template-columns: 50px 1fr; gap: 10px 12px;
    }
    .notice-letter {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--navy-800), var(--navy-700));
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 16px; font-family: 'Playfair Display', serif;
      align-self: center; justify-self: center;
      box-shadow: 0 4px 12px rgba(11,29,58,0.30);
    }
    .notice-card {
      background: var(--paper);
      border: 2px solid var(--ink);
      padding: 14px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14.5px;
      line-height: 1.4;
      white-space: pre-line;
      min-height: 52px;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      box-shadow: var(--shadow-sm), 0 2px 0 rgba(11,29,58,0.06);
      transition: transform .2s ease;
    }
    .notice-card:hover { transform: translateY(-1px); }
    /* Per-notice flavour — picked by letter */
    .notice-card.flavor-ticket { background: linear-gradient(180deg, #fffbeb, #fef3c7); border-color: #b45309; color: #78350f; }
    .notice-card.flavor-warn   { background: #facc15; border-color: #854d0e; color: #1c0d00; font-weight: 800; text-transform: uppercase; letter-spacing: 0.7px; }
    .notice-card.flavor-info   { background: linear-gradient(180deg, #dbeafe, #bfdbfe); border-color: #1e40af; color: #1e3a8a; font-weight: 800; }
    .notice-card.flavor-police { background: linear-gradient(180deg, #ffe4e6, #fecaca); border-color: #991b1b; color: #7f1d1d; font-weight: 700; }
    .notice-card.flavor-open   { background: #fff; border-color: var(--ink); color: var(--ink); }

    /* Part 1 question row — pills wrap below in the narrower column.
       Mobile (<560px): hide pill row, show styled dropdown. */
    .p1-q {
      display: grid; grid-template-columns: 40px 1fr; gap: 10px 14px;
      padding: 16px 0; border-top: 1px dashed var(--ring);
      align-items: center;
    }
    .p1-q:first-of-type { border-top: 0; padding-top: 4px; }
    .p1-q .q-num { width: 38px; height: 38px; font-size: 16px; }
    .p1-q .q-text {
      font-size: 16px; font-weight: 600; color: var(--ink);
      line-height: 1.5; letter-spacing: -0.1px;
    }
    .p1-q .p1-answer { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .p1-q .p1-answer .opt-pill { min-width: 42px; padding: 10px 14px; font-size: 14px; }
    .p1-q .p1-dd { display: none; grid-column: 1 / -1; margin-top: 4px; }
    @media (max-width: 560px) {
      .p1-q .q-text { font-size: 16.5px; font-weight: 600; }
      .p1-q .p1-answer { display: none; }
      .p1-q .p1-dd { display: block; }
    }

    /* Custom dropdown — styled to match the pill look */
    .dd-wrap { position: relative; }
    .dd-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 10px;
      background: var(--paper); border: 1.5px solid var(--ring-strong);
      color: var(--ink); font-weight: 700; font-family: inherit; font-size: 14px;
      cursor: pointer; width: 100%; min-height: 44px;
      transition: all .15s ease;
      box-shadow: var(--shadow-sm);
    }
    .dd-btn:hover { border-color: var(--blue-500); }
    .dd-btn.open { border-color: var(--blue-500); box-shadow: 0 0 0 3px rgba(28,91,216,0.15); }
    .dd-btn .dd-circle {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, var(--navy-800), var(--navy-700));
      color: #fff; display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 12px; font-family: 'Playfair Display', serif;
      flex-shrink: 0;
    }
    .dd-btn .dd-circle.empty { background: var(--ring); color: var(--muted); font-family: inherit; font-size: 16px; }
    .dd-btn .dd-current { flex: 1; text-align: left; color: var(--ink-2); }
    .dd-btn .dd-current.picked { color: var(--navy-800); font-weight: 800; }
    .dd-btn .dd-arrow { color: var(--muted); transition: transform .2s ease; }
    .dd-btn.open .dd-arrow { transform: rotate(180deg); }
    .dd-popover {
      display: none;
      position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: var(--paper); border-radius: 12px;
      box-shadow: var(--shadow-pop);
      border: 1px solid var(--ring);
      padding: 8px; z-index: 1000;
      max-height: 320px; overflow-y: auto;
    }
    /* When any dropdown inside a part-card is open, lift the whole card so
       its overflowing popover sits above subsequent cards. */
    .part-card:has(.dd-btn.open) { z-index: 500; }
    .dd-popover.open { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    @media (max-width: 480px) {
      .dd-popover.open { grid-template-columns: 1fr; }
    }
    .dd-opt {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 8px;
      background: transparent; border: 0;
      cursor: pointer; font-family: inherit; font-size: 13px;
      text-align: left; transition: all .12s ease;
      color: var(--ink);
    }
    .dd-opt:hover { background: var(--bg-soft); }
    .dd-opt.selected { background: linear-gradient(135deg, #eff6ff, #dbeafe); }
    .dd-opt .dd-circle { width: 28px; height: 28px; }
    .dd-opt .dd-hint {
      font-size: 12.5px; color: var(--ink-2); font-weight: 600;
      flex: 1; min-width: 0; line-height: 1.45;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    /* Compact "mini" dropdown — used inline in Part 3b's dialogue lines.
       No persistent label, just a small letter-circle + chevron.
       Width and position are entirely JS-driven (positionFixedPopover)
       so the popover never overflows the viewport regardless of where
       the trigger sits in the dialogue. */
    .dd-wrap-mini { display: inline-block; }
    .dd-btn-mini {
      display: inline-flex; width: auto; min-height: 36px;
      padding: 5px 10px; gap: 6px;
    }
    .dd-btn-mini .dd-current { display: none; }
    .dd-btn-mini .dd-circle { width: 26px; height: 26px; font-size: 11px; }
    /* Inside the mini popover: full-width rows + top-aligned circle so
       multi-line option text wraps naturally beside the letter. */
    .dd-wrap-mini .dd-opt { width: 100%; align-items: flex-start; }
    .dd-wrap-mini .dd-opt .dd-circle { margin-top: 1px; }

    /* Question rows (parts 4 etc.) */
    .q-row {
      display: grid; grid-template-columns: 44px 1fr 270px; gap: 14px;
      align-items: center; padding: 14px 0;
      border-top: 1px dashed var(--ring);
    }

    /* Part 4 — Q + book-title options. Row on desktop, stacked on mobile. */
    .p4-q {
      display: grid; grid-template-columns: 40px 1fr; gap: 10px 14px;
      padding: 16px 0; border-top: 1px dashed var(--ring);
      align-items: start;
    }
    .p4-q:first-of-type { border-top: 0; padding-top: 4px; }
    .p4-q .q-num { width: 38px; height: 38px; font-size: 16px; }
    .p4-q .q-text {
      font-size: 16px; font-weight: 600; color: var(--ink);
      line-height: 1.5; letter-spacing: -0.1px;
    }
    .p4-answer {
      grid-column: 1 / -1; display: flex; gap: 8px;
      flex-wrap: wrap; margin-top: 6px;
    }
    .p4-opt {
      flex: 1 1 30%; min-width: 160px;
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; border-radius: 10px;
      background: var(--paper); color: var(--ink-2);
      border: 1.5px solid var(--ring-strong);
      font-size: 13.5px; font-family: inherit; text-align: left;
      cursor: pointer; transition: all .15s cubic-bezier(.4,0,.2,1);
      box-shadow: var(--shadow-sm);
    }
    .p4-opt:hover { border-color: var(--blue-500); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .p4-opt.selected {
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border-color: var(--blue-500); color: var(--navy-800);
      box-shadow: 0 4px 14px rgba(28,91,216,0.20);
    }
    .p4-opt .p4-letter {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--bg-soft); color: var(--navy-700);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 11px; flex-shrink: 0;
      font-family: 'Playfair Display', serif;
    }
    .p4-opt.selected .p4-letter { background: var(--blue-600); color: #fff; }
    .p4-opt .p4-title { font-weight: 700; line-height: 1.3; }
    @media (max-width: 640px) {
      .p4-answer { flex-direction: column; }
      .p4-opt { flex: 1 1 100%; width: 100%; min-width: 0; }
    }
    .q-row:first-of-type { border-top: 0; }
    .q-num {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--bg-soft); color: var(--navy-800);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 15px;
    }
    .q-row.answered .q-num { background: var(--emerald-500); color: #fff; box-shadow: 0 4px 12px rgba(16,185,129,0.35); }
    .q-text { font-size: 14.5px; line-height: 1.55; color: var(--ink); }
    .q-answer-select { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
    .opt-pill {
      min-width: 36px; padding: 8px 12px; border-radius: 10px;
      background: var(--paper); color: var(--ink-2);
      border: 1.5px solid var(--ring-strong);
      font-weight: 800; font-size: 13px; font-family: inherit;
      cursor: pointer; transition: all .12s cubic-bezier(.4,0,.2,1);
      box-shadow: var(--shadow-sm);
    }
    .opt-pill:hover { border-color: var(--blue-500); color: var(--blue-600); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .opt-pill.selected {
      background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
      color: #fff; border-color: transparent;
      box-shadow: 0 4px 12px rgba(28,91,216,0.40);
      transform: translateY(-1px);
    }
    .opt-pill:active { transform: translateY(0) scale(.96); }

    /* Sentence MCQ */
    .sentence-q { padding: 18px 0; border-top: 1px dashed var(--ring); }
    .sentence-q:first-of-type { border-top: 0; }
    .sentence-stem {
      font-size: 15px; line-height: 1.7; margin-bottom: 10px; color: var(--ink);
      display: flex; gap: 10px;
    }
    .sentence-stem .num {
      flex-shrink: 0;
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--bg-soft); color: var(--navy-800);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 13px;
    }
    .sentence-q.answered .sentence-stem .num { background: var(--emerald-500); color: #fff; }
    .mcq-row { display: flex; gap: 10px; flex-wrap: wrap; margin-left: 38px; }
    .mcq-opt {
      flex: 1 1 28%; min-width: 140px;
      padding: 11px 14px; border-radius: 10px;
      background: var(--paper); color: var(--ink-2);
      border: 1.5px solid var(--ring-strong);
      font-size: 13.5px; font-family: inherit;
      cursor: pointer; transition: all .15s cubic-bezier(.4,0,.2,1);
      display: flex; align-items: center; gap: 8px;
      box-shadow: var(--shadow-sm);
    }
    .mcq-opt:hover { border-color: var(--blue-500); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .mcq-opt .ltr {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--bg-soft); color: var(--navy-700);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 11px; flex-shrink: 0;
      transition: all .15s ease;
    }
    .mcq-opt.selected {
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border-color: var(--blue-500); color: var(--navy-800);
      box-shadow: 0 4px 14px rgba(28,91,216,0.20);
    }
    .mcq-opt.selected .ltr { background: var(--blue-600); color: #fff; }

    /* Dialogue table (Part 3b) */
    .dialogue-wrap {
      background: var(--paper-warm);
      border: 1px solid #e8e0c8;
      border-radius: 14px;
      padding: 22px;
      margin: 18px 0;
      box-shadow: var(--shadow-sm);
    }
    /* Positioning ancestor for the per-gap dropdown popover. The
       popover spans the full line width so option text always has
       room to breathe — no JS-driven fixed positioning needed. */
    .dlg-line { position: relative; }
    .dd-wrap-mini { position: static; }
    .dd-wrap-mini .dd-popover {
      left: 0; right: 0;
      top: calc(100% + 6px);
      min-width: 0;
    }
    .dialogue-and-options {
      display: grid; grid-template-columns: 1.2fr 1fr; gap: 26px;
    }
    @media (max-width: 720px) { .dialogue-and-options { grid-template-columns: 1fr; } }
    .dlg-line {
      display: grid; grid-template-columns: 96px 1fr; gap: 10px;
      padding: 8px 0; border-bottom: 1px dotted #e8e0c8;
      font-size: 14px; line-height: 1.55;
    }
    .dlg-line:last-child { border-bottom: 0; }
    .dlg-speaker { font-weight: 800; color: var(--navy-800); }
    .dlg-gap { display: inline-flex; align-items: center; gap: 10px; }
    .dlg-gap .num {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--blue-500); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 12px;
    }
    .dlg-select {
      padding: 6px 12px;
      border: 1.5px solid var(--ring-strong); border-radius: 10px;
      font-family: inherit; font-weight: 700; font-size: 13px;
      background: #fff; cursor: pointer;
      transition: all .15s ease;
    }
    .dlg-select:focus { outline: 0; border-color: var(--blue-500); }
    .options-list {
      background: #fff; border-radius: 12px;
      padding: 14px 16px; font-size: 13.5px; line-height: 1.6;
      border: 1px solid var(--ring);
    }
    /* On mobile the per-gap dropdown already exposes the full text of
       every option, so the side options-list panel becomes redundant —
       hide it to reclaim scroll real estate. Desktop keeps it visible. */
    @media (max-width: 720px) {
      .options-list { display: none; }
      .dialogue-and-options { grid-template-columns: 1fr; }
    }
    .options-list .opt { padding: 7px 0; border-bottom: 1px dashed var(--ring); display: flex; gap: 10px; }
    .options-list .opt:last-child { border-bottom: 0; }
    .options-list .opt .ltr {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--navy-800); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 11px; flex-shrink: 0;
      font-family: 'Playfair Display', serif;
    }

    /* Three book texts (Part 4) */
    .three-texts-heading {
      background: linear-gradient(135deg, var(--navy-800), var(--navy-700));
      color: #fff; padding: 14px 22px; border-radius: 14px 14px 0 0;
      font-weight: 800; font-size: 17px; letter-spacing: 0.5px;
      font-family: 'Playfair Display', serif;
      box-shadow: var(--shadow-sm);
    }
    .three-texts {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0;
      background: var(--paper); border-radius: 0 0 14px 14px;
      box-shadow: var(--shadow-md);
      margin-bottom: 18px;
      overflow: hidden;
      border: 1px solid var(--ring);
    }
    @media (max-width: 900px) { .three-texts { grid-template-columns: 1fr; } }
    .book-card {
      padding: 20px 18px;
      background: var(--paper);
      border-right: 1px dashed var(--ring);
      position: relative;
    }
    .book-card:last-child { border-right: 0; }
    @media (max-width: 900px) {
      .book-card { border-right: 0; border-bottom: 1px dashed var(--ring); }
      .book-card:last-child { border-bottom: 0; }
    }
    .book-card .book-letter {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--rose-500), #c11444);
      color: #fff; font-weight: 900; font-family: 'Playfair Display', serif;
      font-size: 15px; margin-bottom: 10px;
      box-shadow: 0 4px 12px rgba(225,29,72,0.32);
    }
    .book-card .book-title {
      font-family: 'Playfair Display', serif;
      font-weight: 800; font-size: 18px; line-height: 1.2;
      color: var(--ink); margin-bottom: 10px; letter-spacing: -0.2px;
    }
    .book-card .book-body {
      font-size: 13px; line-height: 1.65; color: var(--ink-2);
      white-space: pre-line;
    }

    /* Cloze passage (Part 5) */
    .cloze-box {
      background: var(--paper-warm);
      border: 1px solid #e8e0c8;
      border-radius: 14px;
      padding: 22px 28px;
      font-size: 15.5px; line-height: 2; white-space: pre-line;
      box-shadow: var(--shadow-sm);
      font-family: 'Playfair Display', Georgia, serif;
    }
    .cloze-box h3 {
      font-family: 'Playfair Display', serif;
      margin: 0 0 14px 0;
      font-size: 26px; font-weight: 800; font-style: italic;
      color: var(--navy-800);
    }
    .gap-pill {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 32px; padding: 2px 10px;
      background: var(--amber-200);
      border: 1px solid var(--gold-500);
      color: #78350f;
      border-radius: 8px; font-weight: 800; font-size: 13.5px;
      font-family: 'Inter', sans-serif;
      vertical-align: baseline; line-height: 1.5;
    }
    .gap-pill.ex { background: #d1fae5; border-color: var(--emerald-500); color: #065f46; }

    /* Cloze inline dropdown (Part 5) — each gap is its own popover.
       The trigger looks like the amber gap pill; after picking it
       turns green and shows the chosen word inline in the passage. */
    .cloze-gap-wrap {
      position: relative; display: inline-block;
      vertical-align: baseline; line-height: 1;
    }
    .cloze-gap-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px;
      border: 1px solid var(--gold-500);
      background: var(--amber-200);
      color: #78350f;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 800; font-size: 13.5px;
      cursor: pointer; line-height: 1.4;
      vertical-align: baseline;
      transition: all .15s ease;
      box-shadow: var(--shadow-sm);
    }
    .cloze-gap-btn:hover { background: #fde68a; }
    .cloze-gap-btn.open { background: #fcd34d; box-shadow: 0 0 0 3px rgba(212,167,44,0.2); }
    /* Plain inline number inside the amber pill — no circle wrapper.
       After answering, the same span gets swapped to the picked word
       in pickDD() and the pill class flips to `.answered` (green). */
    .cloze-gap-btn .cloze-num {
      display: inline; padding: 0; margin: 0; background: transparent;
      color: inherit;
      font-family: 'Inter', sans-serif;
      font-weight: 800; font-size: 14px;
      letter-spacing: 0.2px;
      box-shadow: none; border-radius: 0;
      width: auto; height: auto;
    }
    .cloze-gap-btn .dd-arrow { color: var(--gold-500); font-size: 10px; margin-left: 2px; }
    .cloze-gap-btn.answered .cloze-num { color: #047857; }
    /* Answered: green pill showing the picked word inline. */
    .cloze-gap-btn.answered {
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      border-color: var(--emerald-500);
      color: #065f46;
    }
    .cloze-gap-btn.answered .dd-arrow { color: var(--emerald-500); }
    .cloze-gap-wrap .dd-popover {
      position: absolute;
      top: calc(100% + 6px);
      left: 0; right: auto;
      width: 220px;
      min-width: 0;
      display: none;
    }
    .cloze-gap-wrap .dd-popover.open {
      display: grid; grid-template-columns: 1fr; gap: 4px;
    }
    .cloze-gap-wrap .dd-opt { width: 100%; padding: 8px 10px; }
    .cloze-gap-wrap .dd-opt .dd-hint {
      font-size: 13px; font-weight: 700;
      font-family: 'Inter', sans-serif;
    }

    /* Vocab fill (Part 6) */
    .vocab-row {
      display: grid; grid-template-columns: 44px 1fr 240px; gap: 14px;
      padding: 14px 0; align-items: center;
      border-top: 1px dashed var(--ring);
    }
    .vocab-row:first-of-type { border-top: 0; }
    .vocab-prompt { font-size: 14.5px; line-height: 1.55; color: var(--ink); }
    .vocab-input-wrap {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-soft); padding: 10px 14px; border-radius: 10px;
      border: 1.5px solid var(--ring-strong);
      transition: all .15s ease;
    }
    .vocab-input-wrap:focus-within { border-color: var(--blue-500); background: #f0f9ff; }
    .vocab-input-wrap .first-ltr {
      font-family: 'Playfair Display', serif;
      font-weight: 800; font-size: 20px; color: var(--navy-800);
      min-width: 18px;
    }
    .vocab-input {
      font-family: inherit; font-size: 15px;
      padding: 6px 4px; border: 0; background: transparent;
      flex: 1; min-width: 0; color: var(--ink);
      border-bottom: 2px dotted var(--ring-strong);
    }
    .vocab-input:focus { outline: 0; border-bottom-color: var(--blue-500); }

    /* Letter (Part 7) */
    .letter-box {
      background:
        repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(15,23,42,0.06) 27px, rgba(15,23,42,0.06) 28px),
        var(--paper-warm);
      border: 1px solid #e8d8a3;
      border-left: 6px solid #b45309;
      border-radius: 10px;
      padding: 28px 36px;
      font-size: 15px; line-height: 1.9;
      color: var(--ink);
      box-shadow: var(--shadow-md);
      position: relative;
    }
    .letter-box::before {
      content: ''; position: absolute; left: -6px; top: 14px; bottom: 14px;
      width: 6px; background: repeating-linear-gradient(180deg, #b45309, #b45309 6px, #fbbf24 6px, #fbbf24 12px);
      border-radius: 6px 0 0 6px;
    }
    .letter-header { text-align: right; white-space: pre-line; color: var(--ink-2); margin-bottom: 18px; font-family: 'Caveat', cursive; font-size: 19px; line-height: 1.4; }
    .letter-greeting { font-weight: 700; margin-bottom: 8px; }
    .letter-body { white-space: pre-line; }
    .letter-closing { white-space: pre-line; margin-top: 14px; font-weight: 600; font-family: 'Caveat', cursive; font-size: 21px; }
    .inline-input {
      display: inline-block; vertical-align: baseline;
      font-family: inherit; font-size: 14.5px;
      width: 88px; padding: 2px 8px;
      border: 0; border-bottom: 2px dotted var(--blue-500);
      background: rgba(28,91,216,0.06);
      border-radius: 4px 4px 0 0;
      color: var(--navy-800); font-weight: 700;
      transition: all .15s ease;
    }
    .inline-input:focus { outline: 0; background: #fef3c7; border-bottom-color: var(--gold-500); }
    .inline-input::placeholder { color: var(--blue-400); font-weight: 800; }

    /* Part 8 — notice + note + Andy's notes */
    .filmclub-notice {
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 10px;
      padding: 0; overflow: hidden;
      margin: 16px 0;
      box-shadow: var(--shadow-md);
      max-width: 440px; margin-left: auto; margin-right: auto;
    }
    .filmclub-notice .ntitle {
      background: linear-gradient(180deg, #fde68a, #fbbf24);
      color: #78350f;
      padding: 12px 16px;
      font-weight: 900; font-size: 18px;
      text-align: center; letter-spacing: 1.5px;
      border-bottom: 3px solid var(--ink);
      font-family: 'Playfair Display', serif;
    }
    .filmclub-notice .nbody {
      padding: 16px 22px;
      font-size: 15px; line-height: 1.8;
      white-space: pre-line;
      font-family: 'Playfair Display', serif;
    }
    .note-card {
      background: var(--paper-warm);
      border: 1px solid #e8d8a3;
      border-radius: 10px;
      padding: 18px 22px;
      margin: 18px 0;
      font-family: 'Caveat', cursive;
      font-size: 19px; line-height: 1.5;
      color: var(--ink);
      box-shadow: var(--shadow-sm);
      max-width: 460px;
    }
    .note-card .date-line { text-align: right; color: var(--muted); font-size: 16px; margin-bottom: 6px; }
    .note-card .note-body { white-space: pre-line; }
    .note-card .sig { font-weight: 700; margin-top: 8px; font-size: 22px; }
    .andy-notes {
      background: var(--paper);
      border: 1px solid var(--ring);
      border-radius: 14px;
      padding: 22px 26px;
      margin: 18px 0;
      box-shadow: var(--shadow-md);
    }
    .andy-notes .an-title {
      font-family: 'Playfair Display', serif;
      font-weight: 800; text-align: center; font-size: 20px;
      color: var(--navy-800);
    }
    .andy-notes .an-sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .andy-notes .an-row {
      display: grid; grid-template-columns: 150px 1fr;
      gap: 14px; padding: 12px 0; align-items: center;
      border-top: 1px dashed var(--ring);
    }
    .andy-notes .an-row:first-of-type { border-top: 0; }
    .andy-notes .an-label { font-weight: 700; color: var(--ink-2); }
    .andy-notes .an-value {
      display: flex; align-items: center; gap: 10px;
      min-width: 0;
    }
    .andy-notes .an-num {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--blue-500); color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 13px; flex-shrink: 0;
    }
    .andy-notes .an-prefix {
      font-weight: 700; color: var(--ink); flex-shrink: 0;
    }
    .andy-notes .an-input {
      padding: 8px 12px; border: 1.5px solid var(--ring-strong); border-radius: 8px;
      font-size: 14.5px; font-family: inherit;
      flex: 1; min-width: 0;
      transition: all .15s ease;
    }
    .andy-notes .an-input:focus { outline: 0; border-color: var(--blue-500); background: #f0f9ff; }
    .andy-notes .prefilled { font-style: italic; color: var(--muted); font-family: 'Caveat', cursive; font-size: 19px; }

    /* Mobile: label stacks above the value so the input gets full width. */
    @media (max-width: 640px) {
      .andy-notes .an-row {
        grid-template-columns: 1fr;
        gap: 6px; padding: 14px 0;
      }
      .andy-notes .an-label { font-size: 14.5px; }
    }

    /* Postcard (Part 9) */
    .postcard-prompt-card {
      background: linear-gradient(135deg, #fffbeb, #fef3c7);
      border: 1px solid #fcd34d;
      border-radius: 14px;
      padding: 18px 22px;
      margin: 18px 0;
      font-size: 14.5px; line-height: 1.65;
      white-space: pre-line;
      box-shadow: var(--shadow-sm);
      max-width: 460px;
    }
    .postcard-prompt-card .sig {
      margin-top: 12px; font-family: 'Caveat', cursive;
      font-size: 22px; font-weight: 700; text-align: right;
      color: var(--navy-800);
    }
    .postcard-frame {
      background:
        linear-gradient(135deg, #fafafa 0%, #fff 100%);
      border: 2px solid var(--ring-strong);
      border-radius: 14px;
      padding: 18px;
      box-shadow: var(--shadow-md);
      position: relative;
    }
    .postcard-frame::before {
      content: 'POSTCARD'; position: absolute; top: 8px; right: 12px;
      font-size: 10px; font-weight: 800; letter-spacing: 2px;
      color: var(--ring-strong);
    }
    .postcard-textarea {
      width: 100%; min-height: 160px;
      padding: 14px 16px; border: 1.5px dashed var(--ring-strong);
      border-radius: 10px;
      font-family: 'Caveat', cursive; font-size: 21px; line-height: 1.4;
      resize: vertical; background: transparent;
      color: var(--ink);
    }
    .postcard-textarea:focus { outline: 0; border-color: var(--blue-500); background: #fffef9; }
    .wc-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; padding: 0 4px; }
    .wc-bar { flex: 1; height: 6px; background: var(--ring); border-radius: 3px; overflow: hidden; }
    .wc-fill { height: 100%; background: linear-gradient(90deg, var(--rose-500), var(--gold-500), var(--emerald-500)); width: 0; transition: width .25s ease; }
    .wc-label { font-size: 12.5px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
    .wc-label.in-range { color: var(--emerald-600); }
    .wc-label.out-range { color: var(--rose-500); }

    /* Floating bottom submit on mobile */
    .float-submit {
      display: none;
      position: fixed; bottom: 16px; right: 16px; z-index: 95;
      background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
      color: var(--navy-900);
      border: 0; padding: 14px 22px; border-radius: 999px;
      font-weight: 800; font-family: inherit; font-size: 15px;
      box-shadow: 0 12px 30px rgba(212,167,44,0.55);
      cursor: pointer;
    }
    @media (max-width: 720px) { .float-submit { display: inline-flex; align-items: center; gap: 8px; } }

    /* Results modal */
    .results-modal {
      position: fixed; inset: 0;
      background: rgba(11,29,58,0.85); backdrop-filter: blur(10px);
      display: none; align-items: center; justify-content: center;
      z-index: 200; padding: 20px;
    }
    .results-modal.show { display: flex; }
    .results-card {
      background: var(--paper); border-radius: 22px;
      max-width: 780px; width: 100%; max-height: 90vh; overflow-y: auto;
      padding: 32px 36px;
      box-shadow: var(--shadow-pop);
      animation: cardFadeIn .4s ease both;
    }
    .results-card h2 {
      margin: 0 0 16px 0; font-family: 'Playfair Display', serif;
      font-weight: 800; font-size: 28px; color: var(--navy-800);
    }
    .score-hero {
      background: linear-gradient(135deg, var(--navy-900), var(--navy-700));
      color: #fff; padding: 24px 28px; border-radius: 18px;
      display: flex; align-items: center; gap: 24px;
      margin: 14px 0 20px;
    }
    .score-big {
      font-family: 'Playfair Display', serif;
      font-size: 56px; font-weight: 900; line-height: 1;
      background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .score-meta { font-size: 13.5px; color: rgba(255,255,255,0.85); line-height: 1.5; }
    .score-meta strong { color: #fff; }
    .score-breakdown {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; margin: 18px 0;
    }
    .score-row {
      background: var(--bg-soft); padding: 10px 14px; border-radius: 10px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px;
    }
    .score-row .pn { font-weight: 800; color: var(--navy-800); }
    .score-row .ps { font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    @media (max-width: 540px) { .score-breakdown { grid-template-columns: 1fr 1fr; } }
    .free-text-review {
      background: var(--bg-soft); border-radius: 12px;
      padding: 14px 16px; margin: 12px 0;
      border-left: 3px solid var(--blue-500);
    }
    .free-text-review .qhead { font-weight: 800; margin-bottom: 8px; color: var(--navy-800); }
    .free-text-review .their-ans {
      background: #fff; border: 1px solid var(--ring-strong);
      padding: 10px 14px; border-radius: 8px;
      font-size: 14.5px; margin-bottom: 8px; white-space: pre-line;
    }
    .free-text-review .expected {
      color: var(--ink-2); font-size: 13px;
    }
    .free-text-review .expected strong { color: var(--emerald-600); }
    .results-actions { display: flex; gap: 12px; margin-top: 24px; }
    .results-actions button {
      flex: 1; padding: 12px 18px; border-radius: 12px; border: 0;
      cursor: pointer; font-weight: 800; font-family: inherit; font-size: 14px;
      transition: all .15s ease;
    }
    .btn-back { background: var(--bg-soft); color: var(--ink); }
    .btn-back:hover { background: var(--ring); }
    .btn-retry {
      background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
      color: #fff; box-shadow: 0 6px 18px rgba(28,91,216,0.35);
    }
    .btn-retry:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(28,91,216,0.45); }

    @media (max-width: 720px) {
      .page { margin: 18px auto 100px; padding: 0 12px; }
      .part-card { padding: 22px 18px; border-radius: 18px; }
      .part-card::before { left: 0; top: 22px; bottom: 22px; }
      .paper-hero { padding: 28px 22px; border-radius: 18px; }
      .topbar { padding: 10px 14px; gap: 10px; }
      .topbar .titlewrap { display: none; }
      .nav-strip { padding: 8px 12px; top: 60px; }
      .q-row { grid-template-columns: 36px 1fr; }
      .q-row .q-answer-select { grid-column: 1 / -1; justify-content: flex-start; }
      .vocab-row { grid-template-columns: 36px 1fr; }
      .vocab-row .vocab-input-wrap { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <button class="back" onclick="goBack()">← Back</button>
  <div class="brand">
    <div class="crest">KE</div>
    <div class="titlewrap">
      <div class="t1">KET · Key English Test</div>
      <div class="t2">Paper 1 · Reading and Writing</div>
    </div>
  </div>
  <span class="spacer"></span>
  <span class="timer" id="timer">1:10:00</span>
  <button class="submit" onclick="submitTest()">Submit</button>
</div>

<div class="nav-strip" id="navStrip"></div>

<div class="page" id="page">
  <div class="paper-hero">
    <span class="lvl-chip">⭐ A2 · Key English Test</span>
    <div class="test-no">Test 1</div>
    <div class="paper-line"><strong>PAPER 1</strong> &nbsp; READING AND WRITING &nbsp;·&nbsp; 1 hour 10 minutes</div>
    <div class="meta-row">
      <div class="m">📑 <b>9 parts</b></div>
      <div class="m">❓ <b>56 questions</b></div>
      <div class="m">⏱ <b>70 min</b></div>
    </div>
  </div>
  <div id="partsRoot"></div>
</div>

<button class="float-submit" onclick="submitTest()">Submit ✓</button>

<div class="results-modal" id="resultsModal">
  <div class="results-card" id="resultsCard"></div>
</div>

<script src="questions KET RW/ket-rw-test-01.js"></script>
<script>
  function goBack() {
    if (window.confirm('Leave the test? Your answers will be lost.')) {
      window.location.href = '/landing-v3.html?reopen=cambridge';
    }
  }

  // ── State ──────────────────────────────────────────────────────
  window.__ANS = {};
  function setAns(id, val) {
    window.__ANS[id] = val;
    refreshAnsweredMarkers(id);
    refreshNavStrip();
  }
  function getAns(id) { return window.__ANS[id] || ''; }

  function refreshAnsweredMarkers(id) {
    // Mark parent .q-row / .sentence-q answered when any input/pill is filled
    document.querySelectorAll('[data-qslot="' + id + '"]').forEach(function (el) {
      if (window.__ANS[id]) el.classList.add('answered');
      else el.classList.remove('answered');
    });
  }

  function refreshNavStrip() {
    if (!window.KET_RW_TEST) return;
    var strip = document.getElementById('navStrip');
    if (!strip) return;
    strip.innerHTML = '';
    var parts = window.KET_RW_TEST.parts;
    var partGroups = {};
    parts.forEach(function (p) {
      var key = p.partNumber + (p.partLetter || '');
      if (!partGroups[key]) partGroups[key] = { part: p, items: [] };
      (p.items || []).forEach(function (it) { partGroups[key].items.push(it); });
    });
    Object.keys(partGroups).forEach(function (key) {
      var grp = partGroups[key];
      var total = grp.items.length;
      var answered = grp.items.filter(function (it) { return window.__ANS[it.id]; }).length;
      var chip = document.createElement('a');
      chip.href = '#part-' + key;
      chip.className = 'nav-chip';
      if (answered === total && total > 0) chip.classList.add('complete');
      else if (answered > 0) chip.classList.add('has-answers');
      chip.innerHTML = '<span class="dot"></span> Part ' + key + ' · ' + answered + '/' + total;
      strip.appendChild(chip);
    });
  }

  // ── Renderers ──────────────────────────────────────────────────
  var PART_NAMES = {
    '1':  'Match the notices',
    '2':  'Sentence gap-fill · birthday',
    '3a': 'Conversation replies',
    '3b': 'Conversation at a garage',
    '4':  'Three book reviews',
    '5':  'Cloze passage · Schnauzer dogs',
    '6':  'Vocabulary · holidays & travel',
    '7':  'Open cloze letter · Maria',
    '8':  'Andy’s notes',
    '9':  'Postcard writing'
  };

  function renderPartHeader(part) {
    var key = part.partNumber + (part.partLetter || '');
    var name = PART_NAMES[key] || ('Part ' + key);
    var instrHtml = (part.instruction || []).map(function (l) { return '<p>' + escapeHtml(l) + '</p>'; }).join('');
    var n = (part.items || []).length;
    return ''
      + '<div class="part-head">'
      + '  <div class="part-num">' + part.partNumber + '</div>'
      + '  <div style="flex:1;min-width:0">'
      + '    <h2 class="part-name">' + escapeHtml(name) + '</h2>'
      + '    <div class="part-meta-row">' + escapeHtml(part.questionsLabel || '') + ' <span class="dot">•</span> ' + n + ' questions</div>'
      + '  </div>'
      + '</div>'
      + '<div class="part-instr">' + instrHtml + '</div>';
  }

  function renderExampleSimple(prompt, answer) {
    return '<div class="example-card">'
      + '<div><div class="ex-label">Example</div><div style="margin-top:4px"><b>0</b> ' + escapeHtml(prompt) + '</div></div>'
      + '<div style="text-align:right"><div class="ex-label">Answer</div><div style="margin-top:6px"><span class="ex-answer-pill">' + escapeHtml(answer) + '</span></div></div>'
      + '</div>';
  }

  // PART 1 — two-column on desktop: questions left, notices right
  function renderPart1(part) {
    var flavorMap = { A: 'flavor-ticket', B: 'flavor-open', C: 'flavor-warn', D: 'flavor-open', E: 'flavor-info', F: 'flavor-police', G: 'flavor-open', H: 'flavor-info' };
    // Build hint map letter → full notice text (mobile dropdown options).
    // Multi-line notices ("Police Notice / Road Closed") get a space join so
    // they fit in the 2-line clamped area without truncation.
    var hintMap = {};
    part.notices.forEach(function (n) { hintMap[n.letter] = String(n.text || '').replace(/\n/g, ' / '); });
    var letters = part.notices.map(function (n) { return n.letter; });

    var html = renderPartHeader(part) + renderExampleSimple(part.example.prompt, part.example.answer);
    html += '<div class="p1-grid">';

    // Left column — questions
    html += '<div class="p1-questions">';
    html += '<div class="p1-section-head">Questions</div>';
    part.items.forEach(function (item) {
      html += '<div class="p1-q" data-qslot="' + item.id + '">';
      html += '<div class="q-num">' + item.id + '</div>';
      html += '<div class="q-text">' + escapeHtml(item.prompt) + '</div>';
      // Desktop pill row
      html += '<div class="p1-answer">';
      letters.forEach(function (l) {
        html += '<button class="opt-pill" data-letter="' + l + '" onclick="pickPill(' + item.id + ',\'' + l + '\',this)">' + l + '</button>';
      });
      html += '</div>';
      // Mobile dropdown
      html += '<div class="p1-dd">';
      html += '  <div class="dd-wrap" id="dd-' + item.id + '">';
      html += '    <button type="button" class="dd-btn" onclick="toggleDD(' + item.id + ', event)">';
      html += '      <span class="dd-circle empty">—</span>';
      html += '      <span class="dd-current">Select your answer</span>';
      html += '      <span class="dd-arrow">▾</span>';
      html += '    </button>';
      html += '    <div class="dd-popover">';
      letters.forEach(function (l) {
        html += '<button class="dd-opt" data-letter="' + l + '" onclick="pickDD(' + item.id + ',\'' + l + '\',\'' + escapeJs(hintMap[l] || '') + '\', this, event)">';
        html += '<span class="dd-circle">' + l + '</span>';
        html += '<span class="dd-hint">' + escapeHtml(hintMap[l] || '') + '</span>';
        html += '</button>';
      });
      html += '    </div>';
      html += '  </div>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';

    // Right column — notices (collapsible <details> on mobile)
    html += '<div class="p1-notices">';
    html += '<details class="notices-collapse" open>';
    html += '<summary class="p1-section-head"><span>📋 Notices · A–H</span><span class="collapse-caret">▾</span></summary>';
    html += '<div class="notices-grid">';
    part.notices.forEach(function (n) {
      html += '<div class="notice-letter">' + escapeHtml(n.letter) + '</div>';
      html += '<div class="notice-card ' + (flavorMap[n.letter] || '') + '">' + escapeHtml(n.text) + '</div>';
    });
    html += '</div></details></div>';

    html += '</div>';
    return html;
  }

  // ── Custom dropdown for Part 1 (mobile) + Part 3b (all widths) ──
  function toggleDD(id, ev) {
    if (ev) ev.stopPropagation();
    var wrap = document.getElementById('dd-' + id);
    if (!wrap) return;
    var btn = wrap.querySelector('.dd-btn');
    var pop = wrap.querySelector('.dd-popover');
    // Close any other open dropdowns first
    document.querySelectorAll('.dd-btn.open').forEach(function (b) {
      if (b !== btn) {
        b.classList.remove('open');
        var sibling = b.parentElement.querySelector('.dd-popover');
        if (sibling) sibling.classList.remove('open');
      }
    });
    btn.classList.toggle('open');
    pop.classList.toggle('open');
  }
  function pickDD(id, letter, hint, optEl, ev) {
    if (ev) ev.stopPropagation();
    setAns(id, letter);
    var wrap = document.getElementById('dd-' + id);
    if (!wrap) return;
    var btn = wrap.querySelector('.dd-btn');
    var pop = wrap.querySelector('.dd-popover');
    var circle = btn.querySelector('.dd-circle');
    var current = btn.querySelector('.dd-current');
    var isCloze = btn.classList.contains('cloze-gap-btn');
    if (isCloze) {
      // Cloze trigger: update the plain inline number span to the
      // picked word so the passage reads naturally, e.g.
      // "All the dogs [have] long hair…"
      var clozeNum = btn.querySelector('.cloze-num');
      if (clozeNum) clozeNum.textContent = hint || letter;
      btn.classList.add('answered');
    } else if (circle) {
      circle.classList.remove('empty');
      circle.textContent = letter;
    }
    // .dd-current only exists in the full Part-1 variant; mini variants
    // (Part 3b) don't render it, so the textContent assignment must be
    // null-guarded.
    if (current) {
      current.textContent = hint || letter;
      current.classList.add('picked');
    }
    pop.querySelectorAll('.dd-opt').forEach(function (o) { o.classList.remove('selected'); });
    optEl.classList.add('selected');
    // Mirror to the desktop pill row so a tab from mobile→desktop stays in sync (Part 1 only)
    var pillRow = wrap.parentElement.parentElement.querySelector('.p1-answer');
    if (pillRow) {
      pillRow.querySelectorAll('.opt-pill').forEach(function (p) {
        p.classList.toggle('selected', p.getAttribute('data-letter') === letter);
      });
    }
    btn.classList.remove('open');
    pop.classList.remove('open');
  }
  // Close dropdown on outside click
  document.addEventListener('click', function (e) {
    if (e.target.closest('.dd-wrap')) return;
    closeAllDropdowns();
  });
  function closeAllDropdowns() {
    document.querySelectorAll('.dd-btn.open').forEach(function (b) {
      b.classList.remove('open');
      var pop = b.parentElement.querySelector('.dd-popover');
      if (pop) pop.classList.remove('open');
    });
  }

  // PART 2 — MCQ gap-fill sentences (3 options each)
  function renderPart2(part) {
    var html = renderPartHeader(part);
    var ex = part.example;
    var exOptsHtml = ex.options.map(function (o) {
      return '<div class="mcq-opt"><span class="ltr">' + escapeHtml(o.letter) + '</span>' + escapeHtml(o.text) + '</div>';
    }).join('');
    html += '<div class="example-card vert">'
      + '<div style="display:flex;justify-content:space-between;align-items:center"><div class="ex-label">Example</div><div><span class="ex-label">Answer</span> <span class="ex-answer-pill">' + escapeHtml(ex.answer) + '</span></div></div>'
      + '<div class="sentence-stem" style="margin:10px 0 4px"><span class="num">0</span><span>' + escapeHtml(ex.sentence) + '</span></div>'
      + '<div class="mcq-row">' + exOptsHtml + '</div>'
      + '</div>';
    part.items.forEach(function (item) {
      html += '<div class="sentence-q" data-qslot="' + item.id + '">';
      html += '<div class="sentence-stem"><span class="num">' + item.id + '</span><span>' + escapeHtml(item.sentence) + '</span></div>';
      html += '<div class="mcq-row">';
      item.options.forEach(function (o) {
        html += '<div class="mcq-opt" onclick="pickMcq(' + item.id + ',\'' + o.letter + '\',this)" data-id="' + item.id + '" data-letter="' + o.letter + '"><span class="ltr">' + escapeHtml(o.letter) + '</span>' + escapeHtml(o.text) + '</div>';
      });
      html += '</div></div>';
    });
    return html;
  }

  // PART 3a — MCQ response
  function renderPart3a(part) {
    var html = renderPartHeader(part);
    var ex = part.example;
    html += '<div class="example-card vert">'
      + '<div style="display:flex;justify-content:space-between;align-items:center"><div class="ex-label">Example</div><div><span class="ex-label">Answer</span> <span class="ex-answer-pill">' + escapeHtml(ex.answer) + '</span></div></div>'
      + '<div class="sentence-stem" style="margin:10px 0 4px"><span class="num">0</span><em style="color:var(--navy-700)">' + escapeHtml(ex.prompt) + '</em></div>'
      + '<div class="mcq-row">' + ex.options.map(function (o) { return '<div class="mcq-opt"><span class="ltr">' + escapeHtml(o.letter) + '</span>' + escapeHtml(o.text) + '</div>'; }).join('') + '</div>'
      + '</div>';
    part.items.forEach(function (item) {
      html += '<div class="sentence-q" data-qslot="' + item.id + '">';
      html += '<div class="sentence-stem"><span class="num">' + item.id + '</span><em style="color:var(--navy-700);font-weight:600">' + escapeHtml(item.prompt) + '</em></div>';
      html += '<div class="mcq-row">';
      item.options.forEach(function (o) {
        html += '<div class="mcq-opt" onclick="pickMcq(' + item.id + ',\'' + o.letter + '\',this)" data-id="' + item.id + '" data-letter="' + o.letter + '"><span class="ltr">' + escapeHtml(o.letter) + '</span>' + escapeHtml(o.text) + '</div>';
      });
      html += '</div></div>';
    });
    return html;
  }

  // PART 3b — dialogue matching with custom dropdown per gap (shows full text)
  function renderPart3b(part) {
    var html = renderPartHeader(part);
    var hintMap = {};
    part.options.forEach(function (o) { hintMap[o.letter] = o.text; });
    html += '<div class="dialogue-wrap"><div class="dialogue-and-options"><div class="dialogue">';
    part.dialogue.forEach(function (d) {
      html += '<div class="dlg-line"><div class="dlg-speaker">' + escapeHtml(d.speaker) + ':</div><div>';
      if (typeof d.line === 'string') {
        html += escapeHtml(d.line);
      } else if (typeof d.gap === 'number') {
        if (d.gap === 0) {
          html += '<span class="dlg-gap"><span class="num">0</span> <span class="ex-answer-pill">' + escapeHtml(part.example.answer) + '</span></span>';
        } else {
          // Custom mini dropdown — popover shows full text of each option.
          html += '<span class="dlg-gap" data-qslot="' + d.gap + '"><span class="num">' + d.gap + '</span>';
          html += '<div class="dd-wrap dd-wrap-mini" id="dd-' + d.gap + '">';
          html += '  <button type="button" class="dd-btn dd-btn-mini" onclick="toggleDD(' + d.gap + ', event)">';
          html += '    <span class="dd-circle empty">—</span>';
          html += '    <span class="dd-arrow">▾</span>';
          html += '  </button>';
          html += '  <div class="dd-popover">';
          part.options.forEach(function (o) {
            html += '<button class="dd-opt" data-letter="' + o.letter + '" onclick="pickDD(' + d.gap + ',\'' + o.letter + '\',\'' + escapeJs(o.text) + '\', this, event)">';
            html += '<span class="dd-circle">' + o.letter + '</span>';
            html += '<span class="dd-hint">' + escapeHtml(o.text) + '</span>';
            html += '</button>';
          });
          html += '  </div>';
          html += '</div>';
          html += '</span>';
        }
      }
      html += '</div></div>';
    });
    html += '</div><div class="options-list">';
    part.options.forEach(function (o) {
      html += '<div class="opt"><span class="ltr">' + escapeHtml(o.letter) + '</span><span>' + escapeHtml(o.text) + '</span></div>';
    });
    html += '</div></div></div>';
    return html;
  }

  // PART 4 — three texts
  function renderPart4(part) {
    var html = renderPartHeader(part);
    html += '<div class="three-texts-heading">📖 ' + escapeHtml(part.heading) + '</div>';
    html += '<div class="three-texts">';
    part.texts.forEach(function (t) {
      html += '<div class="book-card"><span class="book-letter">' + escapeHtml(t.letter) + '</span><div class="book-title">' + escapeHtml(t.title) + '</div><div class="book-body">' + escapeHtml(t.body) + '</div></div>';
    });
    html += '</div>';
    var ex = part.example;
    html += renderExampleSimple(ex.prompt, ex.answer);
    // Map book-letter → title so each option shows "A · The Long Night" etc.
    var titleMap = {};
    part.texts.forEach(function (t) { titleMap[t.letter] = t.title; });
    part.items.forEach(function (item) {
      html += '<div class="p4-q" data-qslot="' + item.id + '">';
      html += '<div class="q-num">' + item.id + '</div>';
      html += '<div class="q-text">' + escapeHtml(item.prompt) + '</div>';
      html += '<div class="p4-answer">';
      ['A', 'B', 'C'].forEach(function (l) {
        html += '<button class="p4-opt" data-letter="' + l + '" onclick="pickPill(' + item.id + ',\'' + l + '\',this)">';
        html += '<span class="p4-letter">' + l + '</span>';
        html += '<span class="p4-title">' + escapeHtml(titleMap[l] || '') + '</span>';
        html += '</button>';
      });
      html += '</div></div>';
    });
    return html;
  }

  // PART 5 — cloze passage with inline per-gap dropdowns
  function renderPart5(part) {
    var html = renderPartHeader(part);
    var optMap = {};
    part.items.forEach(function (item) { optMap[item.id] = item.options; });
    var passageHtml = escapeHtml(part.passage).replace(/\{(\d+)\}/g, function (_, n) {
      var id = parseInt(n, 10);
      if (id === 0) return '<span class="gap-pill ex">0 → ' + escapeHtml(part.example.answer) + '</span>';
      var options = optMap[id] || [];
      var opts = '';
      options.forEach(function (o) {
        opts += '<button class="dd-opt" data-letter="' + o.letter + '" onclick="pickDD(' + id + ',\'' + o.letter + '\',\'' + escapeJs(o.text) + '\', this, event)">'
              + '<span class="dd-circle">' + o.letter + '</span>'
              + '<span class="dd-hint">' + escapeHtml(o.text) + '</span>'
              + '</button>';
      });
      return ''
        + '<span class="dd-wrap cloze-gap-wrap" id="dd-' + id + '" data-qslot="' + id + '">'
        + '<button type="button" class="dd-btn cloze-gap-btn" onclick="toggleDD(' + id + ', event)">'
        +   '<span class="cloze-num">' + id + '</span>'
        +   '<span class="dd-arrow">▾</span>'
        + '</button>'
        + '<div class="dd-popover">' + opts + '</div>'
        + '</span>';
    });
    html += '<div class="cloze-box"><h3>' + escapeHtml(part.passageTitle) + '</h3>' + passageHtml + '</div>';
    return html;
  }

  // PART 6 — vocab fill
  function renderPart6(part) {
    var html = renderPartHeader(part);
    var ex = part.example;
    html += '<div class="example-card">'
      + '<div><div class="ex-label">Example</div><div style="margin-top:4px"><b>0</b> ' + escapeHtml(ex.prompt) + '</div></div>'
      + '<div style="text-align:right"><div class="ex-label">Answer</div><div style="margin-top:6px;font-family:Playfair Display,serif;font-weight:800;font-size:18px;color:var(--navy-800);letter-spacing:2px">' + escapeHtml(ex.answer) + '</div></div>'
      + '</div>';
    part.items.forEach(function (item) {
      var slots = item.letters - 1;
      var hint = '_ '.repeat(slots).trim();
      html += '<div class="vocab-row" data-qslot="' + item.id + '">';
      html += '<div class="q-num">' + item.id + '</div>';
      html += '<div class="vocab-prompt">' + escapeHtml(item.prompt) + '</div>';
      html += '<div class="vocab-input-wrap"><span class="first-ltr">' + escapeHtml(item.firstLetter) + '</span>';
      html += '<input class="vocab-input" type="text" placeholder="' + hint + '" maxlength="' + (item.letters - 1) + '" oninput="setAns(' + item.id + ', \'' + item.firstLetter + '\' + this.value)" />';
      html += '</div></div>';
    });
    return html;
  }

  // PART 7 — open cloze letter
  function renderPart7(part) {
    var html = renderPartHeader(part);
    var bodyHtml = escapeHtml(part.body).replace(/\{(\d+)\}/g, function (_, n) {
      var id = parseInt(n, 10);
      if (id === 0) return '<strong style="color:var(--navy-800)">' + escapeHtml(part.example.answer) + '</strong>';
      return '<input class="inline-input" type="text" data-id="' + id + '" oninput="setAns(' + id + ', this.value)" placeholder="' + id + '" />';
    });
    html += '<div class="letter-box">';
    html += '<div class="letter-header">' + escapeHtml(part.header) + '</div>';
    html += '<div class="letter-greeting">' + escapeHtml(part.greeting) + '</div>';
    html += '<div class="letter-body">' + bodyHtml + '</div>';
    html += '<div class="letter-closing">' + escapeHtml(part.closing) + '</div>';
    html += '</div>';
    return html;
  }

  // PART 8 — info-transfer notes
  function renderPart8(part) {
    var html = renderPartHeader(part);
    html += '<div class="filmclub-notice">';
    html += '<div class="ntitle">' + escapeHtml(part.notice.title) + '</div>';
    html += '<div class="nbody">' + escapeHtml(part.notice.body) + '</div>';
    html += '</div>';
    html += '<div class="note-card">';
    html += '<div class="date-line">' + escapeHtml(part.note.dateLine) + '</div>';
    html += '<div class="note-body">' + escapeHtml(part.note.body) + '</div>';
    html += '<div class="sig">' + escapeHtml(part.note.signature) + '</div>';
    html += '</div>';
    html += '<div class="andy-notes">';
    html += '<div class="an-title">' + escapeHtml(part.notesTitle) + '</div>';
    html += '<div class="an-sub">' + escapeHtml(part.notesSubtitle) + '</div>';
    part.rows.forEach(function (row) {
      html += '<div class="an-row"' + (row.id ? ' data-qslot="' + row.id + '"' : '') + '>';
      html += '<div class="an-label">' + escapeHtml(row.label) + '</div>';
      html += '<div class="an-value">';
      if (row.prefilled) {
        html += '<span class="prefilled">' + escapeHtml(row.prefilled) + '</span>';
      } else {
        html += '<span class="an-num">' + row.id + '</span>';
        if (row.prefix) html += '<span class="an-prefix">' + escapeHtml(row.prefix) + '</span>';
        html += '<input class="an-input" type="text" data-id="' + row.id + '" oninput="setAns(' + row.id + ', this.value)" />';
      }
      html += '</div></div>';
    });
    html += '</div>';
    return html;
  }

  // PART 9 — postcard writing
  function renderPart9(part) {
    var html = renderPartHeader(part);
    html += '<div class="postcard-prompt-card">' + escapeHtml(part.prompt) + '<div class="sig">' + escapeHtml(part.promptSignature) + '</div></div>';
    html += '<div style="font-weight:700;color:var(--navy-800);margin:14px 0 6px">Write your postcard:</div>';
    html += '<div class="postcard-frame" data-qslot="56">';
    html += '<textarea class="postcard-textarea" data-id="56" oninput="setAns(56, this.value); updateWordCount(this);" placeholder="Write your reply here..."></textarea>';
    html += '<div class="wc-row"><div class="wc-bar"><div class="wc-fill" id="wc-fill"></div></div><div class="wc-label" id="wc-line"><span id="wc-count">0</span> words · target 25–35</div></div>';
    html += '</div>';
    return html;
  }

  function updateWordCount(textarea) {
    var txt = (textarea.value || '').trim();
    var n = txt ? txt.split(/\s+/).length : 0;
    var el = document.getElementById('wc-count');
    var line = document.getElementById('wc-line');
    var fill = document.getElementById('wc-fill');
    if (el) el.textContent = n;
    if (fill) {
      var pct = Math.min(100, (n / 35) * 100);
      fill.style.width = pct + '%';
    }
    if (line) {
      line.classList.remove('in-range', 'out-range');
      if (n >= 25 && n <= 35) line.classList.add('in-range');
      else if (n > 35) line.classList.add('out-range');
    }
  }

  // ── Pickers ─────────────────────────────────────────────────────
  function pickPill(id, letter, btn) {
    setAns(id, letter);
    var parent = btn.parentElement;
    parent.querySelectorAll('.opt-pill').forEach(function (p) { p.classList.remove('selected'); });
    btn.classList.add('selected');
  }
  function pickPillCloze(id, letter, text, btn) {
    setAns(id, letter);
    var parent = btn.parentElement;
    parent.querySelectorAll('.opt-pill').forEach(function (p) { p.classList.remove('selected'); });
    btn.classList.add('selected');
    var pill = document.getElementById('gap-pill-' + id);
    if (pill) { pill.textContent = letter + ' · ' + text; pill.style.background = '#d1fae5'; pill.style.borderColor = 'var(--emerald-500)'; pill.style.color = '#065f46'; }
  }
  function pickMcq(id, letter, el) {
    setAns(id, letter);
    var siblings = el.parentElement.querySelectorAll('.mcq-opt[data-id="' + id + '"]');
    siblings.forEach(function (s) { s.classList.remove('selected'); });
    el.classList.add('selected');
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function escapeJs(s) {
    return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  }

  // ── Build page ─────────────────────────────────────────────────
  function build() {
    var data = window.KET_RW_TEST;
    if (!data) {
      document.getElementById('partsRoot').innerHTML = '<div style="padding:40px;text-align:center;color:var(--rose-500);background:#fff;border-radius:12px">Failed to load the test data.</div>';
      return;
    }
    var renderers = {
      'match-notices':          renderPart1,
      'mcq-gap-fill-sentences': renderPart2,
      'mcq-response':           renderPart3a,
      'match-dialogue':         renderPart3b,
      'match-three-texts':      renderPart4,
      'mcq-cloze-passage':      renderPart5,
      'vocab-first-letter':     renderPart6,
      'open-cloze-letter':      renderPart7,
      'info-transfer-notes':    renderPart8,
      'writing-postcard':       renderPart9
    };
    var rootHtml = '';
    data.parts.forEach(function (p, idx) {
      var key = p.partNumber + (p.partLetter || '');
      var fn = renderers[p.type];
      rootHtml += '<div class="part-card" id="part-' + key + '" data-pn="' + key + '" style="animation-delay:' + (idx * 50) + 'ms">' + (fn ? fn(p) : ('<em>Unknown type: ' + p.type + '</em>')) + '</div>';
    });
    document.getElementById('partsRoot').innerHTML = rootHtml;
    refreshNavStrip();
  }

  // ── Timer ───────────────────────────────────────────────────────
  var totalSeconds = (window.KET_RW_TEST && window.KET_RW_TEST.testInfo.totalTime || 70) * 60;
  var endAt = Date.now() + totalSeconds * 1000;
  function fmt(s) {
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }
  function tickTimer() {
    var left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    var el = document.getElementById('timer');
    el.textContent = fmt(left);
    el.classList.toggle('warn', left <= 600 && left > 60);
    el.classList.toggle('crit', left <= 60);
    if (left === 0) submitTest();
  }
  setInterval(tickTimer, 1000);

  // ── Submit + grade ──────────────────────────────────────────────
  function submitTest() {
    var data = window.KET_RW_TEST;
    if (!data) return;
    var report = { perPart: [], totalScore: 0, totalAuto: 0, freeText: [] };
    data.parts.forEach(function (p) {
      var key = p.partNumber + (p.partLetter || '');
      var partRow = { partNumber: key, type: p.type, score: 0, max: 0 };
      var auto = isAutoGradable(p.type);
      (p.items || []).forEach(function (item) {
        if (auto) {
          partRow.max += 1;
          var given = normalize(getAns(item.id));
          var expected = normalize(item.answer);
          if (given && given === expected) partRow.score += 1;
        } else {
          report.freeText.push({ id: item.id, partNumber: partRow.partNumber, expected: item.answer || '', given: getAns(item.id), type: p.type });
        }
      });
      report.perPart.push(partRow);
      report.totalScore += partRow.score;
      report.totalAuto += partRow.max;
    });
    showResults(report);
  }

  function isAutoGradable(t) {
    return t === 'match-notices' || t === 'mcq-gap-fill-sentences' || t === 'mcq-response'
        || t === 'match-dialogue' || t === 'match-three-texts' || t === 'mcq-cloze-passage'
        || t === 'vocab-first-letter' || t === 'open-cloze-letter' || t === 'info-transfer-notes';
  }
  function normalize(s) {
    return String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function showResults(report) {
    var pct = report.totalAuto > 0 ? Math.round((report.totalScore / report.totalAuto) * 100) : 0;
    var verdict = pct >= 70 ? '🎉 Strong pass!' : pct >= 50 ? '👍 Solid attempt' : '📘 Keep practising';
    var html = '<h2>Results</h2>';
    html += '<div class="score-hero">';
    html += '<div class="score-big">' + report.totalScore + '<span style="font-size:24px;color:rgba(255,255,255,0.5)">/' + report.totalAuto + '</span></div>';
    html += '<div class="score-meta"><div style="font-size:18px;font-weight:800;color:#fff;margin-bottom:4px">' + verdict + '</div>';
    html += '<div><strong>' + pct + '%</strong> on auto-graded items</div>';
    if (report.freeText.length > 0) html += '<div style="margin-top:6px;font-size:12.5px;color:rgba(255,255,255,0.65)">Part 9 postcard is collected for review below</div>';
    html += '</div></div>';
    html += '<div class="score-breakdown">';
    report.perPart.forEach(function (r) {
      if (r.max > 0) {
        html += '<div class="score-row"><span class="pn">Part ' + r.partNumber + '</span><span class="ps">' + r.score + ' / ' + r.max + '</span></div>';
      }
    });
    html += '</div>';
    if (report.freeText.length > 0) {
      html += '<h3 style="margin:20px 0 10px;font-family:Playfair Display,serif;color:var(--navy-800)">Free-text — for self-review</h3>';
      report.freeText.forEach(function (ft) {
        html += '<div class="free-text-review">';
        html += '<div class="qhead">Q' + ft.id + ' · Part ' + ft.partNumber + '</div>';
        html += '<div class="their-ans">' + (escapeHtml(ft.given) || '<em style="color:var(--muted)">— blank —</em>') + '</div>';
        if (ft.expected) html += '<div class="expected"><strong>Sample answer:</strong> ' + escapeHtml(ft.expected) + '</div>';
        html += '</div>';
      });
    }
    html += '<div class="results-actions">';
    html += '<button class="btn-back" onclick="window.location.href=\'/landing-v3.html?reopen=cambridge\'">← Back to picker</button>';
    html += '<button class="btn-retry" onclick="window.location.reload()">Try again ↻</button>';
    html += '</div>';
    document.getElementById('resultsCard').innerHTML = html;
    document.getElementById('resultsModal').classList.add('show');
  }

  // Boot
  build();
  tickTimer();
</script>

</body>
</html>
