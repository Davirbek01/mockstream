# Functions-only config. NO [build] section on purpose: the 7 sites' publish dir
# and per-centre center-id.js build step stay exactly as configured in the Netlify
# UI. This file only tells Netlify where the serverless functions live and how to
# bundle the headless-Chrome PDF function (mock-pdf).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # @sparticuz/chromium ships its own Chromium binary — don't let esbuild bundle it.
  external_node_modules = ["@sparticuz/chromium"]

# Short, shareable link to the desktop app download page (hosted in the GCS
# release bucket). Lets us hand students "mock-stream.com/desktop" instead of the
# long storage.googleapis.com URL. /download is an alias. 302 so we can re-point
# the target later (e.g. to a custom domain) without students' links breaking.
[[redirects]]
  from = "/desktop"
  to = "https://storage.googleapis.com/mockstream-desktop-releases/download.html"
  status = 302
  force = true

[[redirects]]
  from = "/download"
  to = "https://storage.googleapis.com/mockstream-desktop-releases/download.html"
  status = 302
  force = true

# OG link previews for /take/<slug> deep links (Telegram/WhatsApp covers).
# The function transforms the response the /take/* rewrite already produces —
# see netlify/edge-functions/og-take.ts (path binding via its own `config`
# export). Declared here too so the binding survives if that export changes.
[[edge_functions]]
  path = "/take/*"
  function = "og-take"
